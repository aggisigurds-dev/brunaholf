<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light"/>
<!-- Chrome Android Force Dark endurlitar síður sjálfkrafa og gerði sumar
     hub-síður ólæsilegar í síma Agnars. `only light` er opt-out Blink.
     ATH: body er EKKI málað hvítt — hannaðir dökkir fletir haldast.
     Sama lagfæring og reyndist í slokkvitaeki (verk 58ddf148). -->
<style>html{color-scheme:light}html,body{color-scheme:only light}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fjármála-yfirlit</title>
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css?v=4">
<link rel="stylesheet" href="/css/fjarmalyfirlit.css?v=5">
  <script src="/js/dags-snid.js?v=20260918b"></script>
</head>
<body>
<!-- Boss-þema (2026-09-03) — fyrirmynd: docs/design-boss/pages/fjarmala-yfirlit-boss.html -->
<div class="fy">
  <div class="fy-head">
    <div>
      <div class="boss-kicker" id="fy-kicker">Fjármál</div>
      <h1 class="boss-h1">Fjármála-yfirlit</h1>
      <div class="boss-sub sub">Peningapípan þvert á Slökkvitæki + Brunahólf · staðan núna · <a class="refresh" href="#" id="refresh">↻ uppfæra</a></div>
      <div class="boss-meta" id="fy-meta">Sæki tölur…</div>
    </div>
    <div class="fy-actions">
      <a class="boss-btn ivory" href="/#krofuyfirlit" target="_top" title="Opna Kröfu yfirlit">📋 Kröfu yfirlit</a>
      <a class="boss-btn obsidian" href="/#gerdreikninga" target="_top" title="Opna Gerð Reikninga">🧾 Gerð Reikninga</a>
    </div>
  </div>
  <div class="syncbar">
    <span data-sync-workflow="timavera" data-sync-label="Tímavera"></span>
    <span data-sync-workflow="ajour" data-sync-label="Ajour"></span>
    <span data-sync-workflow="redder" data-sync-label="Redder"></span>
    <span data-sync-workflow="payday" data-sync-label="Payday"></span>
  </div>
  <div id="app"><div class="loading"><span class="boss-medallion ghost">🔥</span><span>Sæki tölur…</span></div></div>
</div>

<script>
  var API = '/api/fjarmal-yfirlit';
  var MONTHS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
  var MON3 = ['JAN','FEB','MAR','APR','MAÍ','JÚN','JÚL','ÁGÚ','SEP','OKT','NÓV','DES'];
  function num(n){ return (Math.round(n||0)).toLocaleString('is-IS').replace(/,/g,'.'); }
  function kr(n){ return num(n) + ' kr'; }
  function krHtml(n){ return num(n) + '<span class="kr">kr</span>'; }
  function mlabel(m){ var p=String(m||'').split('-'); return MONTHS[(+p[1])-1]+' '+p[0]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  (function(){ var d=new Date(); var k=document.getElementById('fy-kicker'); if(k) k.textContent='Fjármál · '+MONTHS[d.getMonth()]+' '+d.getFullYear(); })();

  var _cid = 0;
  function detailRows(list){
    return (list||[]).map(function(it){
      var sub = it.sub ? ' · '+esc(it.sub) : '';
      return '<div class="mrow"><span class="mm">'+esc(it.label)+sub+'</span><span class="mk">'+kr(it.kr)+'</span></div>';
    }).join('') || '<div class="mrow"><span class="mm">engar færslur</span></div>';
  }
  // card(cls,l,v,n,list,extra) — list => click-to-expand; extra => HTML (t.d. vinnu-tengill) inni í kortinu.
  function card(cls,l,v,n,list,extra){
    var hasList = list && list.length;
    var id = 'd'+(++_cid);
    var chev = hasList ? '<span class="chev">▸</span>' : '';
    var head = '<div class="l">'+l+chev+'</div><div class="v">'+krHtml(v)+'</div>'+(n!=null?'<div class="n">'+n+'</div>':'');
    var inner = hasList
      ? '<button type="button" class="cardbtn" aria-expanded="false" aria-controls="'+id+'" onclick="toggleCard(this)">'+head+'</button>'
      : head;
    var det = hasList ? '<div class="detail" id="'+id+'" hidden>'+detailRows(list)+'</div>' : '';
    return '<div class="card '+(cls||'')+(hasList?' expandable':'')+'">'+inner+(extra||'')+det+'</div>';
  }
  function toggleCard(btn){
    var open = btn.getAttribute('aria-expanded')==='true';
    btn.setAttribute('aria-expanded', open?'false':'true');
    var det = document.getElementById(btn.getAttribute('aria-controls'));
    if(det) det.hidden = open;
    var chev = btn.querySelector('.chev'); if(chev) chev.textContent = open?'▸':'▾';
  }
  // 16.10.2026 (Agnar: „Það vantar refresh takka á allt þarna og hvenær sótt seinast"): hver kafli ber nú „sótt HH:MM · fyrir N mín" og
  // ↻ sem sækir allt upp á nýtt (ein API-sókn fæðir alla kafla). Tölur sem eru reiknaðar annars staðar (Skýrslur í vinnslu úr appinu,
  // NLSH úr Ajour) bera sinn eigin tíma, og verða gulbrúnar þegar þær eru orðnar gamlar.
  function hhmm(t){ var d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function ago(t){ var m=Math.max(0,Math.round((Date.now()-t)/60000)); if(m<1) return 'núna'; if(m<60) return 'fyrir '+m+' mín'; var h=Math.round(m/60); return h<48 ? 'fyrir '+h+' klst' : 'fyrir '+Math.round(h/24)+' d'; }
  function stampTxt(t,label){ return (label||'sótt')+' '+hhmm(t)+' · '+ago(t); }
  function stampHtml(t,label,staleMin,withBtn){
    if(!t) return '';
    var gamalt = staleMin && (Date.now()-t) > staleMin*60000;
    return '<span class="sh-t'+(gamalt?' gamalt':'')+'" data-t="'+t+'" data-label="'+esc(label||'sótt')+'" data-stale="'+(staleMin||0)+'" title="'+esc((label||'sótt')+' '+new Date(t).toLocaleString('is-IS'))+'">'+esc(stampTxt(t,label))+'</span>'
      + (withBtn ? '<button type="button" class="sh-r" title="Sækja allt upp á nýtt" onclick="load(true)">↻</button>' : '');
  }
  setInterval(function(){
    document.querySelectorAll('.sh-t[data-t]').forEach(function(e){
      var t=+e.getAttribute('data-t'), st=+e.getAttribute('data-stale')||0;
      e.textContent = stampTxt(t, e.getAttribute('data-label'));
      e.classList.toggle('gamalt', !!st && (Date.now()-t) > st*60000);
    });
  }, 30000);
  var _gen = 0; // hvenær /api/fjarmal-yfirlit var reiknað (generated_at)
  // Kaflahaus: gull-plata með númeri · Playfair heiti · samtala · gull-hárlína · sótt-tími + ↻.
  var _sec = 0;
  function sh(title, total, opt){
    var n = String(++_sec).padStart(2,'0');
    opt = opt || {};
    var t = opt.t || _gen;
    return '<div class="sh"><span class="boss-plate">'+n+'</span><h2>'+title+'</h2><span class="st">'+kr(total)+'</span><span class="hair"></span>'+stampHtml(t, opt.label, opt.stale || 15, true)+'</div>';
  }
  var LINK_SLOKK = '<a class="worklink" href="https://slokkvitaeki.netlify.app/reikningar-bid.html" target="_blank" rel="noopener" onclick="event.stopPropagation()">✏️ Vinna kröfur →</a>';
  var LINK_BRU = '<a class="worklink" href="https://brunaholf.netlify.app/#gerdreikninga" target="_blank" rel="noopener" onclick="event.stopPropagation()">✏️ Vinna drög →</a>';
  var LINK_TIMI = '<a class="worklink" href="https://brunaholf.netlify.app/#gerdreikninga" target="_blank" rel="noopener" onclick="event.stopPropagation()">✏️ Laga tíma →</a>';
  var LINK_VERKST = '<a class="worklink" href="https://slokkvitaeki.netlify.app/#thjonustu-verkstaedi" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔧 Opna Þjónustuverkstæði →</a>';
  var LINK_VERKROD = '<a class="worklink" href="https://slokkvitaeki.netlify.app/#verkstaedi" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔧 Opna Verkröðina →</a>';
  var LINK_AFGR = '<a class="worklink" href="https://slokkvitaeki.netlify.app/#afgreidsla" target="_blank" rel="noopener" onclick="event.stopPropagation()">🛎️ Opna Afgreiðsluna →</a>';

  function render(d, nlsh, nlshAt){
    _cid = 0; _sec = 0;
    _gen = Date.parse(d.generated_at) || Date.now();
    // Áunnið NLSH (Landsspítalinn) úr Ajour-samningi (/api/nlsh-dashboard byMonth).
    // AÐEINS þessi mánuður fer í pípuna — eldri NLSH-mánuðir eru þegar rukkaðir í
    // Payday (invoices) svo þeir mega ekki tvítaljast.
    var nlshBy = (nlsh && nlsh.byMonth) || [];
    var nlshCur = null; for(var _i=0;_i<nlshBy.length;_i++){ if(nlshBy[_i].month===d.month){ nlshCur=nlshBy[_i]; break; } }
    var nlshMonthKr = nlshCur ? (+nlshCur.revenue_m_vsk||0) : 0;
    var nlshCumKr = nlshBy.length ? (+nlshBy[nlshBy.length-1].cum_revenue_m_vsk||0) : 0;
    var nlshList = nlshBy.slice().reverse().map(function(m){ return { label: mlabel(m.month), sub: (m.holes||0)+' göt', kr: +m.revenue_m_vsk||0 }; });
    var grandDisp = (+d.grand_total||0) + nlshMonthKr;
    var A=d.slokk, warnHtml = (d.warnings&&d.warnings.length)? '<div class="warn">⚠ '+d.warnings.map(function(w){return w.replace(/</g,'&lt;');}).join('<br>')+'</div>' : '';
    var mon3 = MON3[(+String(d.month||'').split('-')[1])-1] || '';
    var meta = document.getElementById('fy-meta');
    if(meta) meta.textContent = 'Uppfært '+new Date(d.generated_at).toLocaleString('is-IS')+' · taxti '+kr(d.taxti_mvsk)+'/klst m/vsk (9.951 × 1,24) · rukkanlegir Tímavera-verkstaðir án Slökkvitæki-innri / NLSH';

    // Pípu-dálkarnir á dökku slab-inu: það sem myndar heildar-pípuna.
    var fmtKlst = function(n){ return (Math.round((+n||0)*100)/100).toLocaleString('is-IS',{minimumFractionDigits:0,maximumFractionDigits:2}); };
    var pipe = [
      ['Slökkvitæki', A.heildar.kr, ''],
      ['Brunahólf Payday', d.bru_payday_ogreitt.kr, ''],
      // nettó: tímar sem eru þegar í drögum/kröfum mánaðarins teljast ekki aftur (18.09.2026)
      ['Tímavera · '+mon3, (d.timavera_manudur.netto_kr!=null ? d.timavera_manudur.netto_kr : d.timavera_manudur.kr), 'gold',
        // 16.10.2026 (Agnar: „tímaveru stundir virðast ekki vera koma inn á fjármálayfirlit"): 0 þýðir að tímarnir eru þegar í drögum
        // (Ósent) og eru ekki taldir aftur — segjum það í stað þess að láta töluna líta út eins og tóm gögn.
        (d.timavera_manudur.klst>0 ? (d.timavera_manudur.i_drogum_klst>0 ? (fmtKlst(d.timavera_manudur.klst)+' klst · '+(d.timavera_manudur.i_drogum_klst>=d.timavera_manudur.klst-0.005 ? 'allt' : fmtKlst(d.timavera_manudur.i_drogum_klst))+' í drögum') : fmtKlst(d.timavera_manudur.klst)+' klst') : 'engar færslur'),
        'Tímar úr Tímaveru í '+mon3+': '+d.timavera_manudur.klst+' klst ('+kr(d.timavera_manudur.kr)+'). Þegar komnir í drög/kröfur: '+(d.timavera_manudur.i_drogum_klst||0)+' klst ('+kr(d.timavera_manudur.i_drogum_kr||0)+') — teljast í Ósent, ekki tvisvar. Talan hér er það sem er EKKI enn komið í drög.'],
      (nlshBy.length ? ['NLSH · '+mon3, nlshMonthKr, 'gold'] : null),
      ['Ósent', d.bru_osendar.kr, '']
    ].filter(Boolean).map(function(p){ return '<div'+(p[4]?' title="'+esc(p[4])+'"':'')+'><div class="pl">'+esc(p[0])+'</div><div class="pv '+p[2]+'">'+num(p[1])+'</div>'+(p[3]?'<div class="ps">'+esc(p[3])+'</div>':'')+'</div>'; }).join('');

    document.getElementById('app').innerHTML =
      warnHtml +
      '<div class="boss-slab grand"><span class="coin"></span>' +
        '<div><div class="lbl"><span class="boss-plate dark">00</span><span class="t">Heildar-pípa · allt óinnheimt / óuppgert</span></div>' +
        '<div class="val">'+num(grandDisp)+'<span class="kr">kr</span></div></div>' +
        '<div class="pipe">'+pipe+'</div>' +
      '</div>' +

      '<section>'+sh('🧯 Slökkvitæki — kröfur', A.heildar.kr) +
        '<div class="grid">' +
          card('card--amber', 'Ógreiddar í Payday', A.ogreitt_payday.kr, A.ogreitt_payday.n+' kröfur', A.ogreitt_payday.list) +
          card('card--blue', 'Ósendar kröfur', A.osendar.kr, A.osendar.n+' kröfur', A.osendar.list, LINK_SLOKK) +
          card('card--sub full', 'Heildarkröfur (millisamtala)', A.heildar.kr, A.heildar.n+' sölur', A.heildar.list) +
          // Vinnan sem er ekki orðin að kröfum enn (ósk Agnars 8.8.) — til sýnis,
          // EKKI inni í heildar-pípunni (skarast við ósendar/Payday þegar rukkað er):
          (d.skyrslur_i_vinnslu
            ? card('card--blue', 'Skýrslur í vinnslu (áætlað virði)', d.skyrslur_i_vinnslu.kr,
                d.skyrslur_i_vinnslu.n+' verk á borðinu', d.skyrslur_i_vinnslu.list, LINK_VERKST + (d.skyrslur_i_vinnslu.updated_at ? '<div class="cstamp">'+stampHtml(Date.parse(d.skyrslur_i_vinnslu.updated_at),'reiknað í appinu',30,false)+' <span class="cs-n">· endurreiknast þegar staða verks breytist eða Þjónustuverkstæði er opnað</span></div>' : ''))
            : '') +
          (d.slokk_verkstaedi
            ? card('', 'Á verkstæði (Verkröð)', d.slokk_verkstaedi.kr,
                d.slokk_verkstaedi.n+' verk · '+d.slokk_verkstaedi.n2+' tæki', d.slokk_verkstaedi.list, LINK_VERKROD)
            : '') +
          (d.slokk_afgreidsla_osott
            ? card('card--green', 'Tilbúið ósótt í Afgreiðslu', d.slokk_afgreidsla_osott.kr,
                d.slokk_afgreidsla_osott.n+' verk · '+d.slokk_afgreidsla_osott.n2+' tæki', d.slokk_afgreidsla_osott.list, LINK_AFGR)
            : '') +
        '</div></section>' +

      '<section>'+sh('🏦 Brunahólf — raun-ógreitt í Payday', d.bru_payday_ogreitt.kr) +
        '<div class="grid">' + card('card--green full', 'Útistandandi kröfur (óborgaðar)', d.bru_payday_ogreitt.kr, d.bru_payday_ogreitt.n+' kröfur', d.bru_payday_ogreitt.list) + '</div></section>' +

      '<section>'+sh('🕒 Áunnið Tímavera — '+mlabel(d.month), d.timavera_manudur.kr) +
        '<div class="grid">' + card('card--hero full', 'Þessi mánuður (klst × dagvinnutaxti m/vsk)', d.timavera_manudur.kr, d.timavera_manudur.klst+' klst · taxti '+kr(d.taxti_mvsk)+'/klst' + (d.timavera_manudur.i_drogum_klst>0 ? ' · þar af '+d.timavera_manudur.i_drogum_klst+' klst ('+kr(d.timavera_manudur.i_drogum_kr)+') þegar í drögum/kröfum — ekki tvítalið í heildar-pípu' : ''), d.timavera_manudur.list, LINK_TIMI) + '</div></section>' +

      (nlshBy.length ?
       '<section>'+sh('🏥 Áunnið NLSH (Landsspítalinn)', nlshMonthKr, {t: nlshAt || _gen, label: 'sótt'}) +
        '<div class="grid">' + card('card--hero full', 'Þessi mánuður (Ajour · samningstaxti m/vsk)', nlshMonthKr, 'uppsafnað í ár '+kr(nlshCumKr)+' · smelltu fyrir mánuði', nlshList) + '</div></section>'
       : '') +

      '<section>'+sh('🟡 Ósent', d.bru_osendar.kr) +
        '<div class="grid">' +
          card('card--amber full', 'Ósent — lesið beint af Kröfu yfirliti (CG-02)'+(d.bru_osendar.heimild==='krofu-yfirlit-bru'?'':' ⚠ varaleið'), d.bru_osendar.kr, d.bru_osendar.n+' drög · bíður sendingar', d.bru_osendar.list, LINK_BRU) +
        '</div>' +
      '</section>' +
      '<div class="note">Uppfært '+new Date(d.generated_at).toLocaleString('is-IS')+'. Taxti '+kr(d.taxti_mvsk)+'/klst m/vsk (9.951 × 1,24). Rukkanlegir Tímavera-verkstaðir (án Slökkvitæki-innri / NLSH).</div>';
  }

  function load(silent){
    if(silent === true){ document.querySelectorAll('.sh-r').forEach(function(b){ b.classList.add('snuning'); }); }
    else document.getElementById('app').innerHTML = '<div class="loading"><span class="boss-medallion ghost">🔥</span><span>Sæki tölur…</span></div>';
    Promise.all([
      fetch(API).then(function(r){ return r.json(); }),
      fetch('/api/nlsh-dashboard').then(function(r){ return r.json(); }).catch(function(){ return null; })
    ]).then(function(res){
      var d=res[0], nlsh=res[1];
      if(d.error){ document.getElementById('app').innerHTML='<div class="warn">Villa: '+d.error+'</div>'; return; }
      render(d, nlsh, Date.now());
    }).catch(function(e){
      document.querySelectorAll('.sh-r').forEach(function(b){ b.classList.remove('snuning'); }); document.getElementById('app').innerHTML='<div class="warn">Netvilla: '+e.message+'</div>'; });
  }
  document.getElementById('refresh').onclick=function(e){ e.preventDefault(); load(true); };
  load();
</script>
<script src="/js/hub-sync-buttons.js?v=20260919a" defer></script>
</body>
</html>
