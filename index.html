        <div class="tv-kpi"><div class="tv-kpi-l">Í vinnslu</div><div class="tv-kpi-v" id="sp-k-prog">—</div><div class="tv-kpi-x">í gangi</div></div>
        <div class="tv-kpi sp-kpi-high"><div class="tv-kpi-l">Hátt forgangur</div><div class="tv-kpi-v" id="sp-k-high">—</div><div class="tv-kpi-x">opnar + í vinnslu</div></div>
        <div class="tv-kpi sp-kpi-done"><div class="tv-kpi-l">Svarað</div><div class="tv-kpi-v" id="sp-k-done">—</div><div class="tv-kpi-x">klárað</div></div>
      </div>

      <div class="tv-card">
        <div class="ws-filter-bar">
          <input type="search" id="sp-q" placeholder="Leita í spurningum (sendandi, efni, snippet)..." />
          <div class="ws-chips" id="sp-chips"></div>
        </div>
      </div>

      <div id="sp-list" class="sp-list"></div>
    </div>
  `;
  bindEditButtons();

  const $refresh = document.getElementById('sp-refresh');
  const $q = document.getElementById('sp-q');
  const $chips = document.getElementById('sp-chips');
  let filterStatus = 'open';
  let qVal = '';
  let debounce;
  let lastData = null;

  function renderChips(counts){
    const opts = [
      ['open',         `Opnar`,           (counts.new||0)+(counts.in_progress||0)],
      ['new',          'Nýjar',           counts.new||0],
      ['in_progress',  'Í vinnslu',       counts.in_progress||0],
      ['snoozed',      'Frestaðar',       counts.snoozed||0],
      ['answered',     'Svarað',          counts.answered||0],
      ['dismissed',    'Frávísað',        counts.dismissed||0],
      ['all',          'Allt',            counts.total||0],
    ];
    $chips.innerHTML = opts.map(([id,label,n]) => `
      <button class="chip ${filterStatus===id?'active':''}" data-filter="${id}">${escapeHtml(label)} <span class="chip-n">${n}</span></button>
    `).join('');
    $chips.querySelectorAll('button[data-filter]').forEach(b => b.addEventListener('click', () => {
      filterStatus = b.dataset.filter;
      load();
    }));
  }

  function formatWhen(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString('is-IS', {hour:'2-digit', minute:'2-digit'});
      return d.toLocaleDateString('is-IS', {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString('is-IS', {hour:'2-digit', minute:'2-digit'});
    } catch(e){ return ''; }
  }

  async function updateAction(email_id, patch){
    await fetch('/api/email-tasks', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email_id, ...patch }),
    });
  }

  function renderList(rows){
    const $list = document.getElementById('sp-list');
    if (!rows.length) { $list.innerHTML = '<div class="empty">Engar spurningar í þessum flokki.</div>'; return; }
    $list.innerHTML = rows.map(r => {
      const st = SP_STATUS[r.status] || SP_STATUS.new;
      const pr = SP_PRIORITY[r.priority] || SP_PRIORITY.normal;
      const sender = r.sender_name || r.sender_email || '(ókunn.)';
      return `
        <div class="sp-card ${st.cls}" data-email-id="${r.id}">
          <div class="sp-card-head">
            <span class="sp-status-pill ${st.cls}" data-action="cycle-status" title="Smelltu til að breyta">
              <span class="sp-icon">${st.icon}</span> ${escapeHtml(st.label)}
            </span>
            <span class="sp-pri-pill ${pr.cls}" data-action="cycle-priority" title="Smelltu til að breyta forgang">
              ${escapeHtml(pr.label)}
            </span>
            <span class="sp-sender">${escapeHtml(sender)}</span>
            <span class="sp-account">${escapeHtml(r.account||'')}</span>
            <span class="sp-when">${escapeHtml(formatWhen(r.received_at))}</span>
          </div>
          <div class="sp-subject">${escapeHtml(r.subject||'(engin efnislína)')}</div>
          <div class="sp-snippet">${escapeHtml(r.snippet||'')}</div>
          <div class="sp-actions">
            <button class="sp-act-btn" data-action="answered">✓ Svarað</button>
            <button class="sp-act-btn" data-action="in_progress">⋯ Í vinnslu</button>
            <button class="sp-act-btn" data-action="snoozed">⏸ Fresta</button>
            <button class="sp-act-btn" data-action="dismissed">× Vísa frá</button>
            <button class="sp-act-btn sp-act-add-note" data-action="add-note">📝 Athugasemd</button>
          </div>
          ${r.notes ? `<div class="sp-notes">📝 ${escapeHtml(r.notes)}</div>` : ''}
          ${r.linked_worksite ? `<div class="sp-linked">🏗 Verkstaður: ${escapeHtml(r.linked_worksite)}</div>` : ''}
        </div>`;
    }).join('');

    // Wire interactions
    const STATUS_CYCLE = ['new','in_progress','answered','dismissed','snoozed'];
    const PRIORITY_CYCLE = ['normal','high','low'];

    $list.querySelectorAll('[data-action="cycle-status"]').forEach(el => el.addEventListener('click', async e => {
      const card = e.target.closest('.sp-card');
      const id = parseInt(card.dataset.emailId, 10);
      const row = lastData.rows.find(r => r.id === id);
      const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(row.status)+1) % STATUS_CYCLE.length];
      await updateAction(id, { status: next });
      await load();
    }));
    $list.querySelectorAll('[data-action="cycle-priority"]').forEach(el => el.addEventListener('click', async e => {
      const card = e.target.closest('.sp-card');
      const id = parseInt(card.dataset.emailId, 10);
      const row = lastData.rows.find(r => r.id === id);
      const next = PRIORITY_CYCLE[(PRIORITY_CYCLE.indexOf(row.priority)+1) % PRIORITY_CYCLE.length];
      await updateAction(id, { priority: next });
      await load();
    }));
    $list.querySelectorAll('.sp-act-btn').forEach(btn => btn.addEventListener('click', async e => {
      const card = e.target.closest('.sp-card');
      const id = parseInt(card.dataset.emailId, 10);
      const action = btn.dataset.action;
      if (action === 'add-note') {
        const row = lastData.rows.find(r => r.id === id);
        const note = prompt('Athugasemd:', row.notes || '');
        if (note === null) return;
        await updateAction(id, { notes: note.trim() || null });
      } else {
        // Status shortcuts
        await updateAction(id, { status: action });
      }
      await load();
    }));
  }

  async function load(){
    document.getElementById('sp-meta').textContent = 'Sækir…';
    $refresh.disabled = true; $refresh.classList.add('loading');
    try {
      const params = new URLSearchParams({ status: filterStatus, limit: '200' });
      if (qVal) params.set('q', qVal);
      const r = await fetch('/api/email-tasks?' + params.toString());
      if (!r.ok) {
        const e = await r.json().catch(()=>({error:'Villa'}));
        document.getElementById('sp-meta').innerHTML = `<span style="color:var(--red)">${escapeHtml(e.error||'HTTP '+r.status)}</span>`;
        return;
      }
      lastData = await r.json();
      const c = lastData.counts;
      document.getElementById('sp-k-new').textContent  = c.new||0;
      document.getElementById('sp-k-prog').textContent = c.in_progress||0;
      document.getElementById('sp-k-high').textContent = c.high_priority||0;
      document.getElementById('sp-k-done').textContent = c.answered||0;
      document.getElementById('sp-meta').textContent = `${lastData.count} sýnd · ${lastData.total} alls`;
      renderChips(c);
      renderList(lastData.rows);
    } finally {
      $refresh.disabled = false; $refresh.classList.remove('loading');
    }
  }

  $refresh.addEventListener('click', load);
  $q.addEventListener('input', e => {
    qVal = e.target.value.trim();
    if (debounce) clearTimeout(debounce);
    debounce = setTimeout(load, 250);
  });

  load();
}

  function renderChips(byStatus, noInvoiceCount){
    const total = (byStatus.unreviewed||0)+(byStatus.review||0)+(byStatus.billing_in_progress||0)+(byStatus.invoiced||0)+(byStatus.not_billable||0);
    const opts = [
      ['all',           'Allt',                total],
      ['no_invoice',    '⚠ Án reiknings',      noInvoiceCount || 0],
      ['unreviewed',    'Óstaðfest',           byStatus.unreviewed||0],
      ['review',        'Í skoðun',            byStatus.review||0],
      ['billing_in_progress','Í reikningi',    byStatus.billing_in_progress||0],

      ['not_billable',  'Ekki rukkanlegt',     byStatus.not_billable||0],
    ];
    $chips.innerHTML = opts.map(([id, label, n]) => `
      <button class="chip ${activeFilter===id?'active':''} ${id==='no_invoice'?'chip-warn':''}" data-filter="${id}">${escapeHtml(label)} <span class="chip-n">${n}</span></button>
    `).join('');

      activeFilter = b.dataset.filter;
      $chips.querySelectorAll('button[data-filter]').forEach(x => x.classList.toggle('active', x === b));
      renderList();
    }));
  }

  function renderList(){
    if (!lastData) return;
    const $list = document.getElementById('ws-list');
    let rows = lastData.worksites.slice();
    if (activeFilter === 'no_invoice') {
      rows = rows.filter(w => (w.invoice_count||0) === 0 && w.hours > 0 && !/almennt|veikindi|sick|work at home/i.test(w.project));
    } else if (activeFilter !== 'all') {
      rows = rows.filter(w => w.status.billing_status === activeFilter);
    }
    if (qVal) {
      const q = qVal.toLowerCase();
      rows = rows.filter(w => w.project.toLowerCase().includes(q));
    }
    if (!rows.length) { $list.innerHTML = '<div class="empty">Engir verkstaðir í þessum flokki.</div>'; return; }

    $list.innerHTML = rows.map(w => {
      const st = WS_STATUS_LABEL[w.status.billing_status] || WS_STATUS_LABEL.unreviewed;
      const monthly = Object.keys(w.monthly).sort();
      const maxM = Math.max(0.001, ...Object.values(w.monthly));
      const isNonBillable = /almennt|veikindi|sick|work at home/i.test(w.project);
      const hasInvoice  = (w.invoice_count || 0) > 0;
      const fullyPaid   = hasInvoice && (w.invoice_unpaid || 0) === 0;

        const month = parseInt(m.slice(5,7),10);
        return ['','Jan','Feb','Mar','Apr','Maí','Jún','Júl','Ágú','Sep','Okt','Nóv','Des'][month] || m;

          <div class="ws-mbar-fill" style="height:${pct}%"></div>

      const sentCells = monthly.map((m, i) => {
        const h = w.monthly[m];

        return `<div class="ws-cell ws-cell-warn" title="${monthLabels[i]}: vinna en enginn reikningur"></div>`;
      }).join('');
      const paidCells = monthly.map((m, i) => {
        const h = w.monthly[m];
        if (!h) return '<div class="ws-cell ws-cell-empty"></div>';
        if (isNonBillable) return '<div class="ws-cell ws-cell-na"></div>';
        if (!hasInvoice) return '<div class="ws-cell ws-cell-empty"></div>';

    $list.querySelectorAll('[data-action="toggle-status"]').forEach(b => b.addEventListener('click', async e => {

      const cur = w.status.billing_status || 'unreviewed';
      const idx = WS_STATUS_ORDER.indexOf(cur);
      const next = WS_STATUS_ORDER[(idx + 1) % WS_STATUS_ORDER.length];
      await updateStatus(project, { billing_status: next });
      w.status.billing_status = next;
      renderList();
      // Refresh summary KPIs
      const counts = { unreviewed:0, review:0, billing_in_progress:0, invoiced:0, not_billable:0 };
      lastData.worksites.forEach(x => { counts[x.status.billing_status||'unreviewed']++; });
      lastData.summary.by_status = counts;
      renderSummary(lastData.summary);
      renderChips(counts);
    }));
    $list.querySelectorAll('[data-action="add-drive"]').forEach(b => b.addEventListener('click', async e => {
      const card = e.target.closest('.ws-card');
      const project = card.dataset.project;
      const url = prompt('Líma inn Google Drive slóð fyrir "'+project+'":');
      if (!url) return;
      await updateStatus(project, { drive_folder_url: url });
      const w = lastData.worksites.find(x => x.project === project);
      w.status.drive_folder_url = url;
      renderList();
    }));
    $list.querySelectorAll('[data-action="edit-customer"]').forEach(el => el.addEventListener('click', async e => {
      const cust = el.dataset.customer;
      // Get current info
      let cur = {};
      try { cur = (await (await fetch('/api/customer-info?name=' + encodeURIComponent(cust))).json()).rows?.[0] || {}; } catch {}
      const method = prompt(`Greiðsluleið fyrir ${cust}\n("payday" / "bank-direct" / "mix" / blank)`, cur.payment_method || '');
      if (method === null) return;
      const retentionStr = prompt(`Öryggisfé (%) fyrir ${cust}\n(t.d. 10, 0, blank)`, String(cur.retention_pct || 0));
      if (retentionStr === null) return;
      const terms = prompt(`Greiðsluskilmálar fyrir ${cust}\n(t.d. "30 days net")`, cur.payment_terms || '');
      if (terms === null) return;
      const notes = prompt(`Athugasemd fyrir ${cust}`, cur.general_notes || '');
      if (notes === null) return;
      try {
        await fetch('/api/customer-info', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            customer_name: cust,
            payment_method: method.trim() || null,
            retention_pct: parseFloat(retentionStr) || 0,
            payment_terms: terms.trim() || null,
            general_notes: notes.trim() || null,
          }),
        });
        await load(true);
      } catch(err) { alert('Villa: '+err.message); }
    }));
    $list.querySelectorAll('[data-action="map-customer"]').forEach(b => b.addEventListener('click', async e => {
      const card = e.target.closest('.ws-card');
      const project = card.dataset.project;
      const customer = prompt('Heiti viðskiptavinar sem á að tengja við "'+project+'" (þeir reikningar verða tengdir þessum verkstað):');
      if (!customer || !customer.trim()) return;
      try {
        const r = await fetch('/api/customer-map', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ customer_name: customer.trim(), worksite_name: project }),
        });
        if (!r.ok) { alert('Villa: '+await r.text()); return; }
        await load(true);
      } catch(e){ alert('Villa: '+e.message); }
    }));
  }

  async function updateStatus(project_name, patch){
    try {
      await fetch('/api/worksites', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ project_name, year: selectedYear, ...patch }),
      });
    } catch (e) { alert('Villa: '+e.message); }
  }

  function renderSummary(s){
    document.getElementById('ws-kpi-count').textContent = s.total_worksites;
    document.getElementById('ws-kpi-hours').textContent = s.total_hours.toLocaleString('is-IS');
    document.getElementById('ws-kpi-ajour').textContent = (s.total_ajour_registrations||0).toLocaleString('is-IS');
    document.getElementById('ws-kpi-no-inv').textContent = s.worksites_with_no_invoice || 0;
    document.getElementById('ws-kpi-inv-total').textContent = ((s.total_invoiced||0)/1e6).toFixed(1) + 'M kr';
    document.getElementById('ws-kpi-unpaid-x').textContent = ((s.total_unpaid||0)).toLocaleString('is-IS') + ' kr ógr.';
  }

  function renderActions(){
    if (!lastData) return;
    const NON = /almennt|veikindi|sick|work at home/i;
    const billable = lastData.worksites.filter(w => !NON.test(w.project) && w.hours > 0);
    const needsBilling = billable
      .filter(w => (w.invoice_count||0) === 0)
      .sort((a,b) => b.hours - a.hours)
      .slice(0, 8);
    const needsCollection = billable
      .filter(w => (w.invoice_unpaid||0) > 0)
      .sort((a,b) => (b.invoice_unpaid||0) - (a.invoice_unpaid||0))
      .slice(0, 8);
    const card = document.getElementById('ws-actions-card');
    if (!needsBilling.length && !needsCollection.length) { card.hidden = true; return; }
    card.hidden = false;
    document.getElementById('ws-actions-bill').innerHTML = needsBilling.length ? needsBilling.map(w => `
      <a class="ws-action-item" href="#" data-jump="${escapeAttr(w.project)}">
        <span class="ws-action-name">${escapeHtml(w.project)}</span>
        <span class="ws-action-meta"><strong>${w.hours.toLocaleString('is-IS')}</strong> klst · ${w.days} dagar · ${w.staff_count} starfsmenn</span>
        ${w.ajour_registrations ? `<span class="ws-action-sub">${w.ajour_registrations.toLocaleString('is-IS')} Ajour skráningar</span>` : ''}
      </a>
    `).join('') : '<div class="ws-action-empty">— Allt í lagi hér.</div>';
    document.getElementById('ws-actions-collect').innerHTML = needsCollection.length ? needsCollection.map(w => `
      <a class="ws-action-item" href="#" data-jump="${escapeAttr(w.project)}">
        <span class="ws-action-name">${escapeHtml(w.project)}</span>
        <span class="ws-action-meta"><strong>${(w.invoice_unpaid/1e6).toFixed(1)}M kr</strong> ógr. · ${w.invoice_count} reikning${w.invoice_count===1?'ur':'ar'}</span>
        ${w.mapped_customers && w.mapped_customers.length ? `<span class="ws-action-sub">${escapeHtml(w.mapped_customers.join(', '))}</span>` : ''}
      </a>
    `).join('') : '<div class="ws-action-empty">— Engir reikningar í vanskilum 🎉</div>';

    card.querySelectorAll('.ws-action-item').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      const proj = a.dataset.jump;
      const target = document.querySelector(`.ws-card[data-project="${CSS.escape(proj)}"]`);
      if (target) {
        target.scrollIntoView({behavior:'smooth', block:'center'});
        target.style.outline = '3px solid var(--gold)';
        setTimeout(() => target.style.outline = '', 1800);
      }
    }));
  }

  async function load(force){
    document.getElementById('ws-meta').textContent = 'Sækir…';
    $refresh.disabled = true; $refresh.classList.add('loading');
    try {
      const cb = force ? ('&_=' + Date.now()) : '';
      const r = await fetch(`/api/worksites?year=${selectedYear}${cb}`);
      if (!r.ok) {
        const e = await r.json().catch(()=>({error:'Villa'}));
        document.getElementById('ws-meta').innerHTML = `<span style="color:var(--red)">${escapeHtml(e.error||('HTTP '+r.status))}</span>`;
        return;
      }
      lastData = await r.json();
      document.getElementById('ws-yr-label').textContent = lastData.summary.year;
      document.getElementById('ws-meta').textContent = `${lastData.summary.total_worksites} verkstaðir · ${lastData.summary.total_hours.toLocaleString('is-IS')} klst · ${(lastData.summary.total_ajour_registrations||0).toLocaleString('is-IS')} Ajour skráningar · ${lastData.summary.total_days} virkir dagar`;
      renderSummary(lastData.summary);
      renderChips(lastData.summary.by_status, lastData.summary.worksites_with_no_invoice);
      renderActions();
      renderList();
    } finally {
      $refresh.disabled = false; $refresh.classList.remove('loading');
    }
  }

  $year.addEventListener('change', e => { selectedYear = parseInt(e.target.value,10); load(false); });
  $refresh.addEventListener('click', () => load(true));
  $q.addEventListener('input', e => { qVal = e.target.value.trim(); renderList(); });

  // Google connection status + Tengja button
  let googleConnected = false;
  async function checkGoogle(){
    const pill = document.getElementById('ws-google-status');
    try {
      const r = await fetch('/api/google-auth?status=1');
      const d = await r.json();
      googleConnected = !!d.connected;
      if (googleConnected) {
        pill.className = 'ws-google-pill ws-google-on';
        pill.innerHTML = `✓ ${escapeHtml(d.user_email||'tengt')}`;
        pill.title = 'Smelltu til að endurnýja tengingu';
      } else if (d.expired) {
        // Token exists but Google rejected it — make it obvious it needs re-consent.
        pill.className = 'ws-google-pill ws-google-off';
        pill.innerHTML = '⚠ Google tenging útrunnin — tengja aftur';
        pill.title = 'Google hafnaði tókanum (útrunninn/afturkallaður). Smelltu til að tengja aftur.';
      } else {
        pill.className = 'ws-google-pill ws-google-off';
        pill.innerHTML = '✦ Tengja Google';
        pill.title = 'Veita aðgang að Drive og Gmail';
      }
      pill.onclick = async () => {
        const ar = await fetch('/api/google-auth?json=1');
        const j = await ar.json();
        if (j.url) window.location.href = j.url;
      };
      pill.style.cursor = 'pointer';
    } catch(e){
      pill.textContent = 'Google: villa';
    }
  }
  checkGoogle();

  // If we just came back from OAuth, show toast
  if (location.search.includes('google=ok')) {
    setTimeout(() => alert('Google tenging tókst! Drive-möppur birtast núna á hverjum verkstað.'), 300);
    history.replaceState({}, '', location.pathname + '?cb=ws');
  }

  // After each renderList, auto-search Drive folders for any worksite that doesn't have one set
  const origRenderList = renderList;
  renderList = async function(){
    origRenderList();
    if (!googleConnected || !lastData) return;
    const cards = document.querySelectorAll('.ws-card');
    for (const card of cards) {
      const project = card.dataset.project;
      const w = lastData.worksites.find(x => x.project === project);
      if (!w || w.status.drive_folder_url) continue;
      // Skip generic buckets
      if (/almennt|veikindi|sick|work at home/i.test(project)) continue;
      try {
        const core = project.split(/[\s,\-]+/).filter(p => p.length > 2).slice(0,2).join(' ');
        if (!core) continue;
        const r = await fetch('/api/drive-folders?q=' + encodeURIComponent(core) + '&limit=5');
        if (!r.ok) continue;
        const d = await r.json();
        if (!d.files || !d.files.length) continue;
        const folders = d.files.filter(f => f.is_folder).slice(0, 3);
        if (!folders.length) continue;
        // Inject into the meta row
        const meta = card.querySelector('.ws-card-meta');
        if (meta && !meta.querySelector('.ws-drive-hits')) {
          const span = document.createElement('span');
          span.className = 'ws-drive-hits';
          span.innerHTML = '📁 ' + folders.map(f =>
            `<a class="ws-drive-link" href="${escapeAttr(f.web_link)}" target="_blank" rel="noopener" data-folder-id="${escapeAttr(f.id)}" title="Smelltu hægri til að festa við þennan verkstað">${escapeHtml(f.name)} ↗</a>`
          ).join(' · ');
          meta.appendChild(span);
          // Right-click → save as the canonical Drive URL for this worksite
          span.querySelectorAll('.ws-drive-link').forEach(a => a.addEventListener('contextmenu', async (e) => {
            e.preventDefault();
            if (!confirm('Festa "'+a.textContent.replace(/ ↗$/,'')+'" sem Drive-möppu fyrir '+project+'?')) return;
            await updateStatus(project, { drive_folder_url: a.href });
            w.status.drive_folder_url = a.href;
            renderList();
          }));
        }
      } catch(e){ /* ignore individual misses */ }
    }
  };

  load(false);
}

const RG_DEFAULT_RATE_DV = 9951;
const RG_DEFAULT_RATE_EV = 14927;

};
function rgRateFor(project){
  // 1. Prefer rates from the pricing_guide table (live, editable per worksite)
  const pg = (window.__rgPricingGuide || {})[project];
  if(pg && (pg.dagvinna_rate || pg.eftirvinna_rate)){
    return {
      dv: Number(pg.dagvinna_rate)   || RG_DEFAULT_RATE_DV,
      ev: Number(pg.eftirvinna_rate) || RG_DEFAULT_RATE_EV,
    };
  }
  // 2. Fall back to the hardcoded map (only used until pricing_guide is loaded)
  return RG_RATES[project] || { dv: RG_DEFAULT_RATE_DV, ev: RG_DEFAULT_RATE_EV };
}

  const $win = document.getElementById('rg-window');
  const $refresh = document.getElementById('rg-refresh');
  const $host = document.getElementById('rg-grid-host');
  let lastData = null;

  function setMeta(s){
    const el = document.getElementById('rg-meta');
    if(el) el.textContent = s;
  }

  async function load(){
    setMeta('Sækir…');
    if($refresh){ $refresh.disabled = true; $refresh.classList.add('loading'); }
    try{
      const [r, drR, efR, pgR, rdR, ubR] = await Promise.all([
        cachedFetch('/api/worksites?year=combined'),
        cachedFetch('/api/invoice-drafts?status=invoiced').catch(() => null),
        cachedFetch('/api/efnislisti-docs').catch(() => null),
        cachedFetch('/api/pricing-guide').catch(() => null),
        cachedFetch('/api/redder-invoices').catch(() => null),
        cachedFetch('/api/unbilled-hours').catch(() => null),
      ]);
      // Build pricing_guide map → window-global so rgRateFor() can read it
      if (pgR && pgR.ok) {
        const { rows } = await pgR.json();
        window.__rgPricingGuide = {};
        for (const row of (rows||[])) {
          window.__rgPricingGuide[row.worksite_name] = row;
        }
      }
      if(!r.ok) throw new Error('HTTP '+r.status);
      lastData = await r.json();
      // Build worksite → unbilled klst (running balance shown in last column)
      lastData.unbilled = {};
      if (ubR && ubR.ok) {
        const { rows } = await ubR.json();
        for (const x of (rows||[])) lastData.unbilled[x.worksite] = x.unbilled_hours;
      }
      // Build (worksite, month) → total Redder material cost (recharged onto invoice)
      lastData.efni_total = {};
      if (rdR && rdR.ok) {
        const { summary } = await rdR.json();
        for (const g of (summary?.by_worksite_month||[])) {
          lastData.efni_total[`${g.worksite}|${g.month}`] = g.total_m_vsk;
        }
      }
      // Build a map of (worksite, month) → manually billed
      lastData.manual_billed = {};
      if (drR && drR.ok) {
        const { rows } = await drR.json();
        for (const row of (rows||[])) {
          if (row.status === 'invoiced') {
            lastData.manual_billed[`${row.worksite_name}|${row.work_month}`] = true;
          }
        }
      }
      // Build a map of (worksite, month) → efnislisti drive file URL
      lastData.efnislisti = {};
      if (efR && efR.ok) {
        const { rows } = await efR.json();
        for (const row of (rows||[])) {
          if (row.doc_type === 'invoice') continue;  // invoices have their own slot in Vinnubók
          const k = `${row.worksite_name}|${row.work_month}`;
          if (!lastData.efnislisti[k]) lastData.efnislisti[k] = [];
          lastData.efnislisti[k].push({ id: row.drive_file_id, title: row.title });
        }
      }
      // Bail out if a tab switch destroyed our DOM while the fetch was in flight
      if(!document.getElementById('rg-grid-host')) return;
      render();
      setMeta(`Uppfært ${new Date(lastData.generated_at).toLocaleTimeString('is-IS')} · ${lastData.summary.total_worksites} verkstaðir`);
    }catch(e){
      setMeta('Villa: '+(e.message||e));
    }finally{
      if($refresh){ $refresh.disabled = false; $refresh.classList.remove('loading'); }
    }
  }

  function buildMonthList(){
    const winVal = $win.value;
    const today = new Date();
    const out = [];
    if(winVal === 'ytd'){
      for(let m=0; m<=today.getMonth(); m++){
        out.push(`${today.getFullYear()}-${String(m+1).padStart(2,'0')}`);
      }
    } else {
      const n = parseInt(winVal, 10) || 8;
      for(let i=n-1; i>=0; i--){
        const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
        out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      }
    }
    return out;
  }

  function monthLabel(ym){
    const [y,m] = ym.split('-');
    const names = ['Jan','Feb','Mar','Apr','Maí','Jún','Júl','Ágú','Sep','Okt','Nóv','Des'];
    return `${names[parseInt(m,10)-1]} ${y.slice(2)}`;
  }

  function bucketInvoicesByMonth(invoices){
    const out = {};
    for(const inv of (invoices||[])){
      if(!inv.gjalddagi) continue;
      const ym = String(inv.gjalddagi).slice(0,7);
      if(!out[ym]) out[ym] = { amount:0, count:0, anyPaid:false, allPaid:true, anyOpen:false };
      const amt = Number(inv.amount||0);
      out[ym].amount += amt;
      out[ym].count += 1;
      const paid = /greidd|greitt/i.test(inv.status||'') || inv.greidsla_date;
      if(paid) out[ym].anyPaid = true; else out[ym].allPaid = false;
      if(/ógreidd|ógreitt|vanskil/i.test(inv.status||'')) out[ym].anyOpen = true;
    }
    return out;
  }

  function sourceIcon(project, hours, hasInvoices){
    if(RG_GATA_VERKEFNI.has(project) || /landsspítal|landsspital|nlsh|heklu|dalvegur 30/i.test(project)){
      return { icon:'🏗', cls:'rg-src-aj', title:'Ajour-byggt (Gata verkefni)' };
    }
    if(hours > 0){
      return { icon:'⏱', cls:'rg-src-tv', title:'Tímavera-byggt' };
    }
    return { icon:'💰', cls:'rg-src-fx', title:'Fast verð / annað' };
  }

  function isGata(project){
    return RG_GATA_VERKEFNI.has(project) || /landsspítal|landsspital|nlsh|^heklu/i.test(project);
  }

  function fmtIsk(n){ return n ? Math.round(n).toLocaleString('is-IS') : ''; }

  function rowLinks(w, months, invByMonth){
    const drive = w.status?.drive_folder_url || '';
    const project = w.project;
    const gmail = `https://mail.google.com/mail/u/0/?authuser=bokhald@brunaholf.is#search/${encodeURIComponent(project)}`;
    const gata = isGata(project);
    const projAttr = escapeAttr(project);
    const customer = (w.mapped_customers||[])[0] || '';
    const rates = rgRateFor(project);
    // Build /reikningur deep link with most-recent month-with-hours-but-no-invoice
    let efnisMonth = '', efnisHours = 0;
    for(let i = months.length-1; i >= 0; i--){
      const ym = months[i];
      const hr = (w.monthly||{})[ym] || 0;
      if(hr > 0 && !invByMonth[ym]){ efnisMonth = ym; efnisHours = hr; break; }
    }
    if(!efnisMonth && months.length){
      efnisMonth = months[months.length-1];
      efnisHours = (w.monthly||{})[efnisMonth] || 0;
    }
    const efnisUrl = `/reikningur?worksite=${encodeURIComponent(project)}&customer=${encodeURIComponent(customer)}&month=${encodeURIComponent(efnisMonth)}&dv_hours=${efnisHours.toFixed(2)}&dv_rate=${rates.dv}&ev_rate=${rates.ev}`;
    return `
      <a class="rg-link rg-link-pill" href="${efnisUrl}" target="_blank" rel="noopener" title="Opna Efnislista fyrir ${efnisMonth || 'nýjasta mánuð'}">📝</a>
      <button type="button" class="rg-link rg-link-btn" data-rg-calc="${projAttr}" title="Reikna næsta reikning">🧾</button>
      <a class="rg-link ${drive?'':'rg-link-empty'}" href="${escapeHtml(drive||'#')}" target="_blank" rel="noopener" title="Drive mappa">📁</a>
      <a class="rg-link" href="${gata?RG_AJOUR_URL:RG_TIMAVERA_URL}" target="_blank" rel="noopener" title="${gata?'Opna Ajour':'Opna Tímavera'}">${gata?'🏗':'⏱'}</a>
      <a class="rg-link" href="${RG_PAYDAY_URL}" target="_blank" rel="noopener" title="Opna Payday">💳</a>
      <a class="rg-link" href="${gmail}" target="_blank" rel="noopener" title="Leita í bokhald inbox">📧</a>
      <button type="button" class="rg-link rg-link-btn" data-rg-hide="${projAttr}" title="Fela verkstaðinn">👁</button>
    `;
  }

  // Hidden-project list lives in app state so it persists across devices
  function rgHidden(){
    state.ui = state.ui || {};
    if(!Array.isArray(state.ui.rg_hidden)) state.ui.rg_hidden = [];
    return state.ui.rg_hidden;
  }
  function rgHideProject(name){
    const arr = rgHidden();
    if(!arr.includes(name)){ arr.push(name); save(); render(); }
  }
  function rgUnhideAll(){
    state.ui.rg_hidden = []; save(); render();
  }

  function render(){
    if(!lastData){ $host.innerHTML = ''; return; }
    const months = buildMonthList();
    const hidden = new Set(rgHidden());
    const allSites = (lastData.worksites||[]).filter(w => {
      // skip noise buckets
      if(/almennt|veikindi|sick|work at home|kaffi|fundir/i.test(w.project)) return false;
      // only show sites with activity in window OR with invoices/skuldir
      const hasMonthHours = months.some(ym => (w.monthly||{})[ym] > 0);
      const invByMonth = bucketInvoicesByMonth(w.invoices);
      const hasMonthInv = months.some(ym => invByMonth[ym]);
      return hasMonthHours || hasMonthInv || (w.invoice_unpaid||0) > 0;
    });
    const hiddenInWindow = allSites.filter(w => hidden.has(w.project)).length;
    const sites = allSites.filter(w => !hidden.has(w.project));

    // split: regular (Tímavera) vs Gata verkefni
    const regular = sites.filter(w => !isGata(w.project));
    const gata    = sites.filter(w =>  isGata(w.project));

    // sort each block by hours desc
    regular.sort((a,b) => (b.hours||0) - (a.hours||0));
    gata.sort((a,b) => (b.hours||0) - (a.hours||0));

    // monthly totals across all visible sites
    const monthlyTotals = months.map(ym => {
      let sum = 0;
      for(const w of sites){
        const inv = bucketInvoicesByMonth(w.invoices)[ym];
        sum += inv?.amount || 0;
      }
      return sum;
    });

    const rowHtml = (w) => {
      const src = sourceIcon(w.project, w.hours||0, (w.invoice_count||0) > 0);
      const invByMonth = bucketInvoicesByMonth(w.invoices);
      const cust = (w.mapped_customers||[])[0] || '';
      const skuldir = w.invoice_unpaid || 0;
      const driveUrl = w.status?.drive_folder_url || '';

      return `
        <tr class="${isGata(w.project)?'rg-row-gata':''}">
          <td class="rg-col-drive">
            ${driveUrl
              ? `<a class="rg-drive" href="${escapeHtml(driveUrl)}" target="_blank" rel="noopener" title="Drive mappa">📁</a>`
              : `<span class="rg-drive rg-drive-empty" title="Engin Drive mappa">📁</span>`}
          </td>
          <td class="rg-col-src ${src.cls}" title="${src.title}">${src.icon}</td>
          <td class="rg-col-name"><button type="button" class="rg-name-link" data-rg-wc="${escapeAttr(w.project)}" title="Opna verkstöð / Workcenter">${escapeHtml(w.project)}</button><span class="rg-name-sub">${(w.hours||0).toFixed(0)} klst · ${(w.ajour_registrations||0)} skr.</span></td>
          <td class="rg-col-cust">${escapeHtml(cust)}</td>
          <td class="rg-col-skuldir">${fmtIsk(skuldir)}</td>
          ${months.map(ym => {
            const inv = invByMonth[ym];
            const amt = inv?.amount || 0;
            const rei = !!inv;
            const greitt = !!(inv && inv.allPaid && !inv.anyOpen);
            const monthHours = (w.monthly||{})[ym] || 0;
            // Highlight: hours logged this month but no invoice yet → needs invoicing
            const isAjour = isGata(w.project);
            const needsBill = monthHours > 0 && !rei && !isAjour;
            const cellCls = inv?.anyOpen ? ' rg-attn' : (needsBill ? ' rg-needs-bill' : '');
            // Always show hours when present, plus a rough kr estimate (hours × rate × 1.24)
            // so even months without an invoice surface their value at a glance.
            const rates = rgRateFor(w.project);
            const rateSource = (window.__rgPricingGuide||{})[w.project] ? 'pricing_guide' : (RG_RATES[w.project] ? 'hardcoded' : 'default');
            const estKr = !isAjour ? Math.round(monthHours * rates.dv * 1.24) : 0;
            const hoursLabel = !isAjour && monthHours > 0
              ? `<span class="rg-month-hrs" title="Tímavera klst · taxti ${rates.dv} kr/klst (${rateSource}) · áætluð: ${monthHours.toFixed(1)} × ${rates.dv} × 1.24 = ${fmtIsk(estKr)} kr m.vsk">${monthHours.toFixed(0)}t<span class="rg-month-est">≈${fmtIsk(estKr)}</span></span>`
              : '';
            const amtLabel = amt
              ? `<span class="rg-month-kr">${fmtIsk(amt)}</span>`
              : (hoursLabel ? '' : '<span class="rg-zero">–</span>');
            const cellInner = `${hoursLabel}${hoursLabel && amtLabel ? '<br>' : ''}${amtLabel}`;
            // Check if user has manually marked this month as billed (via override in invoice_drafts)
            const manualBilled = (lastData.manual_billed||{})[`${w.project}|${ym}`];
            const billedCls = manualBilled ? ' rg-billed-manual' : '';
            // Efnislisti docs linked for this (worksite, month) — show 📎 link to the first one
            const efDocs = (lastData.efnislisti||{})[`${w.project}|${ym}`] || [];
            const efLink = efDocs.length
              ? `<a class="rg-month-doc" href="https://drive.google.com/file/d/${efDocs[0].id}/view" target="_blank" rel="noopener" title="Efnislisti: ${escapeAttr(efDocs[0].title)}${efDocs.length>1?' (+'+(efDocs.length-1)+' fleiri)':''}" onclick="event.stopPropagation()">📎</a>`
              : '';
            // Redder material cost for this (worksite, month) — recharged onto customer invoice
            const efniKr = (lastData.efni_total||{})[`${w.project}|${ym}`] || 0;
            const efniLine = efniKr > 0
              ? `<div class="rg-month-efni" title="Efni úr Redder · smelltu til að breyta verðum"><button type="button" class="rg-efni-btn" data-rg-efni="${escapeAttr(w.project)}|${ym}">📦 ${fmtIsk(efniKr)}</button></div>`
              : '';
            return `
              <td class="rg-month${needsBill && !manualBilled?' rg-month-needs':''}${billedCls}" title="${needsBill?(monthHours.toFixed(1)+' klst skráðar — engin reikningur'):''}">
                <div class="rg-month-amt ${cellCls}">${cellInner}</div>
                ${efniLine}
                <div class="rg-cb-row">
                  ${efLink}
                  <span class="rg-cb rg-cb-clickable ${rei||manualBilled?'rg-cb-ok':'rg-cb-no'}" data-rg-toggle-rei="${escapeAttr(w.project)}|${ym}" title="Smelltu til að merkja sem rukkað (bundlað í annan reikning eða sent of seint)">${rei||manualBilled?'☑':'☐'} rei</span>
                  <span class="rg-cb ${greitt?'rg-cb-ok':'rg-cb-no'}" title="${greitt?'Greitt':'Ógreitt'}">${greitt?'☑':'☐'} gr</span>
                </div>
              </td>`;
          }).join('')}
          <td class="rg-col-balance ${(lastData.unbilled||{})[w.project] > 0 && !isGata(w.project) ? 'rg-balance-unbilled' : ''}">${(() => {
            if (isGata(w.project)) return '<span class="rg-zero" title="Gata verkefni: rukkast eftir Ajour stakar, ekki Tímavera klst">⊘</span>';
            const ub = (lastData.unbilled||{})[w.project];
            if (ub == null) return '<span class="rg-zero">—</span>';
            const sign = ub > 0 ? '+' : '';
            return `${sign}${ub.toFixed(0)}t`;
          })()}</td>
          <td class="rg-col-links">${rowLinks(w, months, invByMonth)}</td>
        </tr>
      `;
    };

    const hiddenBar = hiddenInWindow
      ? `<div class="rg-hidden-bar">${hiddenInWindow} verkstaðir faldir <button type="button" id="rg-unhide-all" class="rg-tool" style="margin-left:8px">↻ Sýna aftur</button></div>`
      : '';

    const html = `
      ${hiddenBar}
      <table class="rg-grid">
        <thead>
          <tr>
            <th class="rg-col-drive"></th>
            <th class="rg-col-src"></th>
            <th class="rg-col-name">Verkstaður</th>
            <th class="rg-col-cust">Viðskiptavinur</th>
            <th class="rg-col-skuldir">Skuld</th>
            ${months.map(ym => `<th class="rg-month">${monthLabel(ym)}</th>`).join('')}
            <th class="rg-col-balance" title="Klst skráðar mínus áætl. rukkaðar (Tímavera − [reikningur − efni] / taxti)">Eftirst. klst</th>
            <th class="rg-col-links"></th>
          </tr>
        </thead>
        <tbody>
          ${regular.map(rowHtml).join('')}
          ${gata.length ? `<tr class="rg-section-row"><td colspan="${6+months.length+1}">Gata verkefni · Ajour</td></tr>` : ''}
          ${gata.map(rowHtml).join('')}
          <tr class="rg-totals-row">
            <td colspan="5" style="text-align:right">Samtals</td>
            ${monthlyTotals.map(t => `<td class="rg-month"><div class="rg-month-amt">${fmtIsk(t)}</div></td>`).join('')}
            <td></td>
          </tr>
        </tbody>
      </table>
    `;
    $host.innerHTML = html;

    // Wire hide/unhide + calculator buttons after innerHTML reset
    $host.querySelectorAll('[data-rg-hide]').forEach(b => {
      b.onclick = () => rgHideProject(b.dataset.rgHide);
    });
    $host.querySelectorAll('[data-rg-calc]').forEach(b => {
      b.onclick = () => rgOpenCalculator(b.dataset.rgCalc, allSites, months);
    });
    $host.querySelectorAll('[data-rg-wc]').forEach(b => {
      b.onclick = () => rgOpenWorkcenter(b.dataset.rgWc, allSites, months);
    });
    // Click on the 📦 efni button → open Redder-invoices editor for (worksite, month)
    $host.querySelectorAll('[data-rg-efni]').forEach(b => {
      b.onclick = () => {
        const [worksite, month] = b.dataset.rgEfni.split('|');
        rgOpenEfniEditor(worksite, month);
      };
    });
    // Click on the "rei" chip → mark month as manually billed (bundled / late-issue case)
    $host.querySelectorAll('[data-rg-toggle-rei]').forEach(b => {
      b.onclick = async () => {
        const [worksite, work_month] = b.dataset.rgToggleRei.split('|');
        const key = `${worksite}|${work_month}`;
        lastData.manual_billed = lastData.manual_billed || {};
        const currentlyBilled = !!lastData.manual_billed[key];
        const newStatus = currentlyBilled ? 'overdue' : 'invoiced';
        lastData.manual_billed[key] = !currentlyBilled;  // optimistic
        render();
        try {
          await fetch('/api/invoice-drafts', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
              worksite_name: worksite,
              work_month: work_month,
              status: newStatus,
              notes: newStatus === 'invoiced'
                ? `Merkt sem rukkað handvirkt í Reikningagerð (bundlað í annan reikning eða sent of seint)`
                : `Aftekið handvirkt merkingu`,
              updated_by: 'rg-grid-toggle',
            }),
          });
        } catch(e) {
          // revert on error
          lastData.manual_billed[key] = currentlyBilled;
          render();
        }
      };
    });
    const $unhide = document.getElementById('rg-unhide-all');
    if($unhide) $unhide.onclick = rgUnhideAll;

    // KPIs
    document.getElementById('rg-k-count').textContent = sites.length;
    document.getElementById('rg-k-count-sub').textContent = `${regular.length} Tímavera · ${gata.length} Gata`;
    document.getElementById('rg-k-no-inv').textContent = sites.filter(w => (w.hours||0) > 0 && (w.invoice_count||0) === 0).length;
    const invTotal = sites.reduce((a,w) => a + (w.invoice_total||0), 0);
    const invUnpaid = sites.reduce((a,w) => a + (w.invoice_unpaid||0), 0);
    document.getElementById('rg-k-inv').textContent = fmtIsk(invTotal);
    document.getElementById('rg-k-inv-sub').textContent = `${sites.reduce((a,w) => a + (w.invoice_count||0), 0)} reikningar`;
    document.getElementById('rg-k-unpaid').textContent = fmtIsk(invUnpaid);
  }

  // expose for the calculator modal to use later
  window.__rgRender = render;

  $refresh.addEventListener('click', () => {
    clearDataCache();
    load();
    loadDataSources();
    loadForecast();
  });
  $win.addEventListener('change', () => { if(lastData) render(); });
  load();

  // Data freshness strip
  loadDataSources();
  // Forecast banner — fetch invoice_drafts and render summary + expandable breakdown
  loadForecast();
  document.getElementById('rg-forecast-toggle').onclick = () => {
    const $list = document.getElementById('rg-forecast-list');
    const $btn  = document.getElementById('rg-forecast-toggle');
    const hidden = $list.hasAttribute('hidden');
    if(hidden){ $list.removeAttribute('hidden'); $btn.textContent = 'Fela sundurliðun ▴'; }
    else      { $list.setAttribute('hidden',''); $btn.textContent = 'Sýna sundurliðun ▾'; }
  };
}

async function loadDataSources(){
  const $el = document.getElementById('rg-sources');
  if (!$el) return;
  try{
    const r = await fetch('/api/data-sources-status');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const { sources } = await r.json();
    const statusColor = s => s==='fresh'?'#2E8C5B' : s==='aging'?'#B26B00' : s==='stale'?'#9B1A0F' : '#777';
    const statusLabel = s => s==='fresh'?'FERSKT' : s==='aging'?'ELDIST' : s==='stale'?'LIÐINN' : '?';
    $el.innerHTML = `
      <div class="rg-sources-head">
        <div>
          <div class="rg-sources-title">📊 Gögn í kerfinu</div>
          <div class="rg-sources-sub">Hve gömul eru gögnin? Smelltu á 📥 hjá uppruna til að sjá hvaða skrá á að uppfæra.</div>
        </div>
        <button type="button" class="rg-tool" id="rg-sources-refresh" title="Endurnýja allar gagnasíður">↻ Endurnýja</button>
      </div>
      <div class="rg-sources-grid">
        ${sources.map(s => `
          <div class="rg-source" title="${escapeAttr(s.file_hint||'')}">
            <div class="rg-source-head">
              <span class="rg-source-icon">${s.icon}</span>
              <span class="rg-source-label">${escapeHtml(s.label)}</span>
              <span class="rg-source-pill" style="background:${statusColor(s.status)}22;color:${statusColor(s.status)}">${statusLabel(s.status)}</span>
            </div>
            <div class="rg-source-meta">
              ${s.last_import
                ? `${s.age_days != null ? (s.age_days === 0 ? 'Í dag' : s.age_days + ' dagar síðan') : '?'} · ${(s.count||0).toLocaleString('is-IS')} færslur`
                : '<em>engin gögn enn</em>'}
            </div>
            <div class="rg-source-file">📥 ${escapeHtml(s.file_hint||'—')}</div>
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById('rg-sources-refresh').onclick = () => {
      clearDataCache();
      // Re-fire the page's main load + side panels
      if (typeof load === 'function') load();
      else { state.ui.activeTab = 'reikningar'; save(); render(); }
      loadDataSources();
      loadForecast();
    };
  }catch(e){
    $el.innerHTML = `<div class="vs-empty">Gat ekki sótt gagnasamantekt: ${escapeHtml(e.message||'')}</div>`;
  }
}

async function loadForecast(){
  try{
    const r = await fetch('/api/invoice-drafts?status=overdue,draft');
    if(!r.ok) return;
    const { rows, summary } = await r.json();
    const fmt = n => Math.round(n||0).toLocaleString('is-IS');
    const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
    const overdue = (summary.by_status||{}).overdue || 0;
    const draft   = (summary.by_status||{}).draft   || 0;
    const nOver   = rows.filter(r => r.status==='overdue').length;
    const nDraft  = rows.filter(r => r.status==='draft').length;
    const hrsOver = rows.filter(r => r.status==='overdue').reduce((a,r) => a + Number(r.hours_dagvinna||0), 0);
    const hrsDr   = rows.filter(r => r.status==='draft').reduce((a,r) => a + Number(r.hours_dagvinna||0), 0);
    set('rg-fc-overdue-v', fmt(overdue));
    set('rg-fc-overdue-n', `${nOver} línur · ${hrsOver.toFixed(0)} klst`);
    set('rg-fc-draft-v',   fmt(draft));
    set('rg-fc-draft-n',   `${nDraft} línur · ${hrsDr.toFixed(0)} klst`);
    set('rg-fc-total-v',   fmt(overdue + draft));

    // Build breakdown list with the math for each line
    const $list = document.getElementById('rg-forecast-list');
    if($list){
      $list.innerHTML = rows.slice(0, 30).map(r => {
        const hrs = Number(r.hours_dagvinna || 0);
        const rate = Number(r.rate_dagvinna || 0);
        const dvAmt = hrs * rate;
        const sma = Number(r.smahlutagjald || 0);
        const net = Number(r.net_an_vsk || 0);
        const vsk = Number(r.vsk_amount || 0);
        const total = Number(r.total_m_vsk || 0);
        const tagCls = r.status === 'overdue' ? 'rg-fc-tag-over' : 'rg-fc-tag-draft';
        const tagLabel = r.status === 'overdue' ? 'YFIR GJALDDAGA' : 'DRÖG';
        return `
          <details class="rg-fc-item">
            <summary>
              <span class="rg-fc-tag ${tagCls}">${tagLabel}</span>
              <span class="rg-fc-item-name">${escapeHtml(r.worksite_name)}</span>
              <span class="rg-fc-item-cust">${escapeHtml(r.customer_name || '—')}</span>
              <span class="rg-fc-item-month">${monthLabelStatic(r.work_month)}</span>
              <span class="rg-fc-item-hrs">${hrs.toFixed(1)} klst</span>
              <span class="rg-fc-item-amt">${fmt(total)} kr</span>
            </summary>
            <div class="rg-fc-math">
              <div class="rg-fc-math-line"><span>Tímavera klst (dagvinna)</span><span>${hrs.toFixed(2)} klst</span></div>
              <div class="rg-fc-math-line"><span>Verðtaxti</span><span>× ${fmt(rate)} kr/klst</span></div>
              <div class="rg-fc-math-line rg-fc-math-eq"><span>= Dagvinna</span><span>${fmt(dvAmt)} kr</span></div>
              <div class="rg-fc-math-line"><span>+ Smáhlutagjald (137 × ${hrs.toFixed(1)})</span><span>+ ${fmt(sma)} kr</span></div>
              <div class="rg-fc-math-line"><span>+ Akstur</span><span class="rg-fc-math-todo">— (handvirkt)</span></div>
              <div class="rg-fc-math-line"><span>+ Efni (Redder)</span><span class="rg-fc-math-todo">— (handvirkt)</span></div>
              <div class="rg-fc-math-line rg-fc-math-sub"><span>= Samtals án vsk</span><span>${fmt(net)} kr</span></div>
              <div class="rg-fc-math-line"><span>+ 24% VSK</span><span>+ ${fmt(vsk)} kr</span></div>
              <div class="rg-fc-math-line rg-fc-math-total"><span>= Samtals m. vsk (forecast)</span><span>${fmt(total)} kr</span></div>
              ${r.notes ? `<div class="rg-fc-math-note">${escapeHtml(r.notes)}</div>` : ''}
            </div>
          </details>`;
      }).join('') + (rows.length > 30 ? `<div class="rg-fc-more">+ ${rows.length - 30} fleiri línur — sjá invoice_drafts töflu</div>` : '');
    }
  }catch(e){
    const el = document.getElementById('rg-fc-total-v');
    if(el) el.textContent = 'villa';
  }
}

/* ====================== REIKNINGAGERÐ — invoice calculator modal ====================== */
function rgOpenCalculator(project, allSites, months){
  const w = allSites.find(s => s.project === project);
  if(!w){ alert('Engin gögn fyrir verkstað: '+project); return; }

  // Default to the most recent month that has hours but no invoice — else
  // the latest month in window.
  const rgInvByMonth = (invs) => {
    const out = {};
    for(const inv of (invs||[])){
      if(!inv.gjalddagi) continue;
      const ym = String(inv.gjalddagi).slice(0,7);
      out[ym] = true;
    }
    return out;
  };
  const invByMonth = rgInvByMonth(w.invoices);
  let defaultMonth = months[months.length-1];
  for(let i = months.length-1; i >= 0; i--){
    const ym = months[i];
    const hr = (w.monthly||{})[ym] || 0;
    if(hr > 0 && !invByMonth[ym]) { defaultMonth = ym; break; }
  }
  const rates = rgRateFor(project);
  const fmt = n => Math.round(n||0).toLocaleString('is-IS');

  const html = `
    <div class="rg-calc-wrap">
      <div class="rg-calc-head">
        <div>
          <div class="rg-calc-title">Reikna næsta reikning</div>
          <div class="rg-calc-sub">${escapeHtml(project)} · viðskiptavinur ${escapeHtml((w.mapped_customers||[])[0]||'—')}</div>
        </div>
        <button type="button" class="rg-calc-close" id="rg-calc-close">✕</button>
      </div>

      <div class="rg-calc-row">
        <label>Mánuður
          <select id="rg-calc-month">
            ${months.map(ym => `<option value="${ym}" ${ym===defaultMonth?'selected':''}>${monthLabelStatic(ym)}</option>`).join('')}
          </select>
        </label>
        <div class="rg-calc-hours-display">
          Tímavera klst: <strong id="rg-calc-hours-total">—</strong>
        </div>
      </div>

      <table class="rg-calc-table">
        <tr>
          <td>Dagvinna</td>
          <td><input type="number" id="rg-calc-dv-rate" value="${rates.dv}" step="50"> kr/klst</td>
          <td>×</td>
          <td><input type="number" id="rg-calc-dv-hours" value="0" step="0.5"> klst</td>
          <td class="rg-calc-amt" id="rg-calc-dv-amt">0</td>
        </tr>
        <tr>
          <td>Eftirvinna</td>
          <td><input type="number" id="rg-calc-ev-rate" value="${rates.ev}" step="50"> kr/klst</td>
          <td>×</td>
          <td><input type="number" id="rg-calc-ev-hours" value="0" step="0.5"> klst</td>
          <td class="rg-calc-amt" id="rg-calc-ev-amt">0</td>
        </tr>
        <tr>
          <td>Akstur — km</td>
          <td>${RG_AKSTUR_KM_RATE.toLocaleString('is-IS')} kr/km</td>
          <td>×</td>
          <td><input type="number" id="rg-calc-km" value="0" step="10"> km</td>
          <td class="rg-calc-amt" id="rg-calc-km-amt">0</td>
        </tr>
        <tr>
          <td>Akstur — ferðir</td>
          <td>${RG_AKSTUR_FERD_RATE.toLocaleString('is-IS')} kr/ferð</td>
          <td>×</td>
          <td><input type="number" id="rg-calc-ferd" value="0" step="1"> ferðir</td>
          <td class="rg-calc-amt" id="rg-calc-ferd-amt">0</td>
        </tr>
        <tr>
          <td>Smáhlutagjald</td>
          <td>${RG_SMAHLUTAGJALD} kr/klst (dv+ev)</td>
          <td>×</td>
          <td><span id="rg-calc-sma-mult">0</span> klst</td>
          <td class="rg-calc-amt" id="rg-calc-sma-amt">0</td>
        </tr>
        <tr>
          <td>Staðfesting brunaþéttinga</td>
          <td>${RG_STADFESTING.toLocaleString('is-IS')} kr</td>
          <td colspan="2"><label><input type="checkbox" id="rg-calc-stadf"> innifalið</label></td>
          <td class="rg-calc-amt" id="rg-calc-stadf-amt">0</td>
        </tr>
        <tr>
          <td colspan="4">Efni (handfylla — kemur í v2)</td>
          <td><input type="number" id="rg-calc-efni" value="0" step="100"></td>
        </tr>
        <tr class="rg-calc-sub-row">
          <td colspan="4">Samtals án vsk</td>
          <td class="rg-calc-amt" id="rg-calc-net">0</td>
        </tr>
        <tr>
          <td colspan="4">VSK (${RG_VSK_PCT}%)</td>
          <td class="rg-calc-amt" id="rg-calc-vsk">0</td>
        </tr>
        <tr class="rg-calc-total-row">
          <td colspan="4">Samtals m. vsk</td>
          <td class="rg-calc-amt" id="rg-calc-total">0</td>
        </tr>
      </table>

      <div class="rg-calc-actions">
        <button type="button" class="rg-tool" id="rg-calc-copy-total" title="Afrita upphæð m. vsk">📋 Afrita upphæð</button>
        <button type="button" class="rg-tool" id="rg-calc-copy-all" title="Afrita allar línur">📋 Afrita allt</button>
        <a class="rg-tool" href="${RG_PAYDAY_URL}" target="_blank" rel="noopener">💳 Opna Payday</a>
      </div>
      <div class="rg-calc-hint">Tímavera klst koma sjálfkrafa fyrir valinn mánuð. Skipting milli dagvinnu/eftirvinnu er handvirk — flest verkefni eru bara dagvinna.</div>
    </div>
  `;
  openModal(html);

  // helpers
  const $ = id => document.getElementById(id);
  const num = id => Number($(id).value) || 0;
  const setAmt = (id, v) => $(id).textContent = fmt(v);

  function recompute(){
    const dv = num('rg-calc-dv-rate') * num('rg-calc-dv-hours');
    const ev = num('rg-calc-ev-rate') * num('rg-calc-ev-hours');
    const km = RG_AKSTUR_KM_RATE * num('rg-calc-km');
    const fr = RG_AKSTUR_FERD_RATE * num('rg-calc-ferd');
    const smaMult = num('rg-calc-dv-hours') + num('rg-calc-ev-hours');  // dagvinna + yfirvinna
    const sma = RG_SMAHLUTAGJALD * smaMult;
    const stadf = $('rg-calc-stadf').checked ? RG_STADFESTING : 0;
    const efni = num('rg-calc-efni');
    const net  = dv + ev + km + fr + sma + stadf + efni;
    const vsk  = Math.round(net * RG_VSK_PCT / 100);
    const total = net + vsk;
    setAmt('rg-calc-dv-amt', dv);
    setAmt('rg-calc-ev-amt', ev);
    setAmt('rg-calc-km-amt', km);
    setAmt('rg-calc-ferd-amt', fr);
    setAmt('rg-calc-sma-amt', sma);
    setAmt('rg-calc-stadf-amt', stadf);
    setAmt('rg-calc-net', net);
    setAmt('rg-calc-vsk', vsk);
    setAmt('rg-calc-total', total);
    $('rg-calc-sma-mult').textContent = smaMult.toFixed(1);
  }

  function loadMonth(){
    const ym = $('rg-calc-month').value;
    const hr = (w.monthly||{})[ym] || 0;
    $('rg-calc-hours-total').textContent = hr.toFixed(1) + ' klst';
    // Default: put all hours into dagvinna; user can split if needed
    $('rg-calc-dv-hours').value = hr.toFixed(2);
    $('rg-calc-ev-hours').value = 0;
    recompute();
  }

  $('rg-calc-month').onchange = loadMonth;
  ['rg-calc-dv-rate','rg-calc-dv-hours','rg-calc-ev-rate','rg-calc-ev-hours',
   'rg-calc-km','rg-calc-ferd','rg-calc-efni'].forEach(id => {
    $(id).oninput = recompute;
  });
  $('rg-calc-stadf').onchange = recompute;
  $('rg-calc-close').onclick = closeModal;
  $('rg-calc-copy-total').onclick = () => {
    const t = $('rg-calc-total').textContent;
    navigator.clipboard.writeText(t).then(() => {
      $('rg-calc-copy-total').textContent = '✓ Afritað';
      setTimeout(() => $('rg-calc-copy-total').textContent = '📋 Afrita upphæð', 1500);
    });
  };
  $('rg-calc-copy-all').onclick = () => {
    const ym = $('rg-calc-month').value;
    const lines = [
      `${project} — ${monthLabelStatic(ym)}`,
      `Dagvinna ${num('rg-calc-dv-hours').toFixed(1)} klst × ${fmt(num('rg-calc-dv-rate'))} = ${$('rg-calc-dv-amt').textContent}`,
      `Eftirvinna ${num('rg-calc-ev-hours').toFixed(1)} klst × ${fmt(num('rg-calc-ev-rate'))} = ${$('rg-calc-ev-amt').textContent}`,
      `Akstur km ${num('rg-calc-km')} = ${$('rg-calc-km-amt').textContent}`,
      `Akstur ferðir ${num('rg-calc-ferd')} = ${$('rg-calc-ferd-amt').textContent}`,
      `Smáhlutagjald = ${$('rg-calc-sma-amt').textContent}`,
      `Staðfesting = ${$('rg-calc-stadf-amt').textContent}`,
      `Efni = ${$('rg-calc-efni').value}`,
      `Samtals án vsk = ${$('rg-calc-net').textContent}`,
      `VSK ${RG_VSK_PCT}% = ${$('rg-calc-vsk').textContent}`,
      `Samtals m. vsk = ${$('rg-calc-total').textContent}`,
    ].join('\n');
    navigator.clipboard.writeText(lines).then(() => {
      $('rg-calc-copy-all').textContent = '✓ Afritað';
      setTimeout(() => $('rg-calc-copy-all').textContent = '📋 Afrita allt', 1500);
    });
  };

  loadMonth();
}
// Static month-label helper for use outside the closure
function monthLabelStatic(ym){
  const names = ['Jan','Feb','Mar','Apr','Maí','Jún','Júl','Ágú','Sep','Okt','Nóv','Des'];
  const [y,m] = ym.split('-');
  return `${names[parseInt(m,10)-1]} ${y.slice(2)}`;
}

/* ====================== VINNUSTOFA — action-first dashboard ====================== */
async function renderVinnustofa(t){
  $view.innerHTML = `
    <div class="vs-wrap">
      <div class="vs-hero">
        <h1>🎯 Vinnustofa</h1>
        <p class="vs-tag">Hvað þarf að gera núna — raðað eftir áhrifum á reksturinn</p>
      </div>
      <div class="vs-kpis" id="vs-kpis">Sækir…</div>
      <div class="vs-cols">
        <section class="vs-col" id="vs-bill-col"><div class="vs-loading">Sækir…</div></section>
        <section class="vs-col" id="vs-collect-col"><div class="vs-loading">Sækir…</div></section>
      </div>
      <section class="vs-card" id="vs-unbilled" style="margin-bottom:18px">
        <h2 class="vs-h2">⏱ Ósend klst (Tímavera án reiknings)</h2>
        <p class="vs-h2-sub">Klst skráðar í Tímavera mínus áætlaðar rukkaðar klst (eftir frádrag á efni). Smelltu á verkstað til að opna Workcenter.</p>
        <div id="vs-unbilled-list" class="vs-loading">Sækir…</div>
      </section>
      <section class="vs-card" id="vs-activity">
        <h2 class="vs-h2">📰 Nýleg starfsemi</h2>
        <div id="vs-activity-list" class="vs-loading">Sækir…</div>
      </section>
    </div>
  `;
  bindEditButtons();

  const fmt = n => Math.round(n||0).toLocaleString('is-IS');
  const $kpis = document.getElementById('vs-kpis');
  const $bill = document.getElementById('vs-bill-col');
  const $collect = document.getElementById('vs-collect-col');
  const $activity = document.getElementById('vs-activity-list');

  try{
    const [wsR, drR, rdR, ubR] = await Promise.all([
      cachedFetch('/api/worksites?year=combined'),
      cachedFetch('/api/invoice-drafts?status=overdue,draft').catch(() => null),
      cachedFetch('/api/redder-invoices').catch(() => null),
      cachedFetch('/api/unbilled-hours').catch(() => null),
    ]);
    const ws = await wsR.json();
    const drafts = drR && drR.ok ? (await drR.json()).rows || [] : [];
    const redder = rdR && rdR.ok ? (await rdR.json()) : { rows:[], summary:{} };
    const unbilled = ubR && ubR.ok ? (await ubR.json()) : { rows:[], summary:{} };

    // KPI numbers
    const totalUnpaid  = (ws.worksites||[]).reduce((a,w) => a + (w.invoice_unpaid||0), 0);
    const totalDrafts  = drafts.reduce((a,d) => a + Number(d.total_m_vsk||0), 0);
    const draftsCount  = drafts.length;
    const efniTotal    = Number(redder.summary?.grand_total_m_vsk || 0);
    const efniCount    = (redder.rows||[]).length;
    $kpis.innerHTML = `
      <div class="vs-kpi vs-kpi-red">
        <div class="vs-kpi-l">🔴 Útistandandi skuldir</div>
        <div class="vs-kpi-v">${fmt(totalUnpaid)}</div>
        <div class="vs-kpi-x">kr m. vsk · sjá lista hægra megin →</div>
      </div>
      <div class="vs-kpi vs-kpi-amber">
        <div class="vs-kpi-l">📤 Til að senda</div>
        <div class="vs-kpi-v">${fmt(totalDrafts)}</div>
        <div class="vs-kpi-x">${draftsCount} drög · sjá vinstri →</div>
      </div>
      <div class="vs-kpi vs-kpi-blue">
        <div class="vs-kpi-l">📦 Efnisk. á reikning</div>
        <div class="vs-kpi-v">${fmt(efniTotal)}</div>
        <div class="vs-kpi-x">${efniCount} Redder reikningar</div>
      </div>
      <div class="vs-kpi vs-kpi-green">
        <div class="vs-kpi-l">📈 Spá m. vsk</div>
        <div class="vs-kpi-v">${fmt(totalUnpaid + totalDrafts)}</div>
        <div class="vs-kpi-x">útistandandi + ósent</div>
      </div>
    `;

    // ===== Left column: Til að senda (top 8 drafts) =====
    const billItems = drafts.slice().sort((a,b) => Number(b.total_m_vsk||0) - Number(a.total_m_vsk||0)).slice(0, 8);
    $bill.innerHTML = `
      <h2 class="vs-h2">📤 Senda þessa reikninga næst</h2>
      <p class="vs-h2-sub">${draftsCount} drög samtals · raðað eftir upphæð</p>
      <div class="vs-items">
        ${billItems.length === 0
          ? '<div class="vs-empty">Engin ósend drög — allt í lagi 🎉</div>'
          : billItems.map(d => {
              const hrs = Number(d.hours_dagvinna || 0);
              const total = Number(d.total_m_vsk || 0);
              const tag = d.status === 'overdue' ? `<span class="vs-pill vs-pill-red">YFIR GJALDDAGA</span>` : `<span class="vs-pill vs-pill-amber">DRÖG</span>`;
              const customerStr = d.customer_name ? ` · ${escapeHtml(d.customer_name)}` : '';
              const dvRate = Number(d.rate_dagvinna) || 9951;
              const evRate = Number(d.rate_eftirvinna) || 14927;
              // Use trailing slash to bypass the 301 redirect and preserve query params cleanly
              const url = `/reikningur/?worksite=${encodeURIComponent(d.worksite_name)}&customer=${encodeURIComponent(d.customer_name||'')}&month=${encodeURIComponent(d.work_month)}&dv_hours=${hrs.toFixed(2)}&dv_rate=${dvRate}&ev_rate=${evRate}`;
              return `
                <div class="vs-item">
                  <div class="vs-item-head">
                    ${tag}
                    <strong>${escapeHtml(d.worksite_name)}</strong>
                    <span class="vs-item-meta">${monthLabelStatic(d.work_month)}${customerStr}</span>
                  </div>
                  <div class="vs-item-body">
                    <div class="vs-item-num"><div class="vs-item-num-l">Tímar</div><div class="vs-item-num-v">${hrs.toFixed(1)} klst</div></div>
                    <div class="vs-item-num"><div class="vs-item-num-l">Áætlað m. vsk</div><div class="vs-item-num-v vs-item-num-amount">${fmt(total)}</div></div>
                  </div>
                  <div class="vs-item-actions">
                    <a class="vs-btn vs-btn-primary" href="${url}" target="_blank" rel="noopener">📝 Búa til Efnislista</a>
                    <a class="vs-btn" href="${RG_PAYDAY_URL}" target="_blank" rel="noopener">💳 Payday</a>
                  </div>
                </div>`;
            }).join('')}
      </div>
    `;

    // ===== Right column: Innheimta (top 8 unpaid) =====
    const today = new Date();
    const collectItems = (ws.worksites||[])
      .filter(w => (w.invoice_unpaid||0) > 0)
      .sort((a,b) => (b.invoice_unpaid||0) - (a.invoice_unpaid||0))
      .slice(0, 8);
    $collect.innerHTML = `
      <h2 class="vs-h2">💰 Innheimta — ógreiddir reikningar</h2>
      <p class="vs-h2-sub">${collectItems.length} verkstaðir með skuld · ${fmt(totalUnpaid)} kr</p>
      <div class="vs-items">
        ${collectItems.length === 0
          ? '<div class="vs-empty">Allt greitt 🎉</div>'
          : collectItems.map(w => {
              const unpaid = w.invoice_unpaid || 0;
              const oldest = (w.invoices||[]).filter(i => /ógreidd|ógreitt|vanskil/i.test(i.status||''))
                .map(i => i.gjalddagi).filter(Boolean).sort()[0];
              const daysOverdue = oldest ? Math.floor((today - new Date(oldest))/86400000) : null;
              const customer = (w.mapped_customers||[])[0] || '';
              const gmailUrl = customer ? `https://mail.google.com/mail/u/0/?authuser=bokhald@brunaholf.is#search/from%3A${encodeURIComponent(customer.split(' ')[0].toLowerCase())}` : `https://mail.google.com/mail/?authuser=bokhald@brunaholf.is`;
              return `
                <div class="vs-item">
                  <div class="vs-item-head">
                    ${daysOverdue !== null && daysOverdue > 30 ? `<span class="vs-pill vs-pill-red">${daysOverdue}d</span>` : daysOverdue !== null ? `<span class="vs-pill vs-pill-amber">${daysOverdue}d</span>` : ''}
                    <strong>${escapeHtml(w.project)}</strong>
                    <span class="vs-item-meta">${escapeHtml(customer || '—')}</span>
                  </div>
                  <div class="vs-item-body">
                    <div class="vs-item-num"><div class="vs-item-num-l">Skuld</div><div class="vs-item-num-v vs-item-num-amount" style="color:#9B1A0F">${fmt(unpaid)}</div></div>
                    <div class="vs-item-num"><div class="vs-item-num-l">Elsti gjalddagi</div><div class="vs-item-num-v">${oldest || '—'}</div></div>
                  </div>
                  <div class="vs-item-actions">
                    <a class="vs-btn vs-btn-primary" href="${gmailUrl}" target="_blank" rel="noopener">📧 Senda áminningu</a>
                    <a class="vs-btn" href="${RG_PAYDAY_URL}" target="_blank" rel="noopener">💳 Payday</a>
                  </div>
                </div>`;
            }).join('')}
      </div>
    `;

    // ===== Recent activity =====
    const recent = [];
    for (const w of (ws.worksites||[])) {
      for (const inv of (w.invoices||[]).slice(0, 3)) {
        if (!inv.gjalddagi) continue;
        recent.push({
          date: inv.greidsla_date || inv.gjalddagi,
          kind: inv.greidsla_date ? 'paid' : 'invoiced',
          worksite: w.project,
          customer: (w.mapped_customers||[])[0] || '',
          amount: inv.amount,
          tilvisun: inv.tilvisun,
        });
      }
    }
    recent.sort((a,b) => String(b.date).localeCompare(String(a.date)));
    $activity.innerHTML = recent.length === 0 ? '<div class="vs-empty">Engin starfsemi.</div>' : recent.slice(0, 12).map(e => `
      <div class="vs-event">
        <span class="vs-event-date">${e.date}</span>
        <span class="vs-event-icon">${e.kind === 'paid' ? '✅' : '📤'}</span>
        <span class="vs-event-text">
          ${e.kind === 'paid' ? 'Greitt' : 'Sent'} — <strong>${escapeHtml(e.worksite)}</strong>
          ${e.customer ? ' · '+escapeHtml(e.customer) : ''}
          <span class="vs-event-tilvisun">#${escapeHtml(String(e.tilvisun||''))}</span>
        </span>
        <span class="vs-event-amount">${fmt(e.amount)} kr</span>
      </div>
    `).join('');

    // ===== Unbilled hours panel =====
    const $unb = document.getElementById('vs-unbilled-list');
    const ubRows = (unbilled.rows||[]).filter(r => r.unbilled_hours > 5).slice(0, 15);
    const totalUnb = unbilled.summary?.total_unbilled_hours || 0;
    const sum = unbilled.summary || {};
    const totalTv  = Number(sum.total_tv_hours || 0);
    const totalBi  = Number(sum.total_est_billed_hours || 0);
    const netUb    = Number(sum.net_unbilled_hours || 0);
    if (!ubRows.length){
      $unb.innerHTML = '<div class="vs-empty">Engar ósendar klst — vel búið! 🎉</div>';
    } else {
      $unb.innerHTML = `
        <!-- Big equation: Tímavera − Áætl. rukkað = Eftirstöðvar -->
        <div class="vs-eq">
          <div class="vs-eq-cell">
            <div class="vs-eq-l">Tímavera klst skráðar</div>
            <div class="vs-eq-v">${totalTv.toFixed(0)}</div>
          </div>
          <div class="vs-eq-op">−</div>
          <div class="vs-eq-cell">
            <div class="vs-eq-l">Áætl. rukkað á reikningum</div>
            <div class="vs-eq-v">${totalBi.toFixed(0)}</div>
          </div>
          <div class="vs-eq-op">=</div>
          <div class="vs-eq-cell vs-eq-result ${netUb > 0 ? 'vs-eq-red' : 'vs-eq-green'}">
            <div class="vs-eq-l">${netUb > 0 ? 'Eftir að rukka' : 'Yfirrukkað (akstur+efni)'}</div>
            <div class="vs-eq-v">${netUb >= 0 ? '+' : ''}${netUb.toFixed(0)}</div>
            <div class="vs-eq-sub">${netUb > 0 ? '≈ ' + fmt(sum.estimated_unbilled_kr_an_vsk || 0) + ' kr án vsk' : ''}</div>
          </div>
        </div>
        <table class="vs-unb-table">
          <thead><tr>
            <th>Verkstaður</th>
            <th class="num">Tímavera klst</th>
            <th class="num">Rukkað</th>
            <th class="num">Ósent klst</th>
            <th class="num">Ósent kr m. vsk</th>
            <th>Mánuðir með ósent</th>
          </tr></thead>
          <tbody>
            ${ubRows.map(r => {
              const monthsStr = (r.months||[]).map(monthLabelStatic).join(' · ');
              const kr = r.unbilled_kr_m_vsk || Math.round(r.unbilled_hours * (r.rate || 9951) * 1.24);
              const billed = Math.max(r.tv_hours - r.unbilled_hours, 0);
              return `
                <tr>
                  <td><button type="button" class="vs-unb-name" data-ub-ws="${escapeAttr(r.worksite)}">${escapeHtml(r.worksite)}</button></td>
                  <td class="num">${r.tv_hours.toFixed(1)}</td>
                  <td class="num" style="color:var(--muted-2)">${billed.toFixed(1)}</td>

        <div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:8px">

        </div>
      `;
      // Click worksite name → open Workcenter directly with data we have
      const today = new Date();
      const months = [];
      for(let i = 7; i >= 0; i--){
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      }
      $unb.querySelectorAll('[data-ub-ws]').forEach(b => {
        b.onclick = () => {
          const wsName = b.dataset.ubWs;
          if (typeof rgOpenWorkcenter === 'function') {
            rgOpenWorkcenter(wsName, ws.worksites, months);
          } else {
            state.ui.activeTab = 'reikningar'; save(); render();
          }
        };
      });
    }

  } catch(e) {
    $kpis.innerHTML = `<div class="vs-empty">Villa: ${e.message||e}</div>`;
  }
}

// Simplify the raw Redder product text into a clean Eldvarnar-name for display.
// Unknown materials keep their original name so nothing is lost.
function simplifyRedderName(raw){
  const n = String(raw||'').toLowerCase();
  if(/silikon|silicon/.test(n))                           return 'Eldvarnar silikon';
  if(/h[áa]þe?n+slu|h[áa]þ.*k[íi]tti/.test(n))            return 'Eldvarnar háþennslukítti';
  if(/akr[íi]l/.test(n))                                   return 'Eldvarnar akríl';
  if(/þéttull|thettull|steinull/.test(n))                 return 'Eldvarnar þéttull';
  if(/m[áa]lning/.test(n))                                 return 'Eldvarnar málning';
  if(/r[úu]lla/.test(n))                                   return 'Eldvarnar rúlla';
  return raw || '';
}
async function rgOpenEfniEditor(worksite, month){
  const fmt = n => Math.round(n||0).toLocaleString('is-IS');
  openModal(`
    <div class="rg-calc-wrap">
      <div class="rg-calc-head">
        <div>
          <div class="rg-calc-title">📦 Efniskostnaður — ${escapeHtml(worksite)}</div>

        </div>

      </div>
      <div id="efni-body">Sækir…</div>
    </div>
  `);
  document.getElementById('efni-close').onclick = closeModal;

  let rows = [];
  try{
    const r = await fetch(`/api/redder-invoices?worksite=${encodeURIComponent(worksite)}&month=${encodeURIComponent(month)}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    rows = (await r.json()).rows || [];
  }catch(e){
    document.getElementById('efni-body').innerHTML = `<div class="wc-empty">Villa: ${e.message||e}</div>`;
    return;
  }

  if(!rows.length){
    document.getElementById('efni-body').innerHTML = `<div class="wc-empty">Engir Redder reikningar fyrir ${escapeHtml(worksite)} í ${monthLabelStatic(month)}.</div>`;
    return;
  }

  let total = 0;
  const html = rows.map(inv => {
    const recharge = Number(inv.recharge_amount ?? inv.m_vsk) || 0;
    total += recharge;
    return `
      <div class="efni-card">
        <div class="efni-card-head">
          <div>
            <div class="efni-inv-nr">#${escapeHtml(inv.invoice_nr)} · ${inv.dagsetning || '—'}</div>
            <div class="efni-inv-raw">${escapeHtml(inv.worksite_raw || '')} · seljandi: ${escapeHtml(inv.salesperson || '—')}</div>
          </div>
          <div class="efni-edit">
            <label>Endurkrafa (kr m. vsk)</label>
            <input type="number" data-efni-id="${inv.id}" data-efni-orig="${inv.m_vsk}" value="${recharge}" step="1">
          </div>
        </div>
        <div class="efni-inv-orig">Upphafleg Redder upphæð: ${fmt(inv.m_vsk)} kr m. vsk (${fmt(inv.an_vsk)} án vsk)</div>
        ${(inv.redder_line_items||[]).length ? `
          <table class="efni-lines">
            <thead><tr><th>Vörunr</th><th>Heiti</th><th class="num">Magn</th><th class="num">Verð</th><th class="num">Afsl</th><th class="num">Samtals</th></tr></thead>
            <tbody>${inv.redder_line_items.map(li => `
              <tr>
                <td>${escapeHtml(li.item_code||'')}</td>
                <td title="${escapeAttr(li.item_name||'')}">${escapeHtml(simplifyRedderName(li.item_name))}</td>
                <td class="num">${Number(li.magn||0)} ${escapeHtml(li.unit||'')}</td>
                <td class="num">${fmt(li.ein_verd)}</td>
                <td class="num">${li.afsl_pct||0}%</td>
                <td class="num">${fmt(li.upphaed)}</td>
              </tr>`).join('')}
            </tbody>
          </table>` : ''}
      </div>`;
  }).join('');

  document.getElementById('efni-body').innerHTML = `
    <div class="efni-totals"><span>Samtals endurkrafa fyrir ${monthLabelStatic(month)}</span><strong id="efni-total">${fmt(total)} kr</strong></div>
    ${html}
    <div class="rg-calc-actions" style="margin-top:14px">
      <button type="button" class="rg-tool" id="efni-save">💾 Vista allar breytingar</button>
      <span id="efni-save-status" class="wc-save-status"></span>
    </div>
    <div class="rg-calc-hint">Breyting á "Endurkrafa" hefur áhrif á samtals efniskostnað í Reikningagerð. Upphafleg Redder upphæð er fast og breytist ekki — endurkrafan er bara það sem þú ætlar að rukka verkkaupa.</div>
  `;

  // live update total as user edits
  document.querySelectorAll('[data-efni-id]').forEach(el => {
    el.oninput = () => {
      let t = 0;
      document.querySelectorAll('[data-efni-id]').forEach(x => t += Number(x.value)||0);
      document.getElementById('efni-total').textContent = fmt(t) + ' kr';
    };
  });

  document.getElementById('efni-save').onclick = async () => {
    const $s = document.getElementById('efni-save-status');
    $s.textContent = '… vistar';
    const inputs = document.querySelectorAll('[data-efni-id]');
    let ok = 0, fail = 0;
    for (const el of inputs) {
      const orig = Number(el.dataset.efniOrig);
      const val = Number(el.value)||0;
      // Only save if changed
      if (Math.abs(val - orig) < 0.5 && el.value === String(orig)) continue;
      try {
        const inv = rows.find(r => String(r.id) === el.dataset.efniId);
        const r = await fetch('/api/redder-invoices', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ ...inv, recharge_amount: val, line_items: undefined }),
        });
        if (r.ok) ok++; else fail++;
      } catch(e) { fail++; }
    }
    $s.textContent = fail ? `✗ ${ok} vistuð, ${fail} mistakast` : ok ? `✓ ${ok} vistuð` : '— engin breyting';
    $s.className = 'wc-save-status ' + (fail ? 'wc-save-err' : 'wc-save-ok');
  };
}

  const GR_FLAT = GR_MATERIALS.flatMap(s=>s.items);
  // Autofill from Redder should bill the customer our SALE price, not the buy-in
  // cost. Match each Redder line to a Verðskrá item → bill that sale price.
  // Lines with NO Verðskrá match (consumables: túss, hreinsiklútar, kíttisstútur,
  // hnífar …) are NOT recharged — they're covered by smáhlutagjald/aukagjald —
  // so they're dropped from the autofill. (Only on first autofill; once the draft
  // is saved its stored materials are reused unchanged.)
  const grNorm = (s)=>String(s||'').toLowerCase().replace(/[^0-9a-záðéíóúýþæ]+/gi,' ').replace(/\s+/g,' ').trim();
  // Aliases for UNSIZED materials: Redder writes abbreviated/variant names
  // (Akríll, Þéttull, ml/mm pack sizes) that the size-aware matcher misses.
  // Each entry: a test on the normalised Redder name → the exact Verðskrá label.
  // These are real billable materials, so they must map to a Verðskrá price.
  const GR_REDDER_ALIASES = [
    { label:'Eldvarnar Akríl 5kg', test:n=>/akr[íi]l?l?/.test(n) && /5\s*kg/.test(n) },
    { label:'Eldvarnar akríl',     test:n=>/akr[íi]l?l?/.test(n) },                 // 310/600ml tubes
    { label:'Háþennslukítti',      test:n=>/h[áa]þe?n+slu/.test(n) || /h[áa]þ.*k[íi]tti/.test(n) },
    { label:'Eldvarnar steinull',  test:n=>/þéttull|steinull/.test(n) },           // þéttull = steinull
    { label:'Eldvarnar silikon',   test:n=>/silikon|silicon/.test(n) },
    { label:'Eldvarnar málning',   test:n=>/m[áa]lning/.test(n) },
  ];
  // Verðskrá items that are genuinely size-specific (mm must agree to match).
  const grIsSized = (label)=>/^(band|kragi|brunaþéttirör)/i.test(label) || /rúlla/i.test(label);
  function matchVerdskra(label){
    const n = grNorm(label);
    if(!n) return null;
    // 1) Unsized-material aliases first (akríl, þéttull, háþennslukítti, …).
    for(const a of GR_REDDER_ALIASES){

    }

    for(const it of GR_FLAT){

      let hit=0; for(const t of toks) if(n.includes(t)) hit++;
      let score = hit/toks.length;
      if(sized && mm===itMm) score += 0.5;             // matched size is a strong signal
      if(score>bestScore){ bestScore=score; best=it; }
    }
    return bestScore>=0.6 ? best : null;
  }
  const GR_KM=186, GR_FERD=4000, GR_SMA=137, GR_STADF=20000;
