<!-- @dsCard group="Components" viewport="700x150" name="Buttons & plates" subtitle="Ivory, obsidian, gold — one gold per panel" -->
<!DOCTYPE html>
<html lang="is"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:var(--boss-paper);display:flex;flex-direction:column;gap:12px;font-family:var(--boss-font-body)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
</style></head><body>
<div class="row">
  <button class="boss-btn ivory">🔑 Viðskiptavinavefir</button>
  <button class="boss-btn ivory sm">Í dag</button>
  <button class="boss-btn obsidian">+ Nýtt mál</button>
  <button class="boss-btn gold sm">+ Skrá verk</button>
  <button class="boss-btn gold lg" style="padding:0 20px">📋 Setja á dagskrá</button>
</div>
<div class="row">
  <span class="boss-plate">01</span><span class="boss-plate">04</span><span class="boss-plate dark">06</span>
  <span style="width:1px;height:22px;background:var(--boss-rule)"></span>
  <span class="boss-chip">2</span><span class="boss-chip">3</span>
  <span style="width:1px;height:22px;background:var(--boss-rule)"></span>
  <span class="boss-pill-sync"><i class="boss-led on"></i>synced</span>
  <span class="boss-led warn"></span>
  <span class="boss-pin">◆</span>
</div>
<div class="row">
  <span class="boss-field" style="flex:1">🏢 Fyrirtæki eða kennitala (RSK)…</span>
  <span class="boss-field" style="width:120px;color:var(--boss-ink);font-weight:600">Bjarndís ▾</span>
  <span class="boss-tray" style="width:110px;height:36px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--boss-font-mono)">CG-01 +</span>
</div>
</body></html>
