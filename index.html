async function fetchMaeting(t){
  const holder = document.getElementById('maetingHolder');
  if(!holder) return;
  holder.innerHTML = `<div class="empty">Hleður…</div>`;
  if(!t.sheetCsv){
    holder.innerHTML = `<div class="empty">Engin CSV slóð. Stilltu í Stillingar → Mæting.</div>`;
    return;
  }
  try{
    const r = await fetch(t.sheetCsv,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text = await r.text();
    const rows = parseCSV(text);
    if(rows.length<2){ holder.innerHTML = `<div class="empty">Engar færslur enn.<br><br>Bíður eftir næstu Tímavera-skoðun (kl 09:00 eða 17:00).</div>`; return; }
    const head = rows[0].map(h=>h.toLowerCase().trim());
    const idx = (k)=>head.indexOf(k);
    const iStatus=idx('status'), iName=idx('name'), iProj=idx('project'), iIn=idx('inn'), iOut=idx('ut'), iH=idx('hours'), iGps=idx('gps'), iNote=idx('note'), iAt=idx('scraped_at');
    const recs = rows.slice(1).map(r=>({
      status:(r[iStatus]||'').toLowerCase(),
      name:r[iName]||'', project:r[iProj]||'',
      inn:r[iIn]||'', ut:r[iOut]||'',
      hours:r[iH]||'', gps:(r[iGps]||'').toLowerCase(),
      note:r[iNote]||'', at:r[iAt]||''
    })).filter(x=>x.name);

    const maett = recs.filter(x=>x.status==='mætt' || (x.inn && !x.ut));
    const haett = recs.filter(x=>x.status==='hætt' || (x.inn && x.ut));
    const lastAt = recs.map(x=>x.at).filter(Boolean).sort().slice(-1)[0] || '';

    const card = (x)=>{
      const gpsBadge = x.gps==='yes' ? '🟢 GPS' : (x.gps==='no' ? '⚠️ GPS vantar' : '');
      const times = x.ut ? `${escapeHtml(x.inn)}–${escapeHtml(x.ut)}` : `frá ${escapeHtml(x.inn)}`;
      const hrs = x.hours ? ` · ${escapeHtml(x.hours)}t` : '';
      const noteHtml = x.note ? `<div class="sub" style="margin-top:4px;color:var(--red)">${escapeHtml(x.note)}</div>` : '';
      return `<div class="kbtn ${x.status==='mætt'?'t-green':'t-dark'}" style="cursor:default">
        <div class="ico">${escapeHtml((x.name||'?').slice(0,2).toUpperCase())}</div>
        <div style="min-width:0;flex:1">
          <div class="lbl">${escapeHtml(x.name)} <span style="font-weight:500;opacity:.85">@ ${escapeHtml(x.project)}</span></div>
          <div class="sub">${times}${hrs} ${gpsBadge?'· '+gpsBadge:''}</div>
          ${noteHtml}
        </div>
      </div>`;
    };

    const sec = (title, list, emoji) => list.length ? `
      <div class="section">
        <div class="group-title"><strong>${emoji} ${title} <span style="opacity:.7;font-weight:500">(${list.length})</span></strong><div class="line"></div></div>
        <div class="grid">${list.map(card).join('')}</div>
      </div>` : '';

    const updated = lastAt ? `<div class="helprow" style="margin-bottom:14px">Síðasta uppfærsla: <b>${escapeHtml(lastAt)}</b></div>` : '';
    holder.innerHTML = updated +
      sec('Mættir núna', maett, '🟢') +
      sec('Hættir í dag', haett, '🏁') +
      (maett.length+haett.length===0 ? `<div class="empty">Engar færslur í dag enn.</div>` : '');
  }catch(err){
    holder.innerHTML = `<div class="empty">Tókst ekki að sækja gögn:<br>${escapeHtml(String(err.message||err))}</div>`;
  }
}

async function fetchVerkefnalisti(t){
  const holder = document.getElementById('vl-board');
  if(!holder) return;
  holder.innerHTML = '<div class="empty">Hleður...</div>';
  try{
    const r = await fetch(t.sheetCsv,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text = await r.text();
    const rows = parseCSV(text);
    if(rows.length<2){ holder.innerHTML = '<div class="empty">Tóm skrá. Bætið við verkefni í sheetinu.</div>'; return; }
    const head = rows[0].map(h=>h.toLowerCase().trim());
    const idx = (k)=>head.indexOf(k);
    const iT=idx('tími'), iF=idx('frá'), iTo=idx('til'), iFl=idx('flokkur'), iV=idx('verkefni'), iA=idx('athugasemd'), iL=idx('hlekkur'), iS=idx('staða');
    const all = rows.slice(1).map((r,i)=>({
      _row:i+2,
      tími:r[iT]||'', from:r[iF]||'', to:(r[iTo]||'').trim(),
      flokkur:r[iFl]||'Annað', verkefni:r[iV]||'', note:r[iA]||'',
      link:r[iL]||'', stada:(r[iS]||'Bíður').trim()
    })).filter(x=>x.verkefni);

    const isDone = (s)=> s.toLowerCase().includes('klár') || s.toLowerCase().includes('done');
    const total = all.length;
    const doneCount = all.filter(x=>isDone(x.stada)).length;
    const pct = total ? Math.round(doneCount/total*100) : 0;

    // group by flokkur
    const groups = {};
    all.forEach(it => { const g = it.flokkur||'Annað'; (groups[g]=groups[g]||[]).push(it); });

    const personChip = (p) => {
      const ic = p==='Anni'?'🦍':p==='Aggi'?'🐒':(p.toLowerCase().includes('báð')||p.toLowerCase().includes('both'))?'🦍🐒':'❓';
      const col = p==='Anni'?'#E55A3C':p==='Aggi'?'#3B82F6':(p.toLowerCase().includes('báð'))?'#10A36B':'var(--muted)';
      return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:${col}1F;color:${col};font-size:10px;font-weight:700;letter-spacing:.3px">${ic} ${escapeHtml(p)}</span>`;
    };

    const stadaChip = (s) => {
      const x = s.toLowerCase();
      let col = 'var(--muted)';
      if(x.includes('vinnsl')) col='#D4A24F';
      else if(x.includes('skoðun')) col='#3B82F6';
      else if(x.includes('klár')||x.includes('done')) col='#10A36B';
      return `<span style="font-size:10px;color:${col};font-weight:700">● ${escapeHtml(s)}</span>`;
    };

    const rowHtml = (it) => {
      const done = isDone(it.stada);
      const editLink = (t.sheetEdit||'https://docs.google.com') + '?gid=0&range=B' + it._row;
      return `
        <a href="${escapeAttr(editLink)}" target="_blank" rel="noopener" class="kbtn ${done?'t-green':'t-dark'}" style="text-decoration:none;color:inherit;align-items:flex-start;padding:11px 12px;cursor:pointer;${done?'opacity:.65':''}">
          <div class="ico ico-emoji" style="font-size:18px">${done?'✅':(autoIcon(it.flokkur,'')||'📌')}</div>
          <div style="min-width:0;flex:1">
            <div class="lbl" style="font-size:13.5px;line-height:1.35;${done?'text-decoration:line-through':''}">${escapeHtml(it.verkefni)}</div>
            ${it.note?`<div class="sub" style="margin-top:3px;line-height:1.4">${escapeHtml(it.note)}</div>`:''}
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px">
              ${personChip(it.to)}
              ${stadaChip(it.stada)}
              ${it.link?`<a target="_blank" rel="noopener" href="${escapeAttr(it.link)}" onclick="event.stopPropagation()" style="text-decoration:none;color:var(--blue);font-size:11px;font-weight:600">↗ Hlekkur</a>`:''}
              ${it.from?`<span style="font-size:10px;color:var(--muted)">frá ${escapeHtml(it.from)}</span>`:''}
            </div>
          </div>
        </a>`;
    };

    const groupHtml = Object.keys(groups).sort().map(g => {
      const items = groups[g];
      const gDone = items.filter(x=>isDone(x.stada)).length;
      return `
        <div class="section">
          <div class="group-title"><strong>${autoIcon(g,'')||'📌'} ${escapeHtml(g)} <span style="opacity:.6;font-weight:500">${gDone}/${items.length}</span></strong><div class="line"></div></div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${items.map(rowHtml).join('')}
          </div>
        </div>`;
    }).join('');

    holder.innerHTML = `
      <div class="section">
        <div class="card" style="display:flex;align-items:center;gap:14px">
          <div style="flex:1">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700">Framvinda</div>
            <div style="font-size:24px;font-weight:800;color:var(--ink);margin-top:4px">${doneCount} / ${total} <span style="font-size:13px;color:var(--muted);font-weight:600">kláruð</span></div>
          </div>
          <div style="flex:2;height:10px;background:var(--input-bg);border-radius:6px;overflow:hidden;border:1px solid var(--line);min-width:120px">
            <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--red),var(--gold))"></div>
          </div>
          <div style="font-weight:800;color:var(--red);min-width:48px;text-align:right;font-size:20px">${pct}%</div>
        </div>
      </div>
      ${groupHtml}
    `;
  }catch(err){
    holder.innerHTML = `<div class="empty">Tókst ekki að sækja:<br>${escapeHtml(String(err.message||err))}<br><br>Staðfestu að sheet sé birt á neti.</div>`;
  }
}

let _pdfjsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjsLoading) return _pdfjsLoading;
  _pdfjsLoading = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = reject; document.head.appendChild(s);
  });
  return _pdfjsLoading;
}

        })});

  pdfIn.onchange = ()=>{ const f=pdfIn.files[0]; if(f) handlePdf(f); };

  // list templates
  renderTemplates();
}

async function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file);
  });
}

async function handlePdf(file){
  const area = document.getElementById('kv-pdf-area');
  area.innerHTML = `<div class="helprow">Les PDF (${escapeHtml(file.name)})...</div>`;
  try{
    await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
    const lines = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let lastY = null;
      let curLine = '';
      tc.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        if(lastY!==null && Math.abs(y-lastY)>4){
          if(curLine.trim()) lines.push(curLine.trim());
          curLine = '';
        }
        curLine += it.str + ' ';
        lastY = y;
      });
      if(curLine.trim()) lines.push(curLine.trim());
    }
    showPdfFields(file.name, lines);
  }catch(e){
    area.innerHTML = `<div class="empty">Mistókst að lesa PDF: ${escapeHtml(String(e.message||e))}</div>`;
  }
}

  {key:'seljandi', label:'Seljandi (vendor)'},
  {key:'kennitala', label:'Kennitala'},
  {key:'reikningsnr', label:'Reikningsnúmer'},
  {key:'dagsetning', label:'Dagsetning'},

function showPdfFields(filename, lines){
  const area = document.getElementById('kv-pdf-area');
  const tmpls = loadTemplates();
  // try to detect vendor from first lines
  const firstChunk = lines.slice(0,8).join(' \\ ').slice(0,200);
  // pick guesses for fields
  const guess = autoGuess(lines);
  // find template by vendor
  let useTmpl = null;
  for(const k in tmpls){ if(firstChunk.toLowerCase().includes(k.toLowerCase())){ useTmpl = tmpls[k]; break; } }
  const linesHtml = lines.map((l,i)=>`<div class="pdf-line" data-i="${i}" style="padding:6px 8px;border-radius:6px;cursor:pointer;line-height:1.4">${escapeHtml(l)}</div>`).join('');
  const fieldsHtml = PDF_FIELDS.map(f=>{
    const v = (useTmpl && useTmpl[f.key]) || guess[f.key] || '';
    return `
      <div style="margin-bottom:8px">
        <label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700">${f.label}</label>
        <div style="display:flex;gap:6px">
          <input data-fk="${f.key}" value="${escapeAttr(v)}" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink)">
          <button class="btn ghost" data-pickfk="${f.key}" style="padding:8px 10px;flex:0 0 auto;font-size:11px">Velja úr texta</button>
        </div>
      </div>`;
  }).join('');
  area.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <div class="group-title"><strong>Texti úr PDF</strong><div class="line"></div></div>
        <div id="pdf-lines" style="max-height:420px;overflow:auto;background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12.5px;color:var(--ink-2)">${linesHtml}</div>
        <div class="helprow">Smelltu á línu eftir að þú smellir á "Velja úr texta" hjá reit.</div>
      </div>
      <div>
        <div class="group-title"><strong>Reikningsreitir</strong><div class="line"></div></div>
        ${fieldsHtml}
        <div class="btn-row" style="margin-top:12px">
          <button class="btn ghost" id="pdf-save-tmpl">Vista sniðmát</button>
          <button class="btn primary" id="pdf-send">Senda í Sheets</button>
        </div>
        <div id="pdf-status" class="helprow" style="margin-top:8px"></div>
      </div>
    </div>
  `;
  let pickingFor = null;
  area.querySelectorAll('[data-pickfk]').forEach(b=>{
    b.onclick = ()=>{ pickingFor = b.dataset.pickfk; b.textContent='Smelltu á línu...'; setTimeout(()=>{b.textContent='Velja úr texta'},4000); };
  });
  area.querySelectorAll('.pdf-line').forEach(el=>{
    el.onmouseenter = ()=>{ el.style.background = 'rgba(209,69,40,.18)'; };
    el.onmouseleave = ()=>{ el.style.background = ''; };
    el.onclick = ()=>{
      if(!pickingFor) return;
      const inp = area.querySelector(`[data-fk="${pickingFor}"]`);
      if(inp) inp.value = el.innerText.trim();
      pickingFor = null;
      area.querySelectorAll('[data-pickfk]').forEach(b=>b.textContent='Velja úr texta');
    };
  });
  document.getElementById('pdf-save-tmpl').onclick = ()=>{
    const vendor = area.querySelector('[data-fk="seljandi"]').value.trim();
    if(!vendor){ alert('Vantar seljanda til að vista sniðmát'); return; }
    const tmpls = loadTemplates();
    const obj = {};
    PDF_FIELDS.forEach(f=>{ obj[f.key] = area.querySelector(`[data-fk="${f.key}"]`).value.trim(); });
    tmpls[vendor] = obj;
    saveTemplates(tmpls);
    renderTemplates();
    alert('Sniðmát vistað fyrir "'+vendor+'"');
  };
  document.getElementById('pdf-send').onclick = async ()=>{
    const ep = state.ui.appsScriptUrl;
    const st = document.getElementById('pdf-status');
    if(!ep){ st.innerHTML = '<span style="color:var(--gold)">Apps Script endpoint ekki stillt — opnaðu Stillingar.</span>'; return; }
    const obj = {filename};
    PDF_FIELDS.forEach(f=>{ obj[f.key] = area.querySelector(`[data-fk="${f.key}"]`).value.trim(); });
    st.textContent = 'Sendi í Sheets...';
    try{
      const r = await fetch(ep, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'append_invoice', data:obj})});
      const j = await r.json();
      if(j.ok) st.innerHTML = '✓ Sent í Sheets. <a target="_blank" href="'+(j.sheetUrl||'#')+'">Opna</a>';
      else st.innerHTML = '<span style="color:var(--red-2)">Villa: '+escapeHtml(j.error||'óþekkt')+'</span>';
    }catch(e){ st.innerHTML = '<span style="color:var(--red-2)">Villa: '+escapeHtml(e.message)+'</span>'; }
  };
}

function autoGuess(lines){
  const txt = lines.join('\n');
  const out = {};
  // kennitala (6+4 digits)
  let m = txt.match(/\b(\d{6}-?\d{4})\b/); if(m) out.kennitala = m[1].replace(/(\d{6})(\d{4})/,'$1-$2');
  // dagsetning (DD.MM.YYYY or DD/MM/YYYY)
  m = txt.match(/\b(\d{1,2}[\.\/]\d{1,2}[\.\/]\d{2,4})\b/); if(m) out.dagsetning = m[1];
  // reikningsnr
  m = txt.match(/reikning(?:s|ur)?\s*(?:nr\.?|n[uú]mer)?[:\s]*([A-Z0-9\-]+)/i); if(m) out.reikningsnr = m[1];
  // upphæð (Icelandic kr: 1.234,56 or 1234.56)
  m = txt.match(/(?:samtals|alls|t[oó]tal)[:\s]*(?:kr\.?\s*)?([\d\.,]+)/i); if(m) out.upphaed = m[1];
  // seljandi: first non-empty line
  out.seljandi = (lines[0]||'').slice(0,60);
  return out;
}

function renderTemplates(){
  const tmpls = loadTemplates();
  const holder = document.getElementById('kv-tmpls');
  if(!holder) return;
  const keys = Object.keys(tmpls);
  if(keys.length===0){ holder.innerHTML = '<div class="empty">Engin sniðmát enn</div>'; return; }
  holder.innerHTML = keys.map(k=>`
    <div class="kbtn t-dark" style="cursor:default">
      <div class="ico">🧠</div>
      <div style="min-width:0;flex:1">
        <div class="lbl">${escapeHtml(k)}</div>
        <div class="sub">${escapeHtml(Object.keys(tmpls[k]).filter(x=>tmpls[k][x]).join(', '))}</div>
      </div>
      <button class="edit" data-deltmpl="${escapeAttr(k)}" title="Eyða">✕</button>
    </div>
  `).join('');
  holder.querySelectorAll('[data-deltmpl]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('Eyða sniðmáti?')) return;
      const t=loadTemplates(); delete t[b.dataset.deltmpl]; saveTemplates(t); renderTemplates();
    };
  });
}

      }).join('')}

    <div class="btn-row">
      <button class="btn ghost" id="cancelBtn">Hætta við</button>
      ${!isNew?`<button class="btn danger" id="delBtn">Eyða</button>`:''}
      <button class="btn primary" id="saveBtn">${isNew?'Bæta við':'Vista'}</button>
    </div>
  `);
  let chosen = btn.color || 't-red';
  let chosenSize = btn.size || 'm';
  document.querySelectorAll('#sw button').forEach(b=>{
    b.onclick = ()=>{ chosen=b.dataset.c; document.querySelectorAll('#sw button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
  });
  document.querySelectorAll('#sz button').forEach(b=>{
    b.onclick = ()=>{ chosenSize=b.dataset.s; document.querySelectorAll('#sz button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
  });
  document.getElementById('cancelBtn').onclick = closeModal;
  if(!isNew) document.getElementById('delBtn').onclick = ()=>{
    if(!confirm('Eyða hnappi?')) return;
    state.buttons = state.buttons.filter(x=>x.id!==btn.id);
    save(); closeModal(); render();
  };
  document.getElementById('saveBtn').onclick = ()=>{
    btn.label = document.getElementById('f-label').value.trim();

    if(!btn.label){ alert('Vantar texta'); return; }

function openTabEditor(tabId){
  const isNew = !tabId;
  const t = isNew ? {id:'tab-'+b(), label:'', icon:'•'} : state.tabs.find(x=>x.id===tabId);
  if(!t) return;
  const curType = t.checklist!==undefined ? 'checklist' : (t.sheetCsv!==undefined ? 'list' : 'buttons');
  openModal(`
    <h2>${isNew?'Nýr tab':'Breyta tab'}</h2>
    <label>Nafn</label><input id="t-label" value="${escapeAttr(t.label)}">
    <div class="row">
      <div><label>Tákn</label><input id="t-icon" value="${escapeAttr(t.icon||'•')}" maxlength="3"></div>
      <div>
        <label>Tegund</label>
        <select id="t-type">
          <option value="buttons" ${curType==='buttons'?'selected':''}>Hnappar</option>
          <option value="list" ${curType==='list'?'selected':''}>Listi (Sheets CSV)</option>
          <option value="checklist" ${curType==='checklist'?'selected':''}>Checklist (verkefnalisti)</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="cancelTab">Hætta við</button>
      <button class="btn primary" id="saveTab">${isNew?'Bæta við':'Vista'}</button>
    </div>
  `);
  document.getElementById('cancelTab').onclick = closeModal;
  document.getElementById('saveTab').onclick = ()=>{
    const lbl = document.getElementById('t-label').value.trim();
    const icon = document.getElementById('t-icon').value.trim()||'•';
    const type = document.getElementById('t-type').value;
    if(!lbl){ alert('Vantar nafn'); return; }
    t.label = lbl; t.icon = icon;
    // reset to selected type
    delete t.sheetCsv; delete t.checklist;
    if(type==='list') t.sheetCsv='';
    if(type==='checklist') t.checklist = t.checklist || [];
    if(isNew){
      const i = state.tabs.findIndex(x=>x.id==='stillingar');
      if(i>=0) state.tabs.splice(i,0,t); else state.tabs.push(t);
    }
    save(); closeModal(); render();
  };
}

/* ====================== SCREENSHOT TOOL ====================== */
(function(){
  const $ov = document.getElementById('ssOverlay');
  const $stage = document.getElementById('ssStage');
  const $helpS = document.getElementById('ssHelpStage');
  const $crop = document.getElementById('ssCropBox');
  const btn = id => document.getElementById(id);
  let imgEl=null, currentBlob=null, cropRect=null;

  function reset(){
    if(imgEl && imgEl.parentNode) imgEl.remove();
    imgEl=null;currentBlob=null;cropRect=null;
    $crop.style.display='none';
    $helpS.style.display='';
    btn('ssCrop').disabled=true;
    btn('ssReset').disabled=true;
    btn('ssSave').disabled=true;
  }

  function showImageFromBlob(blob){
    currentBlob = blob;
    if(imgEl) imgEl.remove();
    imgEl = document.createElement('img');
    imgEl.src = URL.createObjectURL(blob);
    imgEl.draggable=false;
    $helpS.style.display='none';
    $stage.appendChild(imgEl);
    btn('ssReset').disabled=false;
    btn('ssSave').disabled=false;
  }

  let cropStart=null;
  $stage.addEventListener('mousedown', e=>{
    if(!imgEl) return;
    const rect = $stage.getBoundingClientRect();
    cropStart = {x:e.clientX-rect.left, y:e.clientY-rect.top};
    cropRect = null;
    $crop.style.left=cropStart.x+'px';$crop.style.top=cropStart.y+'px';
    $crop.style.width='0px';$crop.style.height='0px';
    $crop.style.display='block';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!cropStart) return;
    const rect = $stage.getBoundingClientRect();
    const x = e.clientX-rect.left, y = e.clientY-rect.top;
    const left = Math.min(x,cropStart.x), top = Math.min(y,cropStart.y);
    const w = Math.abs(x-cropStart.x), h = Math.abs(y-cropStart.y);
    $crop.style.left=left+'px';$crop.style.top=top+'px';
    $crop.style.width=w+'px';$crop.style.height=h+'px';
    cropRect = {left,top,w,h};
  });
  document.addEventListener('mouseup', ()=>{
    if(cropStart && cropRect && cropRect.w>10 && cropRect.h>10){
      btn('ssCrop').disabled=false;
    }
    cropStart = null;
  });

  async function capture(){
    try{
      const stream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
      const track = stream.getVideoTracks()[0];
      await new Promise(r=>setTimeout(r,300));
      let blob;
      if(window.ImageCapture){
        const ic = new ImageCapture(track);
        const bitmap = await ic.grabFrame();
        const c = document.createElement('canvas');
        c.width = bitmap.width; c.height = bitmap.height;
        c.getContext('2d').drawImage(bitmap,0,0);
        blob = await new Promise(r=>c.toBlob(r,'image/png'));
      } else {
        // fallback: render video frame to canvas
        const v = document.createElement('video');
        v.srcObject = stream; await v.play();
        await new Promise(r=>setTimeout(r,200));
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        blob = await new Promise(r=>c.toBlob(r,'image/png'));
      }
      track.stop();
      if(blob) showImageFromBlob(blob);
    }catch(e){
      if(e.name!=='NotAllowedError') alert('Skjáskot mistókst: '+e.message);
    }
  }

  function cropToBlob(){
    if(!imgEl || !cropRect) return;
    const r = imgEl.getBoundingClientRect();
    const sr = $stage.getBoundingClientRect();
    const imgX = r.left - sr.left, imgY = r.top - sr.top;
    const scaleX = imgEl.naturalWidth / r.width;
    const scaleY = imgEl.naturalHeight / r.height;
    const sx = Math.max(0,(cropRect.left - imgX) * scaleX);
    const sy = Math.max(0,(cropRect.top - imgY) * scaleY);
    const sw = Math.min(imgEl.naturalWidth-sx, cropRect.w * scaleX);
    const sh = Math.min(imgEl.naturalHeight-sy, cropRect.h * scaleY);
    if(sw<2||sh<2){ alert('Of lítill krip'); return; }
    const c = document.createElement('canvas');
    c.width = Math.round(sw); c.height = Math.round(sh);
    c.getContext('2d').drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
    c.toBlob(b=>{ if(b){ showImageFromBlob(b); $crop.style.display='none'; cropRect=null; btn('ssCrop').disabled=true; } }, 'image/png');
  }

  async function save(){
    if(!currentBlob) return;
    const ep = state.ui.appsScriptUrl;
    const folder = state.ui.uploadFolderId || '1MRleiwpQyqHzcSIfbbCUjPF7ujoXHd0U';
    const filename = 'skjaskot-' + new Date().toISOString().replace(/[:.]/g,'-').slice(0,19) + '.png';
    const url = URL.createObjectURL(currentBlob);
    const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    if(!ep){
      btn('ssTitle').textContent = '📷 Niðurhalað (Apps Script ekki stillt → upphlóð sleppt)';
      return;
    }
    btn('ssTitle').textContent = '📷 Hleður upp í Drive...';
    try{
      const b64 = await new Promise(r=>{
        const fr = new FileReader();
        fr.onload = ()=> r(String(fr.result).split(',')[1]);
        fr.readAsDataURL(currentBlob);
      });
      const resp = await fetch(ep, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({
        action:'upload_image', filename, mimeType:'image/png', data:b64, folderId:folder
      })});
      const j = await resp.json();
      if(j.ok){
        const link = j.url;
        btn('ssTitle').innerHTML = '✅ Vistað — <a target="_blank" href="'+link+'" style="color:#FFB388">opna</a> · URL afritað í clipboard';
        try{ await navigator.clipboard.writeText(link); }catch(e){}
      } else {
        btn('ssTitle').textContent = '⚠️ Villa: '+(j.error||'óþekkt');
      }
    }catch(e){
      btn('ssTitle').textContent = '⚠️ Villa: '+e.message;
    }
  }

  async function pasteFromClipboard(){
    try{
      const items = await navigator.clipboard.read();
      for(const item of items){
        for(const type of item.types){
          if(type.startsWith('image/')){
            const blob = await item.getType(type);
            showImageFromBlob(blob);
            return;
          }
        }
      }
      alert('Engin mynd í clipboard. Notið Win+Shift+S → svæði → smelltu „Líma".');
    }catch(e){ alert('Clipboard read mistókst: '+e.message); }
  }

  document.getElementById('fabSs').onclick = ()=>{ reset(); btn('ssTitle').textContent='📷 Skjáskot'; $ov.classList.add('open'); };
  document.getElementById('ssClose').onclick = ()=>$ov.classList.remove('open');
  document.getElementById('ssCapture').onclick = capture;
  document.getElementById('ssPaste').onclick = pasteFromClipboard;
  document.getElementById('ssCrop').onclick = cropToBlob;
  document.getElementById('ssReset').onclick = reset;
  document.getElementById('ssSave').onclick = save;
  document.addEventListener('paste', e=>{
    if(!$ov.classList.contains('open')) return;
    for(const it of (e.clipboardData?.items||[])){
      if(it.type.startsWith('image/')){
        const blob = it.getAsFile();
        if(blob) showImageFromBlob(blob);
      }
    }
  });
})();
</script>

<script>
(function(){
  const KEY_HISTORY = 'luna.chat.v1';
  const KEY_VISIBLE = 'luna.visible.v1';
  const ENDPOINT = '/.netlify/functions/luna';

  const panel = document.getElementById('luna-panel');
  const fab = document.getElementById('luna-fab');
  const closeBtn = document.getElementById('luna-close');
  const clearBtn = document.getElementById('luna-clear');
  const messagesEl = document.getElementById('luna-messages');
  const form = document.getElementById('luna-form');
  const input = document.getElementById('luna-input');
  const sendBtn = document.getElementById('luna-send');

  // Show fab if previously unlocked or ?luna=1 is set.
  const params = new URLSearchParams(location.search);
  if (params.get('luna') === '1') localStorage.setItem(KEY_VISIBLE, '1');
  if (localStorage.getItem(KEY_VISIBLE) === '1') fab.style.display = 'flex';

  function loadHistory(){
    try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); }
    catch(e){ return []; }
  }
  function saveHistory(h){ localStorage.setItem(KEY_HISTORY, JSON.stringify(h)); }

  function renderMsg(text, klass){
    const el = document.createElement('div');
    el.className = 'luna-msg ' + klass;
    el.textContent = text;
    const empty = document.getElementById('luna-empty');
    if (empty) empty.remove();
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function renderAll(){
    messagesEl.innerHTML = '';
    const h = loadHistory();
    if (h.length === 0){
      const empty = document.createElement('div');
      empty.id = 'luna-empty';
      empty.textContent = 'Ask me anything — to organize your day, draft a quick note, or sanity-check an idea.';
      messagesEl.appendChild(empty);
      return;
    }
    h.forEach(m => {
      const el = document.createElement('div');
      el.className = 'luna-msg ' + (m.role === 'user' ? 'user' : 'luna');
      el.textContent = m.content;
      messagesEl.appendChild(el);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function openPanel(){
    panel.classList.add('open');
    panel.setAttribute('aria-hidden','false');
    fab.style.display = 'flex';
    localStorage.setItem(KEY_VISIBLE,'1');
    input.focus();
  }
  function closePanel(){
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
  }

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.shiftKey && (e.key==='L' || e.key==='l')){
      e.preventDefault();
      panel.classList.contains('open') ? closePanel() : openPanel();
    }
  });
  fab.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  clearBtn.addEventListener('click', ()=>{
    if (confirm('Clear the conversation?')){
      saveHistory([]);
      renderAll();
    }
  });

  // Auto-grow textarea; Enter sends, Shift+Enter newline.
  input.addEventListener('input', ()=>{
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', {cancelable:true}));
    }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const history = loadHistory();
    history.push({role:'user', content:text});
    saveHistory(history);
    renderMsg(text, 'user');

    const thinking = renderMsg('Luna is thinking…', 'thinking');

    try {
      const res = await fetch(ENDPOINT, {
        method:'POST',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({messages: history})
      });
      const data = await res.json().catch(()=>({error:'Invalid response from server.'}));
      thinking.remove();
      if (!res.ok){
        renderMsg(data.error || ('Error ' + res.status), 'err');
        return;
      }
      const reply = (data.reply || '').trim() || '(no response)';
      const newHistory = loadHistory();
      newHistory.push({role:'assistant', content:reply});
      saveHistory(newHistory);
      renderMsg(reply, 'luna');
    } catch(err){
      thinking.remove();
      renderMsg('Network error: ' + err.message, 'err');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  renderAll();
})();
</script>
