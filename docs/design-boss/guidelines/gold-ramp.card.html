<!-- @dsCard group="Gold" viewport="700x110" name="Gold ramp" subtitle="Specular to bronze — text on cream is always gold-800" -->
<!DOCTYPE html>
<html lang="is"><head>

<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--boss-paper);display:flex;gap:6px;font-family:var(--boss-font-body)}
.sw{flex:1;display:flex;flex-direction:column;gap:5px}
.c{height:40px;border:1px solid rgba(0,0,0,.08)}
.n{font-size:10px;font-weight:700;color:var(--boss-ink)}
.v{font-family:var(--boss-font-mono);font-size:9px;color:var(--boss-ink-mute)}
</style></head><body>
<div class="sw"><div class="c" style="background:var(--gold-100)"></div><span class="n">100</span><span class="v">#fff3b0</span></div>
<div class="sw"><div class="c" style="background:var(--gold-200)"></div><span class="n">200</span><span class="v">#f5d76e</span></div>
<div class="sw"><div class="c" style="background:var(--gold-300)"></div><span class="n">300</span><span class="v">#e8cb7a</span></div>
<div class="sw"><div class="c" style="background:var(--gold-400)"></div><span class="n">400</span><span class="v">#d9b25a</span></div>
<div class="sw"><div class="c" style="background:var(--gold-500)"></div><span class="n">500</span><span class="v">#c9a54a</span></div>
<div class="sw"><div class="c" style="background:var(--gold-600)"></div><span class="n">600</span><span class="v">#b8892e</span></div>
<div class="sw"><div class="c" style="background:var(--gold-700)"></div><span class="n">700</span><span class="v">#a87b1f</span></div>
<div class="sw"><div class="c" style="background:var(--gold-800)"></div><span class="n">800 · text</span><span class="v">#8f6a1c</span></div>
<div class="sw"><div class="c" style="background:var(--gold-900)"></div><span class="n">900</span><span class="v">#5a4410</span></div>
<div class="sw"><div class="c" style="background:var(--gold-950)"></div><span class="n">950</span><span class="v">#3e2c06</span></div>
</body></html>
