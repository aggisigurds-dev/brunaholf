<!-- @dsCard group="Gold" viewport="700x150" name="The four gold recipes" subtitle="line · face · side · coin — never author a fifth" -->
<!DOCTYPE html>
<html lang="is"><head>

<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:var(--boss-paper);display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:16px;align-items:end;font-family:var(--boss-font-body)}
.u{display:flex;flex-direction:column;gap:7px}
.n{font-size:10.5px;font-weight:700;color:var(--boss-ink)}
.v{font-family:var(--boss-font-mono);font-size:9.5px;color:var(--boss-ink-mute)}
</style></head><body>
<div class="u"><span style="height:4px;background:var(--gold-line);box-shadow:0 1px 0 #fff"></span><span style="height:1px;background:var(--gold-line)"></span><span class="n">--gold-line</span><span class="v">hairlines, top rules, kicker</span></div>
<div class="u"><span style="height:42px;border:var(--gold-bevel-border);border-top-color:var(--gold-bevel-top);border-bottom-color:var(--gold-bevel-bottom);border-radius:5px;background:var(--gold-face);box-shadow:var(--gold-bevel-shadow)"></span><span class="n">--gold-face</span><span class="v">buttons, plates, chips</span></div>
<div class="u"><span style="height:42px;border-radius:3px;background:var(--gold-side);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.5)"></span><span class="n">--gold-side</span><span class="v">active nav, view switch</span></div>
<div class="u" style="align-items:center"><span class="boss-medallion">🔥</span><span class="n">--gold-coin</span><span class="v">medallion</span></div>
</body></html>
