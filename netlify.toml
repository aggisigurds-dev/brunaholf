# Brunahólf — Stjórnstöð · Netlify build config

[build]
  publish = "."
  functions = "netlify/functions"

# --- Innri skrár EKKI birtar opinberlega -------------------------------------
# `publish = "."` birtir rót verkefnisins, svo ALLT sem er í repo-inu var sótt-
# anlegt á brunaholf.netlify.app — m.a. CLAUDE.md (107 KB af innri lýsingu:
# Supabase-verkefnis-id, Drive-möppu-id, kennitölur, töfluskema) og sql/*.sql.
# Slökkvitæki sleppur við þetta því build-dist.js sleppir *.md; hér er ekkert
# build-þrep, svo lokað er með redirect-reglum. Þær verða að standa FREMST —
# Netlify tekur fyrstu reglu sem passar.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.mcp.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/local-mcp/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# TurboPaint lives on the Kjarni Vercel app.
[[redirects]]
  from = "/kjarni"
  to = "https://kjarni.vercel.app/kjarni"
  status = 302

[[redirects]]
  from = "/kjarni/*"
  to = "https://kjarni.vercel.app/kjarni/:splat"
  status = 302

# Ship pdf-parse / xlsx as real node_modules (not esbuild-bundled) so the
# Efnislisti amount parser loads reliably in the function runtime.
[functions]
  external_node_modules = ["pdf-parse", "xlsx", "mailparser", "pdf-lib"]

# Friendly URL for the Mæting bridge:
#   /api/maeting  →  /.netlify/functions/timavera-maeting

# Landsspítalinn — slóðin sem Agnar notar (öll rithætti) → NLSH-síðan (skýrslan efst).
[[redirects]]
  from = "/Landsspitalinn"
  to = "/nlsh.html"
  status = 200

[[redirects]]
  from = "/landsspitalinn"
  to = "/nlsh.html"
  status = 200

[[redirects]]
  from = "/Landsspítalinn"
  to = "/nlsh.html"
  status = 200

[[redirects]]
  from = "/api/maeting"
  to = "/.netlify/functions/timavera-maeting"
  status = 200

# Brunaþéttingar — verkstaða-appið (starfsmenn á verkstað; PWA, manifest-brunathettingar.json).
[[redirects]]
  from = "/brunathettingar"
  to = "/brunathettingar.html"
  status = 200

[[redirects]]
  from = "/Brunaþéttingar"
  to = "/brunathettingar.html"
  status = 200

[[redirects]]
  from = "/brunathettingar/*"
  to = "/brunathettingar.html"
  status = 200

[[redirects]]
  from = "/api/payday-pull-bg"
  to = "/.netlify/functions/payday-pull-background"
  status = 200

[[redirects]]
  from = "/bakendi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/reikningar"
  to = "/.netlify/functions/worksites"
  status = 200
  force = false

[[redirects]]
  from = "/reikningur"
  to = "/reikningur/"
  status = 301
  force = true

[[redirects]]
  from = "/reikningur/"
  to = "/reikningur/index.html"
  status = 200
  force = true


# Landsbanki-hreyfingar úr Drive → bank_transactions (twin of payday/timavera
# ingest-drive). Rides the /api/* catch-all below too, en skýr redirect fyrir vissu.
[[redirects]]
  from = "/api/landsbanki-ingest-drive"
  to = "/.netlify/functions/landsbanki-ingest-drive"
  status = 200

# Skjala-multitool (Fasi 1 — les-eingöngu forskoðun). Ríður líka /api/* catch-all,
# en skýr redirect fyrir vissu.
[[redirects]]
  from = "/api/drive-multitool"
  to = "/.netlify/functions/drive-multitool"
  status = 200

# Öll önnur /api/* → samnefnd function (leysti 90 eins 1:1 blokkir af)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions."timavera-maeting"]
  schedule = "*/10 * * * *"

# ⚠️ ALDREI setja `schedule` á föllu sem VAFRINN kallar á.
# Netlify svarar hverri HTTP-beiðni á áætlaða föllu með 403. Frá 2026-07-24 til
# 2026-07-30 stóðu áætlanirnar hér að neðan á `timavera-pull` og `payday-pull`
# sjálfum, sem drap alla samstillingartakkana í viðmótinu (Mæting „🔄 Samstilla",
# Bakendi „🕒 Tímavera API" — líka „💾 Vista lykil" — og Kröfu yfirlit
# „🔄 Uppfæra Payday stöðu"). Og áætlunin keyrði samt ekki, því Netlify ræsir með
# POST og bæði föllin höfnuðu POST. Þess vegna sitja áætlanirnar núna á
# `-background` tvíburunum og HTTP-endapunktarnir eru aftur frjálsir.

# Tímavera beintenging (API) — nú AÐAL-heimild vinnufærslna (2026-07-15). Sækir
# beint úr Tímavera Customer API á 2 tíma fresti; dedupe á entry_key svo endur-pull
# er skaðlaus. Leysir af desktop-xlsx-brúna (luna-bridge/timavera-bridge.js RETIRED)
# + Drive-xlsx innsog. Lykill í app_kv['timavera_api_key'] (Agnar setti 2026-07-15).
# Umgjörðin kallar á sama handler með GET, svo rökfræðin er ein og hin sama.
# Frá 2026-08-07 speglar keyrslan gluggann líka (eyðir röðum sem Tímavera skilar
# ekki lengur) — með days=3 nær það yfir tvo síðustu heilu dagana.
[functions."timavera-pull-background"]
  schedule = "15 */2 * * *"

# Nætur-speglun 60 daga aftur (2026-08-07, beiðni 0138d239). Tíða keyrslan að ofan
# speglar aðeins síðustu tvo heilu dagana, en vinnufærslum er breytt í tímaveru.is
# löngu eftir á (staðfest: keyrsla 31.7 sótti leiðréttar færslur frá 13.7). Þessi
# þekur allan undanfarandi mánuð svo breyttar færslur skilji ekki eftir draugaraðir
# sem tvítelja tíma í Efnislista/Kröfuyfirliti. Sér function svo villa í breiða
# glugganum felli ekki 2-tíma ferskleikakeyrsluna.
[functions."timavera-reconcile-background"]
  schedule = "40 4 * * *"

# Payday reikningar → invoices (Brunahólf AR). Tvisvar á dag (07/15). Upsert á
# (tilvisun, source='payday') með dedupe — sama lykill og xlsx-leiðin, engin tvítök.
# Staðfest 2026-07-15: probe OK, dry mappar 345 raðir rétt (kt/hofudstoll/upphaed_total/
# gjalddagi/status, kredit meðhöndlað). Heldur Skuldunautum/Krófum ferskum án handvirkni.
[functions."payday-pull-background"]
  schedule = "0 7,15 * * *"

# Nightly (03:00 UTC) append-only backup of the Supabase document PDFs
# (úttektarskýrslur + reikningar + Efnislisti/Tímaskýrsla) into a Google Drive
# backup folder — a durable second copy so the docs never live in one unbacked
# store. Background function (15-min budget) → handles the full backfill.
[functions."storage-backup-background"]
  schedule = "0 3 * * *"

# eldklar póst-innsog (inbox + sent) á 2 tíma fresti (2026-08-19). ENGIN
# gervigreind — hrein Gmail API → Supabase upsert (dedupe á message_id) svo
# svarstaðan á Þjónustuver póstum / company-mail helst fersk án handvirkni.
# Áður var ekkert áætlað fall að sækja póst; sent-hólfið sat eftir frá 6.8.
# Áætlunin situr á -background tvíbura því Netlify svarar HTTP á áætluð föll með
# 403 — gmail-ingest sjálft er áfram frjálst (Kerfisheilsu-hnappur, bakfylling).
# Mínúta 35 svo það rekist ekki á timavera (:15) né payday (:00).
[functions."gmail-ingest-background"]
  schedule = "35 */2 * * *"

# ── Afkasta-caching (2026-08-13) ─────────────────────────────────────────────
# Allar <script>/<link> tilvísanir nota ?v= útgáfustimpil, svo það er óhætt að
# leyfa vafranum að endurnota skrárnar án 304-umferðar í klukkustund — og
# stale-while-revalidate uppfærir í bakgrunni. HTML-síðurnar sjálfar halda
# sjálfgefna must-revalidate (þær eru inngangurinn og mega aldrei vera gamlar).
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Tilboðsgerð lives at /public/tilbod/ on this host (the dedicated
# brunaholf-tilbod.netlify.app site uses public/tilbod/netlify.toml).
# HTML under that path still revalidates; the logo may be cached.
[[headers]]
  for = "/public/tilbod/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
