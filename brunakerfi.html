<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f9">
<title>Brunakerfi — yfirlit</title>
<style>
  :root{
    --bg:#f3f5f8; --panel:#fff; --line:#e4e8ee; --line2:#eef1f5;
    --text:#0b1220; --muted:#5c6b7d; --accent:#1d4ed8;
    --ok:#157a45; --okbg:#e8f6ee; --okbd:#c6e6d2;
    --warn:#9a6400; --warnbg:#fff6e0; --warnbd:#f0e0b0;
    --due:#b42318; --duebg:#fdecec; --duebd:#f4c7c2;
    --chip:#eef2f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 16px 48px}
  h1{font-size:22px;margin:0 0 4px;font-weight:760;letter-spacing:-.02em}
  .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:72ch}
  .lead b{color:var(--text);font-weight:650}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:#fff}
  .newbtn{display:inline-flex;align-items:center;gap:6px;background:#b91c1c;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;box-shadow:0 1px 4px rgba(185,28,28,.22)}
  .stats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:92px}
  .stat b{display:block;font-size:18px;font-weight:760;font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.due b{color:var(--due)}
  .months{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .mchip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .mchip.on{background:#0f172a;border-color:#0f172a;color:#fff;font-weight:650}
  .mchip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:3px}
  .rule{font-size:12.5px;color:var(--muted);background:#fff;border:1px dashed #d7deea;border-radius:10px;padding:8px 12px;margin-bottom:12px}
  .scroller{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
  th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;position:sticky;top:0;z-index:1}
  td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f7f9fc}
  .name{font-weight:700}
  .name a{color:inherit;text-decoration:none}
  .name a:hover{color:var(--accent);text-decoration:underline}
  .hint{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .hint.warn{color:var(--warn)}
  .addr,.kt{color:var(--muted);font-size:12.5px}
  .kt{font-variant-numeric:tabular-nums}
  .yrs{display:flex;gap:4px}
  .yr{width:28px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--chip);color:#94a3b8;text-decoration:none;border:1px solid transparent}
  .yr.ok{background:var(--okbg);color:var(--ok);border-color:var(--okbd)}
  .yr.ok:hover{filter:brightness(.96)}
  .mon{font-weight:650;text-transform:lowercase}
  .last{font-variant-numeric:tabular-nums;white-space:nowrap}
  .docs{font-variant-numeric:tabular-nums;color:var(--muted)}
  .badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .badge.skodad{background:var(--okbg);color:var(--ok);border-color:var(--okbd)}
  .badge.vantar{background:var(--warnbg);color:var(--warn);border-color:var(--warnbd)}
  .badge.engin{background:#f1f4f8;color:#64748b;border-color:#e2e8f0}
  th:first-child,td:first-child{position:sticky;left:0;background:var(--panel);z-index:2;min-width:180px;box-shadow:8px 0 8px -8px rgba(15,23,42,.12)}
  th:first-child{z-index:3;background:#fafbfc}
  th:last-child,td:last-child{position:sticky;right:0;background:var(--panel);z-index:2;box-shadow:-8px 0 8px -8px rgba(15,23,42,.12)}
  th:last-child{z-index:3;background:#fafbfc}
  tr:hover td:first-child,tr:hover td:last-child{background:#f7f9fc}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:14px}
  .err{background:var(--duebg);color:var(--due);border:1px solid var(--duebd);border-radius:10px;padding:10px 12px}
  @media (max-width:640px){
    .wrap{padding:12px 10px 36px}
    h1{font-size:19px}
    th,td{padding:8px 7px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Brunakerfi — yfirlit</h1>
  <p class="lead">Ein röð per <b>stað</b>. <b>Skoðað</b> þýðir brunakerfisskýrsla þessa árs á þessu húsi — ekki slökkvitækja-úttekt, ekki systkinahús á sömu kennitölu.</p>

  <div class="toolbar">
    <input id="q" class="search" placeholder="🔎 Leita að stað, kennitölu eða heimilisfangi…" autocomplete="off">
    <a class="newbtn" href="brunakerfi-skodun.html">🧯 Ný skoðunarskýrsla</a>
  </div>
  <div id="stats" class="stats"></div>
  <div id="months" class="months"></div>
  <div class="rule" id="rule">Skoðað YYYY = PDF með <code>doc_type=brunakerfi</code> á <code>fyrirtaeki_id</code> þessa staðar.</div>
  <div id="list"><div class="empty">Hleður…</div></div>
  <div class="note" id="note"></div>
</div>
<script>
function yearShort(y){ return "'" + String(y).slice(-2); }
const MONTHS = ['','jan','feb','mar','apr','maí','jún','júl','ágú','sep','okt','nóv','des'];
let DATA = null;
let monthFilter = 'all';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtKt(k){
  const d=String(k||'').replace(/\D/g,'');
  return d.length===10 ? d.slice(0,6)+'-'+d.slice(6) : (k||'');
}
function lastTxt(r){
  if(!r.last_year) return '—';
  const m = r.last_month ? MONTHS[r.last_month] : '';
  return m ? (r.last_year+' · '+m) : String(r.last_year);
}
function custHref(r){
  if(r.base_id) return 'customer.html?base='+encodeURIComponent(r.base_id);
  if(r.kennitala) return 'customer.html?kt='+encodeURIComponent(String(r.kennitala).replace(/\D/g,''));
  return '';
}

function renderStats(d, shown){
  const c=d.counts||{};
  const leak=d.leaks||{};
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${shown}</b><span>sýndir staðir</span></div>`+
    `<div class="stat ok"><b>${c.skodad||0}</b><span>Skoðað ${d.year}</span></div>`+
    `<div class="stat warn"><b>${c.vantar||0}</b><span>Vantar ${d.year}</span></div>`+
    `<div class="stat due"><b>${c.engin||0}</b><span>Engin skýrsla</span></div>`+
    (leak.uttekt_would_paint ? `<div class="stat warn"><b>${leak.uttekt_would_paint}</b><span>væru false ef slökkvit. teldist</span></div>` : '')+
    (leak.kt_sibling_would_paint ? `<div class="stat warn"><b>${leak.kt_sibling_would_paint}</b><span>væru false ef kt teldist</span></div>` : '');
}

function renderMonths(d){
  const months=d.months||{};
  const all=d.counts.all||0;
  const chips=[{k:'all',l:'Allir mán.',n:all}];
  for(let m=1;m<=12;m++) chips.push({k:String(m),l:MONTHS[m],n:months[m]||0});
  if(months[0]) chips.push({k:'0',l:'án mánaðar',n:months[0]});
  document.getElementById('months').innerHTML = chips.map(c=>
    `<button type="button" class="mchip${monthFilter===c.k?' on':''}" data-m="${c.k}">${esc(c.l)} <span class="n">${c.n}</span></button>`
  ).join('');
}

function passes(r, q){
  if(monthFilter!=='all'){
    const want = Number(monthFilter);
    if((r.last_month||0)!==want) return false;
  }
  if(!q) return true;
  const hay = ((r.nafn||'')+' '+(r.heimilisfang||'')+' '+(r.kennitala||'')+' '+String(r.kennitala||'').replace(/\D/g,'')).toLowerCase();
  return hay.includes(q);
}

function yearCells(r){
  const uniq = Object.keys(r.years||{}).map(Number).filter(Boolean).sort();
  return `<div class="yrs">`+uniq.map(y=>{
    const url=r.years[y];
    const short=yearShort(y);
    if(url) return `<a class="yr ok" href="${esc(url)}" target="_blank" rel="noopener" title="${y}">${short}</a>`;
    return `<span class="yr" title="${y} — ekkert PDF">${short}</span>`;
  }).join('')+`</div>`;
}

function render(){
  const d=DATA; if(!d) return;
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const rows=(d.rows||[]).filter(r=>passes(r,q));
  renderStats(d, rows.length);
  renderMonths(d);
  if(!rows.length){
    document.getElementById('list').innerHTML='<div class="scroller"><div class="empty">Ekkert fannst.</div></div>';
    return;
  }
  const body=rows.map(r=>{
    const href=custHref(r);
    const name=href?`<a href="${esc(href)}">${esc(r.nafn)}</a>`:esc(r.nafn);
    let hint='';
    if(r.false_if_uttekt) hint=`<span class="hint warn">slökkvitæki skoðað ${r.uttekt_year} — telst ekki hér</span>`;
    else if(r.false_if_kt) hint=`<span class="hint warn">systkinahús á sömu kt á skýrslu ${d.year} — telst ekki hér</span>`;
    return `<tr>
      <td><div class="name">${name}</div>${hint}</td>
      <td>${yearCells(r)}</td>
      <td class="addr">${esc(r.heimilisfang||'—')}</td>
      <td class="mon">${r.last_month?esc(MONTHS[r.last_month]):'—'}</td>
      <td class="last">${esc(lastTxt(r))}</td>
      <td class="docs">${r.docs||0}</td>
      <td><span class="badge ${esc(r.stada)}">${esc(r.stada_label)}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('list').innerHTML =
    `<div class="scroller"><table><thead><tr>
      <th>Fyrirtæki</th><th>'23–'26</th><th>Heimilisfang</th><th>Mánuður</th><th>Síðast</th><th>Skjöl</th><th>Staða</th>
    </tr></thead><tbody>${body}</tbody></table></div>`;
}

async function load(){
  try{
    const r=await fetch('/api/brunakerfi-yfirlit');
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    DATA=d;
    document.getElementById('rule').textContent = d.rule || document.getElementById('rule').textContent;
    const when=d.generated_at? new Date(d.generated_at).toLocaleString('is-IS') : '';
    document.getElementById('note').textContent =
      (when?('Sótt '+when+' · '):'')+(d.counts.all||0)+' staðir · óstaðsett brunakerfi-skjöl: '+(d.leaks&&d.leaks.unplaced_brunakerfi||0);
    render();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="err">Gat ekki hlaðið yfirlit: '+esc(e.message||e)+'</div>';
  }
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('months').addEventListener('click', e=>{
  const b=e.target.closest('.mchip'); if(!b) return;
  monthFilter=b.dataset.m;
  render();
});
load();
</script>
</body>
</html>
