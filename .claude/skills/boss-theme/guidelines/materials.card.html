<!-- @dsCard group="Colors" viewport="700x130" name="Three materials" subtitle="Black steel · cream paper · gold metal — nothing is a fourth" -->
<!DOCTYPE html>
<html lang="is"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px;background:var(--boss-paper);display:flex;gap:12px;font-family:var(--boss-font-body)}
.m{flex:1;display:flex;flex-direction:column;gap:6px}
.ladder{display:flex;height:44px;border:1px solid rgba(0,0,0,.1)}
.ladder i{flex:1}
.n{font-size:10.5px;font-weight:700;color:var(--boss-ink)}
.v{font-family:var(--boss-font-mono);font-size:9.5px;color:var(--boss-ink-mute)}
</style></head><body>
<div class="m"><div class="ladder"><i style="background:var(--boss-black-950)"></i><i style="background:var(--boss-black-800)"></i><i style="background:var(--boss-black-700)"></i><i style="background:var(--boss-black-500)"></i><i style="background:var(--boss-black-400)"></i><i style="background:var(--boss-black-300)"></i><i style="background:var(--boss-black-200)"></i></div><span class="n">Black steel</span><span class="v">#050505 → #4a463f · header, sidebar, slabs, obsidian keys</span></div>
<div class="m"><div class="ladder"><i style="background:var(--boss-paper-deep)"></i><i style="background:var(--boss-paper)"></i><i style="background:var(--boss-cream-deep)"></i><i style="background:var(--boss-cream)"></i><i style="background:var(--boss-white)"></i><i style="background:var(--boss-rule)"></i><i style="background:var(--boss-edge-deep)"></i></div><span class="n">Cream paper</span><span class="v">#ece7dc → #ffffff · ground, panels, ivory keys, wells</span></div>
<div class="m"><div class="ladder" style="background:var(--gold-face)"></div><span class="n">Gold metal</span><span class="v">decorative only — structure, never data</span></div>
</body></html>
