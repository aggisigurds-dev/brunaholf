<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Kúnna-yfirlit · Brunahólf</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f4f6f9; --panel:#fff; --line:#e2e6ec; --fg:#0f172a; --muted:#64748b;
          --accent:#2563eb; --ok:#1f7a4d; --warn:#9a6400; --err:#b42318; --purple:#6b3fd4; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:960px; margin:0 auto; padding:18px 22px 60px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .lead { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .lead a { color:var(--accent); text-decoration:none; }
  .lead a:hover { text-decoration:underline; }

  .picker { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .picker input, .picker select { padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; font-size:13px; }
  .picker input { min-width:220px; }
  .picker select { min-width:280px; }
  .picker button { padding:8px 12px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; font:inherit; font-size:12px; color:var(--muted); }
  .picker button:hover { color:var(--fg); }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .card h2 { margin:0 0 10px; font-size:14px; font-weight:700; }
  .meta { color:var(--muted); font-size:12.5px; }
  .meta b { color:var(--fg); }
  .kt { font-variant-numeric:tabular-nums; }

  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .b { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:700; }
  .b.sys   { background:#dbeafe; color:var(--accent); }
  .b.ok    { background:#d1fae5; color:var(--ok); }
  .b.due   { background:#fee2e2; color:var(--err); }
  .b.mgr   { background:#ede9fe; color:var(--purple); }
  .b.vantar { background:#fef3c7; color:var(--warn); }

  /* AI advisor */
  .advisor { background:#fff7ed; border:1px solid #fed7aa; border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .advisor h2 { margin:0 0 8px; font-size:14px; color:#9a3412; }
  .advisor ul { margin:0; padding-left:20px; font-size:13px; }
  .advisor li { margin:5px 0; line-height:1.45; }
  .advisor li.warn { color:var(--err); }
  .advisor li.info { color:#92400e; }
  .advisor li .hint { color:var(--muted); font-size:12px; display:block; margin-top:2px; }

  /* Year matrix */
  table.matrix { width:100%; border-collapse:collapse; margin-top:6px; font-size:13px; }
  table.matrix th, table.matrix td { padding:8px 10px; text-align:left; border-bottom:1px solid #f1f5f9; vertical-align:top; }
  table.matrix th { font-weight:700; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; background:#f8fafc; }
  table.matrix .yr { font-variant-numeric:tabular-nums; font-weight:700; width:60px; }
  table.matrix .cell-empty { color:#cbd5e1; }
  .doc-link { display:inline-block; padding:2px 8px; margin:2px 4px 2px 0; border-radius:5px; background:#eff6ff; color:var(--accent); text-decoration:none; font-size:12px; }
  .doc-link::after { content:" ↗"; opacity:.6; }
  .doc-link:hover { background:#dbeafe; }
  .doc-link.dup { background:#fef3c7; color:var(--warn); }
  .doc-link.dup::before { content:"⚠ "; }
  .doc-link.reviewed { background:#dcfce7; color:var(--ok); }
  .doc-link.reviewed::before { content:"✓ "; }

  /* Sites */
  .site { padding:10px 0; border-bottom:1px solid #f1f5f9; }
  .site:last-child { border-bottom:0; }
  .site .n { font-weight:600; }
  .site .a { color:var(--muted); font-size:12px; margin-top:2px; }
  .site-mx { margin:12px 0 18px; padding-top:8px; border-top:1px solid #f1f5f9; }
  .site-mx:first-of-type { border-top:0; padding-top:0; }
  .site-mx .n { font-weight:600; margin-bottom:6px; }
  .site-mx .a { font-weight:400; color:var(--muted); }

  /* AR / invoices */
  table.inv { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.inv th, table.inv td { padding:6px 8px; text-align:left; border-bottom:1px solid #f1f5f9; }
  table.inv th { font-weight:700; font-size:11px; color:var(--muted); text-transform:uppercase; }
  table.inv td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .stat-paid { color:var(--ok); }
  .stat-sent { color:var(--warn); }

  .empty { color:var(--muted); font-style:italic; font-size:13px; }
  pre.err { background:#fee2e2; color:var(--err); padding:8px 10px; border-radius:6px; font:12px ui-monospace,Menlo,monospace; }

  details { margin-top:8px; }
  details summary { cursor:pointer; font-size:12px; color:var(--accent); }

  /* Inline edit */
  .ed-btn { background:none; border:1px solid var(--line); border-radius:5px; padding:2px 6px; font-size:11px; cursor:pointer; color:var(--muted); }
  .ed-btn:hover { color:var(--fg); background:#f8fafc; }
  .ed-btn.save { color:var(--ok); border-color:#bbf7d0; }
  .ed-btn.save:hover { background:#dcfce7; }
  .ed-btn.cancel { color:var(--err); border-color:#fecaca; }
  .ed-btn.cancel:hover { background:#fee2e2; }
  .ed-input { padding:2px 5px; border:1px solid var(--line); border-radius:4px; font:12px Inter,sans-serif; max-width:100%; }
  .ed-input.num { text-align:right; font-variant-numeric:tabular-nums; width:90px; }
  .ed-input.date { width:130px; }
  .ed-input.text { width:100%; min-width:80px; }
  .ed-input.rno { width:90px; }
  .ed-input:focus { outline:none; border-color:var(--accent); }
  tr.editing { background:#fffbeb; }
  tr.editing td { vertical-align:middle; }
  .ed-actions { display:flex; gap:4px; }
</style>
</head>
<body>
<div class="wrap">

<h1>👤 Kúnna-yfirlit</h1>
<p class="lead">Eitt-kúnni-í-einu. Skýrslur · reikningar · samningur · staðsettningar · AI ráðgjafi · á einum stað.
  · <a href="doc-matrix.html">Skjala-checklist →</a> · <a href="brunakerfi.html">Brunakerfi →</a> · <a href="rekstrarfelog.html">Rekstrarfélög →</a></p>

<div class="picker">
  <input id="kt" placeholder="Kennitala (xxxxxx-xxxx eða xxxxxxxxxx)">
  <input id="id" placeholder="base_id (valkv.)" style="min-width:120px">
  <select id="dropdown"><option value="">— eða veldu úr lista (þjónustukúnnar) —</option></select>
  <button onclick="load()">Sækja</button>
  <span id="hint" class="meta"></span>
</div>

<div id="out"></div>

<script>
const MONTHS = ['','jan','feb','mar','apr','maí','jún','júl','ágú','sep','okt','nóv','des'];
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtKt(k) { if (!k) return ''; const d = String(k).replace(/\D/g,''); return d.length === 10 ? d.slice(0,6) + '-' + d.slice(6) : k; }
function fmtKr(n) { return Math.round(Number(n)||0).toLocaleString('is-IS').replace(/,/g,'.'); }
function fmtDate(d) { if (!d) return ''; const m = d.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${parseInt(m[3])}. ${MONTHS[parseInt(m[2])]} ${m[1]}` : d; }
function el(id) { return document.getElementById(id); }

// Pre-load service-customer dropdown
async function loadDropdown() {
  try {
    const r = await fetch('/api/doc-matrix?from=2023&to=2026');
    const d = await r.json();
    const opts = (d.rows || [])
      .filter(r => r.er_i_thjonustu)
      .sort((a,b) => (a.nafn||'').localeCompare(b.nafn||'','is'))
      .map(r => `<option value="${r.base_id}">${esc(r.nafn || '?')} (${esc(fmtKt(r.kennitala))})</option>`);
    el('dropdown').innerHTML = '<option value="">— veldu kúnna —</option>' + opts.join('');
    el('dropdown').onchange = () => { if (el('dropdown').value) { el('id').value = el('dropdown').value; el('kt').value=''; load(); } };
  } catch (e) {
    el('hint').textContent = 'Listi ekki tilbúinn: ' + e.message;
  }
}
loadDropdown();

async function load() {
  const id = el('id').value.trim();
  const kt = el('kt').value.trim();
  if (!id && !kt) { el('hint').textContent = 'Vantar kennitala eða base_id'; return; }
  el('hint').textContent = 'Hleð…';
  el('out').innerHTML = '<div class="card meta">Hleð…</div>';
  const q = id ? '?base=' + encodeURIComponent(id) : '?kt=' + encodeURIComponent(kt);
  const r = await fetch('/api/customer' + q);
  const data = await r.json();
  if (!r.ok || data.error) {
    el('out').innerHTML = '<pre class="err">' + esc(data.error || 'villa') + '</pre>';
    el('hint').textContent = '';
    return;
  }
  render(data);
  el('hint').textContent = '';
  history.replaceState(null, '', '?base=' + data.base.id);
}

let LAST_DATA = null;
const DOC_TYPES = ['uttektarskyrsla', 'reikningur', 'samningur', 'annad'];
const DOC_TYPE_LABEL = { uttektarskyrsla: 'Úttekt', reikningur: 'Reikningur', samningur: 'Samningur', annad: 'Annað' };

function render(d) {
  LAST_DATA = d;
  const { base, sites, docs, invoices, summary, ai_flags, last_contact } = d;
  let html = '';

  // Header card
  html += `<div class="card">`;
  html += `<h2>${esc(base.nafn || '(nafnlaus)')}</h2>`;
  html += `<div class="meta"><b class="kt">${esc(fmtKt(base.kennitala))}</b>`;
  if (base.heimilisfang) html += ` · ${esc(base.heimilisfang)}`;
  if (base.rekstrarfelag) html += ` · ⌂ ${esc(base.rekstrarfelag)}`;
  html += `</div>`;
  const yearNow = new Date().getUTCFullYear();
  html += '<div class="badges">';
  if (base.er_i_thjonustu) html += '<span class="b ok">✓ Í þjónustu</span>';
  const nLive = summary.sites_in_service || ((sites || []).filter(s => s.er_i_thjonustu).length);
  const nOk = summary.sites_with_2026_uttekt;
  if (nLive > 1 && nOk != null) {
    if (nOk === nLive) html += '<span class="b ok">' + yearNow + ' skýrsla á öllum ' + nLive + ' stöðum</span>';
    else html += '<span class="b due">' + nOk + '/' + nLive + ' staðir með ' + yearNow + ' skýrslu</span>';
  } else if (summary.has_2026_uttekt) {
    html += '<span class="b ok">' + yearNow + ' skýrsla komin</span>';
  } else if (base.er_i_thjonustu) {
    html += '<span class="b due">⚠ Vantar ' + yearNow + ' skýrslu</span>';
  }
  if (summary.ar_open_kr > 0) html += '<span class="b due">' + fmtKr(summary.ar_open_kr) + ' kr óinnheimt</span>';
  if (summary.dup_count > 0) html += '<span class="b vantar">' + summary.dup_count + ' tvítak</span>';
  const slReikThisYear = docs.filter(d => d.doc_type === 'reikningur' &&
    (d.year === yearNow || (d.doc_date && d.doc_date.startsWith(String(yearNow)))));
  if (slReikThisYear.length) {
    const sum = slReikThisYear.reduce((s, x) => s + (Number(x.amount) || 0), 0);
    html += '<span class="b sys">' + yearNow + ': ' + slReikThisYear.length + ' reikn · ' + fmtKr(sum) + ' kr</span>';
  }
  // Síðasta póstsamskipti (verkefnalisti aaaa0cb6) — sýnt óháð svar-stöðu; ósvarað fær sér lit.
  if (last_contact && last_contact.received_at) {
    const cls = last_contact.unreplied ? 'due' : 'ok';
    html += `<span class="b ${cls}" title="${esc(last_contact.from || '')}${last_contact.subject ? ' — ' + esc(last_contact.subject) : ''}">✉️ Síðast í sambandi: ${esc(fmtDate(last_contact.received_at))}${last_contact.unreplied ? ' (ósvarað)' : ''}</span>`;
  }
  html += '</div></div>';

  // AI advisor
  if (ai_flags && ai_flags.length) {
    html += '<div class="advisor"><h2>🤖 AI Ráðgjafi</h2><ul>';
    for (const f of ai_flags) {
      html += `<li class="${esc(f.severity)}">${esc(f.msg)}`;
      if (f.hint) html += `<span class="hint">${esc(f.hint)}</span>`;
      html += '</li>';
    }
    html += '</ul></div>';
  }

  // Stofn samningur
  const samningur = docs.filter(x => x.doc_type === 'samningur');
  html += '<div class="card"><h2>📝 Þjónustusamningur</h2>';
  if (samningur.length) {
    html += samningur.map(s => docLink(s)).join(' ');
  } else {
    html += '<div class="empty">Enginn skráður þjónustusamningur</div>';
  }
  html += '</div>';

  // Year matrix
  html += '<div class="card"><h2>📊 Ár-grid</h2>';
  html += yearMatrix(docs, base.er_i_thjonustu, sites);
  html += '</div>';

  // Sites (only if >0)
  if (sites && sites.length) {
    html += '<div class="card"><h2>📍 Staðsettningar (' + sites.length + ')</h2>';
    for (const s of sites) {
      const siteUt = docs.filter(d => d.fyrirtaeki_id === s.id && d.doc_type === 'uttektarskyrsla' && !d.is_duplicate);
      const years = siteUt.map(d => d.year || (d.doc_date ? Number(String(d.doc_date).slice(0, 4)) : null)).filter(Boolean);
      const last = years.length ? Math.max.apply(null, years) : null;
      let cov = '<span class="b vantar">engin skýrsla</span>';
      if (last >= yearNow) cov = '<span class="b ok">skýrsla ' + last + '</span>';
      else if (last) cov = '<span class="b due">síðast ' + last + '</span>';
      html += '<div class="site">';
      html += '<div class="n">' + esc(s.nafn || '?') + (s.er_i_thjonustu ? ' <span class="b ok" style="font-size:10px">í þjón.</span>' : '') + ' ' + cov + '</div>';
      if (s.heimilisfang) html += '<div class="a">' + esc(s.heimilisfang) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // Slökkvitæki invoices (OCR'd PDFs from customer_documents)
  const slInv = docs
    .filter(d => d.doc_type === 'reikningur')
    .sort((a, b) => (b.doc_date || '').localeCompare(a.doc_date || ''));
  if (slInv.length) {
    const slTotal = slInv.reduce((s, x) => s + (Number(x.amount) || 0), 0);
    const byYear = {};
    for (const i of slInv) {
      const y = i.year || (i.doc_date ? Number(i.doc_date.slice(0, 4)) : '?');
      byYear[y] = byYear[y] || { count: 0, sum: 0 };
      byYear[y].count++;
      byYear[y].sum += Number(i.amount) || 0;
    }
    const yrParts = Object.entries(byYear).sort((a, b) => b[0] - a[0])
      .map(([y, v]) => `<b>${y}</b>: ${v.count} stk · ${fmtKr(v.sum)} kr`).join(' · ');
    const ocrOk = slInv.filter(x => x.amount && x.invoice_number && x.doc_date).length;
    html += '<div class="card"><h2>🧾 Reikningar (Slökkvitæki) — ' + slInv.length + ' · ' + fmtKr(slTotal) + ' kr alls</h2>';
    if (yrParts) html += '<div class="meta" style="margin-bottom:6px">' + yrParts + '</div>';
    if (ocrOk < slInv.length) {
      html += '<div class="meta" style="margin-bottom:8px;color:var(--warn)">⚠ ' + ocrOk + ' af ' + slInv.length +
        ' með fullum OCR-gögnum. Keyrðu Reikningalesari í <a href="/#bakendi" target="_blank" style="color:var(--accent)">Bakenda</a> til að fylla restina.</div>';
    }
    // Sort: rows with most data first, then by doc_date desc, then by year desc
    slInv.sort((a, b) => {
      const sa = (a.amount ? 1 : 0) + (a.invoice_number ? 1 : 0) + (a.doc_date ? 1 : 0);
      const sb = (b.amount ? 1 : 0) + (b.invoice_number ? 1 : 0) + (b.doc_date ? 1 : 0);
      if (sa !== sb) return sb - sa;
      return (b.doc_date || String(b.year || '')).localeCompare(a.doc_date || String(a.year || ''));
    });
    html += '<table class="inv" id="slInvTable"><thead><tr><th>R-nr</th><th>Dags</th><th>Tegund</th><th>Kúnni / nafn</th><th class="num">Upphæð</th><th>PDF</th><th></th></tr></thead><tbody>';
    for (const i of slInv.slice(0, 60)) {
      html += renderDocRow(i);
    }
    html += '</tbody></table>';
    if (slInv.length > 60) html += '<div class="meta" style="margin-top:6px">+ ' + (slInv.length - 60) + ' fleiri</div>';
    html += '</div>';
  }

  // Invoices (from invoices table — brunaholf side reikningar, contractor jobs)
  if (invoices && invoices.length) {
    html += '<div class="card"><h2>💰 Reikningar (Brunahólf / Payday) — ' + invoices.length + '</h2>';
    html += '<table class="inv"><thead><tr><th>Nr</th><th>Dags</th><th class="num">Upphæð</th><th>Staða</th><th>Greitt</th></tr></thead><tbody>';
    for (const i of invoices.slice(0, 50)) {
      const stCl = /paid|greidd/i.test(i.status || '') ? 'stat-paid' : 'stat-sent';
      html += `<tr><td>${esc(i.tilvisun || '')}</td>`;
      html += `<td>${esc(fmtDate(i.gjalddagi))}</td>`;
      html += `<td class="num">${fmtKr(i.upphaed_total || i.hofudstoll)} kr</td>`;
      html += `<td class="${stCl}">${esc(i.status || '')}</td>`;
      html += `<td>${esc(fmtDate(i.greidsla_date))}</td></tr>`;
    }
    html += '</tbody></table>';
    if (invoices.length > 50) html += '<div class="meta" style="margin-top:6px">+ ' + (invoices.length - 50) + ' fleiri</div>';
    html += '</div>';
  }

  // Raw debug
  html += '<details><summary>Sjá raw JSON</summary><pre style="font:11px ui-monospace,Menlo,monospace;overflow:auto;background:#f8fafc;padding:10px;border-radius:6px">' + esc(JSON.stringify(d, null, 2)) + '</pre></details>';

  el('out').innerHTML = html;
}

function renderDocRow(i) {
  const editing = window._editingDocId === i.id;
  if (editing) {
    const typeOpts = DOC_TYPES.map(t => `<option value="${t}"${i.doc_type === t ? ' selected' : ''}>${DOC_TYPE_LABEL[t]}</option>`).join('');
    return `<tr class="editing" data-doc-id="${i.id}">
      <td><input class="ed-input rno" data-f="invoice_number" value="${esc(i.invoice_number || '')}"></td>
      <td><input class="ed-input date" data-f="doc_date" type="date" value="${esc(i.doc_date || '')}"></td>
      <td><select class="ed-input" data-f="doc_type" style="width:110px">${typeOpts}</select></td>
      <td><input class="ed-input text" data-f="customer_name" value="${esc(i.customer_name || '')}"></td>
      <td class="num"><input class="ed-input num" data-f="amount" type="number" step="1" value="${i.amount != null ? Number(i.amount) : ''}"></td>
      <td>${i.view_url ? `<a class="doc-link" href="${esc(i.view_url)}" target="_blank" rel="noopener">PDF</a>` : ''}</td>
      <td><div class="ed-actions">
        <button class="ed-btn save" onclick="saveDocEdit(${i.id})" title="Vista">💾</button>
        <button class="ed-btn cancel" onclick="cancelDocEdit()" title="Hætta við">✕</button>
      </div></td>
    </tr>
    <tr class="editing" data-doc-id="${i.id}-notes">
      <td colspan="7" style="padding-top:0">
        <div class="meta" style="margin-bottom:2px;font-size:11px">Athugasemd</div>
        <input class="ed-input text" data-f="notes" style="width:100%" value="${esc(i.notes || '')}">
      </td>
    </tr>`;
  }
  return `<tr data-doc-id="${i.id}"><td>${esc(i.invoice_number || '—')}</td>
    <td>${esc(fmtDate(i.doc_date) || (i.year || ''))}</td>
    <td>${esc(DOC_TYPE_LABEL[i.doc_type] || i.doc_type || '')}</td>
    <td>${esc(i.customer_name || i.site_nafn || '')}</td>
    <td class="num">${i.amount ? fmtKr(i.amount) + ' kr' : ''}</td>
    <td>${i.view_url ? `<a class="doc-link" href="${esc(i.view_url)}" target="_blank" rel="noopener">PDF</a>` : ''}</td>
    <td><button class="ed-btn" onclick="startDocEdit(${i.id})" title="Breyta">✏️</button></td>
  </tr>`;
}

function startDocEdit(id) {
  window._editingDocId = id;
  if (LAST_DATA) render(LAST_DATA);
}

function cancelDocEdit() {
  window._editingDocId = null;
  if (LAST_DATA) render(LAST_DATA);
}

async function saveDocEdit(id) {
  const rows = document.querySelectorAll(`tr[data-doc-id^="${id}"]`);
  const fields = {};
  rows.forEach(tr => {
    tr.querySelectorAll('[data-f]').forEach(inp => {
      fields[inp.dataset.f] = inp.value;
    });
  });
  const saveBtn = document.querySelector(`tr[data-doc-id="${id}"] .ed-btn.save`);
  if (saveBtn) { saveBtn.textContent = '…'; saveBtn.disabled = true; }
  try {
    const r = await fetch('/api/customer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'update-doc', id, fields }),
    });
    const j = await r.json();
    if (!r.ok || j.error) {
      alert('Villa við vistun: ' + (j.error || r.status));
      if (saveBtn) { saveBtn.textContent = '💾'; saveBtn.disabled = false; }
      return;
    }
    window._editingDocId = null;
    await load();
  } catch (e) {
    alert('Villa: ' + e.message);
    if (saveBtn) { saveBtn.textContent = '💾'; saveBtn.disabled = false; }
  }
}

function docLink(doc) {
  // „engin skrá" — EKKI „engin Drive-tenging". Skjal sem á storage_path en engan
  // drive_file_id er fullkomlega opnanlegt (bakendinn setur view_url á Supabase);
  // gamli textinn kallaði 241 slíkt skjal tengingarlaust að ósekju. Grátt merki
  // hér þýðir núna: HVORUG uppspretta á skrá.
  if (!doc.view_url) {
    return `<span class="doc-link" style="background:#f1f5f9;color:#94a3b8" title="Hvorki Drive-skrá né Supabase-skrá að baki þessari röð">(${esc(doc.doc_type)} — engin skrá)</span>`;
  }
  const cls = doc.reviewed ? 'doc-link reviewed' : (doc.is_duplicate ? 'doc-link dup' : 'doc-link');
  let label = doc.doc_type;
  if (doc.invoice_number) label = doc.invoice_number;
  else if (doc.amount) label = fmtKr(doc.amount) + ' kr';
  const src = doc.link_source === 'storage' ? 'Supabase' : 'Drive';
  const tip = [doc.customer_name || '', doc.doc_date || '', '· ' + src].join(' ').trim();
  return `<a class="${cls}" href="${esc(doc.view_url)}" target="_blank" rel="noopener" title="${esc(tip)}">${esc(label)}</a>`;
}

function yearMatrix(docs, expected, sites) {
  const live = (sites || []).filter(s => s.er_i_thjonustu === true);
  if (live.length > 1) {
    let html = '<p class="lead" style="margin:0 0 10px">Per stað — skýrsla á einu húsi telst ekki á hinum.</p>';
    for (const s of live) {
      const siteDocs = docs.filter(d => d.fyrirtaeki_id === s.id);
      html += '<div class="site-mx"><div class="n">' + esc(s.nafn || '?') + (s.heimilisfang ? ' <span class="a">· ' + esc(s.heimilisfang) + '</span>' : '') + '</div>';
      html += yearMatrixTable(siteDocs, !!s.er_i_thjonustu);
      html += '</div>';
    }
    const loose = docs.filter(d => !d.fyrirtaeki_id && (d.doc_type === 'uttektarskyrsla' || d.doc_type === 'reikningur') && !d.is_duplicate);
    if (loose.length) {
      html += '<div class="site-mx"><div class="n">Óstaðsett skjöl (' + loose.length + ') — ekki talin sem þekja</div>';
      html += yearMatrixTable(loose, false);
      html += '</div>';
    }
    return html;
  }
  return yearMatrixTable(docs, expected);
}

function yearMatrixTable(docs, expected) {
  // Determine year range
  const years = new Set();
  for (const d of docs) {
    const y = Number(d.year || (d.doc_date ? String(d.doc_date).slice(0, 4) : 0)) || null;
    if (y) years.add(y);
  }
  const cy = new Date().getUTCFullYear();
  if (expected) {
    for (let y = Math.max(2024, cy - 3); y <= cy; y++) years.add(y);
  }
  if (!years.size) return '<div class="empty">Engin skjöl með ári</div>';
  const sorted = [...years].sort((a, b) => b - a);

  let html = '<table class="matrix"><thead><tr><th>Ár</th><th>📄 Úttektarskýrsla</th><th>🧾 Reikningar</th></tr></thead><tbody>';
  for (const y of sorted) {
    const u = docs.filter(d => (Number(d.year || (d.doc_date ? String(d.doc_date).slice(0, 4) : 0)) || null) === y && d.doc_type === 'uttektarskyrsla');
    const r = docs.filter(d => (Number(d.year || (d.doc_date ? String(d.doc_date).slice(0, 4) : 0)) || null) === y && d.doc_type === 'reikningur');
    html += `<tr><td class="yr">${y}</td>`;
    html += '<td>' + (u.length ? u.map(docLink).join(' ') : (expected ? '<span class="b vantar">vantar</span>' : '<span class="cell-empty">—</span>')) + '</td>';
    html += '<td>' + (r.length ? r.map(docLink).join(' ') : '<span class="cell-empty">—</span>') + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

// On boot: if ?base= or ?kt= in URL, auto-load
(function bootFromUrl() {
  const sp = new URLSearchParams(location.search);
  if (sp.get('base')) { el('id').value = sp.get('base'); load(); }
  else if (sp.get('kt')) { el('kt').value = sp.get('kt'); load(); }
})();
</script>
