<!-- @dsCard group="Components" viewport="700x190" name="Header, panel, slab" subtitle="The three frames every Boss screen is made of" -->
<!DOCTYPE html>
<html lang="is"><head>

<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--boss-paper);font-family:var(--boss-font-body);display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:1fr 260px;gap:12px;padding:14px 16px}
</style></head><body>
<div class="boss-header" style="height:60px;padding:0 18px;gap:14px">
  <span class="boss-medallion" style="width:34px;height:34px;font-size:15px">🔥</span>
  <div style="line-height:1"><span class="boss-wordmark" style="font-size:20px">Brunahólf</span><div class="boss-wordmark-sub">STJÓRNSTÖÐ · SLÖKKVITÆKI EHF.</div></div>
  <div style="margin-left:auto" class="boss-lcd"><div class="boss-lcd-time" style="font-size:16px">16:21</div><div class="boss-lcd-sub">MIÐ 2. SEP</div></div>
  <button class="boss-btn header sm">◐ Sjálfvirkt</button>
</div>
<div class="grid">
  <div class="boss-panel">
    <div class="boss-panel-head" style="padding:9px 14px"><span class="boss-plate">01</span><span class="boss-panel-title" style="font-size:16px">Dagskrá</span><span style="font-size:12px;color:var(--boss-ink-soft)">2.–8. september</span><button class="boss-btn gold sm" style="margin-left:auto">+ Skrá verk</button></div>
    <div style="padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--boss-ink-mute)"><span class="boss-medallion ghost">🔥</span>Engin áríðandi mál</div>
  </div>
  <div class="boss-slab">
    <div style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--boss-black-400)"><span class="boss-plate dark">06</span><span class="boss-label" style="color:var(--gold-500)">Valið mál</span><span class="boss-mono" style="margin-left:auto;font-size:10px;color:var(--boss-green-lit)">0D</span></div>
    <div style="padding:10px 14px;font-family:var(--boss-font-display);font-size:15px;font-weight:700">Nýtt mál — ótengt</div>
  </div>
</div>
</body></html>
