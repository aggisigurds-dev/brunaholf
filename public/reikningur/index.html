<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brunahólf — Reikningagerð (Efnislisti)</title>
<style>
  :root {
    --bg: #fafaf7;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #5b5b5b;
    --line: #e2e2dd;
    --line-strong: #c9c9c2;
    --accent: #d93838;
    --accent-soft: #fce6e6;
    --blue: #2563eb;
    --warning-bg: #fff8d6;
    --warning-border: #caa33a;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45; font-size: 14px;
  }
  header {
    background: var(--ink); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-bottom: 3px solid var(--accent);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header h1 .accent { color: var(--accent); }
  header .tag { font-size: 12px; color: #b8b8b8; }
  header button {
    background: var(--accent); color: #fff; border: 0;
    padding: 8px 14px; font-size: 13px; font-weight: 500;
    border-radius: 4px; cursor: pointer;
  }
  header button.ghost { background: transparent; border: 1px solid #555; color: #ddd; }
  header button:hover { filter: brightness(1.1); }
  header .toolbar { display: flex; gap: 8px; }

  .layout {
    display: grid; grid-template-columns: 420px 1fr; gap: 0;
    min-height: calc(100vh - 60px);
  }
  .form-panel {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px; overflow-y: auto;
    max-height: calc(100vh - 60px); position: sticky; top: 0;
  }
  .preview-panel { padding: 24px 32px; overflow-y: auto; max-height: calc(100vh - 60px); }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--ink-soft); font-weight: 600;
    margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .section-title:first-child { margin-top: 0; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 3px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 9px; font-size: 13px;
    border: 1px solid var(--line-strong); border-radius: 3px;
    font-family: inherit; background: #fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(217,56,56,0.15);
  }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  .field .hint { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .materials-grid {
    display: grid; grid-template-columns: 1fr 90px 70px; gap: 4px 8px;
    font-size: 12px; align-items: center;
  }
  .materials-grid .mat-label { color: var(--ink); padding: 3px 0; }
  .materials-grid .mat-unit { color: var(--ink-soft); font-size: 11px; padding: 3px 0; text-align: right; }
  .materials-grid input { padding: 4px 6px; font-size: 12px; text-align: right; }
  .mat-section-head { grid-column: 1 / -1; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .8px; margin-top: 10px; padding-bottom: 2px; border-bottom: 1px dashed var(--line); }

  /* Preview matches the printed Efnislisti PDF exactly */
  .preview-doc {
    background: #fff; box-shadow: var(--shadow);
    max-width: 820px; margin: 0 auto; padding: 56px 64px;
    border: 1px solid var(--line); border-radius: 4px;
    font-family: "Times New Roman", Times, serif;
    color: #000; font-size: 13px;
  }
  .doc-top {
    display: grid; grid-template-columns: 200px 1fr;
    gap: 24px; align-items: center; margin-bottom: 28px;
  }
  .doc-logo { width: 180px; height: auto; display: block; }
  .doc-title-block { text-align: left; }
  .doc-title-block h1 {
    font-size: 26px; margin: 0; font-weight: 700;
    font-family: "Times New Roman", Times, serif; letter-spacing: 0.5px;
  }
  .doc-title-block .doc-subtitle {
    font-size: 13px; font-style: italic; color: #555;
    margin: 4px 0 0; font-weight: 400;
  }
  .doc-meta { margin-bottom: 16px; font-size: 13px; }
  .doc-meta .period { color: #000; }
  .doc-meta .worksite { font-weight: 700; margin-top: 2px; }

  table.efni {
    width: 100%; border-collapse: collapse; margin: 0;
    font-size: 12.5px; font-family: "Times New Roman", Times, serif;
  }
  table.efni td {
    padding: 3px 4px; vertical-align: bottom;
  }
  table.efni thead td {
    font-style: italic; color: #555; padding-bottom: 6px;
    text-align: right;
  }
  table.efni thead td:first-child { text-align: left; }
  table.efni td.label { text-align: left; font-weight: 400; }
  table.efni td.size { color: #000; width: 50px; }
  table.efni td.unit { color: #000; width: 50px; }
  table.efni td.price {
    text-align: right; font-variant-numeric: tabular-nums;
    width: 100px; white-space: nowrap;
  }
  table.efni td.magn {
    text-align: right; font-variant-numeric: tabular-nums;
    width: 100px; border-bottom: 1px solid #000; white-space: nowrap;
  }
  table.efni td.total {
    text-align: right; font-variant-numeric: tabular-nums;
    width: 110px; white-space: nowrap;
  }
  /* Section headers like "Akstur" / "Efni" */
  table.efni tr.section-row td {
    font-weight: 700; padding-top: 14px; padding-bottom: 4px;
  }
  /* Subtotal/VSK/Total rows with lines per PDF */
  table.efni tr.spacer td { padding-top: 16px; }
  table.efni tr.subtotal-row td {
    border-top: 1px solid #000; padding-top: 4px;
    text-align: center; font-style: italic; color: #555;
  }
  table.efni tr.subtotal-row td.total { font-style: normal; color: #000; text-align: right }
  table.efni tr.vsk-row td {
    text-align: center; font-style: italic; color: #555;
  }
  table.efni tr.vsk-row td.total { font-style: normal; color: #000; text-align: right }
  table.efni tr.grand-row td {
    border-top: 1px solid #000; border-bottom: 3px double #000;
    padding: 6px 4px;
    text-align: center; font-weight: 400; color: #000;
  }
  table.efni tr.grand-row td.total { font-weight: 700; text-align: right }
  table.efni tr.zero-row { /* still shown in editor */ }

  /* Print + saved version */
  @media print {
    body { background: #fff; }
    header, .form-panel { display: none !important; }
    .layout { grid-template-columns: 1fr !important; }
    .preview-panel { padding: 0 !important; max-height: none !important; overflow: visible !important; }
    .preview-doc { box-shadow: none !important; border: none !important; max-width: 100% !important; padding: 24px 32px !important; }
    /* Hide all rows that have 0 magn — only show items actually used */
    table.efni tr.zero-row { display: none !important; }
    /* Hide section header if all its rows are hidden too */
    table.efni tr.section-row.section-empty { display: none !important; }
  }

  .small-link { font-size: 11px; color: var(--blue); cursor: pointer; }
  .small-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Brunahólf <span class="accent">·</span> Reikningagerð <span class="tag">Efnislisti</span></h1>
  <div class="toolbar">
    <button type="button" class="ghost" id="btnPrint">🖨 Prenta / PDF</button>
    <button type="button" id="btnCopy">📋 Afrita</button>
  </div>
</header>

<div class="layout">

  <!-- =================== FORM PANEL =================== -->
  <div class="form-panel">

    <div class="section-title">Verkstaður</div>
    <div class="field">
      <label for="f-verkstadur">Verkstaður</label>
      <input type="text" id="f-verkstadur" value="Fjallaböðin Þjórsárdal" />
    </div>
    <div class="field">
      <label for="f-verkkaupi">Verkkaupi</label>
      <input type="text" id="f-verkkaupi" value="JÁVERK ehf." />
    </div>
    <div class="row-2">
      <div class="field">
        <label for="f-fra">Frá</label>
        <input type="date" id="f-fra" value="2026-04-01" />
      </div>
      <div class="field">
        <label for="f-til">Til</label>
        <input type="date" id="f-til" value="2026-04-30" />
      </div>
    </div>

    <div class="section-title">Tími</div>
    <div class="row-3">
      <div class="field">
        <label>&nbsp;</label>
        <div style="padding:7px 0;font-size:12px;font-weight:500">Dagvinna</div>
      </div>
      <div class="field">
        <label for="f-dv-rate">verð (kr/klst)</label>
        <input type="number" id="f-dv-rate" value="9300" step="50" />
      </div>
      <div class="field">
        <label for="f-dv-h">klst</label>
        <input type="number" id="f-dv-h" value="184.8" step="0.5" />
      </div>
    </div>
    <div class="row-3">
      <div class="field">
        <label>&nbsp;</label>
        <div style="padding:7px 0;font-size:12px;font-weight:500">Yfirvinna</div>
      </div>
      <div class="field">
        <label for="f-ev-rate">verð (kr/klst)</label>
        <input type="number" id="f-ev-rate" value="13950" step="50" />
      </div>
      <div class="field">
        <label for="f-ev-h">klst</label>
        <input type="number" id="f-ev-h" value="0" step="0.5" />
      </div>
    </div>

    <div class="section-title">Akstur</div>
    <div class="row-2">
      <div class="field">
        <label for="f-km">km × 186 kr</label>
        <input type="number" id="f-km" value="0" step="10" />
      </div>
      <div class="field">
        <label for="f-ferd">ferðir × 4000 kr</label>
        <input type="number" id="f-ferd" value="0" step="1" />
      </div>
    </div>

    <div class="section-title">Efni</div>
    <div class="materials-grid" id="mat-grid">
      <!-- filled dynamically -->
    </div>

    <div class="section-title">Aukagjöld</div>
    <div class="field">
      <label><input type="checkbox" id="f-stadf" /> Staðfesting brunaþéttinga (20.000 kr flat)</label>
    </div>
    <div class="field">
      <label>Smáhlutagjald: 137 kr × dagvinna klst (sjálfvirkt)</label>
      <div class="hint" id="f-sma-hint">—</div>
    </div>

    <div class="section-title">Athugasemd (valkvætt)</div>
    <div class="field">
      <textarea id="f-notes" rows="2" placeholder="Birtist neðst á reikningi"></textarea>
    </div>

  </div>

  <!-- =================== PREVIEW PANEL =================== -->
  <div class="preview-panel">
    <div class="preview-doc" id="preview">
      <!-- rendered -->
    </div>
  </div>

</div>

<script>
/* ====== Verðskrá efnis (sömu og í Tekjur sheet Verðskrá) ====== */
const MATERIALS = [
  { section: 'Almennt', items: [
    { key:'akril',         label:'Eldvarnar akríl',         unit:'stk',  price:1624 },
    { key:'akril5kg',      label:'Eldvarnar Akríl 5kg',     unit:'stk',  price:14400 },
    { key:'thullkitti',    label:'Háþennslukítti',          unit:'stk',  price:4489 },
    { key:'silikon',       label:'Eldvarnar silikon',       unit:'stk',  price:2220 },
    { key:'steinull',      label:'Eldvarnar steinull',      unit:'plata',price:10703 },
    { key:'malning',       label:'Eldvarnar málning',       unit:'líter',price:2500 },
    { key:'rulla55',       label:'Eldvarnar rúlla 55mm',    unit:'stk',  price:53574 },
  ]},
  { section: 'Eldvarnar band (mm)', items: [
    { key:'band55',  label:'Band 55mm',   unit:'stk', price:1621 },
    { key:'band63',  label:'Band 63mm',   unit:'stk', price:3590 },
    { key:'band75',  label:'Band 75mm',   unit:'stk', price:1236 },
    { key:'band82',  label:'Band 82mm',   unit:'stk', price:1287 },
    { key:'band90',  label:'Band 90mm',   unit:'stk', price:1556 },
    { key:'band110', label:'Band 110mm',  unit:'stk', price:2047 },
    { key:'band125', label:'Band 125mm',  unit:'stk', price:2628 },
    { key:'band160', label:'Band 160mm',  unit:'stk', price:4780 },
    { key:'band200', label:'Band 200mm',  unit:'stk', price:6025 },
  ]},
  { section: 'Eldvarnar kragi (mm)', items: [
    { key:'kragi32',  label:'Kragi 32mm',  unit:'stk', price:2821 },
    { key:'kragi40',  label:'Kragi 40mm',  unit:'stk', price:3205 },
    { key:'kragi55',  label:'Kragi 55mm',  unit:'stk', price:3308 },
    { key:'kragi63',  label:'Kragi 63mm',  unit:'stk', price:3590 },
    { key:'kragi75',  label:'Kragi 75mm',  unit:'stk', price:4103 },
    { key:'kragi82',  label:'Kragi 82mm',  unit:'stk', price:4174 },
    { key:'kragi90',  label:'Kragi 90mm',  unit:'stk', price:4719 },
    { key:'kragi110', label:'Kragi 110mm', unit:'stk', price:4915 },
    { key:'kragi125', label:'Kragi 125mm', unit:'stk', price:6260 },
    { key:'kragi140', label:'Kragi 140mm', unit:'stk', price:8052 },
    { key:'kragi160', label:'Kragi 160mm', unit:'stk', price:10191 },
    { key:'kragi200', label:'Kragi 200mm', unit:'stk', price:18021 },
    { key:'kragi250', label:'Kragi 250mm', unit:'stk', price:26792 },
    { key:'kragi315', label:'Kragi 315mm', unit:'stk', price:151754 },
  ]},
  { section: 'Brunaþéttirör', items: [
    { key:'bpr16',     label:'Brunaþéttirör 16mm',     unit:'stk', price:6426 },
    { key:'bpr20',     label:'Brunaþéttirör 20mm',     unit:'stk', price:6426 },
    { key:'bpr32',     label:'Brunaþéttirör 32mm',     unit:'stk', price:8044 },
    { key:'bpr50',     label:'Brunaþéttirör 50mm',     unit:'stk', price:9012 },
    { key:'bprpvc32',  label:'Brunaþéttirör PVC 32mm', unit:'stk', price:2498 },
    { key:'bprpvc50',  label:'Brunaþéttirör PVC 50mm', unit:'stk', price:2970 },
  ]},
];

const VSK_PCT       = 24;
const SMA_PER_KLST  = 137;
const STADF_KR      = 20000;
const KM_RATE       = 186;
const FERD_RATE     = 4000;

/* ====== Build materials inputs ====== */
const $mat = document.getElementById('mat-grid');
function buildMaterialsGrid(){
  let html = '';
  for(const sec of MATERIALS){
    html += `<div class="mat-section-head">${sec.section}</div>`;
    for(const it of sec.items){
      html += `
        <div class="mat-label">${it.label}</div>
        <div class="mat-unit">${it.price.toLocaleString('is-IS')} kr / ${it.unit}</div>
        <input type="number" min="0" step="1" data-mat="${it.key}" data-price="${it.price}" data-label="${it.label}" data-unit="${it.unit}" placeholder="0" />
      `;
    }
  }
  $mat.innerHTML = html;
  $mat.querySelectorAll('input').forEach(el => el.addEventListener('input', render));
}
buildMaterialsGrid();

/* ====== Live render ====== */
const $ = id => document.getElementById(id);
const num = id => Number($(id).value) || 0;
const fmt = n => Math.round(n||0).toLocaleString('is-IS');

function gatherMaterials(){
  const lines = [];
  for(const el of $mat.querySelectorAll('input')){
    const qty = Number(el.value) || 0;
    if(qty <= 0) continue;
    const price = Number(el.dataset.price) || 0;
    lines.push({
      label: el.dataset.label,
      unit:  el.dataset.unit,
      price: price,
      qty:   qty,
      total: Math.round(price * qty),
    });
  }
  return lines;
}

function fmtPeriod(from, til){
  if(!from || !til) return '';
  const fmtDate = s => {
    const [y,m,d] = s.split('-');
    return `${d}.${m}.${y}`;
  };
  return `${fmtDate(from)} til ${fmtDate(til)}`;
}

function render(){
  const verkstadur = $('f-verkstadur').value.trim();
  const verkkaupi  = $('f-verkkaupi').value.trim();
  const from = $('f-fra').value;
  const til  = $('f-til').value;

  const dvH = num('f-dv-h');
  const dvR = num('f-dv-rate');
  const evH = num('f-ev-h');
  const evR = num('f-ev-rate');
  const km  = num('f-km');
  const fr  = num('f-ferd');
  const stadf = $('f-stadf').checked ? STADF_KR : 0;
  const notes = $('f-notes').value.trim();

  const dvAmt = dvR * dvH;
  const evAmt = evR * evH;
  const kmAmt = km * KM_RATE;
  const frAmt = fr * FERD_RATE;
  const smaAmt = Math.round(SMA_PER_KLST * dvH);
  $('f-sma-hint').textContent = `${SMA_PER_KLST} × ${dvH.toFixed(1)} = ${fmt(smaAmt)} kr`;

  const materials = gatherMaterials();
  const matSum = materials.reduce((a,m) => a + m.total, 0);

  const net = dvAmt + evAmt + kmAmt + frAmt + smaAmt + stadf + matSum;
  const vsk = Math.round(net * VSK_PCT / 100);
  const total = net + vsk;

  /* ====== Build preview rows — matches the Efnislisti PDF layout exactly ====== */
  const kr = n => (n > 0 ? fmt(n) + ' kr.' : 'kr.');
  const krOnly = n => fmt(n) + ' kr.';
  const magnCell = (v, fixed) => (v > 0 ? (fixed != null ? Number(v).toFixed(fixed) : String(v)) : '');
  const zeroRow = magn => magn > 0 ? '' : 'zero-row';

  /* Dagvinna + Eftirvinna (rates always shown, magn empty if 0) */
  const timeRows = `
    <tr class="${zeroRow(dvH)}">
      <td class="label">Dagvinna</td>
      <td class="size"></td><td class="unit"></td>
      <td class="price">${krOnly(dvR)}</td>
      <td class="magn">${magnCell(dvH, 2)}</td>
      <td class="total">${kr(dvAmt)}</td>
    </tr>
    <tr class="${zeroRow(evH)}">
      <td class="label">Yfirvinna</td>
      <td class="size"></td><td class="unit"></td>
      <td class="price">${krOnly(evR)}</td>
      <td class="magn">${magnCell(evH, 2)}</td>
      <td class="total">${kr(evAmt)}</td>
    </tr>
  `;

  /* Akstur — both lines always shown, hidden in print if 0 */
  const akstrSectionEmpty = (km === 0 && fr === 0) ? 'section-empty' : '';
  const akstrRows = `
    <tr class="section-row ${akstrSectionEmpty}"><td colspan="6"><b>Akstur</b></td></tr>
    <tr class="${zeroRow(km)}">
      <td class="label">ekinn km.</td>
      <td class="size"></td><td class="unit"></td>
      <td class="price">${krOnly(KM_RATE)}</td>
      <td class="magn">${magnCell(km, 2)}</td>
      <td class="total">${kr(km * KM_RATE)}</td>
    </tr>
    <tr class="${zeroRow(fr)}">
      <td class="label">ekinn ferð</td>
      <td class="size"></td><td class="unit"></td>
      <td class="price">${krOnly(FERD_RATE)}</td>
      <td class="magn">${magnCell(fr, 0)}</td>
      <td class="total">${kr(fr * FERD_RATE)}</td>
    </tr>
  `;

  /* Efni — show ALL materials in editor; print-CSS hides zero-magn rows */
  const matRowsFull = MATERIALS.flatMap(sec => sec.items).map(it => {
    const used = materials.find(m => m.label === it.label && (m.unit === it.unit || true)) ;
    // find by exact match against the input value via key
    const input = document.querySelector(`[data-mat="${it.key}"]`);
    const qty = input ? (Number(input.value) || 0) : 0;
    const total = qty * it.price;
    // Split label into name + size: "Eldvarnar band 55mm" → name "Eldvarnar band", size "55mm"
    const m = it.label.match(/^(.*?)\s(\d+\s*mm|5kg)$/);
    const name = m ? m[1] : it.label;
    const size = m ? m[2] : '';
    return `
      <tr class="${zeroRow(qty)}">
        <td class="label">${name}</td>
        <td class="size">${size}</td>
        <td class="unit">${it.unit}</td>
        <td class="price">${krOnly(it.price)}</td>
        <td class="magn">${magnCell(qty, qty % 1 === 0 ? 0 : 2)}</td>
        <td class="total">${kr(total)}</td>
      </tr>`;
  }).join('');
  const matSectionEmpty = materials.length === 0 ? 'section-empty' : '';

  /* Smáhlutagjald + Staðfesting (extras) */
  const extraSectionEmpty = (smaAmt === 0 && stadf === 0) ? 'section-empty' : '';
  const extrasRows = `
    <tr class="section-row ${extraSectionEmpty}"><td colspan="6"><b>Aukagjöld</b></td></tr>
    <tr class="${zeroRow(smaAmt)}">
      <td class="label">Smáhlutagjald (hanskar, þurrkur o.fl.)</td>
      <td class="size"></td><td class="unit">stk</td>
      <td class="price">${krOnly(SMA_PER_KLST)}</td>
      <td class="magn">${magnCell(dvH, 2)}</td>
      <td class="total">${kr(smaAmt)}</td>
    </tr>
    <tr class="${zeroRow(stadf)}">
      <td class="label">Staðfesting brunaþéttinga</td>
      <td class="size"></td><td class="unit"></td>
      <td class="price">${krOnly(STADF_KR)}</td>
      <td class="magn">${stadf > 0 ? '1' : ''}</td>
      <td class="total">${kr(stadf)}</td>
    </tr>
  `;

  const periodLabel = fmtPeriod(from, til);

  const $preview = document.getElementById('preview');
  $preview.innerHTML = `
    <div class="doc-top">
      <img src="brunaholf-logo.png" class="doc-logo" alt="" onerror="this.style.display='none'" />
      <div class="doc-title-block">
        <h1>Brunahólf ehf.</h1>
        <p class="doc-subtitle">Verðskrá / tilboð</p>
      </div>
    </div>

    <div class="doc-meta">
      <div class="period">${periodLabel}</div>
      <div class="worksite">${verkstadur || '—'}</div>
    </div>

    <table class="efni">
      <thead>
        <tr>
          <td></td><td></td><td></td>
          <td class="price">án vsk</td>
          <td class="magn">magn</td>
          <td class="total">samtals</td>
        </tr>
      </thead>
      <tbody>
        ${timeRows}
        ${akstrRows}
        <tr class="section-row ${matSectionEmpty}"><td colspan="6"><b>Efni</b></td></tr>
        ${matRowsFull}
        ${extrasRows}
        <tr class="spacer"><td colspan="6"></td></tr>
        <tr class="subtotal-row">
          <td colspan="5">Samtals án vsk</td>
          <td class="total">${krOnly(net)}</td>
        </tr>
        <tr class="vsk-row">
          <td colspan="5">vsk</td>
          <td class="total">${krOnly(vsk)}</td>
        </tr>
        <tr class="grand-row">
          <td colspan="5">samtals með vsk</td>
          <td class="total">${krOnly(total)}</td>
        </tr>
      </tbody>
    </table>

    ${notes ? `<p style="font-size:12px;color:#5b5b5b;margin-top:18px;font-style:italic">${notes.replace(/</g,'&lt;')}</p>` : ''}
  `;
}

document.querySelectorAll('.form-panel input, .form-panel select, .form-panel textarea').forEach(el => {
  el.addEventListener('input', render);
  el.addEventListener('change', render);
});

document.getElementById('btnPrint').addEventListener('click', () => window.print());

document.getElementById('btnCopy').addEventListener('click', () => {
  const text = document.getElementById('preview').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('btnCopy');
    const old = b.textContent;
    b.textContent = '✓ Afritað';
    setTimeout(() => b.textContent = old, 1500);
  });
});

// Read URL params so we can be opened pre-filled from the main hub:
// /reikningur?worksite=Fjar%C3%B0agata&customer=GG%20verk&month=2026-03&dv_hours=322.2&dv_rate=9951&ev_rate=14927
(function applyParams(){
  const p = new URLSearchParams(window.location.search);
  if(p.get('worksite'))   document.getElementById('f-verkstadur').value = p.get('worksite');
  if(p.get('customer'))   document.getElementById('f-verkkaupi').value  = p.get('customer');
  if(p.get('dv_hours'))   document.getElementById('f-dv-h').value       = p.get('dv_hours');
  if(p.get('dv_rate'))    document.getElementById('f-dv-rate').value    = p.get('dv_rate');
  if(p.get('ev_hours'))   document.getElementById('f-ev-h').value       = p.get('ev_hours');
  if(p.get('ev_rate'))    document.getElementById('f-ev-rate').value    = p.get('ev_rate');
  if(p.get('km'))         document.getElementById('f-km').value         = p.get('km');
  if(p.get('ferd'))       document.getElementById('f-ferd').value       = p.get('ferd');
  if(p.get('stadf')==='1') document.getElementById('f-stadf').checked   = true;
  // month=YYYY-MM → set from = 1st, til = last day of month
  const m = p.get('month');
  if(m && /^\d{4}-\d{2}$/.test(m)){
    const [yr, mo] = m.split('-').map(Number);
    const last = new Date(yr, mo, 0).getDate();
    document.getElementById('f-fra').value = `${yr}-${String(mo).padStart(2,'0')}-01`;
    document.getElementById('f-til').value = `${yr}-${String(mo).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
  }
})();
render();

/* Print + saved-PDF styles are defined in the main <style> block above */
</script>
