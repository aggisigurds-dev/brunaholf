<!-- @dsCard group="Elevation" viewport="700x170" name="Eight objects" subtitle="Every element is one of these — pick the object, don't compose a shadow" -->
<!DOCTYPE html>
<html lang="is"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:var(--boss-paper);display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px;font-family:var(--boss-font-body)}
.u{display:flex;flex-direction:column;gap:6px}
.n{font-size:10px;font-weight:700;color:var(--boss-ink)}
.box{height:40px;border-radius:5px}
</style></head><body>
<div class="u"><div class="box boss-panel"></div><span class="n">panel — raised plate</span></div>
<div class="u"><div class="box" style="background:var(--boss-strip-bg);box-shadow:var(--boss-strip-shadow);border:1px solid var(--boss-rule);border-bottom:1px solid transparent;border-image:var(--gold-line) 1;border-image-width:0 0 1px 0"></div><span class="n">strip — brushed cream header</span></div>
<div class="u"><div class="box" style="border:1px solid var(--boss-edge);border-bottom-color:var(--boss-edge-deep);border-radius:4px;background:var(--boss-key-bg);box-shadow:var(--boss-key-shadow)"></div><span class="n">ivory key</span></div>
<div class="u"><div class="box" style="border:1px solid #000;background:var(--boss-obsidian-bg);box-shadow:var(--boss-obsidian-shadow)"></div><span class="n">obsidian key</span></div>
<div class="u"><div class="box" style="border:var(--gold-bevel-border);border-top-color:var(--gold-bevel-top);border-bottom-color:var(--gold-bevel-bottom);background:var(--gold-face);box-shadow:var(--gold-bevel-shadow)"></div><span class="n">gold key</span></div>
<div class="u"><div class="box" style="border:1px solid var(--boss-edge);border-radius:4px;background:var(--boss-well-bg);box-shadow:var(--boss-well-shadow)"></div><span class="n">well — field, tray</span></div>
<div class="u"><div class="box boss-slab"></div><span class="n">slab — dark card</span></div>
<div class="u"><div class="box" style="border:1px solid #000;background:var(--boss-dark-well-bg);box-shadow:var(--boss-dark-well-shadow)"></div><span class="n">dark well — LCD</span></div>
</body></html>
