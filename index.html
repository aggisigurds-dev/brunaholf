      .gr-mat-line .m-warn{grid-column:1 / -1;font-size:10.5px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:5px;padding:3px 6px;margin-top:1px}
      .gr-mat-del{border:none;background:transparent;color:#dc2626;cursor:pointer;font-size:15px}
      .gr-mat-add{display:flex;gap:6px;margin-top:6px}
      .gr-mat-add select{flex:1;padding:6px;font-size:12px;border:1px solid var(--border,#cbd5e1);border-radius:5px}
      .gr-redder-note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:8px 10px;font-size:11.5px;color:#1e40af;margin-bottom:8px}
      .gr-actions{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:#fff;padding-top:10px}
      /* Efnislisti document preview (mirrors /reikningur) */
      .gr-doc{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);max-width:720px;margin:0 auto;padding:44px 50px;font-family:'Times New Roman',Times,serif;color:#000;font-size:13px}
      .gr-doc-top{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center;margin-bottom:24px}
      .gr-doc-logo{max-width:170px;max-height:90px;width:auto;height:auto;object-fit:contain;display:block}
      .gr-doc h1{font-size:24px;margin:0;font-weight:700}
      .gr-doc .gr-doc-sub{font-size:13px;font-style:italic;color:#555;margin:3px 0 0}
      .gr-doc .gr-doc-meta{margin-bottom:14px}
      .gr-doc .gr-doc-ws{font-weight:700}
      table.gr-efni{width:100%;border-collapse:collapse;font-size:12.5px}
      table.gr-efni td{padding:3px 4px;vertical-align:bottom}
      table.gr-efni thead td{font-style:italic;color:#555;text-align:right}
      table.gr-efni thead td:first-child{text-align:left}
      table.gr-efni td.l{text-align:left}
      table.gr-efni td.p,table.gr-efni td.m,table.gr-efni td.t{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
      table.gr-efni td.m{border-bottom:1px solid #000}
      table.gr-efni tr.sec td{font-weight:700;padding-top:12px}
      table.gr-efni tr.sub td{border-top:1px solid #000;padding-top:4px;text-align:right;font-style:italic;color:#555}
      table.gr-efni tr.sub td.t{font-style:normal;color:#000}
      table.gr-efni tr.grand td{border-top:1px solid #000;border-bottom:3px double #000;padding:6px 4px;text-align:right}
      table.gr-efni tr.grand td.t{font-weight:700}
      @media(max-width:860px){.gr-modal{grid-template-columns:1fr}.gr-prev{display:none}}
    </style>
  `;

  const $host = document.getElementById('gr-host');
  const $meta = document.getElementById('gr-meta');

  let WS=[], PG={}, DRAFTS={}, REDDER={};

  document.getElementById('gr-prev').onclick = () => shiftMonth(-1);
  document.getElementById('gr-next').onclick = () => shiftMonth(1);
  document.getElementById('gr-refresh').onclick = () => load(true);
  document.getElementById('gr-logo-file').onchange = (e) => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try { localStorage.setItem(LOGO_KEY, r.result); alert('Logo vistað (í þessum vafra).'); } catch { alert('Of stór mynd fyrir vistun.'); } };
    r.readAsDataURL(f);
  };

  function shiftMonth(d){
    const [y,m] = state.ui.gr_month.split('-').map(Number);
    const nd = new Date(y, m-1+d, 1);
    state.ui.gr_month = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('gr-month-lbl').textContent = monthLabel(state.ui.gr_month);
    if(typeof save==='function') try{ save(); }catch{}
    renderList();
  }

  function rateFor(name){
    const pg = PG[name] || {};
    return {
      dv: Number(pg.dagvinna_rate)||9951,
      ev: Number(pg.eftirvinna_rate)||14927,
      km: Number(pg.akstur_km_rate)||GR_KM,
      ferd: Number(pg.akstur_ferd_rate)||GR_FERD,
      sma: (pg.smahlutagjald_per_h == null ? GR_SMA : Number(pg.smahlutagjald_per_h)), // explicit 0 = ekkert smáhlutagjald (t.d. Fjallaböðin)
      vsk: Number(pg.vsk_pct)||24,
      stadf: pg.stadfesting_default !== false,
      customer: pg.customer_name || '',
    };
  }
  const monthHours = (w) => (w.monthly||{})[state.ui.gr_month] || 0;
  const draftFor = (name) => DRAFTS[`${name}|${state.ui.gr_month}`];

  async function load(force){
    $meta.textContent = 'Sækir…';
    try{
      const [wsR, pgR, drR, rdR] = await Promise.all([
        cachedFetch('/api/worksites?year=combined', {force:!!force}),
        cachedFetch('/api/pricing-guide', {force:!!force}).catch(()=>null),
        cachedFetch('/api/invoice-drafts', {force:true}).catch(()=>null),
        cachedFetch('/api/redder-invoices', {force:!!force}).catch(()=>null),
      ]);
      const ws = wsR ? await wsR.json() : {worksites:[]};
      const pg = pgR && pgR.ok ? await pgR.json() : {rows:[]};
      const dr = drR && drR.ok ? await drR.json() : {rows:[]};
      const rd = rdR && rdR.ok ? await rdR.json() : {rows:[]};
      WS = ws.worksites || [];
      PG = {}; for(const r of (pg.rows||[])) PG[r.worksite_name] = r;
      DRAFTS = {}; for(const d of (dr.rows||[])) DRAFTS[`${d.worksite_name}|${d.work_month}`] = d;
      REDDER = {};
      for(const r of (rd.rows||[])){
        const ws2 = r.worksite_match; if(!ws2) continue;
        const mo = (r.dagsetning||'').slice(0,7);
        const k = `${ws2}|${mo}`;
        (REDDER[k] = REDDER[k] || {an_vsk:0, lines:[]});
        REDDER[k].an_vsk += Number(r.an_vsk)||0;
        for(const li of (r.redder_line_items||[])){
          const qty = Number(li.magn)||0;
          // Real buy-in unit cost = line total / qty (upphaed is AFTER afsláttur);
          // fall back to ein_verd if qty/total missing.
          const cost = qty>0 && li.upphaed!=null ? Math.round(Number(li.upphaed)/qty) : (Number(li.ein_verd)||0);
          REDDER[k].lines.push({ label: li.item_name||'Efni', cost, qty });
        }
      }
      renderList();
    }catch(e){
      $host.innerHTML = `<div class="gr-loading">Villa: ${escapeHtml(e.message||String(e))}</div>`;
      $meta.textContent = 'Villa';
    }
  }

  function renderList(){
    const month = state.ui.gr_month;
    const sites = WS.filter(w => !NON_BILLABLE.test(w.project));
    const tim = sites.filter(w => !isGata(w.project) && (monthHours(w) > 0 || draftFor(w.project)));
    tim.sort((a,b)=> monthHours(b)-monthHours(a));
    const gataNames = ['Landsspitalinn','Heklureitur','Dalvegur 30'];
    const gata = gataNames.map(n => sites.find(w => isGata(w.project) && new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace('Landsspitalinn','landssp[ií]tal'),'i').test(w.project)) || {project:n, monthly:{}, mapped_customers:[], _synthetic:true});

    const card = (w, gataFlag) => {
      const name = w.project;
      const r = rateFor(name);
      const cust = r.customer || (w.mapped_customers||[])[0] || '';
      const hrs = monthHours(w);
      const d = draftFor(name);
      const est = !gataFlag ? Math.round(hrs * r.dv * (1+r.vsk/100)) : 0;
      const redder = (REDDER[`${name}|${month}`]||{}).an_vsk || 0;
      const saved = d && Number(d.total_m_vsk) > 0;
      const dotKey = `${name}|${month}`;
      state.ui.vb_review = state.ui.vb_review || {};
      const dot = state.ui.vb_review[dotKey];   // undefined | 'green' | 'yellow' | 'red'
      const dotTitle = dot==='green' ? 'Staðfest / tilbúið'
                     : dot==='yellow' ? 'Ágiskun — skoða betur'
                     : dot==='red' ? 'Þarfnast skoðunar'
                     : 'Smelltu til að merkja: grænt = tilbúið, gult = skoða, rautt = vantar';
      return `
        <div class="gr-card ${saved?'gr-done':''} ${gataFlag?'gr-gata':''} ${saved?'':'gr-todo'}">
          <div class="gr-card-top">
            <div style="display:flex;align-items:center;gap:8px">
              <button type="button" class="gr-dot ${dot?'state-'+dot:''}" data-gr-dot="${escapeAttr(dotKey)}" title="${dotTitle}"></button>
              <div><div class="gr-card-name">${escapeHtml(name)}</div>${cust?`<div class="gr-card-cust">${escapeHtml(cust)}</div>`:''}</div>
            </div>
            ${saved?`<span class="gr-pill gr-pill-saved">✓ ${fmt(d.total_m_vsk)}</span>`:`<span class="gr-pill gr-pill-todo">⏳ eftir</span>`}
          </div>
          <div class="gr-card-figs">
            ${gataFlag
              ? `<div class="gr-fig"><span class="gr-fig-l">Grunnur</span><b>Ajour</b></div>`
              : `<div class="gr-fig"><span class="gr-fig-l">Tímavera klst</span><b>${hrs.toFixed(1)}</b></div>
                 <div class="gr-fig"><span class="gr-fig-l">Taxti</span><b>${fmt(r.dv)}</b></div>
                 <div class="gr-fig"><span class="gr-fig-l">Áætlað m.vsk</span><b>${est?fmt(est):'—'}</b></div>
                 ${redder>0?`<div class="gr-fig"><span class="gr-fig-l">Redder efni</span><b>${fmt(redder)}</b></div>`:''}`}
          </div>
          <div class="gr-card-actions">
            ${gataFlag
              ? `<button class="gr-btn gr-btn-primary" data-gr-gata="${escapeAttr(name)}">📐 Ajour uppgjör</button>`
              : `<button class="gr-btn gr-btn-primary" data-gr-edit="${escapeAttr(name)}">🧾 Efnislisti</button>`}
          </div>
        </div>`;
    };

    // Month-total summary: sum of all saved drafts (total_m_vsk) for this month.
    let savedCount = 0, savedTotal = 0;
    for(const w of [...tim, ...gata]){
      const dd = draftFor(w.project);
      if(dd && Number(dd.total_m_vsk) > 0){ savedCount++; savedTotal += Number(dd.total_m_vsk); }
    }
    const pending = (tim.length + gata.length) - savedCount;

    $host.innerHTML = `
      <div class="gr-summary">
        <div class="gr-sum-cell"><span class="gr-sum-l">Samtals m. vsk · ${monthLabel(month)}</span><span class="gr-sum-v">${fmt(savedTotal)} kr</span></div>
        <div class="gr-sum-cell"><span class="gr-sum-l">Reikningar vistaðir</span><span class="gr-sum-v">${savedCount}</span></div>
        <div class="gr-sum-cell"><span class="gr-sum-l">Eftir að gera</span><span class="gr-sum-v ${pending>0?'gr-sum-warn':''}">${pending}</span></div>
      </div>
      <div class="gr-section-h">🧾 Tímavera verkstaðir <span class="gr-count">· ${tim.length} með klst í ${monthLabel(month)}</span></div>
      <div class="gr-grid">${tim.length?tim.map(w=>card(w,false)).join(''):'<div class="gr-loading">Engin Tímavera klst skráð í þessum mánuði.</div>'}</div>
      <div class="gr-section-h">📐 Gata verkefni (Ajour) <span class="gr-count">· NLSH · Heklureitur · Dalvegur 30</span></div>
      <div class="gr-grid">${gata.map(w=>card(w,true)).join('')}</div>
    `;
    $meta.textContent = `${monthLabel(month)} · ${fmt(savedTotal)} kr vistað · ${pending} eftir`;
    $host.querySelectorAll('[data-gr-edit]').forEach(b=> b.onclick = ()=> openEditor(b.dataset.grEdit));
    $host.querySelectorAll('[data-gr-gata]').forEach(b=> b.onclick = ()=> openGata(b.dataset.grGata));
    // Status dot: cycle none → green → yellow → red → none. Shares state.ui.vb_review
    // with Vinnubók so a worksite/month marking stays in sync across both views.
    $host.querySelectorAll('[data-gr-dot]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const key = btn.dataset.grDot;
        state.ui.vb_review = state.ui.vb_review || {};
        const cur = state.ui.vb_review[key];
        const next = cur==='green' ? 'yellow' : cur==='yellow' ? 'red' : cur==='red' ? undefined : 'green';
        if(next) state.ui.vb_review[key] = next; else delete state.ui.vb_review[key];
        save();
        btn.className = 'gr-dot' + (next ? ' state-'+next : '');
      };
    });
  }

  // ===== Efnislisti editor (prefilled, editable, savable) =====
  function openEditor(name){
    const month = state.ui.gr_month;
    const r = rateFor(name);
    const { fra, til } = monthRange(month);
    const d = draftFor(name);
    const wObj = WS.find(w=>w.project===name) || {};
    const cust = (d && d.customer_name) || r.customer || (wObj.mapped_customers||[])[0] || '';
    // Prefill: saved draft wins; else compute from Tímavera + pricing-guide; materials from draft or Redder.
    const dvH = d ? Number(d.hours_dagvinna)||0 : (monthHours(wObj)||0);
    const dvR = d && d.rate_dagvinna ? Number(d.rate_dagvinna) : r.dv;
    const evH = d ? Number(d.hours_eftirvinna)||0 : 0;
    const evR = d && d.rate_eftirvinna ? Number(d.rate_eftirvinna) : r.ev;
    const km  = d ? Number(d.akstur_km)||0 : 0;
    const fr  = d ? Number(d.akstur_ferdir)||0 : 0;
    const stadfOn = d ? Number(d.stadfesting)>0 : r.stadf;
    const notes = d ? (d.notes||'') : '';
    let mats = [];
    if(d && Array.isArray(d.materials_jsonb) && d.materials_jsonb.length){
      mats = d.materials_jsonb.map(m=>({label:m.label||'', price:Number(m.price)||0, qty:Number(m.qty)||0, cost:Number(m.cost)||0}));
    } else {
      // First autofill from Redder → only recharge lines that match a Verðskrá
      // item (use that sale price). Unmatched consumables are covered by
      // smáhlutagjald/aukagjald, so they're skipped. Carry buy-in cost for the
      // margin warning.
      const rd = REDDER[`${name}|${month}`];
      if(rd && rd.lines.length){
        mats = rd.lines.map(l=>{
          const m = matchVerdskra(l.label);
          return m ? { label:l.label, price:m.price, qty:l.qty, cost:l.cost } : null;
        }).filter(Boolean);
      }
    }
    const redderTotal = (REDDER[`${name}|${month}`]||{}).an_vsk || 0;

    const bg = document.createElement('div');
    bg.className = 'gr-modal-bg';
    const matSelect = `<select id="gr-mat-pick"><option value="">+ bæta efni úr Verðskrá…</option>${
      GR_MATERIALS.map(s=>`<optgroup label="${escapeAttr(s.section)}">${s.items.map((it,i)=>`<option value="${escapeAttr(it.label)}|${it.price}">${escapeHtml(it.label)} — ${fmt(it.price)} kr</option>`).join('')}</optgroup>`).join('')
    }</select>`;
    bg.innerHTML = `
      <div class="gr-modal">
        <div class="gr-form">
          <div class="gr-mh"><h2>Efnislisti</h2><button class="gr-x" id="gr-close" type="button">×</button></div>
          <div class="gr-st">Verkstaður</div>
          <div class="gr-f"><label>Verkstaður</label><input id="gr-ws" value="${escapeAttr(name)}"></div>
          <div class="gr-f"><label>Verkkaupi</label><input id="gr-cust" value="${escapeAttr(cust)}"></div>
          <div class="gr-r2"><div class="gr-f"><label>Frá</label><input type="date" id="gr-fra" value="${fra}"></div><div class="gr-f"><label>Til</label><input type="date" id="gr-til" value="${til}"></div></div>
          <div class="gr-st">Tími <button type="button" id="gr-fill-hours" class="gr-btn" style="float:right;padding:3px 9px;font-size:11px" title="Fylla dagvinnu/yfirvinnu úr tímabók (yfirvinna eftir 8 klst/dag — 8,5 hjá Fjarðagötu; helgar (lau/sun) allar yfirvinna)">📥 Fylla úr tímabók</button></div>
          <div class="gr-r3"><div class="gr-f"><label>Dagvinna</label><div style="font-size:11px;color:#94a3b8;padding:6px 0">kr/klst · klst</div></div>
            <div class="gr-f"><input type="number" id="gr-dvr" value="${dvR}" step="50"></div><div class="gr-f"><input type="number" id="gr-dvh" value="${dvH}" step="0.5"></div></div>
          <div class="gr-r3"><div class="gr-f"><label>Eftirvinna</label></div>
            <div class="gr-f"><input type="number" id="gr-evr" value="${evR}" step="50"></div><div class="gr-f"><input type="number" id="gr-evh" value="${evH}" step="0.5"></div></div>
          <div class="gr-st">Akstur</div>
          <div class="gr-r2"><div class="gr-f"><label>km × ${r.km}</label><input type="number" id="gr-km" value="${km}" step="10"></div><div class="gr-f"><label>ferðir × ${fmt(r.ferd)}</label><input type="number" id="gr-ferd" value="${fr}" step="1"></div></div>
          <div class="gr-st">Efni (Redder / handvirkt)</div>
          ${redderTotal>0?`<div class="gr-redder-note">Redder innkaupsverð þennan mánuð: <b>${fmt(redderTotal)} kr án vsk</b>. Forútfyllt á <b>söluverði Verðskrár</b> — aðeins efni sem á sér Verðskrárverð er rukkað; smávara (túss, klútar o.fl.) fellur undir smáhlutagjald. Leiðréttu eftir þörfum.</div>`:''}
          <div id="gr-mats"></div>
          <div class="gr-mat-add">${matSelect}</div>
          <div class="gr-st">Aukagjöld</div>
          <div class="gr-f"><label><input type="checkbox" id="gr-stadf" ${stadfOn?'checked':''}> Staðfesting brunaþéttinga (${fmt(GR_STADF)} kr)</label></div>
          <div class="gr-f"><label>Smáhlutagjald = hanskar, þurrkur o.fl.: ${r.sma} kr × (dagvinna + yfirvinna) klst (sjálfvirkt)</label><div style="font-size:11px;color:#64748b" id="gr-sma-hint">—</div></div>
          <div class="gr-st">Athugasemd</div>
          <div class="gr-f"><textarea id="gr-notes" rows="2" placeholder="Birtist neðst á reikningi">${escapeHtml(notes)}</textarea></div>
          <div class="gr-actions">
            <button class="gr-btn gr-btn-primary" id="gr-save" type="button">💾 Vista</button>
            <button class="gr-btn" id="gr-print" type="button">🖨 Prenta / PDF</button>
            <button class="gr-btn" id="gr-timabok" type="button" title="Prenta tímabók (mæting starfsmanna) til að senda með reikningi">🕒 Tímabók</button>
            <button class="gr-btn" id="gr-close2" type="button">Loka</button>
            <span id="gr-save-st" style="font-size:12px;color:#64748b;align-self:center"></span>
          </div>
        </div>
        <div class="gr-prev"><div class="gr-doc" id="gr-doc"></div></div>
      </div>`;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
    document.getElementById('gr-close').onclick = close;
    document.getElementById('gr-close2').onclick = close;

    // ----- materials editable list -----
    const $mats = document.getElementById('gr-mats');
    function matRow(m){
      const div = document.createElement('div');
      div.className = 'gr-mat-line';
      div.dataset.cost = Number(m.cost)||0;  // Redder buy-in unit cost (0 = manual/unknown)
      div.innerHTML = `<input class="m-label" placeholder="Lýsing" value="${escapeAttr(m.label||'')}">
        <input class="m-price" type="number" placeholder="verð" value="${m.price||''}" step="1">
        <input class="m-qty" type="number" placeholder="magn" value="${m.qty||''}" step="1">
        <button class="gr-mat-del" type="button" title="Eyða">×</button>
        <div class="m-warn" hidden></div>`;
      div.querySelector('.gr-mat-del').onclick = () => { div.remove(); draw(); };
      div.querySelectorAll('input').forEach(i=> i.addEventListener('input', () => { updateWarn(div); draw(); }));
      updateWarn(div);
      return div;
    }
    // Warn when the price we charge is below what we paid Redder (margin loss).
    function updateWarn(div){
      const cost = Number(div.dataset.cost)||0;
      const price = Number(div.querySelector('.m-price').value)||0;
      const $w = div.querySelector('.m-warn');
      if(cost>0 && price>0 && price < cost){
        $w.hidden = false;
        $w.textContent = `⚠ Söluverð (${fmt(price)}) er lægra en innkaup hjá Redder (${fmt(cost)} kr/stk)`;
      } else { $w.hidden = true; $w.textContent=''; }
    }
    function addMat(m){ $mats.appendChild(matRow(m||{label:'',price:0,qty:0,cost:0})); }
    mats.forEach(addMat);
    document.getElementById('gr-mat-pick').onchange = (e)=>{
      const v = e.target.value; if(!v) return;
      const [label, price] = v.split('|');
      addMat({label, price:Number(price)||0, qty:1, cost:0}); e.target.value=''; draw();
    };

    function gatherMats(){
      const out = [];
      $mats.querySelectorAll('.gr-mat-line').forEach(row=>{
        const label = row.querySelector('.m-label').value.trim();
        const price = Number(row.querySelector('.m-price').value)||0;
        const qty = Number(row.querySelector('.m-qty').value)||0;
        const cost = Number(row.dataset.cost)||0;
        if(!label && !qty) return;
        out.push({ label, price, qty, cost, total: Math.round(price*qty) });
      });
      return out;
    }
    const numv = id => Number(document.getElementById(id).value)||0;

    function compute(){
      const dvH=numv('gr-dvh'),dvR=numv('gr-dvr'),evH=numv('gr-evh'),evR=numv('gr-evr');
      const km=numv('gr-km'),fr=numv('gr-ferd');
      const stadf = document.getElementById('gr-stadf').checked ? GR_STADF : 0;
      const smaH = dvH + evH;                 // smáhlutagjald á dagvinnu OG yfirvinnu
      const sma = Math.round(r.sma * smaH);
      const matLines = gatherMats();
      const matSum = matLines.reduce((a,m)=>a+m.total,0);
      const dvAmt=dvR*dvH, evAmt=evR*evH, kmAmt=km*r.km, frAmt=fr*r.ferd;
      const net = dvAmt+evAmt+kmAmt+frAmt+sma+stadf+matSum;
      const vsk = Math.round(net*r.vsk/100);
      const total = net+vsk;
      return {dvH,dvR,evH,evR,km,fr,stadf,sma,matLines,matSum,dvAmt,evAmt,kmAmt,frAmt,net,vsk,total};
    }

  // ===== Gata (Ajour) uppgjör =====
  async function openGata(name){
    const month = state.ui.gr_month;
    const isNLSH = /landssp[ií]tal|nlsh/i.test(name);
    const bg = document.createElement('div');
    bg.className = 'gr-modal-bg';
    bg.innerHTML = `<div class="gr-modal" style="grid-template-columns:1fr">
      <div class="gr-form" style="border:none;max-width:680px">

        <div id="gg-body"><div class="gr-loading">Sæki…</div></div>
      </div></div>`;
    document.body.appendChild(bg);
    const close=()=>bg.remove();
    bg.addEventListener('click',e=>{if(e.target===bg)close();});
    document.getElementById('gg-x').onclick=close;
    const $b = document.getElementById('gg-body');

    if(isNLSH){
      const d = draftFor(name);
      try{

        if(!resp.ok) throw new Error(data.error||('HTTP '+resp.status));
        const lines = data.lines||[];
        const totals = data.totals||{};
        const unmapped = data.unmapped||[];
        const estTotal = Number(totals.total_m_vsk)||0;
        // Prefer a previously-saved total; else the Ajour estimate.
        const startTotal = d && Number(d.total_m_vsk) ? Number(d.total_m_vsk) : estTotal;
        $b.innerHTML = `
          <div class="gr-redder-note">Áætlun úr Ajour: stakir SerialNumber / 2 × samningstaxti (kláraðir í ${monthLabel(month)}). <b>Yfirfarðu</b> og leiðréttu heildina áður en þú vistar — þetta er áætlun, ekki lokatala.</div>
          <table class="gr-efni" style="margin-bottom:12px">
            <thead><tr><td>Verk</td><td class="l">Verkliður</td><td class="m">stakar</td><td class="m">heilar</td><td class="p">verð/heild</td><td class="t">m.vsk</td></tr></thead>
            <tbody>${lines.map(l=>`<tr><td>${escapeHtml(l.verk_nr)}</td><td class="l">${escapeHtml(l.label)}</td><td class="m">${l.stakar}</td><td class="m">${l.heilar}</td><td class="p">${fmt(l.rate_m_vsk)}</td><td class="t">${fmt(l.amount_m_vsk)}</td></tr>`).join('')||'<tr><td colspan="6">Engin Ajour gögn fyrir þennan mánuð.</td></tr>'}</tbody>
          </table>
          ${unmapped.length?`<div class="gr-redder-note" style="background:#fff7ed;border-color:#fdba74;color:#9a3412">⚠ Óþekktir flokkar (ekki taldir með): ${unmapped.map(u=>escapeHtml(u.category_group)+' ('+u.stakar+')').join(', ')}</div>`:''}
          <div style="font-weight:700;margin:8px 0">Áætlað samtals m.vsk: ${fmt(estTotal)} kr</div>
          <div class="gr-f"><label>Samtals m. vsk (leiðréttanlegt)</label><input type="number" id="gg-amt" value="${startTotal||''}" step="1"></div>
          <div class="gr-actions"><button class="gr-btn gr-btn-primary" id="gg-save" type="button">💾 Vista</button><button class="gr-btn" id="gg-close" type="button">Loka</button><span id="gg-st" style="font-size:12px;color:#64748b;align-self:center"></span></div>`;
      }catch(e){
        // Fall back to plain manual entry if the estimate endpoint fails.
        $b.innerHTML = `
          <div class="gr-redder-note">Gat ekki sótt Ajour-áætlun (${escapeHtml(e.message||String(e))}). Sláðu inn heildina handvirkt.</div>
          <div class="gr-f"><label>Samtals m. vsk</label><input type="number" id="gg-amt" value="${d?Number(d.total_m_vsk)||'':''}" step="1"></div>
          <div class="gr-actions"><button class="gr-btn gr-btn-primary" id="gg-save" type="button">💾 Vista</button><button class="gr-btn" id="gg-close" type="button">Loka</button><span id="gg-st" style="font-size:12px;color:#64748b;align-self:center"></span></div>`;

      document.getElementById('gg-save').onclick = () => saveGataTotal(name, Number(document.getElementById('gg-amt').value)||0, document.getElementById('gg-st'), close);

    // Dalvegur 30 / Heklureitur → /api/gata-uppgjor (detailed Verðskrá form)
    try{
      const resp = await fetch(`/api/gata-uppgjor?worksite=${encodeURIComponent(name)}&month=${encodeURIComponent(month)}`);

      const kragi = (data.band_rates&&data.band_rates.kragi)||[];
      const bordi = (data.band_rates&&data.band_rates.bordi)||[];
      const VSK = 1.24;

      // Restore previously-saved band quantities from the draft (materials_jsonb).
      const savedBands = {};
      if(d && Array.isArray(d.materials_jsonb)){
        for(const m of d.materials_jsonb){ if(m && m.band_cat && m.size_mm!=null) savedBands[`${m.band_cat}|${m.size_mm}`] = Number(m.qty)||0; }
      }
      const qOf = (cat,mm) => savedBands[`${cat}|${mm}`]||'';

      const bandRowsHtml = (cat, arr) => arr.map(r=>`
        <tr>
          <td class="l">${escapeHtml(r.size_label)}</td>
          <td class="p">${fmt(r.rate_an_vsk)} kr</td>
          <td class="m"><input type="number" class="gg-qty" data-cat="${cat}" data-mm="${r.size_mm}" data-rate="${r.rate_an_vsk}" value="${qOf(cat,r.size_mm)}" min="0" step="1" style="width:62px;padding:4px 6px;text-align:right"></td>
          <td class="t" data-line="${cat}|${r.size_mm}">—</td>
        </tr>`).join('');

      $b.innerHTML = `
        <div class="gr-st" style="margin-top:0">Brunalokanir (göt) — úr Ajour</div>

          <thead><tr><td>Stærð</td><td class="m">stakar</td><td class="p">verð/stk án vsk</td><td class="t">samtals m.vsk</td></tr></thead>

          <tfoot><tr class="sub"><td colspan="3">Göt samtals m.vsk</td><td class="t">${fmt(totals.holes_m_vsk)} kr</td></tr></tfoot>
        </table>

        <div class="gr-st">Eldvarnarkragi — magn handvirkt</div>
        <table class="gr-efni" style="margin-bottom:14px">
          <thead><tr><td>Stærð</td><td class="p">verð/stk án vsk</td><td class="m">magn</td><td class="t">samtals m.vsk</td></tr></thead>
          <tbody>${bandRowsHtml('kragi', kragi)}</tbody>
        </table>

        <div class="gr-st">Eldvarnar borði / band / háþenslukítti — magn handvirkt</div>
        <table class="gr-efni" style="margin-bottom:14px">
          <thead><tr><td>Stærð</td><td class="p">verð/stk án vsk</td><td class="m">magn</td><td class="t">samtals m.vsk</td></tr></thead>
          <tbody>${bandRowsHtml('bordi', bordi)}</tbody>
        </table>

        <div style="font-weight:700;margin:10px 0;line-height:1.7">
          Göt m.vsk: ${fmt(totals.holes_m_vsk)} kr<br>
          Bönd/Kragar m.vsk: <span id="gg-bands-total">0 kr</span><br>
          Samtals m.vsk: <span id="gg-total">${fmt(totals.holes_m_vsk)}</span> kr
        </div>
        <div class="gr-actions">
          <button class="gr-btn gr-btn-primary" id="gg-save" type="button">💾 Vista</button>
          <button class="gr-btn" id="gg-print" type="button">🖨 Prenta / PDF</button>
          <button class="gr-btn" id="gg-close" type="button">Loka</button>
          <span id="gg-st" style="font-size:12px;color:#64748b;align-self:center"></span>
        </div>`;

      // Recompute per-line + band totals; returns {bands_m_vsk, total_m_vsk, lines}.
      const recalc = () => {
        let bands_an_vsk = 0;
        const lines = [];
        $b.querySelectorAll('.gg-qty').forEach(inp=>{
          const qty = Number(inp.value)||0;
          const rate = Number(inp.dataset.rate)||0;
          const cat = inp.dataset.cat, mm = Number(inp.dataset.mm);
          const an = qty*rate;
          const cell = $b.querySelector(`[data-line="${cat}|${mm}"]`);
          if(cell) cell.textContent = qty>0 ? fmt(Math.round(an*VSK))+' kr' : '—';
          if(qty>0){ bands_an_vsk += an; lines.push({ band_cat:cat, size_mm:mm, qty, rate_an_vsk:rate,
            label:(cat==='kragi'?'Eldvarnarkragi ':'Eldvarnar borði ')+inp.closest('tr').querySelector('.l').textContent }); }
        });
        const bands_m_vsk = Math.round(bands_an_vsk*VSK);
        const total_m_vsk = (Number(totals.holes_m_vsk)||0) + bands_m_vsk;
        const $bt=document.getElementById('gg-bands-total'); if($bt) $bt.textContent = fmt(bands_m_vsk)+' kr';
        const $t=document.getElementById('gg-total'); if($t) $t.textContent = fmt(total_m_vsk);
        return { bands_m_vsk, total_m_vsk, lines };
      };
      $b.querySelectorAll('.gg-qty').forEach(i=> i.addEventListener('input', recalc));
      recalc();

      document.getElementById('gg-close').onclick=close;
      document.getElementById('gg-save').onclick = () => {
        const c = recalc();
        saveGataTotal(name, c.total_m_vsk, document.getElementById('gg-st'), close, c.lines);
      };
      document.getElementById('gg-print').onclick = () => {
        const c = recalc();
        printGataDoc(name, month, holes, totals, c, kragi, bordi);
      };
    }catch(e){
      $b.innerHTML = `<div class="gr-loading">Villa: ${escapeHtml(e.message||String(e))}</div>`;
    }
  }

      ${calc.bands_m_vsk>0?`<table><tbody><tr class="sub"><td colspan="3">Bönd/Kragar samtals m.vsk</td><td class="t">${fmt(calc.bands_m_vsk)} kr</td></tr></tbody></table>`:''}

  async function saveGataTotal(name, total, $st, close, bandLines){
    const month = state.ui.gr_month;
    const existing = draftFor(name);
    if($st) $st.textContent = 'Vistar…';
    try{
      const body = { worksite_name:name, work_month:month, source: existing?.source||'ajour',
        total_m_vsk: total, status: existing?.status||'draft', updated_by:'gerd-reikninga' };
      // Persist per-size Bönd/Kragar quantities so they reload next time.
      if(Array.isArray(bandLines)) body.materials_jsonb = bandLines;
      const rr = await fetch('/api/invoice-drafts', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
      });
      if(!rr.ok) throw new Error('HTTP '+rr.status);
      DRAFTS[`${name}|${month}`] = await rr.json();
      if($st) $st.textContent = '✓ Vistað';
      renderList();
      if(close) setTimeout(close, 600);
    }catch(e){ if($st) $st.textContent = '✗ '+(e.message||e); }
  }

  load();
}
