<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light"/>
<!-- Chrome Android Force Dark endurlitar síður sjálfkrafa og gerði sumar
     hub-síður ólæsilegar í síma Agnars. `only light` er opt-out Blink.
     ATH: body er EKKI málað hvítt — hannaðir dökkir fletir haldast.
     Sama lagfæring og reyndist í slokkvitaeki (verk 58ddf148). -->
<style>html{color-scheme:light}html,body{color-scheme:only light}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fjármála-yfirlit</title>
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/fjarmalyfirlit.css">
</head>
<body>
  <div class="fy-titlebar">
    <h1><svg class="fy-goldbar" width="30" height="21" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="fyBarTop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff6d2"/><stop offset="45%" stop-color="#f3d582"/><stop offset="100%" stop-color="#d3a63f"/>
        </linearGradient>
        <linearGradient id="fyBarFront" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f6dd8f"/><stop offset="22%" stop-color="#e0ad3f"/><stop offset="46%" stop-color="#96631a"/>
          <stop offset="60%" stop-color="#c99a3f"/><stop offset="80%" stop-color="#f3dd97"/><stop offset="100%" stop-color="#8a5c17"/>
        </linearGradient>
      </defs>
      <polygon points="15,20 65,8 90,22 40,34" fill="url(#fyBarTop)" stroke="#6e4a11" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="40,34 90,22 83,52 33,64" fill="url(#fyBarFront)" stroke="#5c3d0a" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="47" y1="40" x2="76" y2="30" stroke="#fff6d2" stroke-width="2.4" opacity="0.5" stroke-linecap="round"/>
    </svg> Fjármála-yfirlit</h1>
    <p class="sub">Peningapípan þvert á Slökkvitæki + Brunahólf · staðan núna · <a class="refresh" href="#" id="refresh">↻ uppfæra</a></p>
  </div>
  <div class="syncbar">
    <span data-sync-workflow="timavera" data-sync-label="Tímavera"></span>
    <span data-sync-workflow="ajour" data-sync-label="Ajour"></span>
    <span data-sync-workflow="redder" data-sync-label="Redder"></span>
    <span data-sync-workflow="payday" data-sync-label="Payday"></span>
  </div>
  <div id="app"><div class="loading">Sæki tölur…</div></div>

<script>
  var API = '/api/fjarmal-yfirlit';
  var MONTHS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
  function kr(n){ return (Math.round(n||0)).toLocaleString('is-IS').replace(/,/g,'.') + ' kr'; }
  function mlabel(m){ var p=String(m||'').split('-'); return MONTHS[(+p[1])-1]+' '+p[0]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var _cid = 0;
  function detailRows(list){
    return (list||[]).map(function(it){
      var sub = it.sub ? ' · '+esc(it.sub) : '';
      return '<div class="mrow"><span class="mm">'+esc(it.label)+sub+'</span><span class="mk">'+kr(it.kr)+'</span></div>';
    }).join('') || '<div class="mrow"><span class="mm">engar færslur</span></div>';
  }
  // card(cls,l,v,n,list,extra) — list => click-to-expand; extra => HTML (t.d. vinnu-tengill) inni í kortinu.
  function card(cls,l,v,n,list,extra){
    var hasList = list && list.length;
    var id = 'd'+(++_cid);
    var chev = hasList ? '<span class="chev">▸</span>' : '';
    var head = '<div class="l">'+l+chev+'</div><div class="v">'+kr(v)+'</div>'+(n!=null?'<div class="n">'+n+'</div>':'');
    var inner = hasList
      ? '<button type="button" class="cardbtn" aria-expanded="false" aria-controls="'+id+'" onclick="toggleCard(this)">'+head+'</button>'
      : head;
    var det = hasList ? '<div class="detail" id="'+id+'" hidden>'+detailRows(list)+'</div>' : '';
    return '<div class="card '+(cls||'')+(hasList?' expandable':'')+'">'+inner+(extra||'')+det+'</div>';
  }
  function toggleCard(btn){
    var open = btn.getAttribute('aria-expanded')==='true';
    btn.setAttribute('aria-expanded', open?'false':'true');
    var det = document.getElementById(btn.getAttribute('aria-controls'));
    if(det) det.hidden = open;
    var chev = btn.querySelector('.chev'); if(chev) chev.textContent = open?'▸':'▾';
  }
  var LINK_SLOKK = '<a class="worklink" href="https://slokkvitaeki.netlify.app/reikningar-bid.html" target="_blank" rel="noopener" onclick="event.stopPropagation()">✏️ Vinna kröfur →</a>';
  var LINK_BRU = '<a class="worklink" href="https://brunaholf.netlify.app/#gerdreikninga" target="_blank" rel="noopener" onclick="event.stopPropagation()">✏️ Vinna drög →</a>';
  var LINK_TIMI = '<a class="worklink" href="https://brunaholf.netlify.app/#gerdreikninga" target="_blank" rel="noopener" onclick="event.stopPropagation()">✏️ Laga tíma →</a>';
  var LINK_VERKST = '<a class="worklink" href="https://slokkvitaeki.netlify.app/#thjonustu-verkstaedi" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔧 Opna Þjónustuverkstæði →</a>';
  var LINK_VERKROD = '<a class="worklink" href="https://slokkvitaeki.netlify.app/#verkstaedi" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔧 Opna Verkröðina →</a>';
  var LINK_AFGR = '<a class="worklink" href="https://slokkvitaeki.netlify.app/#afgreidsla" target="_blank" rel="noopener" onclick="event.stopPropagation()">🛎️ Opna Afgreiðsluna →</a>';

  function render(d, nlsh){
    // Áunnið NLSH (Landsspítalinn) úr Ajour-samningi (/api/nlsh-dashboard byMonth).
    // AÐEINS þessi mánuður fer í pípuna — eldri NLSH-mánuðir eru þegar rukkaðir í
    // Payday (invoices) svo þeir mega ekki tvítaljast.
    var nlshBy = (nlsh && nlsh.byMonth) || [];
    var nlshCur = null; for(var _i=0;_i<nlshBy.length;_i++){ if(nlshBy[_i].month===d.month){ nlshCur=nlshBy[_i]; break; } }
    var nlshMonthKr = nlshCur ? (+nlshCur.revenue_m_vsk||0) : 0;
    var nlshCumKr = nlshBy.length ? (+nlshBy[nlshBy.length-1].cum_revenue_m_vsk||0) : 0;
    var nlshList = nlshBy.slice().reverse().map(function(m){ return { label: mlabel(m.month), sub: (m.holes||0)+' göt', kr: +m.revenue_m_vsk||0 }; });
    var grandDisp = (+d.grand_total||0) + nlshMonthKr;
    var A=d.slokk, warnHtml = (d.warnings&&d.warnings.length)? '<div class="warn">⚠ '+d.warnings.map(function(w){return w.replace(/</g,'&lt;');}).join('<br>')+'</div>' : '';
    document.getElementById('app').innerHTML =
      warnHtml +
      '<div class="grand"><div class="lbl">Heildar-pípa (allt óinnheimt/óuppgert)</div><div class="val">'+kr(grandDisp)+'</div></div>' +

      '<section><div class="sh"><h2>🧯 Slökkvitæki — kröfur</h2><span class="st">'+kr(A.heildar.kr)+'</span></div>' +
        '<div class="grid">' +
          card('card--amber', 'Ógreiddar í Payday', A.ogreitt_payday.kr, A.ogreitt_payday.n+' kröfur', A.ogreitt_payday.list) +
          card('card--blue', 'Ósendar kröfur', A.osendar.kr, A.osendar.n+' kröfur', A.osendar.list, LINK_SLOKK) +
          card('card--sub full', 'Heildarkröfur (millisamtala)', A.heildar.kr, A.heildar.n+' sölur', A.heildar.list) +
          // Vinnan sem er ekki orðin að kröfum enn (ósk Agnars 8.8.) — til sýnis,
          // EKKI inni í heildar-pípunni (skarast við ósendar/Payday þegar rukkað er):
          (d.skyrslur_i_vinnslu
            ? card('card--blue', 'Skýrslur í vinnslu (áætlað virði)', d.skyrslur_i_vinnslu.kr,
                d.skyrslur_i_vinnslu.n+' verk á borðinu', d.skyrslur_i_vinnslu.list, LINK_VERKST)
            : '') +
          (d.slokk_verkstaedi
            ? card('', 'Á verkstæði (Verkröð)', d.slokk_verkstaedi.kr,
                d.slokk_verkstaedi.n+' verk · '+d.slokk_verkstaedi.n2+' tæki', d.slokk_verkstaedi.list, LINK_VERKROD)
            : '') +
          (d.slokk_afgreidsla_osott
            ? card('card--green', 'Tilbúið ósótt í Afgreiðslu', d.slokk_afgreidsla_osott.kr,
                d.slokk_afgreidsla_osott.n+' verk · '+d.slokk_afgreidsla_osott.n2+' tæki', d.slokk_afgreidsla_osott.list, LINK_AFGR)
            : '') +
        '</div></section>' +

      '<section><div class="sh"><h2>🏦 Brunahólf — raun-ógreitt í Payday</h2><span class="st">'+kr(d.bru_payday_ogreitt.kr)+'</span></div>' +
        '<div class="grid">' + card('card--green full', 'Útistandandi krófur (óborgaðar)', d.bru_payday_ogreitt.kr, d.bru_payday_ogreitt.n+' krófur', d.bru_payday_ogreitt.list) + '</div></section>' +

      '<section><div class="sh"><h2>🕒 Áunnið Tímavera — '+mlabel(d.month)+'</h2><span class="st">'+kr(d.timavera_manudur.kr)+'</span></div>' +
        '<div class="grid">' + card('card--hero full', 'Þessi mánuður (klst × dagvinnutaxti m/vsk)', d.timavera_manudur.kr, d.timavera_manudur.klst+' klst · taxti '+kr(d.taxti_mvsk)+'/klst', d.timavera_manudur.list, LINK_TIMI) + '</div></section>' +

      (nlshBy.length ?
       '<section><div class="sh"><h2>🏥 Áunnið NLSH (Landsspítalinn)</h2><span class="st">'+kr(nlshMonthKr)+'</span></div>' +
        '<div class="grid">' + card('card--hero full', 'Þessi mánuður (Ajour · samningstaxti m/vsk)', nlshMonthKr, 'uppsafnað í ár '+kr(nlshCumKr)+' · smelltu fyrir mánuði', nlshList) + '</div></section>'
       : '') +

      '<section><div class="sh"><h2>🟡 Ósent</h2><span class="st">'+kr(d.bru_osendar.kr)+'</span></div>' +
        '<div class="grid">' +
          card('card--amber full', 'Ósent — sama tala og „Ósent" spjaldið á Kröfu yfirliti (CG-02)', d.bru_osendar.kr, d.bru_osendar.n+' drög · bíður sendingar', d.bru_osendar.list, LINK_BRU) +
        '</div>' +
      '</section>' +
      '<div class="note">Uppfært '+new Date(d.generated_at).toLocaleString('is-IS')+'. Taxti '+kr(d.taxti_mvsk)+'/klst m/vsk (9.951 × 1,24). Rukkanlegir Tímavera-verkstaðir (án Slökkvitæki-innri / NLSH).</div>';
  }

  function load(){
    document.getElementById('app').innerHTML = '<div class="loading">Sæki tölur…</div>';
    Promise.all([
      fetch(API).then(function(r){ return r.json(); }),
      fetch('/api/nlsh-dashboard').then(function(r){ return r.json(); }).catch(function(){ return null; })
    ]).then(function(res){
      var d=res[0], nlsh=res[1];
      if(d.error){ document.getElementById('app').innerHTML='<div class="warn">Villa: '+d.error+'</div>'; return; }
      render(d, nlsh);
    }).catch(function(e){ document.getElementById('app').innerHTML='<div class="warn">Netvilla: '+e.message+'</div>'; });
  }
  document.getElementById('refresh').onclick=function(e){ e.preventDefault(); load(); };
  load();
</script>
<script src="/js/hub-sync-buttons.js" defer></script>
</body>
</html>
