     mætingar-athugasemdir (veikur / seint / fjarverandi) og beiðnir til skrifstofu; sjá
     Redder-innkaup mánaðarins og það sem Agnar deilir (TurboPaint-borð o.fl.).

     sama grunn; skjámyndin endurnýjast á mínútu fresti og þegar appið kemur í forgrunn.
     Efnið fer beint í Efnislistann í hubnum (kafli 03 „Frá verkstað"); allt annað í
     hub-flipann „Frá verkstað". Boss-þema (css/theme.css).
     02.11.2026 (Agnar: „english version … especially the efnislista efni verkstjóra site"): tungumálalag
     IS/EN. `?lang=en` (Firestarters EN-appið sendir það) eða EN/IS-takkinn í hausnum (vistað í bt_lang á
     símanum, eins og nafnið). Þýðingin er AÐEINS birting: allt sem vistast (flokkar, efnisheiti, nótur)
     fer áfram á íslensku svo skrifstofan og Efnislistinn lesi það óbreytt. -->

  const dmy = iso => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso || ''); };

  async function api(path, opts) {

  // ── Verkstaðir ────────────────────────────────────────────────────────────

  function renderVerk() {

    const wsList = (b.worksites || []).slice();
    for (const p of pendingRows('verk')) if (!wsList.some(w => w.name === p.worksite_name)) wsList.unshift({ name: p.worksite_name, hours: 0, days: 0, employees: [], tags: ['nytt'], note: p.note || '' });
    // 02.11.2026 (Agnar: „call this í Tímaveru í þessum mánuði ekki viku"): Tímaveru-merkið sýnir hvort verkið hafi tíma í
    // MÁNUÐINUM sem er opinn (w.hours kemur úr Tímaveru þess mánaðar) — „vika"-merkið (síðustu 7 dagar) raðar áfram á þjóninum
    // en birtist ekki, því það var villandi þegar skoðaður var liðinn mánuður.

        + '<div class="cnt"><span><b>' + hf(w.hours) + '</b> ' + T.h + ' · ' + w.days + ' ' + T.days(w.days) + '</span>' + (rd ? '<span>Redder <b>' + fmt(rd.an_vsk) + '</b> kr</span>' : '') + (nE ? '<span>🧰 <b>' + nE + '</b> ' + T.efni_n(nE) + '</span>' : '') + (nK ? '<span>💳 <b>' + nK + '</b> ' + T.serkaup_n(nK) + '</span>' : '') + (nP ?'<span>📝 <b>' + nP + '</b> ' + T.punktar_n(nP) + '</span>' : '') + '</div></div><span class="arrow">›</span></div>';
    }).join('');
    $('#bt-main').innerHTML = '<div class="monthbar"><button type="button" class="key sm" id="m-prev">‹</button><b>' + esc(monthLabel(state.month)) + '</b><button type="button" class="key sm" id="m-next">›</button></div>'
      + '<div class="panel"><div class="panel-h" style="cursor:default"><span class="plate">01</span><span class="panel-t">' + T.jobs_h + '</span><span class="sum">' + T.jobs_n(wsList.length) + '</span></div>'
      + (list || '<div class="empty">' + T.jobs_empty + '</div>') + '</div>'

    $('#verk-add').onclick = openVerkSheet;

  function entryHtml(e, opts) {
    const o = opts || {};
    const seen = e.status && e.status !== 'new' ? '<span class="chip green">' + T.seen + '</span>' : '';

    let main = '';
    if (e.kind === 'efni') main = '<b>' + esc(efniLabel(e.item_label)) + '</b> <span class="num">× ' + hf(e.qty) + '</span> <span style="color:var(--muted)">' + esc(unit(e.unit || '')) + '</span>' + (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '');
    else if (e.kind === 'kostnadur') main = '<b>' + esc(e.item_label) + '</b>' + (e.category ? ' <span class="chip">' + esc(cat(e.category)) + '</span>' : '') + ' <span class="num">' + fmt((Number(e.qty) || 1) * (Number(e.unit_price) || 0)) + ' kr</span> <span style="color:var(--muted)">' + T.ex_vat + '</span>' + (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '');
    else if (e.kind === 'maeting') main ='<b>' + esc(e.employee || '') + '</b> <span class="chip ' + (/veik/i.test(e.category || '') ? 'red' : 'warn') + '">' + esc(cat(e.category) || T.comment) + '</span>' + (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '');
    else if (e.kind === 'beidni') main = '<span class="chip blue">' + esc(cat(e.category) || T.request) + '</span>' + (e.worksite_name ? ' <span class="chip">' + esc(e.worksite_name) + '</span>' : '') + '<div class="note">' + esc(e.note || '') + '</div>';
    else main = '<div class="note">' + esc(e.note || '') + '</div>';
    return '<div class="entry' + (e.pending ? ' pending' : '') + '" data-id="' + esc(e.id) + '"><div class="t">' + main + '<div class="meta"><span>' + esc(dmy(e.entry_date)) + (e.updated_at || e.created_at ? ' ' + hhmm(e.updated_at || e.created_at) : '') + '</span><span>' + esc(e.author || '') + '</span>' + seen + pend + '</div></div>' + (o.noDelete || e.pending ? '' : '<button type="button" class="x" data-del="' + esc(e.id) + '" title="' + T.del + '">×</button>') + '</div>';

  function wireDeletes(root, after) {
    root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(T.del_q)) return;
      try { await POST({ action: 'delete', id: Number(b.dataset.del) }); toast(T.deleted); await after(); } catch (e) { toast('✗ ' + e.message); }

  function renderWsDetail() {
    const b = state.boot, name = state.ws;
    const w = (b.worksites || []).find(x => x.name === name) || { name, hours: 0, employees: [], days: 0 };
    const rd = (b.redder || {})[name] || { an_vsk: 0, lines: [] };
    const efni = entriesFor('efni', name), punktar = entriesFor('punktur', name), kostn = entriesFor('kostnadur', name);
    const efniSum = efni.reduce((s, e) => s + (Number(e.qty) || 0) * (Number(e.unit_price) || 0), 0);
    const kostnSum = kostn.reduce((s, e) => s + (Number(e.qty) || 1) * (Number(e.unit_price) || 0), 0);
    // 02.11.2026 (Agnar: „þyrfti að geta skipt á milli mánaða … erum að fara klára október"): mánaðaskipti líka inni á verkinu,
    // ekki bara á listanum. Verkið helst opið (state.ws) — go() sækir boot fyrir nýja mánuðinn og teiknar sömu sýn.
    $('#bt-main').innerHTML = '<div class="monthbar wsbar"><button type="button" class="back" id="ws-back">' + T.back_ws + '</button><button type="button" class="key sm" id="m-prev" title="' + T.prev_m + '">‹</button><b>' + esc(monthLabel(state.month)) + '</b><button type="button" class="key sm" id="m-next" title="' + T.next_m + '">›</button></div>'
      + '<div class="hero"><h2>' + esc(name) + '</h2><span class="sub">' + hf(w.hours) + ' ' + T.h + ' · ' + w.days + ' ' + T.days(w.days) + ' · ' + w.employees.length + ' ' + T.staff_n + '</span></div>'
      + '<div class="panel collapsed" id="p-redder"><div class="panel-h"><span class="plate">02</span><span class="panel-t">' + T.redder_h + '</span><span class="sum">' + fmt(rd.an_vsk) + ' kr</span><span class="caret">›</span></div><div class="panel-b">'
      + (rd.lines.length ? rd.lines.map(l => '<div class="rline' + (l.excluded ? ' ex' : '') + '"><span>' + esc(l.label) + '</span><span class="num">× ' + hf(l.qty) + '</span><span class="num" style="color:var(--muted)">' + fmt(l.cost) + ' kr</span></div>').join('') + '<div class="kicker" style="margin-top:8px">' + T.redder_kicker + '</div>' : '<div class="empty">' + T.redder_empty + '</div>')
      + '</div></div>'
      + '<div class="panel"><div class="panel-h" style="cursor:default"><span class="plate">03</span><span class="panel-t">' + T.stock_h + '</span><span class="sum">' + (efniSum ? fmt(efniSum) + ' kr' : '—') + '</span></div><div class="panel-b">'
      + '<div class="kicker" style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:12px;margin-bottom:2px">' + (EININGAVERK.test(name) ? T.stock_kicker_unit : T.stock_kicker) + '</div>'
      + efniCounters(name)
      + '<details class="skr"><summary>' + T.entries_sum(efni.length) + '</summary><div id="efni-list">' + (efni.length ? efni.slice().sort((a, b) => String(b.updated_at || b.created_at || 'z').localeCompare(String(a.updated_at || a.created_at || 'z'))).map(e => entryHtml(e)).join('') : '<div class="empty">' + T.none_yet + '</div>') + '</div></details></div></div>'
      + '<div class="panel"><div class="panel-h" style="cursor:default"><span class="plate">04</span><span class="panel-t">' + T.purch_h + '</span><span class="sum">' + (kostn.length ? kostn.length + ' · ' + fmt(kostnSum) + ' kr' : '—') + '</span></div><div class="panel-b">'
      + '<div class="kicker" style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:12px">' + (EININGAVERK.test(name) ? T.purch_kicker_unit : T.purch_kicker) + '</div>'
      + '<div id="kostn-list">' + (kostn.length ? kostn.map(e => entryHtml(e)).join('') : '<div class="empty">' + T.purch_empty + '</div>') + '</div>'
      + '<button type="button" class="key gold wide" id="kostn-add" style="margin-top:10px">' + T.purch_add + '</button></div></div>'
      + '<div class="panel"><div class="panel-h" style="cursor:default"><span class="plate">05</span><span class="panel-t">' + T.notes_h + '</span><span class="sum">' + (punktar.length || '—') + '</span></div><div class="panel-b">'
      + '<div class="f"><textarea class="well" id="punktur-in" placeholder="' + esc(T.notes_ph) + '"></textarea></div>'
      + '<button type="button" class="key wide" id="punktur-save">' + T.note_save + '</button>'
      + '<div id="punktar-list" style="margin-top:10px">' + punktar.map(e => entryHtml(e)).join('') + '</div></div></div>';
    $('#ws-back').onclick = () => { state.ws = null; render(); };
    $('#m-prev').onclick = () => { state.month = shiftYM(state.month, -1); LS.set('bt_month', state.month); go(); };
    $('#m-next').onclick = () => { state.month = shiftYM(state.month, 1); LS.set('bt_month', state.month); go(); };
    $('#p-redder .panel-h').onclick = () => $('#p-redder').classList.toggle('collapsed');
    $('#kostn-add').onclick = () => openKostnadSheet(name);
    document.querySelectorAll('#bt-main .sec-h').forEach(h => h.addEventListener('click', () => { const s = h.parentElement; s.classList.toggle('collapsed'); state.openSec[s.dataset.sec] = !s.classList.contains('collapsed'); }));
    document.querySelectorAll('#bt-main .ctr').forEach(row => {
      const item = efniItem(row.dataset.l); if (!item) return;
      row.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => adjustEfni(name, item, Number(b.dataset.d))));
      const inp = row.querySelector('[data-in]');
      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('change', () => { const v = Number(String(inp.value).replace(',', '.')); if (!Number.isFinite(v) || v < 0) { renderWsDetail(); return; } adjustEfni(name, item, r2(v - efniQty(name, item.label))); });
    });
    $('#punktur-save').onclick = async () => {
      const ta = $('#punktur-in'); const note = ta.value.trim(); if (!note) { toast(T.note_first); return; }
      $('#punktur-save').disabled = true;
      const row = await save({ kind: 'punktur', worksite_name: name, work_month: state.month, entry_date: today(), note });
      if (row) { ta.value = ''; if (!row.pending) state.boot.entries.unshift(row); toast(row.pending ? T.queued : T.note_saved); }
      render();
    };
    wireDeletes($('#bt-main'), async () => { await loadBoot(true); render(); });
  }
  // Bæta við verki: verkstjóri sem er fyrstur á staðinn að taka út verkið (ekki enn í Tímaveru/Kröfu yfirliti) skráir það hér.
  const normWs = s => String(s || '').toLowerCase().replace(/[^a-z0-9áðéíóúýþæö]/g, '');
  function openVerkSheet() {
    openSheet('<h2>' + T.addjob_h + '</h2><div class="sub">' + T.addjob_sub + '</div>'
      + '<div class="f"><label>' + T.addjob_name + '</label><input class="well" id="v-name" placeholder="' + esc(T.addjob_name_ph) + '" autocomplete="off"></div>'
      + '<div class="f"><label>' + T.comment_opt + '</label><input class="well" id="v-note" placeholder="' + esc(T.addjob_note_ph) + '" autocomplete="off"></div>'
      + '<div class="actions"><button type="button" class="key" id="v-cancel">' + T.cancel + '</button><button type="button" class="key gold" id="v-ok">' + T.add + '</button></div>', sh => {
        $('#v-cancel', sh).onclick = closeSheet;
        $('#v-ok', sh).onclick = async () => {
          const name = $('#v-name', sh).value.replace(/\s+/g, ' ').trim(), note = $('#v-note', sh).value.trim();
          if (name.length < 3) { toast(T.addjob_need); return; }
          const dup = ((state.boot && state.boot.worksites) || []).find(w => normWs(w.name) === normWs(name));
          if (dup) { closeSheet(); toast(T.addjob_dup); state.ws = dup.name; render(); window.scrollTo(0, 0); return; }
          $('#v-ok', sh).disabled = true;
          const row = await save({ kind: 'verk', worksite_name: name, work_month: state.month, entry_date: today(), note });
          closeSheet();
          if (!row) { render(); return; }
          if (!row.pending) await loadBoot(true);
          toast(row.pending ? T.queued_auto : T.job_added);
          state.ws = name; render(); window.scrollTo(0, 0);
        };
      });
  }

  // ── Efni úr lager: ＋/− teljarar per atriði Verðskrár ────────────────────────
  // Talan sem sést er samtala mánaðarins á verkstaðnum (allir starfsmenn). ＋ bætir við eigin færslu dagsins (ein röð per
  // atriði/dag/starfsmann, ekki röð á hvern smell); − tekur af eigin færslu dagsins og svo þeirri nýjustu. Sýnileg tala
  // breytist STRAX (state.opt) og vistast í réttri röð í bakgrunni; netið dettur út → ＋ fer í biðröð eins og áður.
  // Efnisheitið sem vistast (item_label) er ALLTAF íslenska `label` úr Verðskránni; `en` er aðeins birting.
  const r2 = n => Math.round(n * 100) / 100;
  const efniGroups = () => (state.boot && state.boot.materials) || window.GR_MATERIALS || [];
  const efniItem = label => { for (const g of efniGroups()) { const it = g.items.find(x => x.label === label); if (it) return it; } return null; };
  const efniLabel = label => { const it = EN ? efniItem(label) : null; return it && it.en ? it.en : label; };
  const efniQty = (ws, label) => r2(entriesFor('efni', ws).filter(e => e.item_label === label).reduce((s, e) => s + (Number(e.qty) || 0), 0) + (state.opt[ws + '|' + label] || 0));
  function efniCounters(ws) {
    const groups = efniGroups();
    return groups.map((g, gi) => {
      const marked = g.items.filter(it => efniQty(ws, it.label) > 0).length;
      const open = state.openSec[g.section] != null ? state.openSec[g.section] : (gi === 0 || marked > 0);
      const rows = g.items.map(it => { const n = efniQty(ws, it.label);
        return '<div class="ctr' + (n > 0 ? ' on' : '') + '" data-l="' + esc(it.label) + '"><div class="nm">' + esc(EN && it.en ? it.en : it.label) + '<small>' + fmt(it.price) + ' kr/' + esc(unit(it.unit)) + '</small></div>'
          + '<div class="step"><button type="button" class="key" data-d="-1" aria-label="' + T.minus + '">−</button><input class="well" inputmode="decimal" data-in value="' + n + '" aria-label="' + T.qty + '"><button type="button" class="key" data-d="1" aria-label="' + T.plus + '">＋</button></div></div>'; }).join('');
      return '<div class="sec' + (open ? '' : ' collapsed') + '" data-sec="' + esc(g.section) + '"><div class="sec-h"><span>' + esc(EN && g.en ? g.en : g.section) + '</span>' + (marked ? '<span class="chip gold">' + T.marked_n(marked) + '</span>' : '') + '<span class="caret">›</span></div><div class="sec-b">' + rows + '</div></div>';
    }).join('');
  }
  const efniChain = {};
  function adjustEfni(ws, item, delta) {
    if (!state.author) { askWho(); return; }
    const key = ws + '|' + item.label;
    if (delta < 0) delta = Math.max(delta, -efniQty(ws, item.label));   // aldrei undir 0
    if (!delta) { renderWsDetail(); return; }
    state.opt[key] = r2((state.opt[key] || 0) + delta);
    renderWsDetail();
    efniChain[key] = (efniChain[key] || Promise.resolve()).then(() => applyEfni(ws, item, delta)).catch(e => toast('✗ ' + (e && e.message || T.error)))
      .then(() => { state.opt[key] = r2((state.opt[key] || 0) - delta); if (state.ws === ws) renderWsDetail(); });
  }
  async function applyEfni(ws, item, delta) {
    const mineToday = e => e.author === state.author && e.entry_date === today();
    const saved = (state.boot.entries || []).filter(e => e.kind === 'efni' && e.worksite_name === ws && e.item_label === item.label);
    if (delta > 0) {
      const mine = saved.find(mineToday);
      if (mine) {
        const q = r2((Number(mine.qty) || 0) + delta);
        try { const j = await POST({ action: 'update', id: mine.id, qty: q }); mine.qty = j.row ? Number(j.row.qty) : q; return; }
        catch (e) { if (e.status === 400 || e.status === 401) { toast('✗ ' + e.message); return; } /* net datt út → ný færsla í biðröð hér að neðan */ }
      }
      const row = await save({ kind: 'efni', worksite_name: ws, work_month: state.month, entry_date: today(), item_label: item.label, qty: delta, unit: item.unit, unit_price: item.price });
      if (row && !row.pending) state.boot.entries.unshift(row);
      return;
    }
    let left = -delta;
    for (const e of saved.slice().sort((a, b) => (mineToday(b) ? 1 : 0) - (mineToday(a) ? 1 : 0))) {   // eigin færsla dagsins fyrst, svo nýjasta (listinn er nýjast fyrst)
      if (left <= 0.001) break;
      const take = Math.min(left, Number(e.qty) || 0), nq = r2((Number(e.qty) || 0) - take);
      try {
        if (nq <= 0.001) { await POST({ action: 'delete', id: e.id }); state.boot.entries = state.boot.entries.filter(x => x !== e); }
        else { const j = await POST({ action: 'update', id: e.id, qty: nq }); e.qty = j.row ? Number(j.row.qty) : nq; }
        left = r2(left - take);
      } catch (err) { toast(err.status ? '✗ ' + err.message : T.net_sub_later); return; }
    }
    if (left > 0.001) toast(T.still_queued);
  }

  // Efniskostnaður: verkstjóri skráir hvað hann keypti, hvar og upphæð á kvittun. Vistað ÁN vsk (kvittun með vsk ÷ 1,24) svo
  // upphæðin passi við Efnislistann; kvittunarupphæðin er geymd í athugasemd (á íslensku — skrifstofan les hana).
  function parseAmount(v) { const s = String(v == null ? '' : v).trim().replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); const n = Number(s); return s !== '' && Number.isFinite(n) && n > 0 ? n : 0; }
  function openKostnadSheet(ws) {
    let selj = '', medVsk = true;
    openSheet('<h2>' + T.purch_sheet_h + '</h2><div class="sub">' + esc(ws) + ' · ' + esc(monthLabel(state.month)) + (EININGAVERK.test(ws) ? T.purch_sub_unit : T.purch_sub) + '</div>'
      + '<div class="f"><label>' + T.what_bought + '</label><input class="well" id="k-what" placeholder="' + esc(T.what_ph) + '" autocomplete="off"></div>'
      + '<div class="f"><label>' + T.where + '</label>' + chipsHtml('selj', SELJENDUR, '') + '</div>'
      + '<div class="f"><label>' + T.amount + '</label><input class="well" id="k-amt" inputmode="decimal" placeholder="0" autocomplete="off"></div>'
      + '<div class="f"><label>' + T.amount_is + '</label>' + chipsHtml('vsk', ['Með vsk', 'Án vsk'], 'Með vsk') + '<div class="sub" id="k-prev" style="margin:4px 0 0"></div></div>'
      + '<div class="f"><label>' + T.comment_opt + '</label><input class="well" id="k-note" placeholder="' + esc(T.note_ph_receipt) + '" autocomplete="off"></div>'
      + '<div class="actions"><button type="button" class="key" id="k-cancel">' + T.cancel + '</button><button type="button" class="key gold" id="k-ok">' + T.save_now + '</button></div>', sh => {
        const amtEl = $('#k-amt', sh);
        const anVsk = () => { const g = parseAmount(amtEl.value); return g ? Math.round(medVsk ? g / VSK : g) : 0; };
        const prev = () => { const g = parseAmount(amtEl.value); $('#k-prev', sh).textContent = g ? T.prev_amt(fmt(anVsk()), fmt(g), medVsk) : ''; };
        wireChips(sh, 'selj', v => { selj = v; });
        wireChips(sh, 'vsk', v => { medVsk = v === 'Með vsk'; prev(); });
        amtEl.addEventListener('input', prev);
        $('#k-cancel', sh).onclick = closeSheet;
        $('#k-ok', sh).onclick = async () => {
          const what = $('#k-what', sh).value.trim(), g = parseAmount(amtEl.value), net = anVsk();
          if (what.length < 2) { toast(T.what_need); return; }
          if (!g || !net) { toast(T.amount_need); return; }
          const note = [$('#k-note', sh).value.trim(), medVsk ? 'kvittun m. vsk ' + Math.round(g).toLocaleString('is-IS') + ' kr' : ''].filter(Boolean).join(' · ');
          $('#k-ok', sh).disabled = true;
          const row = await save({ kind: 'kostnadur', worksite_name: ws, work_month: state.month, entry_date: today(), item_label: what, qty: 1, unit: 'kaup', unit_price: net, category: selj, note });
          closeSheet();
          if (row) { if (!row.pending) state.boot.entries.unshift(row); toast(row.pending ? T.queued_auto : T.purch_saved(what, fmt(net))); }
          render();
        };
      });
  }

  // ── Mæting ────────────────────────────────────────────────────────────────
  function renderMaeting() {
    const d = state.dagar || { days: [] };
    const all = (state.maetingEntries || []).concat(pendingRows('maeting'));
    const byKey = {}; for (const e of all) { const k = e.entry_date + '|' + String(e.employee || '').toLowerCase(); (byKey[k] = byKey[k] || []).push(e); }
    const html = (d.days || []).map(day => {
      const known = new Set(day.staff.map(s => String(s.employee).toLowerCase()));
      const extra = all.filter(e => e.entry_date === day.date && !known.has(String(e.employee || '').toLowerCase()));
      const extraNames = [...new Set(extra.map(e => e.employee))];
      return '<div class="panel"><div class="dayhead"><b>' + esc(dayLbl(day.date)) + '</b><span class="sum">' + day.staff.length + ' ' + T.staff_n + ' · ' + hf(day.total_hours) + ' ' + T.h + '</span></div>'
        + day.staff.map(s => staffRow(day.date, s, byKey[day.date + '|' + String(s.employee).toLowerCase()] || [])).join('')
        + extraNames.map(n => staffRow(day.date, { employee: n, in: '', out: '', hours: 0, projects: [], absent: true }, byKey[day.date + '|' + String(n).toLowerCase()] || [])).join('')
        + '<div class="staff" style="justify-content:center"><button type="button" class="key sm" data-addemp="' + esc(day.date) + '">' + T.add_emp + '</button></div></div>';
    }).join('');
    $('#bt-main').innerHTML = '<div class="hero"><h2>' + T.att_h + '</h2><span class="sub">' + T.att_sub + '</span></div>'
      + (html || '<div class="empty">' + T.att_empty + '</div>')
      + '<div class="kicker" style="text-align:center;margin-top:6px">' + T.att_kicker + '</div>';
    document.querySelectorAll('[data-cm]').forEach(b => b.addEventListener('click', () => openMaetingSheet(b.dataset.date, b.dataset.cm)));
    document.querySelectorAll('[data-addemp]').forEach(b => b.addEventListener('click', () => openMaetingSheet(b.dataset.addemp, '')));
    wireDeletes($('#bt-main'), async () => { await loadMaeting(true); render(); });
  }
  function staffRow(date, s, cmts) {
    return '<div class="staff"><span class="nm">' + esc(s.employee) + '</span>'
      + (s.absent ? '<span class="chip red">' + T.not_in_tv + '</span>' : '<span class="tm"><span class="in">' + esc(s.in || '—') + '</span> → ' + (s.open ? '<span class="in">' + T.working + '</span>' : '<span class="out">' + esc(s.out || '—') + '</span>') + ' · ' + hf(s.hours) + ' ' + T.h + (s.open ? ' ' + T.so_far : '') + '</span>')
      + '<button type="button" class="cm" data-cm="' + esc(s.employee) + '" data-date="' + esc(date) + '" title="' + T.comment_title + '">💬</button>'
      + (s.projects && s.projects.length ? '<span class="proj">' + s.projects.map(p => '<span class="chip">' + esc(p.project) + ' <span style="opacity:.65">' + hf(p.hours) + '</span></span>').join('') + '</span>' : '')
      + (cmts.length ? '<span class="cmts">' + cmts.map(e => '<span class="chip ' + (/veik/i.test(e.category || '') ? 'red' : 'warn') + '">' + esc(cat(e.category) || T.comment) + (e.note ? ': ' + esc(e.note) : '') + ' <span style="opacity:.6">· ' + esc(e.author || '') + '</span>' + (e.pending ? ' ⏳' : '') + '</span>' + (e.pending ? '' : '<button type="button" class="x" data-del="' + esc(e.id) + '" title="' + T.del + '" style="border:0;background:transparent;color:var(--muted);cursor:pointer">×</button>')).join('') + '</span>' : '')
      + '</div>';
  }
  function openMaetingSheet(date, employee) {
    const names = (state.boot && state.boot.names) || [];
    let cat_ = '';
    openSheet('<h2>' + T.att_sheet_h + esc(dayLbl(date)) + '</h2>'
      + (employee ? '<div class="sub">' + T.employee + ': <b style="text-transform:capitalize">' + esc(employee) + '</b></div>' : '<div class="f"><label>' + T.employee + '</label>' + (names.length ? '<select class="well" id="m-emp"><option value="">' + T.select_ + '</option>' + names.map(n => '<option>' + esc(n) + '</option>').join('') + '<option value="__annad">' + T.other_name + '</option></select><input class="well" id="m-emp2" placeholder="' + T.name_ph + '" style="margin-top:6px;display:none">' : '<input class="well" id="m-emp2" placeholder="' + T.name_ph + '">') + '</div>')
      + '<div class="f"><label>' + T.what + '</label>' + chipsHtml('cat', CAT_MAETING, '') + '</div>'
      + '<div class="f"><label>' + T.details_opt + '</label><input class="well" id="m-note" placeholder="' + esc(T.att_note_ph) + '"></div>'
      + '<div class="actions"><button type="button" class="key" id="m-cancel">' + T.cancel + '</button><button type="button" class="key gold" id="m-ok">' + T.save_now + '</button></div>', sh => {
        wireChips(sh, 'cat', v => { cat_ = v; });
        const sel = $('#m-emp', sh); if (sel) sel.addEventListener('change', () => { $('#m-emp2', sh).style.display = sel.value === '__annad' ? '' : 'none'; });
        $('#m-cancel', sh).onclick = closeSheet;
        $('#m-ok', sh).onclick = async () => {
          let emp = employee; if (!emp) { const v = sel ? sel.value : ''; emp = (v && v !== '__annad') ? v : ($('#m-emp2', sh).value || '').trim(); }
          if (!emp) { toast(T.pick_emp); return; }
          if (!cat_) { toast(T.pick_what); return; }
          $('#m-ok', sh).disabled = true;
          const row = await save({ kind: 'maeting', entry_date: date, work_month: date.slice(0, 7), employee: emp, category: cat_, note: $('#m-note', sh).value.trim() });
          closeSheet();
          if (row) { if (!row.pending) state.maetingEntries.unshift(row); toast(row.pending ? T.queued : '✓ ' + emp + ': ' + cat(cat_)); }
          render();
        };
      });
  }

  // ── Beiðnir ───────────────────────────────────────────────────────────────
  function renderBeidnir() {
    const rows = (state.beidnir || []).concat(pendingRows('beidni'));
    $('#bt-main').innerHTML = '<div class="hero"><h2>' + T.req_h + '</h2><span class="sub">' + T.req_sub + '</span></div>'
      + '<button type="button" class="key gold wide" id="b-add">' + T.req_new + '</button>'
      + '<div class="panel" style="margin-top:10px"><div class="panel-h" style="cursor:default"><span class="plate">05</span><span class="panel-t">' + T.req_sent_h + '</span><span class="sum">' + rows.length + '</span></div><div class="panel-b">' + (rows.length ? rows.map(e => entryHtml(e)).join('') : '<div class="empty">' + T.req_empty + '</div>') + '</div></div>';
    $('#b-add').onclick = openBeidniSheet;
    wireDeletes($('#bt-main'), async () => { await loadBeidnir(true); render(); });
  }
  function openBeidniSheet() {
    const wss = (state.boot && state.boot.worksites) || [];
    let cat_ = '';
    openSheet('<h2>' + T.req_sheet_h + '</h2><div class="sub">' + T.req_sheet_sub + '</div>'
      + '<div class="f"><label>' + T.type_ + '</label>' + chipsHtml('cat', CAT_BEIDNI, '') + '</div>'
      + '<div class="f"><label>' + T.ws_opt + '</label><select class="well" id="b-ws"><option value="">—</option>' + wss.map(w => '<option>' + esc(w.name) + '</option>').join('') + '</select></div>'
      + '<div class="f"><label>' + T.the_req + '</label><textarea class="well" id="b-note" placeholder="' + esc(T.req_ph) + '"></textarea></div>'
      + '<div class="actions"><button type="button" class="key" id="b-cancel">' + T.cancel + '</button><button type="button" class="key gold" id="b-ok">' + T.send + '</button></div>', sh => {
        wireChips(sh, 'cat', v => { cat_ = v; });
        $('#b-cancel', sh).onclick = closeSheet;
        $('#b-ok', sh).onclick = async () => {
          const note = $('#b-note', sh).value.trim(); if (!note) { toast(T.req_need); return; }
          $('#b-ok', sh).disabled = true;
          const ws = $('#b-ws', sh).value;
          const row = await save({ kind: 'beidni', category: cat_ || 'Annað', worksite_name: ws || null, entry_date: today(), work_month: today().slice(0, 7), note });
          closeSheet();
          if (row) { if (!row.pending) state.beidnir.unshift(row); toast(row.pending ? T.queued : T.req_sent); }
          render();
        };
      });
  }

  // ── Deilt ─────────────────────────────────────────────────────────────────
  function renderDeilt() {
    const shares = (state.boot && state.boot.shares) || [];
    $('#bt-main').innerHTML = '<div class="hero"><h2>' + T.shared_h + '</h2><span class="sub">' + T.shared_sub + '</span></div>'
      + '<div class="tiles"><a class="tile" href="/nlsh.html" target="_blank" rel="noopener"><span class="i">🏥</span><b>Landsspítalinn</b><small>' + T.nlsh_sub + '</small></a>'
      + '<a class="tile" href="/#tvmaeting" target="_blank" rel="noopener"><span class="i">🕒</span><b>' + T.att_hub + '</b><small>' + T.att_hub_sub + '</small></a>'
      + '<a class="tile" href="https://kjarni.vercel.app/kjarni/turbopaint" target="_blank" rel="noopener"><span class="i">📐</span><b>TurboPaint</b><small>' + T.tp_sub + '</small></a>'
      + '<a class="tile" href="/" target="_blank" rel="noopener"><span class="i">🏢</span><b>Brunahólf hub</b><small>' + T.hub_sub + '</small></a></div>'
      + '<div class="panel"><div class="panel-h" style="cursor:default"><span class="plate">06</span><span class="panel-t">' + T.shared_ws_h + '</span><span class="sum">' + shares.length + '</span></div><div class="panel-b">'
      + (shares.length ? shares.map(s => '<div class="entry"><div class="t"><b>' + (s.kind === 'turbopaint' ? '📐 ' : '🔗 ') + '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" style="color:var(--gold-deep)">' + esc(s.title) + '</a></b>' + (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') + '<div class="meta"><span>' + esc(dmy(s.created_at)) + '</span></div></div></div>').join('') : '<div class="empty">' + T.shared_empty + '</div>')
      + '</div></div>';
  }

  // ── Stýring ───────────────────────────────────────────────────────────────
  function render() {
    renderWho();
    document.querySelectorAll('#bt-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    try {
      if (state.tab === 'verk') renderVerk();
      else if (state.tab === 'maeting') renderMaeting();
      else if (state.tab === 'beidnir') renderBeidnir();
      else renderDeilt();
    } catch (e) { $('#bt-main').innerHTML = '<div class="empty">' + T.err + esc(e.message) + '</div>'; }
  }
  async function go() {
    $('#bt-main').innerHTML = '<div class="empty">' + T.loading_big + '</div>';
    try {
      if (state.tab === 'verk' || state.tab === 'deilt') await loadBoot(state.tab === 'verk' && state.boot && state.boot.month !== state.month);
      else if (state.tab === 'maeting') { await loadBoot(false).catch(() => {}); await loadMaeting(false); }
      else if (state.tab === 'beidnir') { await loadBoot(false).catch(() => {}); await loadBeidnir(false); }
      render();
      askWho(false);
    } catch (e) { $('#bt-main').innerHTML = '<div class="empty">' + T.no_data + esc(e.message) + '<br><br><button type="button" class="key" onclick="location.reload()">' + T.retry + '</button></div>'; setSync('err'); }
  }
  document.querySelectorAll('#bt-tabs button').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; state.ws = null; LS.set('bt_tab', state.tab); go(); window.scrollTo(0, 0); }));
  $('#bt-who').addEventListener('click', () => askWho(true));
  window.addEventListener('online', flush);
  setInterval(() => { if (navigator.onLine) flush(); }, 20000);
  setInterval(() => { if (document.visibilityState === 'visible' && !$('#bt-sheet')) refresh(true); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { flush(); refresh(true); } });
  if (state.queue.length) setSync('queued');
  go().then(flush);
})();
</script>
</body>
</html>
