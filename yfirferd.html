<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yfirferð efnislista</title>
<style>
  /* UTGAFA 2 — sjá haus-badge. Bumpaðu við hverja breytingu (cache-gildran). */
  :root{ --bg:#0b1220; --card:#111a2e; --line:#1f2b45; --ink:#e8edf7; --ink2:#9fb0cc; --ink3:#6b7d9c; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(180deg,#060810 0,#0b1220 200px,#0e1830 100%); color:var(--ink);
    -webkit-text-size-adjust:100%; padding:14px 12px calc(28px + env(safe-area-inset-bottom)); }
  .titlebar{ background:linear-gradient(90deg,#000000 0%,#0a0a0b 45%,#2c2c30 100%); border-radius:14px;
    padding:13px 16px 14px; margin:0 0 12px; position:relative; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .titlebar::after{ content:""; position:absolute; left:16px; right:16px; bottom:0; height:2px;
    background:linear-gradient(90deg,transparent,#f6da79 20%,#8a5c17 50%,#f6da79 80%,transparent); }
  h1{ font-size:20px; margin:0; letter-spacing:-.01em; flex:1;
    background:linear-gradient(180deg,#fffbe8 0%,#f9e29a 12%,#e0ad3f 26%,#96631a 40%,#6e4a11 46%,
      #c99a3f 54%,#f6dd8f 64%,#d3a63f 78%,#8a5c17 90%,#f3dd97 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
  .ver{ font-size:9.5px; color:#6b7d9c; align-self:flex-start; }
  .me{ font:inherit; font-size:13px; font-weight:700; color:#f3dd97; background:rgba(255,255,255,.06);
    border:1px solid #4a4a4e; border-radius:9px; padding:8px 12px; cursor:pointer; }
  .sub{ color:var(--ink3); font-size:12.5px; margin:0 0 14px; line-height:1.5; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 14px 16px; margin:0 0 14px; }
  .card.confirmed{ border-color:#1f5233; }
  .card h2{ font-size:17px; margin:0; }
  .card .cmeta{ color:var(--ink2); font-size:12px; margin-top:2px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; border-radius:99px; padding:3px 10px; margin-top:7px; }
  .badge.pending{ background:#2a1508; border:1px solid #5a3f16; color:#fcd9a6; }
  .badge.ok{ background:#0f1e14; border:1px solid #1f5233; color:#7ff0b0; }
  .total{ font-size:19px; font-weight:800; color:#f3dd97; margin-top:10px; }
  .total small{ display:block; font-size:11px; font-weight:400; color:var(--ink3); margin-top:1px; }
  .acts{ display:flex; gap:9px; margin-top:13px; flex-wrap:wrap; align-items:center; }
  .btn{ font:inherit; font-size:15px; font-weight:700; padding:13px 20px; border-radius:11px; cursor:pointer;
    border:1px solid #35415f; background:#182544; color:#e8edf7; min-height:50px; touch-action:manipulation;
    text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
  .btn.gold{ border:1px solid #6e4a11; color:#1a1200;
    background:linear-gradient(180deg,#f9e29a 0%,#e0ad3f 45%,#c99a3f 55%,#f3dd97 100%); }
  .loading,.empty{ text-align:center; color:var(--ink3); padding:60px 12px; font-size:14px; line-height:1.6; }
  a.refresh{ color:var(--ink2); font-size:12px; text-decoration:none; }
</style>
</head>
<body>
  <div class="titlebar">
    <h1>👔 Yfirferð efnislista</h1>
    <button class="me" id="me" type="button" title="Hver ert þú? Nafnið skráist á staðfestinguna">👤 <span id="me-lbl">…</span></button>
    <span class="ver">v2</span>
  </div>
  <p class="sub">Efnislistar sem skrifstofan bað um yfirferð á. Ýttu á <b>🧾 Opna Efnislista</b> — þar breytir þú tölum í ALVÖRU forminu og ýtir á <b>✓ Staðfesta</b> (eða <b>↶ Hætta við</b> til að afturkalla allt). · <a class="refresh" href="#" id="refresh">↻ uppfæra</a></p>
  <div id="app"><div class="loading">Sæki efnislista…</div></div>

<script>
  var TEAM = ['Annþór','Agnar','Andri','Hákon','Elías'];
  var MONTHS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return (Math.round(n||0)).toLocaleString('is-IS').replace(/,/g,'.'); }
  function mlabel(m){ var p=String(m||'').split('-'); return (MONTHS[(+p[1])-1]||'')+' '+p[0]; }
  function dtIs(s){ try{ return new Date(s).toLocaleString('is-IS',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(_){ return ''; } }

  // Sama auðkenni og hub-ið (bh_me í localStorage) — SAMA lén, svo nafnið sem er
  // valið hér gildir líka inni í Efnislista-forminu (review_confirmed_by).
  function me(){ try{ return (localStorage.getItem('bh_me')||'').trim(); }catch(_){ return ''; } }
  function setMe(n){ try{ localStorage.setItem('bh_me', n); }catch(_){} paintMe(); }
  function paintMe(){ document.getElementById('me-lbl').textContent = me() || 'velja nafn'; }
  document.getElementById('me').onclick = function(){
    var cur = me();
    var pick = prompt('Hver ert þú? (' + TEAM.join(' / ') + ')', cur || 'Annþór');
    if(pick && pick.trim()) setMe(pick.trim());
  };
  paintMe();

  // Beinn hlekkur á ALVÖRU Efnislista-formið (Gerð Reikninga í hub-num) fyrir
  // þennan verkstað/mánuð. review=1 kveikir ✓ Staðfesta / ↶ Hætta við þar, og
  // eftir hvorn takkann sem er kemur history.back() með þig aftur hingað.
  function formUrl(d){
    return '/?embed=1&grws='+encodeURIComponent(d.worksite_name)
      + '&grwm='+encodeURIComponent(d.work_month)+'&review=1#gerdreikninga';
  }

  function cardHtml(d){
    var confirmed = !!d.review_confirmed_at;
    return '<div class="card'+(confirmed?' confirmed':'')+'">'
      + '<h2>'+esc(d.worksite_name)+'</h2>'
      + '<div class="cmeta">'+esc(mlabel(d.work_month))+(d.customer_name?' · '+esc(d.customer_name):'')
      + (d.review_requested_by?' · beðið af '+esc(d.review_requested_by)+(d.review_requested_at?' '+dtIs(d.review_requested_at):''):'')+'</div>'
      + (confirmed
          ? '<span class="badge ok">✓ Staðfest · '+esc(d.review_confirmed_by||'')+' · '+dtIs(d.review_confirmed_at)+'</span>'
          : '<span class="badge pending">Bíður yfirferðar</span>')
      + '<div class="total">'+fmt(d.total_m_vsk)+' kr <small>samtals m/vsk · síðast vistað '+dtIs(d.updated_at)+'</small></div>'
      + '<div class="acts"><a class="btn gold" href="'+esc(formUrl(d))+'">🧾 Opna Efnislista</a></div>'
      + '</div>';
  }

  function render(rows){
    var app = document.getElementById('app');
    if(!rows.length){
      app.innerHTML = '<div class="empty">🎉 Ekkert bíður yfirferðar.<br>Skrifstofan flaggar Efnislista með 👔-takkanum í Kröfu yfirlitinu — þeir birtast hér.</div>';
      return;
    }
    app.innerHTML = rows.map(cardHtml).join('');
  }

  async function load(){
    document.getElementById('app').innerHTML = '<div class="loading">Sæki efnislista…</div>';
    try{
      var res = await fetch('/api/invoice-drafts').then(function(r){ return r.json(); });
      var cutoff = new Date(Date.now() - 60*864e5).toISOString();
      var rows = (res.rows||[]).filter(function(d){
        if(!d.review_requested) return false;
        // Staðfestir listar hverfa af borðinu eftir 60 daga (sagan lifir í töflunni).
        if(d.review_confirmed_at && d.review_confirmed_at < cutoff) return false;
        return true;
      }).sort(function(a,b){
        var ac=a.review_confirmed_at?1:0, bc=b.review_confirmed_at?1:0;
        if(ac!==bc) return ac-bc;   // óstaðfest fyrst
        return String(b.review_requested_at||'').localeCompare(String(a.review_requested_at||''));
      });
      render(rows);
    }catch(e){
      document.getElementById('app').innerHTML = '<div class="empty">Villa: '+esc(e.message||e)+'</div>';
    }
  }
  document.getElementById('refresh').onclick = function(e){ e.preventDefault(); load(); };
  // Endurhlaða þegar komið er TIL BAKA úr forminu (bfcache skilar annars gömlu
  // stöðunni og staðfestingin sæist ekki fyrr en eftir handvirkt ↻).
  window.addEventListener('pageshow', function(ev){ if(ev.persisted) load(); });
  load();
</script>
</body>
</html>
