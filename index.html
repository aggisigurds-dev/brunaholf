function b(){ return Math.random().toString(36).slice(2,9); }

let state = load();

// Ensure newer tab definitions get auto-added to existing user state
// (called both during load from localStorage AND after sync replaces
// state with an older snapshot from the server).
function ensureNewTabs(s){
  if(!s || !Array.isArray(s.tabs)) return;
  ['vinnustofa','efniskostnadur','kvittanir','minverkefni','gogn','samthaetting','slokkvitaeki','okkarVerkefni','inbox','timavera','verdsamanburdur','verkstadir','spurningar'].forEach(id=>{
    if(!s.tabs.find(t=>t.id===id)){
      const d = DEFAULT_STATE.tabs.find(t=>t.id===id);
      if(d){
        // Vinnustofa goes RIGHT AFTER reikningar; efniskostnadur after that
        let target;
        if(id === 'vinnustofa'){
          const idx = s.tabs.findIndex(t=>t.id==='reikningar');
          target = idx >= 0 ? idx + 1 : -1;
        } else if(id === 'efniskostnadur'){
          const idx = s.tabs.findIndex(t=>t.id==='vinnustofa');
          const idx2 = s.tabs.findIndex(t=>t.id==='reikningar');
          target = idx >= 0 ? idx + 1 : (idx2 >= 0 ? idx2 + 1 : -1);
        } else {
          target = s.tabs.findIndex(t=>t.id==='tenglar');
        }
        if(target>=0) s.tabs.splice(target,0,JSON.parse(JSON.stringify(d))); else s.tabs.push(JSON.parse(JSON.stringify(d)));
      }
    }
  });
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    const s = {
      tabs: parsed.tabs || DEFAULT_STATE.tabs,
      buttons: parsed.buttons || DEFAULT_STATE.buttons,
      ui: Object.assign({}, DEFAULT_STATE.ui, parsed.ui||{})
    };
    // migration: ensure maeting tab + buttons exist
    const defM = DEFAULT_STATE.tabs.find(t=>t.id==='maeting');
    let mTab = s.tabs.find(t=>t.id==='maeting');
    if(!mTab && defM){
      const idx = s.tabs.findIndex(t=>t.id==='verkefnastada');
      if(idx>=0) s.tabs.splice(idx,0,JSON.parse(JSON.stringify(defM))); else s.tabs.splice(1,0,JSON.parse(JSON.stringify(defM)));
      mTab = s.tabs.find(t=>t.id==='maeting');
    }
    // migrate old gviz URL to /pub?output=csv
    if(mTab && defM && mTab.sheetCsv && mTab.sheetCsv.includes('/gviz/tq')){
      mTab.sheetCsv = defM.sheetCsv;
    }
    if(mTab){
      const mbtns = DEFAULT_STATE.buttons.filter(b=>b.tab==='maeting');
      mbtns.forEach(b=>{ if(!s.buttons.find(x=>x.tab==='maeting' && x.label===b.label)) s.buttons.push(JSON.parse(JSON.stringify(b))); });
    }
    // migration: ensure new tabs exist for users with saved state
    ensureNewTabs(s);
    // migration: ensure ui.layout / ui.uploadFolderId
    if(!s.ui.layout) s.ui.layout = 'sidebar';
    if(!s.ui.uploadFolderId || s.ui.uploadFolderId === '1MRleiwpQyqHzcSIfbbCUjPF7ujoXHd0U') s.ui.uploadFolderId = '1MRleiwpQyqHzcSIfbbCUjPF7ujoXHd0U';
    if(s.ui.appsScriptUrl===undefined) s.ui.appsScriptUrl = '';
    // migration: remove gamla 'verkefnalisti' (sheet-based) ef hann er enn til
    s.tabs = s.tabs.filter(t=>t.id!=='verkefnalisti');
    s.buttons = s.buttons.filter(b=>b.tab!=='verkefnalisti');
    // migration: ensure twoCol exists for okkarVerkefni
    const okTab = s.tabs.find(t=>t.id==='okkarVerkefni');
    if(okTab && !okTab.twoCol){
      okTab.twoCol = { Anni:{icon:'🦍', items:[]}, Aggi:{icon:'🐒', items:[]} };
    }
    // migration: place okkarVerkefni just below yfirlit if it's elsewhere
    const okPos = s.tabs.findIndex(t=>t.id==='okkarVerkefni');
    const yfPos = s.tabs.findIndex(t=>t.id==='yfirlit');
    if(yfPos>=0 && okPos>=0 && okPos !== yfPos+1){
      const [tab] = s.tabs.splice(okPos, 1);
      s.tabs.splice(yfPos+1, 0, tab);
    }
    return s;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function save(){
  state.ui = state.ui || {};
  state.ui.updated_at = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  scheduleServerSync();
}

/* ====== Cross-device state sync (Supabase via /api/app-state) ======
   localStorage stays as the fast cache; the server copy is the
   shared source of truth across browsers/devices. On boot we kick
   off a background fetch; if the server has a newer version, we
   replace the in-memory state and re-render. */
let _syncTimer = null;
let _syncInFlight = false;
let _serverHasRecord = false;
function scheduleServerSync(){
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncToServer, 800);
}
async function syncToServer(){
  if(_syncInFlight) { _syncTimer = setTimeout(syncToServer, 1000); return; }
  _syncInFlight = true;
  try{
    await fetch('/api/app-state', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key:'hub_state', value: state }),
    });
    _serverHasRecord = true;
    setSyncBadge('synced');
  }catch(e){
    setSyncBadge('offline');
  }finally{
    _syncInFlight = false;
  }
}
async function syncFromServer(){
  try{
    const r = await fetch('/api/app-state?key=hub_state');
    if(r.status === 404){ // first device — push current local state up
      _serverHasRecord = false;
      if(state && state.tabs) scheduleServerSync();
      setSyncBadge('synced');
      return;
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const { value: server, updated_at: serverTs } = await r.json();
    _serverHasRecord = true;
    const localTs = state?.ui?.updated_at || '';
    // server wins if its timestamp is strictly newer than what we
    // have locally — otherwise keep the local copy (it may have
    // unsynced edits) and push it up.
    if(serverTs && serverTs > localTs && server && server.tabs){
      const prevActiveTab = state?.ui?.activeTab;
      const prevTabsHash  = JSON.stringify((state?.tabs||[]).map(t => t.id));
      state = server;
      // Re-apply tab migration to the server-fetched state so newer-than-
      // server tabs (Vinnustofa, Efniskostnaður, etc.) still appear even
      // when an older server snapshot would otherwise overwrite them.
      ensureNewTabs(state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      // Only re-render if the structure actually changed — otherwise the
      // re-render races with whatever the active tab is loading and breaks
      // its in-flight DOM (race causes "can't click" bugs).
      const newTabsHash = JSON.stringify((state?.tabs||[]).map(t => t.id));
      const newActiveTab = state?.ui?.activeTab;
      if(prevActiveTab !== newActiveTab || prevTabsHash !== newTabsHash){
        try{ renderActive(); }catch(e){}
      } else {
        // Just refresh the nav (might have new buttons) without nuking $view
        try{ if(typeof renderTabs === 'function') renderTabs(); }catch(e){}
      }
    } else if(localTs && (!serverTs || localTs > serverTs)){
      scheduleServerSync();
    }
    setSyncBadge('synced');
  }catch(e){
    setSyncBadge('offline');
  }
}
function setSyncBadge(mode){
  const el = document.getElementById('sync-badge');
  if(!el) return;
  if(mode === 'synced'){ el.textContent = '☁ synced'; el.className = 'sync-badge sync-ok'; }
  else if(mode === 'offline'){ el.textContent = '☁ offline'; el.className = 'sync-badge sync-warn'; }
}

  if(typeof renderTabs === 'function') renderTabs();
  if(typeof applyTheme === 'function') applyTheme(state?.ui?.theme || 'classic');

}

  if(u.includes('netlify')) return '🚀';

  if(u.includes('drive.google')) return '📁';
  if(u.includes('docs.google.com/spreadsheets')) return '📊';
  if(u.includes('docs.google.com/document')) return '📄';
  if(u.includes('mail.google.com') || u.includes('@')) return '✉️';
  if(u.includes('claude.ai')) return '🤖';
  if(u.includes('github')) return '🐙';
  if(u.includes('redder')) return '🧾';
  if(t.includes('bokhald')) return '🧾';
  if(t.includes('reikning')) return '💳';
  if(t.includes('kennitala')) return '🔍';
  if(t.includes('mæting') || t.includes('vinnufærslur')) return '🟢';
  if(t.includes('verkstað')) return '🏗';
  if(t.includes('húsfélag')) return '🏢';

  if(t.includes('email') || t.includes('póst')) return '✉️';
  if(t.includes('forwarding') || t.includes('label')) return '🏷';
  if(t.includes('skýrsla') || t.includes('skjal')) return '📄';
  if(t.includes('python')) return '🐍';
  if(t.includes('api')) return '🔌';
  if(t.includes('verðlist')) return '🏷';
  if(t.includes('myndavél') || t.includes('mynd')) return '📷';

function buttonHtml(btn){
  const sub = btn.url ? new URL(btn.url, location.href).host.replace(/^www\./,'') : '';
  // priority: explicit btn.icon > autoIcon based on url/label > initials
  let ico = btn.icon || autoIcon(btn.label, btn.url);
  let icoIsEmoji = !!ico;
  if(!ico){
    ico = btn.initials || (btn.label||'?').slice(0,2).toUpperCase();
  }
  const size = btn.size || 'm';
  return `
    <a class="kbtn ${btn.color||'t-red'} size-${size}" href="${escapeAttr(btn.url||'#')}" target="_blank" rel="noopener" data-id="${btn.id}">
      <button class="drag" title="Færa" data-drag="${btn.id}">⋮⋮</button>
      <div class="ico ${icoIsEmoji?'ico-emoji':''}">${escapeHtml(ico)}</div>
      <div style="min-width:0;flex:1">
        <div class="lbl">${escapeHtml(btn.label)}</div>
        ${sub?`<div class="sub">${escapeHtml(sub)}</div>`:''}
      </div>
      <button class="edit" title="Breyta" data-edit="${btn.id}">✎</button>
    </a>
  `;
}

let _sortableLoading = null;
function loadSortable(){
  if(window.Sortable) return Promise.resolve(window.Sortable);
  if(_sortableLoading) return _sortableLoading;
  _sortableLoading = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js';
    s.onload=()=>resolve(window.Sortable); s.onerror=reject;
    document.head.appendChild(s);
  });
  return _sortableLoading;
}

async function wireDragSort(){
  if(!state.ui.editMode) return;
  await loadSortable();
  document.querySelectorAll('main .grid').forEach(g=>{
    if(g._sortable) g._sortable.destroy();
    g._sortable = window.Sortable.create(g, {
      animation:160,
      handle:'.drag',
      draggable:'.kbtn',
      ghostClass:'sortable-ghost',
      dragClass:'sortable-drag',
      group:{name:'kbtns', pull:true, put:true},
      onEnd: (evt)=>{
        // if moved to different group container, update the group label of the button
        const moved = state.buttons.find(b=>b.id===evt.item.dataset.id);
        if(moved){
          const sec = evt.to.closest('.section');
          const gt = sec ? sec.querySelector('.group-title strong') : null;
          if(gt){
            // strip leading icons & counts
            const newGroup = gt.textContent.trim().replace(/\s*\(\d+\)\s*$/,'').trim();
            if(newGroup && newGroup!==moved.group) moved.group = newGroup;
          }
        }
        // Build new order from DOM across all grids on the page
        const newOrder = [];
        document.querySelectorAll('main .kbtn[data-id]').forEach(el=>{
          const b = state.buttons.find(x=>x.id===el.dataset.id);
          if(b) newOrder.push(b);
        });
        // Append any buttons not in DOM (other tabs) to preserve them
        state.buttons.forEach(b=>{ if(!newOrder.find(x=>x.id===b.id)) newOrder.push(b); });
        state.buttons = newOrder;
        save();
      }
    });
  });
}

function renderButtonTab(t){

  const $status = document.getElementById('inbox-status');
  let filter = 'all';
  let qVal = '';
  let acctVal = '';
  let debounce = null;
  let reqSeq = 0;

  function setActiveChip(btn){
    document.querySelectorAll('.inbox-controls .chip[data-filter]').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
  }

  function formatWhen(iso){
    if(!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if(sameDay){
        return d.toLocaleTimeString('is-IS', {hour:'2-digit', minute:'2-digit'});
      }
      return d.toLocaleDateString('is-IS', {month:'short', day:'numeric'}) +
        ' ' + d.toLocaleTimeString('is-IS', {hour:'2-digit', minute:'2-digit'});
    } catch(e){ return ''; }
  }

  function renderFeed(rows){
    if(!rows.length){
      $feed.innerHTML = '<div class="empty">Engin skilaboð fundust.</div>';
      return;
    }
    $feed.innerHTML = rows.map(row => {
      const sender = row.sender_name || row.sender_email || '(ókunn.)';
      const acctChip = row.account ? `<span class="ic-account">${escapeHtml(row.account)}</span>` : '';
      const tags = [];
      if(row.is_question)    tags.push('<span class="tag t-q">⚠ spurning</span>');
      if(row.has_attachment) tags.push(`<span class="tag t-att">📎 ${(row.attachment_names||[]).length||''}</span>`);
      return `
        <div class="inbox-card${row.is_question?' is-question':''}">
          <div class="ic-head">
            <span class="ic-sender">${escapeHtml(sender)}</span>
            ${acctChip}
            <span class="ic-when">${escapeHtml(formatWhen(row.received_at))}</span>
          </div>
          <div class="ic-subject">${escapeHtml(row.subject||'(engin efnislína)')}</div>
          <div class="ic-snippet">${escapeHtml(row.snippet||'')}</div>
          ${tags.length ? `<div class="ic-tags">${tags.join(' ')}</div>` : ''}
        </div>`;
    }).join('');
  }

  async function load(){
    const mine = ++reqSeq;
    $status.textContent = 'Sækir…';
    const params = new URLSearchParams({ filter, limit:'80' });
    if(qVal)    params.set('q', qVal);
    if(acctVal) params.set('account', acctVal);
    try {
      const r = await fetch('/api/inbox?' + params.toString());
      if(mine !== reqSeq) return; // stale response
      if(!r.ok){
        const e = await r.json().catch(()=>({error:'Villa við að sækja'}));
        $feed.innerHTML = `<div class="empty" style="color:var(--red)">${escapeHtml(e.error||('HTTP '+r.status))}</div>`;
        $status.textContent = '';
        return;
      }
      const data = await r.json();
      renderFeed(data.rows||[]);
      $status.textContent = (data.rows||[]).length + ' skilaboð';
    } catch(err){
      if(mine !== reqSeq) return;
      $feed.innerHTML = `<div class="empty" style="color:var(--red)">Villa: ${escapeHtml(err.message||String(err))}</div>`;
      $status.textContent = '';
    }
  }

  $q.addEventListener('input', e => {
    qVal = e.target.value.trim();
    if(debounce) clearTimeout(debounce);
    debounce = setTimeout(load, 250);
  });
  $acct.addEventListener('change', e => { acctVal = e.target.value; load(); });
  document.querySelectorAll('.inbox-controls .chip[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      setActiveChip(btn);
      load();
    });
  });
  document.getElementById('inbox-refresh').addEventListener('click', load);

  load();
}

            <div class="tv-card-title">Topp verkstaðir</div>
            <div class="tv-card-sub">Tímar á ári · % af heildar</div>
          </div>

            <div class="tv-card-title">Topp starfsmenn</div>

  bindEditButtons();

  const $year = document.getElementById('tv-year');
  const $refresh = document.getElementById('tv-refresh');
  const currentYear = new Date().getFullYear();
  let selectedYear = currentYear;
  // Populate year selector (last 3 years).
  for (let y = currentYear; y >= currentYear - 3; y--) {
    const opt = document.createElement('option');
    opt.value = String(y); opt.textContent = String(y);
    $year.appendChild(opt);
  }
  $year.value = String(selectedYear);

  async function load(force){
    document.getElementById('tv-meta').textContent = 'Sækir…';
    $refresh.disabled = true; $refresh.classList.add('loading');
    const cb = force ? ('&_=' + Date.now()) : '';
    try {
      const r = await fetch(`/api/timavera?year=${selectedYear}${cb}`);
      if (!r.ok) {
        const e = await r.json().catch(()=>({error:'Villa'}));
        document.getElementById('tv-meta').innerHTML = `<span style="color:var(--red)">Villa: ${escapeHtml(e.error||('HTTP '+r.status))}</span>`;
        return;
      }
      const data = await r.json();
      renderAll(data);
    } catch(err) {
      document.getElementById('tv-meta').innerHTML = `<span style="color:var(--red)">Villa: ${escapeHtml(err.message||String(err))}</span>`;
    } finally {
      $refresh.disabled = false; $refresh.classList.remove('loading');
    }
  }

  function renderAll(d){
    document.getElementById('tv-yr-label').textContent = d.year;
    const importedAt = d.last_import ? tvFormatTimestamp(d.last_import) : '—';
    const file = d.source_file ? ` · ${escapeHtml(d.source_file)}` : '';
    document.getElementById('tv-meta').innerHTML = `Síðast uppfært: ${escapeHtml(importedAt)}${file}`;

    // KPIs
    document.getElementById('tv-kpi-total').textContent     = tvFormatHours(d.summary.total_hours);
    document.getElementById('tv-kpi-total-x').textContent   = `klst · ${d.summary.months_count} mán`;
    document.getElementById('tv-kpi-projects').textContent  = d.summary.active_projects;
    document.getElementById('tv-kpi-staff').textContent     = d.summary.active_staff;
    document.getElementById('tv-kpi-today').textContent     = tvFormatHours(d.summary.today_hours);
    document.getElementById('tv-kpi-today-x').textContent   = d.summary.today_date ? d.summary.today_date : '—';

    // Today date label
    document.getElementById('tv-today-date').textContent = d.today.date ? d.today.date : '—';

    // Monthly chart (stacked bars)
    if (!window.Chart) { setTimeout(()=>renderAll(d), 300); return; }
    renderMonthly(d.monthly);
    renderTodayProject(d.today);
    renderTodayStaff(d.today);
    renderWeekly(d.weekly);
    renderProjTable(d.project_totals);
    renderStaffTable(d.staff_totals);
  }

  function renderMonthly(m){
    const labels = m.monthLabels;
    const series = m.series.map((s, i) => ({
      label: s.project,
      data: s.data,
      backgroundColor: TV_PALETTE[i % TV_PALETTE.length],
      borderColor: TV_PALETTE[i % TV_PALETTE.length],
      borderWidth: 0,
      stack: 'all',
    }));
    if (m.other.some(v => v > 0)) {
      series.push({ label:'Annað', data:m.other, backgroundColor:TV_OTHER, borderColor:TV_OTHER, borderWidth:0, stack:'all' });
    }
    const ctx = document.getElementById('tv-monthly');
    if (_tvCharts.monthly) _tvCharts.monthly.destroy();
    _tvCharts.monthly = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: series },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { position:'bottom', labels:{ usePointStyle:true, pointStyle:'rectRounded', font:{size:11} } },
          tooltip: {
            backgroundColor:'#0F2748', titleColor:'#fff', bodyColor:'#E8ECF7', padding:10, cornerRadius:8,
            callbacks: {
              label: c => `${c.dataset.label}: ${tvFormatHours(c.parsed.y)} klst`,
              footer: items => {
                const tot = items.reduce((a,i)=>a + i.parsed.y, 0);
                return `Samtals: ${tvFormatHours(tot)} klst`;
              }
            }
          },
        },
        scales: {
          x: { stacked:true, grid:{ display:false }, ticks:{ font:{size:11} } },
          y: { stacked:true, grid:{ color:'rgba(0,0,0,.06)' }, ticks:{ font:{size:11}, callback: v => tvFormatHours(v) } },
        },
      },
    });
  }

  function renderTodayProject(t){
    const labels = t.by_project.map(x => x.project);
    const data   = t.by_project.map(x => x.hours);
    const colors = labels.map((_, i) => TV_PALETTE[i % TV_PALETTE.length]);
    const ctx = document.getElementById('tv-today-project');
    if (_tvCharts.todayProj) _tvCharts.todayProj.destroy();
    _tvCharts.todayProj = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor:colors, borderColor:'#fff', borderWidth:2 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%',
        plugins: {
          legend: { position:'right', labels:{ usePointStyle:true, font:{size:11}, padding:10 } },
          tooltip: {
            backgroundColor:'#0F2748', titleColor:'#fff', bodyColor:'#E8ECF7', padding:10, cornerRadius:8,
            callbacks: {
              label: c => `${c.label}: ${tvFormatHours(c.parsed)} klst`,
            },
          },
        },
      },
    });
  }

  function renderTodayStaff(t){
    const $el = document.getElementById('tv-today-staff');
    if (!t.by_staff.length) { $el.innerHTML = '<div class="empty" style="margin:0">Engin skráning í dag.</div>'; return; }
    const max = t.by_staff[0].hours || 1;
    $el.innerHTML = t.by_staff.map((s, i) => `
      <div class="tv-staff-row">
        <div class="tv-staff-name">${escapeHtml(s.employee)}</div>
        <div class="tv-staff-bar"><div class="tv-staff-fill" style="width:${(s.hours/max*100).toFixed(0)}%;background:${TV_PALETTE[i % TV_PALETTE.length]}"></div></div>
        <div class="tv-staff-val">${tvFormatHours(s.hours)}</div>
      </div>
    `).join('');
  }

  function renderWeekly(w){
    const labels = w.weekLabels;
    const series = w.series.map((s, i) => ({
      label: s.project,
      data: s.data,
      borderColor: TV_PALETTE[i % TV_PALETTE.length],
      backgroundColor: TV_PALETTE[i % TV_PALETTE.length] + '20',
      borderWidth: 2,
      tension: 0.3,
      pointRadius: 3,
      pointHoverRadius: 5,
      fill: false,
    }));
    const ctx = document.getElementById('tv-weekly');
    if (_tvCharts.weekly) _tvCharts.weekly.destroy();
    _tvCharts.weekly = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: series },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { position:'bottom', labels:{ usePointStyle:true, font:{size:11} } },
          tooltip: {
            backgroundColor:'#0F2748', titleColor:'#fff', bodyColor:'#E8ECF7', padding:10, cornerRadius:8,
            callbacks: { label: c => `${c.dataset.label}: ${tvFormatHours(c.parsed.y)} klst` },
          },
        },
        scales: {
          x: { grid:{ display:false }, ticks:{ font:{size:11} } },
          y: { grid:{ color:'rgba(0,0,0,.06)' }, ticks:{ font:{size:11}, callback: v => tvFormatHours(v) }, beginAtZero:true },
        },
      },
    });
  }

  function renderProjTable(rows){
    const top = rows.slice(0, 15);
    const html = `
      <thead><tr><th>#</th><th>Verkstaður</th><th class="tv-num">Tímar</th><th class="tv-num">Hlutfall</th></tr></thead>
      <tbody>
        ${top.map((p,i)=>`
          <tr>
            <td class="tv-rank">${i+1}</td>
            <td class="tv-trunc" title="${escapeAttr(p.project)}">${escapeHtml(p.project)}</td>
            <td class="tv-num">${tvFormatHours(p.hours)}</td>
            <td class="tv-num"><span class="tv-pct" style="--p:${p.share}">${p.share.toFixed(1)}%</span></td>
          </tr>`).join('')}
      </tbody>`;
    document.getElementById('tv-proj-table').innerHTML = html;
  }

  function renderStaffTable(rows){
    const top = rows.slice(0, 15);
    const html = `
      <thead><tr><th>#</th><th>Starfsmaður</th><th class="tv-num">Tímar</th><th class="tv-num">Dagar</th><th class="tv-num">Meðaltal</th></tr></thead>
      <tbody>
        ${top.map((s,i)=>`
          <tr>
            <td class="tv-rank">${i+1}</td>
            <td>${escapeHtml(s.employee)}</td>
            <td class="tv-num">${tvFormatHours(s.hours)}</td>
            <td class="tv-num">${s.days}</td>
            <td class="tv-num">${s.avg.toFixed(1)}</td>
          </tr>`).join('')}
      </tbody>`;
    document.getElementById('tv-staff-table').innerHTML = html;
  }

  $year.addEventListener('change', e => { selectedYear = parseInt(e.target.value, 10); load(false); });
  $refresh.addEventListener('click', () => load(true));

  load(false);
}

/* ====================== SPURNINGAR & VERKEFNI (email task triage) ====================== */
const SP_STATUS = {
  new:         { label:'Ný',          icon:'●',  cls:'sp-st-new'  },
  in_progress: { label:'Í vinnslu',    icon:'…',  cls:'sp-st-prog' },
  answered:    { label:'Svarað',       icon:'✓',  cls:'sp-st-done' },
  dismissed:   { label:'Frávísað',     icon:'×',  cls:'sp-st-dism' },
  snoozed:     { label:'Frestað',      icon:'⏸',  cls:'sp-st-snz'  },
};
const SP_PRIORITY = {
  high:   { label:'Hátt',   cls:'sp-pr-high'   },
  normal: { label:'Venjul.', cls:'sp-pr-normal' },
  low:    { label:'Lágt',   cls:'sp-pr-low'    },
};

function renderSpurningar(t){
  $view.innerHTML = `
    <div class="sp-wrap">
      <div class="sp-header">
        <div>
          <h1 class="sp-h1">Spurningar & Verkefni</h1>
          <div class="sp-sub" id="sp-meta">Sækir…</div>
        </div>
        <div class="sp-controls">
          <button id="sp-refresh" class="tv-btn" type="button">
            <span class="tv-refresh-icon">↻</span> Sækja
          </button>
        </div>
      </div>

      <div class="tv-kpis sp-kpis">
        <div class="tv-kpi sp-kpi-new"><div class="tv-kpi-l">Nýjar</div><div class="tv-kpi-v" id="sp-k-new">—</div><div class="tv-kpi-x">þurfa svar</div></div>
        <div class="tv-kpi"><div class="tv-kpi-l">Í vinnslu</div><div class="tv-kpi-v" id="sp-k-prog">—</div><div class="tv-kpi-x">í gangi</div></div>
        <div class="tv-kpi sp-kpi-high"><div class="tv-kpi-l">Hátt forgangur</div><div class="tv-kpi-v" id="sp-k-high">—</div><div class="tv-kpi-x">opnar + í vinnslu</div></div>
        <div class="tv-kpi sp-kpi-done"><div class="tv-kpi-l">Svarað</div><div class="tv-kpi-v" id="sp-k-done">—</div><div class="tv-kpi-x">klárað</div></div>
      </div>

      <div class="tv-card">
        <div class="ws-filter-bar">
          <input type="search" id="sp-q" placeholder="Leita í spurningum (sendandi, efni, snippet)..." />
          <div class="ws-chips" id="sp-chips"></div>
        </div>
      </div>

      <div id="sp-list" class="sp-list"></div>
    </div>
  `;
  bindEditButtons();

  const $refresh = document.getElementById('sp-refresh');
  const $q = document.getElementById('sp-q');
  const $chips = document.getElementById('sp-chips');
  let filterStatus = 'open';
  let qVal = '';
  let debounce;
  let lastData = null;

  function renderChips(counts){
    const opts = [
      ['open',         `Opnar`,           (counts.new||0)+(counts.in_progress||0)],
      ['new',          'Nýjar',           counts.new||0],
      ['in_progress',  'Í vinnslu',       counts.in_progress||0],
      ['snoozed',      'Frestaðar',       counts.snoozed||0],
      ['answered',     'Svarað',          counts.answered||0],
      ['dismissed',    'Frávísað',        counts.dismissed||0],
      ['all',          'Allt',            counts.total||0],
    ];
    $chips.innerHTML = opts.map(([id,label,n]) => `
      <button class="chip ${filterStatus===id?'active':''}" data-filter="${id}">${escapeHtml(label)} <span class="chip-n">${n}</span></button>
    `).join('');
    $chips.querySelectorAll('button[data-filter]').forEach(b => b.addEventListener('click', () => {
      filterStatus = b.dataset.filter;
      load();
    }));
  }

  function formatWhen(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString('is-IS', {hour:'2-digit', minute:'2-digit'});
      return d.toLocaleDateString('is-IS', {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString('is-IS', {hour:'2-digit', minute:'2-digit'});
    } catch(e){ return ''; }
  }

  async function updateAction(email_id, patch){
    await fetch('/api/email-tasks', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email_id, ...patch }),
    });
  }

  function renderList(rows){
    const $list = document.getElementById('sp-list');
    if (!rows.length) { $list.innerHTML = '<div class="empty">Engar spurningar í þessum flokki.</div>'; return; }
    $list.innerHTML = rows.map(r => {
      const st = SP_STATUS[r.status] || SP_STATUS.new;
      const pr = SP_PRIORITY[r.priority] || SP_PRIORITY.normal;
      const sender = r.sender_name || r.sender_email || '(ókunn.)';
      return `
        <div class="sp-card ${st.cls}" data-email-id="${r.id}">
          <div class="sp-card-head">
            <span class="sp-status-pill ${st.cls}" data-action="cycle-status" title="Smelltu til að breyta">
              <span class="sp-icon">${st.icon}</span> ${escapeHtml(st.label)}
            </span>
            <span class="sp-pri-pill ${pr.cls}" data-action="cycle-priority" title="Smelltu til að breyta forgang">
              ${escapeHtml(pr.label)}
            </span>
            <span class="sp-sender">${escapeHtml(sender)}</span>
            <span class="sp-account">${escapeHtml(r.account||'')}</span>
            <span class="sp-when">${escapeHtml(formatWhen(r.received_at))}</span>
          </div>
          <div class="sp-subject">${escapeHtml(r.subject||'(engin efnislína)')}</div>
          <div class="sp-snippet">${escapeHtml(r.snippet||'')}</div>
          <div class="sp-actions">
            <button class="sp-act-btn" data-action="answered">✓ Svarað</button>
            <button class="sp-act-btn" data-action="in_progress">⋯ Í vinnslu</button>
            <button class="sp-act-btn" data-action="snoozed">⏸ Fresta</button>
            <button class="sp-act-btn" data-action="dismissed">× Vísa frá</button>
            <button class="sp-act-btn sp-act-add-note" data-action="add-note">📝 Athugasemd</button>
          </div>
          ${r.notes ? `<div class="sp-notes">📝 ${escapeHtml(r.notes)}</div>` : ''}
          ${r.linked_worksite ? `<div class="sp-linked">🏗 Verkstaður: ${escapeHtml(r.linked_worksite)}</div>` : ''}
        </div>`;
    }).join('');

    // Wire interactions
    const STATUS_CYCLE = ['new','in_progress','answered','dismissed','snoozed'];
    const PRIORITY_CYCLE = ['normal','high','low'];

    $list.querySelectorAll('[data-action="cycle-status"]').forEach(el => el.addEventListener('click', async e => {
      const card = e.target.closest('.sp-card');
      const id = parseInt(card.dataset.emailId, 10);
      const row = lastData.rows.find(r => r.id === id);
      const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(row.status)+1) % STATUS_CYCLE.length];
      await updateAction(id, { status: next });
      await load();
    }));
    $list.querySelectorAll('[data-action="cycle-priority"]').forEach(el => el.addEventListener('click', async e => {
      const card = e.target.closest('.sp-card');
      const id = parseInt(card.dataset.emailId, 10);
      const row = lastData.rows.find(r => r.id === id);
      const next = PRIORITY_CYCLE[(PRIORITY_CYCLE.indexOf(row.priority)+1) % PRIORITY_CYCLE.length];
      await updateAction(id, { priority: next });
      await load();
    }));
    $list.querySelectorAll('.sp-act-btn').forEach(btn => btn.addEventListener('click', async e => {
      const card = e.target.closest('.sp-card');
      const id = parseInt(card.dataset.emailId, 10);
      const action = btn.dataset.action;
      if (action === 'add-note') {
        const row = lastData.rows.find(r => r.id === id);
        const note = prompt('Athugasemd:', row.notes || '');
        if (note === null) return;
        await updateAction(id, { notes: note.trim() || null });
      } else {
        // Status shortcuts
        await updateAction(id, { status: action });
      }
      await load();
    }));
  }

  async function load(){
    document.getElementById('sp-meta').textContent = 'Sækir…';
    $refresh.disabled = true; $refresh.classList.add('loading');
    try {
      const params = new URLSearchParams({ status: filterStatus, limit: '200' });
      if (qVal) params.set('q', qVal);
      const r = await fetch('/api/email-tasks?' + params.toString());
      if (!r.ok) {
        const e = await r.json().catch(()=>({error:'Villa'}));
        document.getElementById('sp-meta').innerHTML = `<span style="color:var(--red)">${escapeHtml(e.error||'HTTP '+r.status)}</span>`;
        return;
      }
      lastData = await r.json();
      const c = lastData.counts;
      document.getElementById('sp-k-new').textContent  = c.new||0;
      document.getElementById('sp-k-prog').textContent = c.in_progress||0;
      document.getElementById('sp-k-high').textContent = c.high_priority||0;
      document.getElementById('sp-k-done').textContent = c.answered||0;
      document.getElementById('sp-meta').textContent = `${lastData.count} sýnd · ${lastData.total} alls`;
      renderChips(c);
      renderList(lastData.rows);
    } finally {
      $refresh.disabled = false; $refresh.classList.remove('loading');
    }
  }

  $refresh.addEventListener('click', load);
  $q.addEventListener('input', e => {
    qVal = e.target.value.trim();
    if (debounce) clearTimeout(debounce);
    debounce = setTimeout(load, 250);
  });

  load();
}

      <div class="tv-card ws-actions-card" id="ws-actions-card" hidden>
        <div class="tv-card-head">
          <div class="tv-card-title">Næstu skref til að græna</div>
          <div class="tv-card-sub">Sjálfvirkt forgangsraðað eftir áhrifum (klst og kr)</div>
        </div>
        <div class="ws-actions-grid">
          <div>
            <div class="ws-actions-h">⚠ Vinna en enginn reikningur — útgefa</div>
            <div class="ws-actions-col" id="ws-actions-bill"></div>
          </div>
          <div>
            <div class="ws-actions-h">💰 Reikningur útgefinn en ógreitt — innheimta</div>
            <div class="ws-actions-col" id="ws-actions-collect"></div>
          </div>
        </div>
      </div>

      <div class="tv-card">
        <div class="ws-filter-bar">
          <input type="search" id="ws-q" placeholder="Leita í verkstöðum..." />
          <div class="ws-chips" id="ws-chips"></div>
        </div>
      </div>

      <div id="ws-list" class="ws-list"></div>
    </div>
  `;
  bindEditButtons();

  const $year = document.getElementById('ws-year');
  const $refresh = document.getElementById('ws-refresh');
  const $q = document.getElementById('ws-q');
  const $chips = document.getElementById('ws-chips');
  const currentYear = new Date().getFullYear();
  let selectedYear = currentYear;
  let activeFilter = 'all';
  let qVal = '';
  let lastData = null;

  for (let y = currentYear; y >= currentYear - 3; y--) {
    const opt = document.createElement('option');
    opt.value = String(y); opt.textContent = String(y);
    $year.appendChild(opt);
  }
  // Add combined option (current year + last year) for cross-year audit
  const combinedOpt = document.createElement('option');
  combinedOpt.value = 'combined'; combinedOpt.textContent = `${currentYear-1}+${currentYear}`;
  $year.appendChild(combinedOpt);
  $year.value = String(selectedYear);

  function renderChips(byStatus, noInvoiceCount){
    const total = (byStatus.unreviewed||0)+(byStatus.review||0)+(byStatus.billing_in_progress||0)+(byStatus.invoiced||0)+(byStatus.not_billable||0);
    const opts = [
      ['all',           'Allt',                total],
      ['no_invoice',    '⚠ Án reiknings',      noInvoiceCount || 0],
      ['unreviewed',    'Óstaðfest',           byStatus.unreviewed||0],
      ['review',        'Í skoðun',            byStatus.review||0],
      ['billing_in_progress','Í reikningi',    byStatus.billing_in_progress||0],
      ['invoiced',      'Reikningur sendur',   byStatus.invoiced||0],
      ['not_billable',  'Ekki rukkanlegt',     byStatus.not_billable||0],
    ];
    $chips.innerHTML = opts.map(([id, label, n]) => `
      <button class="chip ${activeFilter===id?'active':''} ${id==='no_invoice'?'chip-warn':''}" data-filter="${id}">${escapeHtml(label)} <span class="chip-n">${n}</span></button>
    `).join('');
    $chips.querySelectorAll('button[data-filter]').forEach(b => b.addEventListener('click', () => {
      activeFilter = b.dataset.filter;
      $chips.querySelectorAll('button[data-filter]').forEach(x => x.classList.toggle('active', x === b));
      renderList();
    }));
  }

  function renderList(){
    if (!lastData) return;
    const $list = document.getElementById('ws-list');
    let rows = lastData.worksites.slice();
    if (activeFilter === 'no_invoice') {
      rows = rows.filter(w => (w.invoice_count||0) === 0 && w.hours > 0 && !/almennt|veikindi|sick|work at home/i.test(w.project));
    } else if (activeFilter !== 'all') {
      rows = rows.filter(w => w.status.billing_status === activeFilter);
    }
    if (qVal) {
      const q = qVal.toLowerCase();
      rows = rows.filter(w => w.project.toLowerCase().includes(q));
    }
    if (!rows.length) { $list.innerHTML = '<div class="empty">Engir verkstaðir í þessum flokki.</div>'; return; }

    $list.innerHTML = rows.map(w => {
      const st = WS_STATUS_LABEL[w.status.billing_status] || WS_STATUS_LABEL.unreviewed;
      const monthly = Object.keys(w.monthly).sort();
      const maxM = Math.max(0.001, ...Object.values(w.monthly));
      const isNonBillable = /almennt|veikindi|sick|work at home/i.test(w.project);
      const hasInvoice  = (w.invoice_count || 0) > 0;
      const fullyPaid   = hasInvoice && (w.invoice_unpaid || 0) === 0;
      const monthLabels = monthly.map(m => {
        const month = parseInt(m.slice(5,7),10);
        return ['','Jan','Feb','Mar','Apr','Maí','Jún','Júl','Ágú','Sep','Okt','Nóv','Des'][month] || m;
      });
      const monthBars = monthly.map((m, i) => {
        const h = w.monthly[m];
        const pct = (h / maxM * 100).toFixed(0);
        return `<div class="ws-cell ws-cell-bar" title="${monthLabels[i]}: ${h.toFixed(1)} klst">
          <div class="ws-mbar-fill" style="height:${pct}%"></div>
        </div>`;
      }).join('');
      const sentCells = monthly.map((m, i) => {
        const h = w.monthly[m];
        if (!h) return '<div class="ws-cell ws-cell-empty"></div>';
        if (isNonBillable) return '<div class="ws-cell ws-cell-na" title="Ekki rukkanlegt"></div>';
        if (hasInvoice) return `<div class="ws-cell ws-cell-ok" title="${monthLabels[i]}: reikningur sendur"></div>`;
        return `<div class="ws-cell ws-cell-warn" title="${monthLabels[i]}: vinna en enginn reikningur"></div>`;
      }).join('');
      const paidCells = monthly.map((m, i) => {
        const h = w.monthly[m];
        if (!h) return '<div class="ws-cell ws-cell-empty"></div>';
        if (isNonBillable) return '<div class="ws-cell ws-cell-na"></div>';
        if (!hasInvoice) return '<div class="ws-cell ws-cell-empty"></div>';
        if (fullyPaid) return `<div class="ws-cell ws-cell-ok" title="${monthLabels[i]}: greitt"></div>`;
        return `<div class="ws-cell ws-cell-warn" title="${monthLabels[i]}: reikningur enn ógreiddur"></div>`;
      }).join('');
      const monthHeaders = monthLabels.map(l => `<div class="ws-cell ws-cell-hdr">${l}</div>`).join('');
      const cardStateClass = isNonBillable ? 'ws-card-na'
        : !hasInvoice ? 'ws-card-warn'
        : !fullyPaid  ? 'ws-card-progress'
        : 'ws-card-done';

      return `
        <div class="ws-card ${cardStateClass}" data-project="${escapeAttr(w.project)}">
          <div class="ws-card-l">
            <div class="ws-card-head">
              <div class="ws-card-name">${escapeHtml(w.project)}</div>
              <span class="ws-status ${st.cls}" data-action="toggle-status">
                <span class="ws-status-icon">${st.icon}</span> ${escapeHtml(st.label)}
              </span>
            </div>
            <div class="ws-card-stats">
              <span><strong>${w.hours.toLocaleString('is-IS')}</strong> klst</span>
              <span>·</span>
              <span><strong>${w.days}</strong> dagar</span>
              <span>·</span>
              <span><strong>${w.staff_count}</strong> starfsmenn</span>
              <span>·</span>
              <span>${w.ajour_registrations ? `<strong>${w.ajour_registrations.toLocaleString('is-IS')}</strong> Ajour skráningar · ` : ''}${w.first} → ${w.last}</span>
            </div>
            <div class="ws-card-billing">
              ${w.invoice_count > 0
                ? `<span class="ws-bill-pill ws-bill-ok">💰 ${w.invoice_count} reikning${w.invoice_count===1?'ur':'ar'} · ${(w.invoice_total).toLocaleString('is-IS')} kr ${w.invoice_unpaid>0 ? `<span class="ws-bill-unpaid">· ógr.: ${w.invoice_unpaid.toLocaleString('is-IS')} kr</span>` : ''}${w.retention_held>0 ? `<span class="ws-bill-retention" title="Áætlaður öryggisfé halda — ekki gjaldfallinn">· haldið: ${w.retention_held.toLocaleString('is-IS')} kr</span>` : ''}${w.bank_covered_hidden>0 ? `<span class="ws-bill-bank" title="Komin inn í banka en Payday ekki uppfært">· greitt í banka: ${w.bank_covered_hidden.toLocaleString('is-IS')} kr</span>` : ''}</span>`
                : (/almennt|veikindi|sick|work at home/i.test(w.project)
                    ? '<span class="ws-bill-pill ws-bill-na">— ekki rukkanlegt</span>'
                    : '<span class="ws-bill-pill ws-bill-warn">⚠ enginn reikningur tengdur</span>')}
              <button class="ws-link-add" data-action="map-customer">+ Tengja viðskiptavin</button>
              ${w.mapped_customer_info && w.mapped_customer_info.length ? `<div class="ws-customers">
                ${w.mapped_customer_info.map(ci => {
                  const bits = [];
                  if (ci.payment_method) bits.push(`<span class="ws-ci-pm ws-ci-pm-${ci.payment_method.replace(/[^a-z]/gi,'')}">${escapeHtml(ci.payment_method)}</span>`);
                  if (ci.retention_pct && Number(ci.retention_pct) > 0) bits.push(`<span class="ws-ci-ret">${ci.retention_pct}% haldið</span>`);
                  if (ci.payment_terms) bits.push(`<span class="ws-ci-term">${escapeHtml(ci.payment_terms)}</span>`);
                  return `<span class="ws-ci" data-action="edit-customer" data-customer="${escapeAttr(ci.customer_name)}" title="${escapeAttr(ci.general_notes || 'Smelltu til að uppfæra')}"><strong>${escapeHtml(ci.customer_name)}</strong> ${bits.join(' ')}</span>`;
                }).join('')}
              </div>` : ''}
            </div>
            <div class="ws-pipeline">
              <div class="ws-pipe-row ws-pipe-row-hdr"><span class="ws-pipe-lbl"></span><div class="ws-pipe-cells">${monthHeaders}</div></div>
              <div class="ws-pipe-row"><span class="ws-pipe-lbl" title="Klukkutímar — vinna lokið">⏱ Vinna</span><div class="ws-pipe-cells">${monthBars}</div></div>
              <div class="ws-pipe-row"><span class="ws-pipe-lbl" title="Reikningur útgefinn">📤 Reikningur</span><div class="ws-pipe-cells">${sentCells}</div></div>
              <div class="ws-pipe-row"><span class="ws-pipe-lbl" title="Greiðsla móttekin">💰 Greitt</span><div class="ws-pipe-cells">${paidCells}</div></div>
            </div>
            <div class="ws-card-meta">
              ${w.email_count > 0 ? `<button class="ws-email-btn" data-action="show-emails">📧 ${w.email_count} póst${w.email_count===1?'ur':'ar'} tengjast</button>` : '<span class="ws-no-email">Engir tengdir póstar</span>'}
              ${w.status.drive_folder_url ? `<a href="${escapeAttr(w.status.drive_folder_url)}" target="_blank" rel="noopener" class="ws-link">📁 Drive mappa ↗</a>` : '<button class="ws-link-add" data-action="add-drive">+ Drive slóð</button>'}
              ${w.status.notes ? `<span class="ws-notes">📝 ${escapeHtml(w.status.notes.slice(0,100))}${w.status.notes.length>100?'…':''}</span>` : ''}
            </div>
            <div class="ws-emails" hidden>
              ${w.emails.map(e => `<div class="ws-email">
                <div class="ws-email-head">
                  <span class="ws-email-sender">${escapeHtml(e.sender)}</span>
                  <span class="ws-email-acct">${escapeHtml(e.account)}</span>
                  <span class="ws-email-when">${e.received_at ? new Date(e.received_at).toLocaleDateString('is-IS') : ''}</span>
                </div>
                <div class="ws-email-subj">${escapeHtml(e.subject)}</div>
                <div class="ws-email-snip">${escapeHtml(e.snippet)}</div>
              </div>`).join('')}
              ${w.email_count > w.emails.length ? `<div class="ws-email-more">(+${w.email_count - w.emails.length} fleiri ekki sýndir)</div>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');

    // Wire up action buttons
    $list.querySelectorAll('[data-action="show-emails"]').forEach(b => b.addEventListener('click', e => {
      const card = e.target.closest('.ws-card');
      const block = card.querySelector('.ws-emails');
      block.hidden = !block.hidden;
      b.textContent = block.hidden ? b.textContent.replace('Fela','📧').replace(/^📧 /, '📧 ') : '📧 Fela póst' + (b.dataset.suffix||'');
    }));
    $list.querySelectorAll('[data-action="toggle-status"]').forEach(b => b.addEventListener('click', async e => {
      const card = e.target.closest('.ws-card');
      const project = card.dataset.project;
      const w = lastData.worksites.find(x => x.project === project);
      const cur = w.status.billing_status || 'unreviewed';
      const idx = WS_STATUS_ORDER.indexOf(cur);
      const next = WS_STATUS_ORDER[(idx + 1) % WS_STATUS_ORDER.length];
      await updateStatus(project, { billing_status: next });
      w.status.billing_status = next;
      renderList();
      // Refresh summary KPIs
      const counts = { unreviewed:0, review:0, billing_in_progress:0, invoiced:0, not_billable:0 };
      lastData.worksites.forEach(x => { counts[x.status.billing_status||'unreviewed']++; });
      lastData.summary.by_status = counts;
      renderSummary(lastData.summary);
      renderChips(counts);
    }));
    $list.querySelectorAll('[data-action="add-drive"]').forEach(b => b.addEventListener('click', async e => {
      const card = e.target.closest('.ws-card');
      const project = card.dataset.project;
      const url = prompt('Líma inn Google Drive slóð fyrir "'+project+'":');
      if (!url) return;
      await updateStatus(project, { drive_folder_url: url });
      const w = lastData.worksites.find(x => x.project === project);
      w.status.drive_folder_url = url;
      renderList();
    }));
    $list.querySelectorAll('[data-action="edit-customer"]').forEach(el => el.addEventListener('click', async e => {
      const cust = el.dataset.customer;
      // Get current info
      let cur = {};
      try { cur = (await (await fetch('/api/customer-info?name=' + encodeURIComponent(cust))).json()).rows?.[0] || {}; } catch {}
      const method = prompt(`Greiðsluleið fyrir ${cust}\n("payday" / "bank-direct" / "mix" / blank)`, cur.payment_method || '');
      if (method === null) return;
      const retentionStr = prompt(`Öryggisfé (%) fyrir ${cust}\n(t.d. 10, 0, blank)`, String(cur.retention_pct || 0));
      if (retentionStr === null) return;
      const terms = prompt(`Greiðsluskilmálar fyrir ${cust}\n(t.d. "30 days net")`, cur.payment_terms || '');
      if (terms === null) return;
      const notes = prompt(`Athugasemd fyrir ${cust}`, cur.general_notes || '');
      if (notes === null) return;
      try {
        await fetch('/api/customer-info', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            customer_name: cust,
            payment_method: method.trim() || null,
            retention_pct: parseFloat(retentionStr) || 0,
            payment_terms: terms.trim() || null,
            general_notes: notes.trim() || null,
          }),
        });
        await load(true);
      } catch(err) { alert('Villa: '+err.message); }
    }));
    $list.querySelectorAll('[data-action="map-customer"]').forEach(b => b.addEventListener('click', async e => {
      const card = e.target.closest('.ws-card');
      const project = card.dataset.project;
      const customer = prompt('Heiti viðskiptavinar sem á að tengja við "'+project+'" (þeir reikningar verða tengdir þessum verkstað):');
      if (!customer || !customer.trim()) return;
      try {
        const r = await fetch('/api/customer-map', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ customer_name: customer.trim(), worksite_name: project }),
        });
        if (!r.ok) { alert('Villa: '+await r.text()); return; }
        await load(true);
      } catch(e){ alert('Villa: '+e.message); }
    }));
  }

  async function updateStatus(project_name, patch){
    try {
      await fetch('/api/worksites', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ project_name, year: selectedYear, ...patch }),
      });
    } catch (e) { alert('Villa: '+e.message); }
  }

  function renderSummary(s){
    document.getElementById('ws-kpi-count').textContent = s.total_worksites;
    document.getElementById('ws-kpi-hours').textContent = s.total_hours.toLocaleString('is-IS');
    document.getElementById('ws-kpi-ajour').textContent = (s.total_ajour_registrations||0).toLocaleString('is-IS');
    document.getElementById('ws-kpi-no-inv').textContent = s.worksites_with_no_invoice || 0;
    document.getElementById('ws-kpi-inv-total').textContent = ((s.total_invoiced||0)/1e6).toFixed(1) + 'M kr';
    document.getElementById('ws-kpi-unpaid-x').textContent = ((s.total_unpaid||0)).toLocaleString('is-IS') + ' kr ógr.';
  }

  function renderActions(){
    if (!lastData) return;
    const NON = /almennt|veikindi|sick|work at home/i;
    const billable = lastData.worksites.filter(w => !NON.test(w.project) && w.hours > 0);
    const needsBilling = billable
      .filter(w => (w.invoice_count||0) === 0)
      .sort((a,b) => b.hours - a.hours)
      .slice(0, 8);
    const needsCollection = billable
      .filter(w => (w.invoice_unpaid||0) > 0)
      .sort((a,b) => (b.invoice_unpaid||0) - (a.invoice_unpaid||0))
      .slice(0, 8);
    const card = document.getElementById('ws-actions-card');
    if (!needsBilling.length && !needsCollection.length) { card.hidden = true; return; }
    card.hidden = false;
    document.getElementById('ws-actions-bill').innerHTML = needsBilling.length ? needsBilling.map(w => `
      <a class="ws-action-item" href="#" data-jump="${escapeAttr(w.project)}">
        <span class="ws-action-name">${escapeHtml(w.project)}</span>
        <span class="ws-action-meta"><strong>${w.hours.toLocaleString('is-IS')}</strong> klst · ${w.days} dagar · ${w.staff_count} starfsmenn</span>
        ${w.ajour_registrations ? `<span class="ws-action-sub">${w.ajour_registrations.toLocaleString('is-IS')} Ajour skráningar</span>` : ''}
      </a>
    `).join('') : '<div class="ws-action-empty">— Allt í lagi hér.</div>';
    document.getElementById('ws-actions-collect').innerHTML = needsCollection.length ? needsCollection.map(w => `
      <a class="ws-action-item" href="#" data-jump="${escapeAttr(w.project)}">
        <span class="ws-action-name">${escapeHtml(w.project)}</span>
        <span class="ws-action-meta"><strong>${(w.invoice_unpaid/1e6).toFixed(1)}M kr</strong> ógr. · ${w.invoice_count} reikning${w.invoice_count===1?'ur':'ar'}</span>
        ${w.mapped_customers && w.mapped_customers.length ? `<span class="ws-action-sub">${escapeHtml(w.mapped_customers.join(', '))}</span>` : ''}
      </a>
    `).join('') : '<div class="ws-action-empty">— Engir reikningar í vanskilum 🎉</div>';

    card.querySelectorAll('.ws-action-item').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      const proj = a.dataset.jump;
      const target = document.querySelector(`.ws-card[data-project="${CSS.escape(proj)}"]`);
      if (target) {
        target.scrollIntoView({behavior:'smooth', block:'center'});
        target.style.outline = '3px solid var(--gold)';
        setTimeout(() => target.style.outline = '', 1800);
      }
    }));
  }

  async function load(force){
    document.getElementById('ws-meta').textContent = 'Sækir…';
    $refresh.disabled = true; $refresh.classList.add('loading');
    try {
      const cb = force ? ('&_=' + Date.now()) : '';
      const r = await fetch(`/api/worksites?year=${selectedYear}${cb}`);
      if (!r.ok) {
        const e = await r.json().catch(()=>({error:'Villa'}));
        document.getElementById('ws-meta').innerHTML = `<span style="color:var(--red)">${escapeHtml(e.error||('HTTP '+r.status))}</span>`;
        return;
      }
      lastData = await r.json();
      document.getElementById('ws-yr-label').textContent = lastData.summary.year;
      document.getElementById('ws-meta').textContent = `${lastData.summary.total_worksites} verkstaðir · ${lastData.summary.total_hours.toLocaleString('is-IS')} klst · ${(lastData.summary.total_ajour_registrations||0).toLocaleString('is-IS')} Ajour skráningar · ${lastData.summary.total_days} virkir dagar`;
      renderSummary(lastData.summary);
      renderChips(lastData.summary.by_status, lastData.summary.worksites_with_no_invoice);
      renderActions();
      renderList();
    } finally {
      $refresh.disabled = false; $refresh.classList.remove('loading');
    }
  }

  $year.addEventListener('change', e => { selectedYear = parseInt(e.target.value,10); load(false); });
  $refresh.addEventListener('click', () => load(true));
  $q.addEventListener('input', e => { qVal = e.target.value.trim(); renderList(); });

  // Google connection status + Tengja button
  let googleConnected = false;
  async function checkGoogle(){
    const pill = document.getElementById('ws-google-status');
    try {
      const r = await fetch('/api/google-auth?status=1');
      const d = await r.json();
      googleConnected = !!d.connected;
      if (googleConnected) {
        pill.className = 'ws-google-pill ws-google-on';
        pill.innerHTML = `✓ ${escapeHtml(d.user_email||'tengt')}`;
        pill.title = 'Smelltu til að endurnýja tengingu';
      } else {
        pill.className = 'ws-google-pill ws-google-off';
        pill.innerHTML = '✦ Tengja Google';
        pill.title = 'Veita aðgang að Drive og Gmail';
      }
      pill.onclick = async () => {
        const ar = await fetch('/api/google-auth?json=1');
        const j = await ar.json();
        if (j.url) window.location.href = j.url;
      };
      pill.style.cursor = 'pointer';
    } catch(e){
      pill.textContent = 'Google: villa';
    }
  }
  checkGoogle();

  // If we just came back from OAuth, show toast
  if (location.search.includes('google=ok')) {
    setTimeout(() => alert('Google tenging tókst! Drive-möppur birtast núna á hverjum verkstað.'), 300);
    history.replaceState({}, '', location.pathname + '?cb=ws');
  }

  // After each renderList, auto-search Drive folders for any worksite that doesn't have one set
  const origRenderList = renderList;
  renderList = async function(){
    origRenderList();
    if (!googleConnected || !lastData) return;
    const cards = document.querySelectorAll('.ws-card');
    for (const card of cards) {
      const project = card.dataset.project;
      const w = lastData.worksites.find(x => x.project === project);
      if (!w || w.status.drive_folder_url) continue;
      // Skip generic buckets
      if (/almennt|veikindi|sick|work at home/i.test(project)) continue;
      try {
        const core = project.split(/[\s,\-]+/).filter(p => p.length > 2).slice(0,2).join(' ');
        if (!core) continue;
        const r = await fetch('/api/drive-folders?q=' + encodeURIComponent(core) + '&limit=5');
        if (!r.ok) continue;
        const d = await r.json();
        if (!d.files || !d.files.length) continue;
        const folders = d.files.filter(f => f.is_folder).slice(0, 3);
        if (!folders.length) continue;
        // Inject into the meta row
        const meta = card.querySelector('.ws-card-meta');
        if (meta && !meta.querySelector('.ws-drive-hits')) {
          const span = document.createElement('span');
          span.className = 'ws-drive-hits';
          span.innerHTML = '📁 ' + folders.map(f =>
            `<a class="ws-drive-link" href="${escapeAttr(f.web_link)}" target="_blank" rel="noopener" data-folder-id="${escapeAttr(f.id)}" title="Smelltu hægri til að festa við þennan verkstað">${escapeHtml(f.name)} ↗</a>`
          ).join(' · ');
          meta.appendChild(span);
          // Right-click → save as the canonical Drive URL for this worksite
          span.querySelectorAll('.ws-drive-link').forEach(a => a.addEventListener('contextmenu', async (e) => {
            e.preventDefault();
            if (!confirm('Festa "'+a.textContent.replace(/ ↗$/,'')+'" sem Drive-möppu fyrir '+project+'?')) return;
            await updateStatus(project, { drive_folder_url: a.href });
            w.status.drive_folder_url = a.href;
            renderList();
          }));
        }
      } catch(e){ /* ignore individual misses */ }
    }
  };

  load(false);
}

// Source: per-worksite Efnislisti xlsx templates. Default used for
// any worksite not in this map. Add overrides as you find them in
// the templates.
const RG_DEFAULT_RATE_DV = 9951;
const RG_DEFAULT_RATE_EV = 14927;
const RG_RATES = {

  // 'Fjarðagata':            { dv: 9951,  ev: 14927 },  // confirmed default
};
function rgRateFor(project){
  // 1. Prefer rates from the pricing_guide table (live, editable per worksite)
  const pg = (window.__rgPricingGuide || {})[project];
  if(pg && (pg.dagvinna_rate || pg.eftirvinna_rate)){
    return {
      dv: Number(pg.dagvinna_rate)   || RG_DEFAULT_RATE_DV,
      ev: Number(pg.eftirvinna_rate) || RG_DEFAULT_RATE_EV,
    };
  }
  // 2. Fall back to the hardcoded map (only used until pricing_guide is loaded)
  return RG_RATES[project] || { dv: RG_DEFAULT_RATE_DV, ev: RG_DEFAULT_RATE_EV };
}

          <div class="rg-fc-cell rg-fc-total"><div class="rg-fc-l">Samtals óbillað</div><div class="rg-fc-v" id="rg-fc-total-v">—</div><div class="rg-fc-x">spá m. vsk</div></div>

  bindEditButtons();

  const $win = document.getElementById('rg-window');
  const $refresh = document.getElementById('rg-refresh');
  const $host = document.getElementById('rg-grid-host');
  let lastData = null;

  function setMeta(s){
    const el = document.getElementById('rg-meta');
    if(el) el.textContent = s;
  }

  async function load(){
    setMeta('Sækir…');
    if($refresh){ $refresh.disabled = true; $refresh.classList.add('loading'); }
    try{
      const [r, drR, efR, pgR, rdR] = await Promise.all([
        fetch('/api/worksites?year=combined'),
        fetch('/api/invoice-drafts?status=invoiced').catch(() => null),
        fetch('/api/efnislisti-docs').catch(() => null),
        fetch('/api/pricing-guide').catch(() => null),
        fetch('/api/redder-invoices').catch(() => null),
      ]);
      // Build pricing_guide map → window-global so rgRateFor() can read it
      if (pgR && pgR.ok) {
        const { rows } = await pgR.json();
        window.__rgPricingGuide = {};
        for (const row of (rows||[])) {
          window.__rgPricingGuide[row.worksite_name] = row;
        }
      }
      if(!r.ok) throw new Error('HTTP '+r.status);
      lastData = await r.json();
      // Build (worksite, month) → total Redder material cost (recharged onto invoice)
      lastData.efni_total = {};
      if (rdR && rdR.ok) {
        const { summary } = await rdR.json();
        for (const g of (summary?.by_worksite_month||[])) {
          lastData.efni_total[`${g.worksite}|${g.month}`] = g.total_m_vsk;
        }
      }
      // Build a map of (worksite, month) → manually billed
      lastData.manual_billed = {};
      if (drR && drR.ok) {
        const { rows } = await drR.json();
        for (const row of (rows||[])) {
          if (row.status === 'invoiced') {
            lastData.manual_billed[`${row.worksite_name}|${row.work_month}`] = true;
          }
        }
      }
      // Build a map of (worksite, month) → efnislisti drive file URL
      lastData.efnislisti = {};
      if (efR && efR.ok) {
        const { rows } = await efR.json();
        for (const row of (rows||[])) {
          const k = `${row.worksite_name}|${row.work_month}`;
          if (!lastData.efnislisti[k]) lastData.efnislisti[k] = [];
          lastData.efnislisti[k].push({ id: row.drive_file_id, title: row.title });
        }
      }
      // Bail out if a tab switch destroyed our DOM while the fetch was in flight
      if(!document.getElementById('rg-grid-host')) return;
      render();
      setMeta(`Uppfært ${new Date(lastData.generated_at).toLocaleTimeString('is-IS')} · ${lastData.summary.total_worksites} verkstaðir`);
    }catch(e){
      setMeta('Villa: '+(e.message||e));
    }finally{
      if($refresh){ $refresh.disabled = false; $refresh.classList.remove('loading'); }
    }
  }

  function buildMonthList(){
    const winVal = $win.value;
    const today = new Date();
    const out = [];
    if(winVal === 'ytd'){
      for(let m=0; m<=today.getMonth(); m++){
        out.push(`${today.getFullYear()}-${String(m+1).padStart(2,'0')}`);
      }
    } else {
      const n = parseInt(winVal, 10) || 8;
      for(let i=n-1; i>=0; i--){
        const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
        out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      }
    }
    return out;
  }

  function monthLabel(ym){
    const [y,m] = ym.split('-');
    const names = ['Jan','Feb','Mar','Apr','Maí','Jún','Júl','Ágú','Sep','Okt','Nóv','Des'];
    return `${names[parseInt(m,10)-1]} ${y.slice(2)}`;
  }

  function bucketInvoicesByMonth(invoices){
    const out = {};
    for(const inv of (invoices||[])){
      if(!inv.gjalddagi) continue;
      const ym = String(inv.gjalddagi).slice(0,7);
      if(!out[ym]) out[ym] = { amount:0, count:0, anyPaid:false, allPaid:true, anyOpen:false };
      const amt = Number(inv.amount||0);
      out[ym].amount += amt;
      out[ym].count += 1;
      const paid = /greidd|greitt/i.test(inv.status||'') || inv.greidsla_date;
      if(paid) out[ym].anyPaid = true; else out[ym].allPaid = false;
      if(/ógreidd|ógreitt|vanskil/i.test(inv.status||'')) out[ym].anyOpen = true;
    }
    return out;
  }

  function sourceIcon(project, hours, hasInvoices){
    if(RG_GATA_VERKEFNI.has(project) || /landsspítal|landsspital|nlsh|heklu|dalvegur 30/i.test(project)){
      return { icon:'🏗', cls:'rg-src-aj', title:'Ajour-byggt (Gata verkefni)' };
    }
    if(hours > 0){
      return { icon:'⏱', cls:'rg-src-tv', title:'Tímavera-byggt' };
    }
    return { icon:'💰', cls:'rg-src-fx', title:'Fast verð / annað' };
  }

  function isGata(project){
    return RG_GATA_VERKEFNI.has(project) || /landsspítal|landsspital|nlsh|^heklu/i.test(project);
  }

  function fmtIsk(n){ return n ? Math.round(n).toLocaleString('is-IS') : ''; }

  function rowLinks(w, months, invByMonth){
    const drive = w.status?.drive_folder_url || '';
    const project = w.project;
    const gmail = `https://mail.google.com/mail/u/0/?authuser=bokhald@brunaholf.is#search/${encodeURIComponent(project)}`;
    const gata = isGata(project);
    const projAttr = escapeAttr(project);
    const customer = (w.mapped_customers||[])[0] || '';
    const rates = rgRateFor(project);
    // Build /reikningur deep link with most-recent month-with-hours-but-no-invoice
    let efnisMonth = '', efnisHours = 0;
    for(let i = months.length-1; i >= 0; i--){
      const ym = months[i];
      const hr = (w.monthly||{})[ym] || 0;
      if(hr > 0 && !invByMonth[ym]){ efnisMonth = ym; efnisHours = hr; break; }
    }
    if(!efnisMonth && months.length){
      efnisMonth = months[months.length-1];
      efnisHours = (w.monthly||{})[efnisMonth] || 0;
    }
    const efnisUrl = `/reikningur?worksite=${encodeURIComponent(project)}&customer=${encodeURIComponent(customer)}&month=${encodeURIComponent(efnisMonth)}&dv_hours=${efnisHours.toFixed(2)}&dv_rate=${rates.dv}&ev_rate=${rates.ev}`;
    return `
      <a class="rg-link rg-link-pill" href="${efnisUrl}" target="_blank" rel="noopener" title="Opna Efnislista fyrir ${efnisMonth || 'nýjasta mánuð'}">📝</a>
      <button type="button" class="rg-link rg-link-btn" data-rg-calc="${projAttr}" title="Reikna næsta reikning">🧾</button>
      <a class="rg-link ${drive?'':'rg-link-empty'}" href="${escapeHtml(drive||'#')}" target="_blank" rel="noopener" title="Drive mappa">📁</a>
      <a class="rg-link" href="${gata?RG_AJOUR_URL:RG_TIMAVERA_URL}" target="_blank" rel="noopener" title="${gata?'Opna Ajour':'Opna Tímavera'}">${gata?'🏗':'⏱'}</a>
      <a class="rg-link" href="${RG_PAYDAY_URL}" target="_blank" rel="noopener" title="Opna Payday">💳</a>
      <a class="rg-link" href="${gmail}" target="_blank" rel="noopener" title="Leita í bokhald inbox">📧</a>
      <button type="button" class="rg-link rg-link-btn" data-rg-hide="${projAttr}" title="Fela verkstaðinn">👁</button>
    `;
  }

  // Hidden-project list lives in app state so it persists across devices
  function rgHidden(){
    state.ui = state.ui || {};
    if(!Array.isArray(state.ui.rg_hidden)) state.ui.rg_hidden = [];
    return state.ui.rg_hidden;
  }
  function rgHideProject(name){
    const arr = rgHidden();
    if(!arr.includes(name)){ arr.push(name); save(); render(); }
  }
  function rgUnhideAll(){
    state.ui.rg_hidden = []; save(); render();
  }

  function render(){
    if(!lastData){ $host.innerHTML = ''; return; }
    const months = buildMonthList();
    const hidden = new Set(rgHidden());
    const allSites = (lastData.worksites||[]).filter(w => {
      // skip noise buckets
      if(/almennt|veikindi|sick|work at home|kaffi|fundir/i.test(w.project)) return false;
      // only show sites with activity in window OR with invoices/skuldir
      const hasMonthHours = months.some(ym => (w.monthly||{})[ym] > 0);
      const invByMonth = bucketInvoicesByMonth(w.invoices);
      const hasMonthInv = months.some(ym => invByMonth[ym]);
      return hasMonthHours || hasMonthInv || (w.invoice_unpaid||0) > 0;
    });
    const hiddenInWindow = allSites.filter(w => hidden.has(w.project)).length;
    const sites = allSites.filter(w => !hidden.has(w.project));

    // split: regular (Tímavera) vs Gata verkefni
    const regular = sites.filter(w => !isGata(w.project));
    const gata    = sites.filter(w =>  isGata(w.project));

    // sort each block by hours desc
    regular.sort((a,b) => (b.hours||0) - (a.hours||0));
    gata.sort((a,b) => (b.hours||0) - (a.hours||0));

    // monthly totals across all visible sites
    const monthlyTotals = months.map(ym => {
      let sum = 0;
      for(const w of sites){
        const inv = bucketInvoicesByMonth(w.invoices)[ym];
        sum += inv?.amount || 0;
      }
      return sum;
    });

    const rowHtml = (w) => {
      const src = sourceIcon(w.project, w.hours||0, (w.invoice_count||0) > 0);
      const invByMonth = bucketInvoicesByMonth(w.invoices);
      const cust = (w.mapped_customers||[])[0] || '';
      const skuldir = w.invoice_unpaid || 0;
      const driveUrl = w.status?.drive_folder_url || '';

      return `
        <tr class="${isGata(w.project)?'rg-row-gata':''}">
          <td class="rg-col-drive">
            ${driveUrl
              ? `<a class="rg-drive" href="${escapeHtml(driveUrl)}" target="_blank" rel="noopener" title="Drive mappa">📁</a>`
              : `<span class="rg-drive rg-drive-empty" title="Engin Drive mappa">📁</span>`}
          </td>
          <td class="rg-col-src ${src.cls}" title="${src.title}">${src.icon}</td>
          <td class="rg-col-name"><button type="button" class="rg-name-link" data-rg-wc="${escapeAttr(w.project)}" title="Opna verkstöð / Workcenter">${escapeHtml(w.project)}</button><span class="rg-name-sub">${(w.hours||0).toFixed(0)} klst · ${(w.ajour_registrations||0)} skr.</span></td>
          <td class="rg-col-cust">${escapeHtml(cust)}</td>
          <td class="rg-col-skuldir">${fmtIsk(skuldir)}</td>
          ${months.map(ym => {
            const inv = invByMonth[ym];
            const amt = inv?.amount || 0;
            const rei = !!inv;
            const greitt = !!(inv && inv.allPaid && !inv.anyOpen);
            const monthHours = (w.monthly||{})[ym] || 0;
            // Highlight: hours logged this month but no invoice yet → needs invoicing
            const isAjour = isGata(w.project);
            const needsBill = monthHours > 0 && !rei && !isAjour;
            const cellCls = inv?.anyOpen ? ' rg-attn' : (needsBill ? ' rg-needs-bill' : '');
            // Always show hours when present, plus a rough kr estimate (hours × rate × 1.24)
            // so even months without an invoice surface their value at a glance.
            const rates = rgRateFor(w.project);
            const rateSource = (window.__rgPricingGuide||{})[w.project] ? 'pricing_guide' : (RG_RATES[w.project] ? 'hardcoded' : 'default');
            const estKr = !isAjour ? Math.round(monthHours * rates.dv * 1.24) : 0;
            const hoursLabel = !isAjour && monthHours > 0
              ? `<span class="rg-month-hrs" title="Tímavera klst · taxti ${rates.dv} kr/klst (${rateSource}) · áætluð: ${monthHours.toFixed(1)} × ${rates.dv} × 1.24 = ${fmtIsk(estKr)} kr m.vsk">${monthHours.toFixed(0)}t<span class="rg-month-est">≈${fmtIsk(estKr)}</span></span>`
              : '';
            const amtLabel = amt
              ? `<span class="rg-month-kr">${fmtIsk(amt)}</span>`
              : (hoursLabel ? '' : '<span class="rg-zero">–</span>');
            const cellInner = `${hoursLabel}${hoursLabel && amtLabel ? '<br>' : ''}${amtLabel}`;
            // Check if user has manually marked this month as billed (via override in invoice_drafts)
            const manualBilled = (lastData.manual_billed||{})[`${w.project}|${ym}`];
            const billedCls = manualBilled ? ' rg-billed-manual' : '';
            // Efnislisti docs linked for this (worksite, month) — show 📎 link to the first one
            const efDocs = (lastData.efnislisti||{})[`${w.project}|${ym}`] || [];
            const efLink = efDocs.length
              ? `<a class="rg-month-doc" href="https://drive.google.com/file/d/${efDocs[0].id}/view" target="_blank" rel="noopener" title="Efnislisti: ${escapeAttr(efDocs[0].title)}${efDocs.length>1?' (+'+(efDocs.length-1)+' fleiri)':''}" onclick="event.stopPropagation()">📎</a>`
              : '';
            // Redder material cost for this (worksite, month) — recharged onto customer invoice
            const efniKr = (lastData.efni_total||{})[`${w.project}|${ym}`] || 0;
            const efniLine = efniKr > 0
              ? `<div class="rg-month-efni" title="Efni úr Redder · smelltu til að breyta verðum"><button type="button" class="rg-efni-btn" data-rg-efni="${escapeAttr(w.project)}|${ym}">📦 ${fmtIsk(efniKr)}</button></div>`
              : '';
            return `
              <td class="rg-month${needsBill && !manualBilled?' rg-month-needs':''}${billedCls}" title="${needsBill?(monthHours.toFixed(1)+' klst skráðar — engin reikningur'):''}">
