<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Brunakerfi · Ársskoðun</title>
<style>
  :root {
    --bg:#f1f5f9; --panel:#fff; --line:#e2e8f0; --line2:#eef2f7;
    --text:#0f172a; --muted:#64748b; --accent:#0f172a; --good:#15803d;
    --bad:#b91c1c; --soft:#f8fafc; --amber:#b45309;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:15px; line-height:1.5; }
  .wrap { max-width:880px; margin:0 auto; padding:18px 14px 80px; }
  header { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 18px 16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  header h1 { font-size:20px; margin:0 0 4px; font-weight:750; }
  header .sub { color:var(--muted); font-size:13px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px 16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.03); }
  .panel h2 { font-size:15px; margin:0 0 10px; font-weight:700; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; font-weight:600; }
  input[type=text], input[type=tel], input[type=email], input[type=date],
  textarea, select {
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:10px 11px; font-size:16px; font-family:inherit; background:#fff;
    color:var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(15,23,42,.08);
  }
  .info-row { margin-bottom:9px; }
  /* Compact PDF-style table — same layout on mobile + desktop.
     Columns: heiti | Í lagi | Ólagi | Athugasemd, 1 row per item. */
  .row {
    display:grid; grid-template-columns: minmax(0,1fr) 44px 44px minmax(0,1.1fr);
    gap:4px; align-items:center; padding:5px 6px;
    border-bottom:1px solid var(--line2); font-size:13px;
  }
  .row:last-of-type { border-bottom:none; }
  .row .lbl { font-weight:500; padding-right:4px; line-height:1.3; }
  .sectionhead { background:#fef3c7; padding:5px 8px; border-radius:4px;
    font-weight:700; margin:8px 0 0; font-size:12.5px;
    border:1px solid #fde68a; border-bottom:none; }
  .sectionhead + .row { border-top:1px solid #fde68a; }
  /* Compact column-header row above each section's first row */
  .tablehead {
    display:grid; grid-template-columns: minmax(0,1fr) 44px 44px minmax(0,1.1fr);
    gap:4px; align-items:center; padding:4px 6px;
    background:#f1f5f9; border:1px solid var(--line);
    font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.03em; border-radius:4px 4px 0 0;
  }
  .tablehead > div { text-align:center; }
  .tablehead > div:first-child, .tablehead > div:last-child { text-align:left; }
  .seg { display:flex; gap:2px; justify-content:center; }
  .seg button {
    width:32px; height:32px; border:1px solid var(--line); border-radius:5px;
    background:#fff; padding:0; font-size:14px; cursor:pointer;
    font-family:inherit; color:var(--muted);
    -webkit-tap-highlight-color: transparent; line-height:1;
  }
  .seg button.on.ok    { background:#dcfce7; border-color:#86efac; color:var(--good); font-weight:700; }
  .seg button.on.bad   { background:#fee2e2; border-color:#fca5a5; color:var(--bad); font-weight:700; }
  .athinp {
    width:100%; border:1px solid var(--line); border-radius:4px;
    padding:4px 6px; font-size:12px; min-height:30px;
    font-family:inherit; background:#fff; color:var(--text);
  }
  /* Mobile: keep the compact table but shrink fonts further */
  @media (max-width: 640px) {
    .row, .tablehead { grid-template-columns: minmax(0,1.4fr) 36px 36px minmax(0,1fr); gap:3px; padding:4px 4px; font-size:11.5px; }
    .row .lbl { font-size:11.5px; line-height:1.25; }
    .seg button { width:30px; height:30px; font-size:13px; }
    .athinp { font-size:11.5px; min-height:26px; padding:3px 5px; }
    .sectionhead { font-size:11.5px; padding:4px 6px; }
    .tablehead { font-size:10px; }
  }
  .sig-wrap { border:1px solid var(--line); border-radius:10px; background:#fff;
    overflow:hidden; }
  .sig-wrap canvas { display:block; width:100%; height:160px;
    touch-action:none; cursor:crosshair; background:#fff; }
  .sig-actions { display:flex; justify-content:space-between; align-items:center;
    padding:6px 10px; background:var(--soft); border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); }
  .sig-actions button { border:none; background:transparent; color:var(--accent);
    font-size:13px; cursor:pointer; font-weight:600; padding:4px 8px; }
  .actions { position:sticky; bottom:0; background:rgba(241,245,249,.95);
    backdrop-filter:blur(6px); padding:12px 0 8px; margin-top:18px;
    border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; }
  .btn { border:none; border-radius:10px; padding:14px 22px; font-size:16px;
    cursor:pointer; font-weight:700; font-family:inherit; min-height:50px;
    -webkit-tap-highlight-color: transparent; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#1e293b; }
  .btn-primary:disabled { background:#cbd5e1; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--muted); }
  .status { padding:14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .status.error   { background:#fee2e2; border:1px solid #fca5a5; color:#7f1d1d; }
  .status.success { background:#dcfce7; border:1px solid #86efac; color:#14532d; }
  .status.info    { background:#dbeafe; border:1px solid #93c5fd; color:#1e3a8a; }
  .loading { text-align:center; padding:60px 20px; color:var(--muted); }
  .footer-note { font-size:12px; color:var(--muted); text-align:center; margin-top:18px; }
  .brand { font-weight:700; letter-spacing:.3px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="boot">Hleður…</div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const ROWS = [
  { sect: 'Prófun á stjórnstöð' },
  { key:'a1',  label:'Analog gildi lesin og yfirfarin á stjórnstöð' },
  { key:'a2',  label:'Skynjarar prófaðir frá stöð' },
  { key:'a3',  label:'Lampaprófun' },
  { key:'a4',  label:'Bilun ef skynjararás er rofin' },
  { key:'a5',  label:'Bilun ef aðvörunarrás er rofin' },
  { key:'a6',  label:'Bilun frá aðalaflgjafa ath.' },
  { key:'a7',  label:'Bilun frá varaaflgjafa ath.' },
  { key:'a8',  label:'Hleðsluspenna og straumnotkun mæld' },
  { key:'a9',  label:'Prófun útganga' },
  { key:'a10', label:'Merkingar, þjónustubók og yfirlitsmynd í lagi' },
  { key:'a11', label:'Rafhlöður (merking/dagsetning)', athPlaceholder:'Dags. á rafhlöðum' },
  { sect: 'Prófun á jaðarbúnaði' },
  { key:'b1',  label:'Reykskynjarar prófaðir með gasi' },
  { key:'b2',  label:'Hitaskynjarar prófaðir með hitagjafa' },
  { key:'b3',  label:'Prófun á öllum handboðum' },
  { key:'b4',  label:'Bilun þegar skynjari er fjarlægður (5% per rás)' },
  { key:'b5',  label:'Gaumljós athuguð' },
  { key:'b6',  label:'Bjöllur (hljóðprófun)' },
  { key:'b7',  label:'Hurðaseglar' },
  { key:'b8',  label:'Textar lesnir saman við númer og staðsetn.' },
  { key:'b9',  label:'Stýribúnaður (loftræsting, reyklúgur, sprinkler o.fl.)' },
  { sect: 'Undirstöðvar' },
  { key:'c1',  label:'Athuga hvort textar og boð skili sér' },
  { key:'c2',  label:'Merking á þjónustubók og yfirlitsmynd í lagi' },
  { sect: 'Boðsendir' },
  { key:'d1',  label:'Skilar brunaboð sér frá hverri rás' },
  { key:'d2',  label:'Skila bilunarboð sér' },
  { key:'d3',  label:'Skynjari tekinn úr sökkli' },
  { key:'d4',  label:'Ath útkallsleiðbeiningar og tengiliði' },
];

const state = {
  invite: null,
  values: {}, // header fields
  checks: {}, // checks[key] = { state: 'ok'|'bad'|null, note: '' }
  signature: null,
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function todayIcelandic() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

async function boot() {
  const app = document.getElementById('app');
  if (!TOKEN) {
    app.innerHTML = '<div class="status error">Engin token í tengli. Sá tengill sem þú smelltir á er ekki gildur.</div>';
    return;
  }
  try {
    const r = await fetch('/api/skoda?token=' + encodeURIComponent(TOKEN));
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: 'Boðsmerki fannst ekki' }));
      app.innerHTML = '<div class="status error">' + esc(e.error || 'Villa') + '</div>';
      return;
    }
    const data = await r.json();
    if (data.expired) {
      app.innerHTML = '<div class="status error">Þessi tengill er útrunninn (eldri en 14 dagar). Hafðu samband við Aggi til að fá nýjan.</div>';
      return;
    }
    if (data.used) {
      app.innerHTML = '<div class="status info">Þessi skoðun hefur þegar verið skilað inn. Þakka þér fyrir!</div>';
      return;
    }
    state.invite = data.invite;
    state.values = {
      verkkaupi:   data.invite.verkkaupi || '',
      kennitala:   data.invite.kennitala || '',
      simi:        data.invite.simi || '',
      tengilidur:  data.invite.tengilidur || '',
      heimilisfang: data.invite.heimilisfang || '',
      postnr:      data.invite.postnumer || '',
      dagsetning:  todayIcelandic(),
      profunarsvid: '',
      tegund_kerfis: '',
      naesta_skodun: '',
      profun_af: '',
      starfsmadur: '',
      athugasemdir: '',
      rafhl_dags: '',
    };
    ROWS.forEach(r => { if (r.key) state.checks[r.key] = { state: null, note: '' }; });
    render();
  } catch (e) {
    app.innerHTML = '<div class="status error">Villa við að ná í boð: ' + esc(e.message || e) + '</div>';
  }
}

function render() {
  const app = document.getElementById('app');
  const i = state.invite;
  app.innerHTML = `
    <header>
      <h1>📋 Ársskoðun brunakerfa</h1>
      <div class="sub">Viðtökupróf / Árleg prófun · <span class="brand">Slökkvitæki ehf</span></div>
    </header>

    <div class="panel">
      <h2>Upplýsingar um verkkaupa</h2>
      <div class="grid2">
        <div class="info-row"><label>Verkkaupi</label><input type="text" id="f_verkkaupi" value="${esc(state.values.verkkaupi)}"></div>
        <div class="info-row"><label>Kennitala</label><input type="text" id="f_kennitala" value="${esc(state.values.kennitala)}"></div>
        <div class="info-row"><label>Sími</label><input type="tel" id="f_simi" value="${esc(state.values.simi)}"></div>
        <div class="info-row"><label>Tengiliður</label><input type="text" id="f_tengilidur" value="${esc(state.values.tengilidur)}"></div>
        <div class="info-row"><label>Heimilisfang</label><input type="text" id="f_heimilisfang" value="${esc(state.values.heimilisfang)}"></div>
        <div class="info-row"><label>Póstnúmer</label><input type="text" id="f_postnr" value="${esc(state.values.postnr)}"></div>
        <div class="info-row">
          <label>Prófun</label>
          <select id="f_profunarsvid">
            <option value="">— veldu —</option>
            <option value="Allt kerfið">Allt kerfið</option>
            <option value="Hluti af kerfi">Hluti af kerfi</option>
          </select>
        </div>
        <div class="info-row"><label>Tegund kerfis</label><input type="text" id="f_tegund_kerfis" placeholder="t.d. Esser, Bosch, Siemens…"></div>
        <div class="info-row"><label>Næsta skoðun</label><input type="text" id="f_naesta_skodun" placeholder="t.d. Júní 2027"></div>
        <div class="info-row"><label>Dagsetning skoðunar</label><input type="date" id="f_dagsetning" value="${esc(state.values.dagsetning)}"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Prófun</h2>
      <div id="checks">${ROWS.map(rowHtml).join('')}</div>
    </div>

    <div class="panel">
      <h2>Athugasemdir og undirritun</h2>
      <div class="info-row">
        <label>Prófun framkvæmd af</label>
        <input type="text" id="f_profun_af" placeholder="Nafn þess sem framkvæmdi prófunina">
      </div>
      <div class="info-row">
        <label>Athugasemdir</label>
        <textarea id="f_athugasemdir" rows="3" placeholder="Ef einhverjar athugasemdir…"></textarea>
      </div>

      <div class="grid2" style="margin-top:14px">
        <div>
          <label>F.h. Slökkvitæki ehf (starfsmaður) — nafn</label>
          <input type="text" id="f_starfsmadur" placeholder="Nafn starfsmanns Slökkvitækja" style="margin-bottom:8px">
          <div class="sig-wrap">
            <canvas id="sigInspectorCanvas" width="800" height="160"></canvas>
            <div class="sig-actions">
              <span>Undirritun starfsmanns</span>
              <button type="button" onclick="clearInspectorSig()">Hreinsa</button>
            </div>
          </div>
        </div>
        <div>
          <label>F.h. verkkaupa — nafn</label>
          <input type="text" id="f_verkkaupi_sig_name" value="${esc(state.values.verkkaupi)}" placeholder="Nafn verkkaupa" style="margin-bottom:8px">
          <div class="sig-wrap">
            <canvas id="sigCanvas" width="800" height="160"></canvas>
            <div class="sig-actions">
              <span>Undirritun verkkaupa</span>
              <button type="button" onclick="clearSig()">Hreinsa</button>
            </div>
          </div>
        </div>
      </div>

      <div class="info-row" style="margin-top:14px">
        <label>Nafn þess sem skilar inn (valkvætt)</label>
        <input type="text" id="f_submitter_name" placeholder="Þitt nafn">
      </div>
      <div class="info-row">
        <label>Netfang (valkvætt)</label>
        <input type="email" id="f_submitter_email" placeholder="netfang@…">
      </div>
    </div>

    <div id="statusBox"></div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="submitBtn" onclick="submitForm()">Vista skoðun</button>
    </div>

    <div class="footer-note">
      Slökkvitæki ehf · Helluhrauni 10, 220 Hafnarfirði · kt. 600508-0400 · sími 565-4080
    </div>
  `;
  // Re-apply any select values (selects don't honour `value=` attribute).
  const profSel = document.getElementById('f_profunarsvid');
  if (profSel && state.values.profunarsvid) profSel.value = state.values.profunarsvid;
  // Pre-fill known values into inputs that aren't initialised inline.
  const presetIds = ['profun_af','starfsmadur','tegund_kerfis','naesta_skodun','athugasemdir','rafhl_dags'];
  presetIds.forEach(id => {
    const el = document.getElementById('f_' + id);
    if (el && state.values[id]) el.value = state.values[id];
  });
  initSignature();
}

function rowHtml(row, idx) {
  if (row.sect) return `<div class="sectionhead">${esc(row.sect)}</div>`;
  const k = row.key;
  // Row a11 (rafhlöður) keeps the dagsetning column matching the
  // slokkvitæki template's `{{rafhl_dags}}` field instead of `ath_a11`.
  const noteId = (k === 'a11') ? 'f_rafhl_dags' : ('ath_' + k);
  return `
    <div class="row">
      <div class="lbl">${esc(row.label)}</div>
      <div class="seg">
        <button type="button" class="ok" onclick="setCheck('${k}','ok')" id="b_${k}_ok" title="Í lagi">✓</button>
      </div>
      <div class="seg">
        <button type="button" class="bad" onclick="setCheck('${k}','bad')" id="b_${k}_bad" title="Ólagi">✗</button>
      </div>
      <input type="text" class="athinp" id="${noteId}" placeholder="${esc(row.athPlaceholder || 'Athugasemd')}">
    </div>`;
}

function setCheck(key, val) {
  const cur = state.checks[key].state;
  state.checks[key].state = (cur === val) ? null : val;
  const ok  = document.getElementById('b_' + key + '_ok');
  const bad = document.getElementById('b_' + key + '_bad');
  ok.classList.toggle('on', state.checks[key].state === 'ok');
  bad.classList.toggle('on', state.checks[key].state === 'bad');
}

/* — Signature pads (verkkaupi + starfsmaður) — */
const sigs = {}; // { custId: { canvas, ctx, hasInk } }
function initSignature() {
  initOneSig('sigCanvas');
  initOneSig('sigInspectorCanvas');
}
function initOneSig(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = Math.round(rect.width  * (window.devicePixelRatio || 1));
  canvas.height = Math.round(rect.height * (window.devicePixelRatio || 1));
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#0f172a';
  sigs[canvasId] = { canvas, ctx, hasInk: false, drawing: false };
  const s = sigs[canvasId];

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length) {
      return [e.touches[0].clientX - r.left, e.touches[0].clientY - r.top];
    }
    return [e.clientX - r.left, e.clientY - r.top];
  };
  const start = (x, y) => { s.drawing = true; s.ctx.beginPath(); s.ctx.moveTo(x, y); };
  const move  = (x, y) => { if (s.drawing) { s.ctx.lineTo(x, y); s.ctx.stroke(); s.hasInk = true; } };
  const end   = () => { s.drawing = false; };
  canvas.addEventListener('mousedown', e => { const [x,y]=pos(e); start(x,y); });
  canvas.addEventListener('mousemove', e => { const [x,y]=pos(e); move(x,y); });
  canvas.addEventListener('mouseup',   end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',e => { e.preventDefault(); const [x,y]=pos(e); start(x,y); }, { passive:false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); const [x,y]=pos(e); move(x,y); },  { passive:false });
  canvas.addEventListener('touchend',  e => { e.preventDefault(); end(); }, { passive:false });
}
function clearSig() {
  const s = sigs['sigCanvas'];
  if (s) { s.ctx.clearRect(0, 0, s.canvas.width, s.canvas.height); s.hasInk = false; }
}
function clearInspectorSig() {
  const s = sigs['sigInspectorCanvas'];
  if (s) { s.ctx.clearRect(0, 0, s.canvas.width, s.canvas.height); s.hasInk = false; }
}

function readHeader() {
  const ids = ['verkkaupi','kennitala','heimilisfang','postnr','tengilidur','simi',
    'dagsetning','profunarsvid','tegund_kerfis','naesta_skodun','profun_af',
    'starfsmadur','athugasemdir','rafhl_dags'];
  ids.forEach(id => {
    const el = document.getElementById('f_' + id);
    if (el) state.values[id] = el.value;
  });
}
function readChecks() {
  ROWS.forEach(r => {
    if (!r.key) return;
    // Row a11 stores its „athugasemd" in the dedicated rafhl_dags field.
    const id = (r.key === 'a11') ? 'f_rafhl_dags' : ('ath_' + r.key);
    const el = document.getElementById(id);
    if (el) state.checks[r.key].note = el.value;
  });
}

// Build a flat, template-compatible field map matching the
// slokkvitæki `seed_arsskodun_brunakerfa` HTML placeholders:
//   {{chk_a1}} / {{chk_a1n}} / {{ath_a1}} … plus the header keys.
// This lets the slokkvitæki side (or any downstream PDF generator)
// drop the form_data straight into the template HTML.
function buildTemplateFields() {
  const f = {
    dagsetning:    state.values.dagsetning   || '',
    verkkaupi:     state.values.verkkaupi    || '',
    kennitala:     state.values.kennitala    || '',
    simi:          state.values.simi         || '',
    tengilidur:    state.values.tengilidur   || '',
    heimilisfang:  state.values.heimilisfang || '',
    postnr:        state.values.postnr       || '',
    profunarsvid:  state.values.profunarsvid || '',
    tegund_kerfis: state.values.tegund_kerfis|| '',
    naesta_skodun: state.values.naesta_skodun|| '',
    profun_af:     state.values.profun_af    || '',
    starfsmadur:   state.values.starfsmadur  || '',
    athugasemdir:  state.values.athugasemdir || '',
    rafhl_dags:    state.values.rafhl_dags   || '',
  };
  ROWS.forEach(r => {
    if (!r.key) return;
    const c = state.checks[r.key] || {};
    f['chk_'  + r.key]       = (c.state === 'ok');
    f['chk_'  + r.key + 'n'] = (c.state === 'bad');
    // a11's note is rafhl_dags (already populated above); other rows use ath_X.
    if (r.key !== 'a11') f['ath_' + r.key] = c.note || '';
  });
  return f;
}

async function submitForm() {
  readHeader();
  readChecks();

  const sigCust = sigs['sigCanvas'];
  if (!sigCust || !sigCust.hasInk) {
    showStatus('Vinsamlegast skrifaðu undir áður en þú vistar.', 'error');
    return;
  }
  const sigInsp = sigs['sigInspectorCanvas'];
  const sigCustDataUrl = sigCust.canvas.toDataURL('image/png');
  const sigInspDataUrl = (sigInsp && sigInsp.hasInk)
    ? sigInsp.canvas.toDataURL('image/png') : null;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Vista…';
  showStatus('Sendir skoðun til Slökkvitækja…', 'info');

  // form_data shape:
  //   fields  — flat template-key map (slokkvitæki HTML placeholders)
  //   checks  — compact per-row {state:'ok'|'bad'|null, note} (UI replay)
  //   header  — original header values (back-compat with earlier shape)
  const templateFields = buildTemplateFields();

  try {
    const r = await fetch('/api/skoda', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'submit',
        token: TOKEN,
        form_data: {
          fields: templateFields,
          checks: state.checks,
          header: state.values,
        },
        signature_customer: sigCustDataUrl,
        signature_inspector: sigInspDataUrl,
        submitter_name:  document.getElementById('f_submitter_name')?.value || '',
        submitter_email: document.getElementById('f_submitter_email')?.value || '',
      }),
    });
    const j = await r.json();
    if (!r.ok) {
      btn.disabled = false;
      btn.textContent = 'Vista skoðun';
      showStatus(j.error || 'Villa við að vista', 'error');
      return;
    }
    // Success — replace whole page with thank-you.
    document.getElementById('app').innerHTML = `
      <header>
        <h1>✅ Takk fyrir!</h1>
        <div class="sub">Skoðun móttekin · ${new Date().toLocaleString('is-IS')}</div>
      </header>
      <div class="panel">
        <p>Skoðunin hefur verið send Slökkvitæki ehf. Þú mátt loka glugganum.</p>
        <p style="color:var(--muted);font-size:13px">Tengillinn er nú notaður og er ekki lengur virkur.</p>
      </div>
    `;
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Vista skoðun';
    showStatus('Netvilla: ' + (e.message || e), 'error');
  }
}

function showStatus(msg, kind) {
  const box = document.getElementById('statusBox');
  if (!box) return;
  box.innerHTML = '<div class="status ' + kind + '">' + esc(msg) + '</div>';
  if (kind === 'info') return;
  setTimeout(() => { if (box.innerHTML.includes(msg)) box.innerHTML = ''; }, 6000);
}

boot();
</script>
