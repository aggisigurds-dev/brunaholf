<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020814">
<title>J.A.R.V.I.S. — Brunahólf</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     HUD. Formið er úr sci-fi mælaborðinu; TÖLURNAR eru allar raunverulegar
     — kerfisheilsa, vélar, gagnaleiðslur og veiðin. Ekkert skraut-tal:
     ef ekkert er að frétta stendur það, í stað þess að láta línurnar rúlla.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#020814; --bg2:#04101f;
    --cy:#4fd8ff; --cy2:#1d7fa8; --cy-dim:#1b4a63;
    --ink:#cfeeff; --ink2:#79b4d0; --ink3:#3f7391;
    --ok:#43f5a0; --var:#ffc746; --hae:#ff5a6e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1200px 700px at 50% 42%,#0a2340 0%,transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 70%);
    background-attachment:fixed;color:var(--ink);
    font:13px/1.5 var(--mono);letter-spacing:.04em;min-height:100vh;overflow-x:hidden}
  /* skannlínur + fínt rúðunet, eins og á skjá */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(180deg,rgba(79,216,255,.045) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(rgba(79,216,255,.05) 1px,transparent 1px) 0 0/100% 34px,
               linear-gradient(90deg,rgba(79,216,255,.05) 1px,transparent 1px) 0 0/34px 100%;
    opacity:.35}

  .hud{position:relative;z-index:2;max-width:1500px;margin:0 auto;padding:14px 16px 40px}

  /* ── Haus ───────────────────────────────────────────────── */
  .haus{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
    border:1px solid var(--cy-dim);padding:10px 14px;position:relative;
    background:linear-gradient(180deg,rgba(79,216,255,.07),transparent)}
  .haus::before,.haus::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--cy)}
  .haus::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .haus::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  .merki{font-size:15px;letter-spacing:.42em;color:var(--cy);text-shadow:0 0 14px rgba(79,216,255,.6);font-weight:700}
  .undirmerki{color:var(--ink3);font-size:10.5px;letter-spacing:.2em;margin-top:3px;text-transform:uppercase}
  .pillur{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .p{border:1px solid var(--cy-dim);padding:2px 9px;font-size:10px;letter-spacing:.14em;
    color:var(--ink2);text-transform:uppercase}
  .p.on{border-color:var(--ok);color:var(--ok);box-shadow:0 0 12px rgba(67,245,160,.22) inset}
  .p.vara{border-color:var(--var);color:var(--var)}
  .p.hae{border-color:var(--hae);color:var(--hae);animation:blikk 1.1s infinite}
  @keyframes blikk{50%{opacity:.35}}
  .klukka{margin-left:auto;text-align:right}
  .klukka .t{font-size:27px;color:var(--cy);letter-spacing:.08em;text-shadow:0 0 18px rgba(79,216,255,.5);
    font-variant-numeric:tabular-nums}
  .klukka .d{color:var(--ink3);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}

  /* ── Grind ──────────────────────────────────────────────── */
  .grind{display:grid;gap:12px;margin-top:12px;
    grid-template-columns:minmax(230px,1fr) minmax(320px,1.7fr) minmax(230px,1fr)}
  @media(max-width:960px){.grind{grid-template-columns:1fr}}
  .dalkur{display:flex;flex-direction:column;gap:12px;min-width:0}

  .spjald{border:1px solid var(--cy-dim);padding:10px 12px;position:relative;
    background:linear-gradient(180deg,rgba(10,35,64,.55),rgba(2,12,25,.5))}
  .spjald>h2{margin:0 0 8px;font-size:10px;letter-spacing:.26em;color:var(--cy2);
    text-transform:uppercase;display:flex;align-items:center;gap:7px}
  .spjald>h2::before{content:"";width:5px;height:5px;background:var(--cy);
    box-shadow:0 0 8px var(--cy);transform:rotate(45deg)}
  .spjald>h2 span{margin-left:auto;color:var(--ink3);letter-spacing:.1em}

  /* mælastikur */
  .maelir{margin-bottom:7px}
  .maelir .lina{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);
    letter-spacing:.1em;text-transform:uppercase}
  .maelir .lina b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
  .rein{height:5px;background:rgba(79,216,255,.1);margin-top:3px;position:relative;overflow:hidden}
  .rein i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cy2),var(--cy));
    box-shadow:0 0 10px rgba(79,216,255,.6);transition:width .8s ease}
  .rein.ok i{background:linear-gradient(90deg,#1c8f5e,var(--ok));box-shadow:0 0 10px rgba(67,245,160,.5)}
  .rein.var i{background:linear-gradient(90deg,#8a6407,var(--var));box-shadow:0 0 10px rgba(255,199,70,.5)}
  .rein.hae i{background:linear-gradient(90deg,#8f1f2c,var(--hae));box-shadow:0 0 10px rgba(255,90,110,.5)}

  /* straumur */
  .straumur{max-height:186px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .straumur div{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .straumur .kl{color:var(--cy2)}
  .straumur .ok{color:var(--ok)} .straumur .vara{color:var(--var)} .straumur .hae{color:var(--hae)}

  /* miðjan */
  /* Kjarninn: hvarfið fyllir efri hlutann, stjórntækin sitja NEÐST (flex-end)
     svo ekkert liggi ofan á miðjunni. Striginn teiknar miðjuna í 40% hæð. */
  .kjarni{border:1px solid var(--cy-dim);position:relative;min-height:430px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    background:radial-gradient(circle at 50% 38%,rgba(29,127,168,.2),transparent 62%)}
  #kjarna-canvas{position:absolute;inset:0;width:100%;height:100%}
  .mid{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    gap:10px;padding:14px 16px 16px;width:100%}
  /* Málrofinn fer út í hornið: hann er stilling, ekki aðgerð, og mátti ekki
     ýta TALA-hnappinum út af miðásnum (kjarni → texti → hnappur). */
  .kjarni>.malrofi{position:absolute;top:10px;right:10px;z-index:3}
  #hnappur{width:98px;height:98px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 50% 40%,rgba(79,216,255,.24),rgba(2,12,25,.85));
    border:1px solid var(--cy);color:var(--cy);font:inherit;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    box-shadow:0 0 34px rgba(79,216,255,.3),inset 0 0 28px rgba(79,216,255,.16)}
  #hnappur .ic{font-size:26px}
  #hnappur.on{border-color:var(--hae);color:var(--hae);
    box-shadow:0 0 46px rgba(255,90,110,.45),inset 0 0 30px rgba(255,90,110,.2)}
  .heyri{font-size:10.5px;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;min-height:14px}
  .talid{max-width:560px;text-align:center;color:var(--ink);font-size:14px;letter-spacing:.02em;
    min-height:20px;line-height:1.5}
  .svar{max-width:600px;border:1px solid var(--cy-dim);padding:11px 14px;
    background:linear-gradient(180deg,rgba(79,216,255,.1),transparent);
    color:var(--ink);font-size:14.5px;line-height:1.6;letter-spacing:.01em}
  .svar b{color:var(--cy)}
  .malrofi{display:flex;gap:6px}
  .malrofi button{border:1px solid var(--cy-dim);background:transparent;color:var(--ink3);
    font:inherit;font-size:10px;letter-spacing:.16em;padding:3px 10px;cursor:pointer;text-transform:uppercase}
  .malrofi button.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px rgba(79,216,255,.2) inset}

  /* ratsjá */
  .ratsja{position:relative;aspect-ratio:1;max-height:190px;margin:0 auto;width:100%}
  #ratsja-canvas{width:100%;height:100%}

  /* markmið */
  .markmid{border:1px solid var(--cy-dim);margin-top:12px;padding:11px 14px;
    background:linear-gradient(180deg,rgba(79,216,255,.07),transparent)}
  .mtitill{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.24em;
    color:var(--cy2);text-transform:uppercase}
  .mtala{font-size:31px;color:var(--cy);letter-spacing:.04em;margin:5px 0 2px;
    text-shadow:0 0 20px rgba(79,216,255,.45);font-variant-numeric:tabular-nums}
  .mtexti{color:var(--ink2);font-size:11px}
  .mrein{height:9px;background:rgba(79,216,255,.1);margin-top:9px;position:relative;overflow:hidden}
  .mrein i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cy2),var(--cy));
    box-shadow:0 0 14px rgba(79,216,255,.55)}
  /* Prósentan situr yfir MIÐJUNNI en fyllingin nær aðeins 37% — dökkur texti
     hvarf því ofan í bakgrunninn. Ljós texti með skugga les á báðum hlutum. */
  .mrein span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;letter-spacing:.2em;color:#eaf8ff;font-weight:700;
    text-shadow:0 0 6px rgba(2,16,25,.95),0 1px 2px rgba(2,16,25,.9)}
  .mfotur{display:flex;justify-content:space-between;color:var(--ink3);font-size:10px;margin-top:5px;
    letter-spacing:.1em}

  .villa{color:var(--hae)}
  a{color:var(--cy)}
  .tenglar{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase}
  .tenglar a{text-decoration:none;color:var(--ink3);border-bottom:1px solid transparent}
  .tenglar a:hover{color:var(--cy);border-color:var(--cy-dim)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hud">

  <div class="haus">
    <div>
      <div class="merki">J.A.R.V.I.S.</div>
      <div class="undirmerki">Brunahólf ehf · Slökkvitæki ehf — stjórnstöð</div>
      <div class="pillur" id="pillur"><span class="p">ræsir…</span></div>
    </div>
    <div class="klukka">
      <div class="t" id="klukka">--:--:--</div>
      <div class="d" id="dags">—</div>
    </div>
  </div>

  <div class="grind">
    <!-- ── vinstri ── -->
    <div class="dalkur">
      <div class="spjald">
        <h2>Kerfis-vitals <span id="k-uppf">—</span></h2>
        <div id="vitals"><div style="color:var(--ink3)">sæki…</div></div>
      </div>
      <div class="spjald">
        <h2>Fjarskipti</h2>
        <div class="straumur" id="straumur"><div style="color:var(--ink3)">sæki…</div></div>
      </div>
    </div>

    <!-- ── miðja ── -->
    <div class="dalkur">
      <div class="kjarni">
        <canvas id="kjarna-canvas"></canvas>
        <!-- Stjórntækin sitja NEÐST, ekki ofan í kjarnanum: miðjan er hvarfið
             sjálft og á að sjást óskert (Agnar 2026-07-31). -->
        <div class="malrofi">
          <button data-mal="is" class="on">ÍSL</button>
          <button data-mal="en">ENG</button>
        </div>
        <div class="mid">
          <div class="talid" id="talid"></div>
          <div class="svar" id="svar" hidden></div>
          <div class="heyri" id="heyri">Ýttu og talaðu</div>
          <button id="hnappur"><span class="ic">◉</span><span id="hlbl">Tala</span></button>
        </div>
      </div>

      <div class="markmid">
        <div class="mtitill"><span>Meginmarkmið — skýrsluþekja 2026</span><span id="m-dags">—</span></div>
        <div class="mtala" id="m-tala">—</div>
        <div class="mtexti" id="m-texti">sæki…</div>
        <div class="mrein"><i id="m-rein" style="width:0%"></i><span id="m-pct"></span></div>
        <div class="mfotur"><span id="m-vinstri">—</span><span id="m-haegri">—</span></div>
      </div>
    </div>

    <!-- ── hægri ── -->
    <div class="dalkur">
      <div class="spjald">
        <h2>Vélar <span id="v-fjoldi">—</span></h2>
        <div class="ratsja"><canvas id="ratsja-canvas"></canvas></div>
        <div id="velalisti" style="margin-top:8px"></div>
      </div>
      <div class="spjald">
        <h2>Hljóðnemi</h2>
        <canvas id="bylgja" style="width:100%;height:56px;display:block"></canvas>
      </div>
      <div class="spjald">
        <h2>Gagnaleiðslur</h2>
        <div id="gogn"><div style="color:var(--ink3)">sæki…</div></div>
      </div>
    </div>
  </div>

  <div class="tenglar">
    <a href="/kerfisheilsa.html">🛡 Kerfisheilsa</a>
    <a href="/radd.html">🎙 Raddminni</a>
    <a href="/verkefnalisti.html">📋 Verkefnalisti</a>
    <a href="/veidin.html">🎯 Veiðin</a>
    <a href="/">← Hubbið</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

/* ── klukka ─────────────────────────────────────────────── */
setInterval(() => {
  const d = new Date();
  $('#klukka').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  $('#dags').textContent = d.toLocaleDateString('is-IS',{weekday:'long',day:'numeric',month:'long'});
}, 1000);

/* ── mál ────────────────────────────────────────────────── */
let MAL = localStorage.getItem('radd_mal') || 'is';
function settMal(m){
  MAL = m; localStorage.setItem('radd_mal', m);
  document.querySelectorAll('.malrofi button').forEach(b => b.classList.toggle('on', b.dataset.mal===m));
  if(sr) sr.lang = m==='en' ? 'en-US' : 'is-IS';
}
document.querySelectorAll('.malrofi button').forEach(b =>
  b.addEventListener('click', () => settMal(b.dataset.mal)));

/* ── kjarninn: hringur sem bregst við RAUNVERULEGU hljóði og
      raunverulegri kerfisstöðu (grænn = allt í lagi, rauður = eitthvað niðri) ── */
const kc = $('#kjarna-canvas'), kx = kc.getContext('2d'), hnapp = $('#hnappur');
let orka = 0, markOrka = 0, heilsulitur = [79,216,255], fasi = 0;
// Bassi/diskant úr TÍÐNIGREININGU (ekki bara styrk) — bassinn ýfir yfirborð
// kjarnans, diskantinn kveikir í ögnunum. Núll þegar hljóðneminn er ekki á.
let bassi = 0, diskant = 0;
let tS = 0;              // tímastimpill síðasta ramma (ms)
let snuningur = 0;       // sporbrautar-horn agnanna — SITT EIGIÐ, hægt
let fyrri = 0;           // orka síðasta ramma → greinir RÍS (högg)
const hogg = [];         // höggbylgjur sem ganga út frá kjarnanum

// Sporbrautirnar eru reiknaðar EINU SINNI: hver ögn fær sitt horn, radíus,
// stefnu og hraða. Áður deildu allar agnirnar einum `fasi`, sem lét þær
// hreyfast í takt eins og eitt hjól; sitt hvor brautin gefur atóm-tilfinninguna.
const AGNIR = Array.from({length:74}, (_,i) => ({
  horn : Math.random()*Math.PI*2,
  rad  : .70 + Math.random()*.62,
  hradi: (Math.random()<.42 ? -1 : 1) * (.45 + Math.random()*.85),
  f    : Math.random()*Math.PI*2,
  st   : Math.random()<.16 ? 1.9 : 1,
}));

function staerd(){
  [kc, $('#ratsja-canvas'), $('#bylgja')].forEach(c => {
    const r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1);
    c.width = Math.max(1, r.width*dpr); c.height = Math.max(1, r.height*dpr);
  });
}
addEventListener('resize', staerd);

function teiknaKjarna(nu){
  const w = kc.width, h = kc.height, cx = w/2, cy = h*.40;
  const dpr = Math.min(2, devicePixelRatio||1);
  // TÍMABUNDIÐ, ekki rammabundið. Áður taldi hreyfingin ramma, svo á 120Hz
  // skjá gekk allt tvöfalt hraðar en á 60Hz — „hægt" varð merkingarlaust.
  // Þakið (50ms) ver okkur á því að flipinn hafi legið í dvala.
  const dt = tS ? Math.min(.05, ((nu||0) - tS)/1000) : 0;
  tS = nu || 0;
  kx.clearRect(0,0,w,h);

  // ── Orku-umslagið: SNÖGG ÁRÁS, HÆG DVÍNUN. Kjarninn tekur við hljóðinu
  //    samstundis og glóir svo niður — það er munurinn á lampa sem er kveikt
  //    á og hvarfi sem tekur við höggi.
  orka += (markOrka - orka) * Math.min(1, (markOrka > orka ? 15 : 1.7) * dt);
  fasi += dt * .5;
  // Andardráttur í þögn — kjarninn er aldrei alveg dauður.
  const E = Math.max(orka, .07 + .05*Math.sin(fasi*.9));
  // Rís yfir þröskuld = högg gengur út frá kjarnanum.
  if(orka - fyrri > .16 && hogg.length < 6) hogg.push({ r:.4, a:1 });
  fyrri = orka;

  const R = Math.min(w,h)*.30;
  const [r,g,b] = heilsulitur;
  const lit = (a) => `rgba(${r},${g},${b},${a})`;
  // Litur hitnar með orkunni — en AÐEINS hálfa leið. Fyrri stilling (E*1.15)
  // hvítaði allan hnöttinn í hávaða og hann las sem teiknuð sól; hvíti liturinn
  // á heima í hjartanu einu, bolurinn heldur kerfisliti sínum.
  const hiti = Math.min(.55, E*.6);
  const heitt = (a) => `rgba(${Math.round(r+(255-r)*hiti)},${Math.round(g+(255-g)*hiti)},` +
                       `${Math.round(b+(255-b)*hiti)},${a})`;

  // ytri hringir
  for(let i=0;i<3;i++){
    const rr = R*(1.18 + i*.14) + E*R*.10;
    kx.beginPath(); kx.arc(cx,cy,rr,0,Math.PI*2);
    kx.strokeStyle = lit(.10 + i*.04); kx.lineWidth = 1*dpr; kx.stroke();
  }
  // strikaður hringur sem snýst — hægur, herðir örlítið á sér með orkunni
  kx.save(); kx.translate(cx,cy); kx.rotate(fasi*.55 + snuningur*.25);
  kx.beginPath();
  for(let i=0;i<72;i++){
    const a = i/72*Math.PI*2, r1 = R*1.42, r2 = r1 + (i%6===0 ? 9 : 4)*dpr;
    kx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1); kx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
  }
  kx.strokeStyle = lit(.30); kx.lineWidth = 1*dpr; kx.stroke(); kx.restore();

  // ── Héðan í frá er teiknað SAMLEGGJANDI ('lighter'): þar sem lögin skarast
  //    leggjast birturnar saman og miðjan brennur út í hvítt af sjálfu sér.
  //    Það er þessi útbruni sem les sem „gríðarleg orka", ekki stærri hringur.
  kx.globalCompositeOperation = 'lighter';

  // Höggbylgjur — ganga út, þynnast, hverfa.
  for(let i=hogg.length-1;i>=0;i--){
    const s = hogg[i];
    s.r += dt*1.9; s.a -= dt*1.15;
    if(s.a <= 0){ hogg.splice(i,1); continue; }
    kx.beginPath(); kx.arc(cx,cy,R*s.r,0,Math.PI*2);
    kx.strokeStyle = heitt(s.a*.5); kx.lineWidth = (1+2*s.a)*dpr; kx.stroke();
  }

  // Miðjan er FRÍ (stjórntækin voru færð neðst), svo hvarfið er teiknað í
  // heilu lagi: hjúpur → ólgandi yfirborð → hvítglóandi hjarta → neistar.
  const kR = R*(.44 + E*.17);
  const olga = (.015 + .05*E + .09*bassi);
  // Yfirtónarnir eru vísvitandi vegnir í átt að HÁUM tíðnum: lágtíðnin ein
  // (sin 3a) gerði hnöttinn skakkan eins og kartöflu; margar smáar gárur lesast
  // sem ólgandi yfirborð.
  const brun = (a) => kR*(1 + olga*(.45*Math.sin(a*3 + fasi*1.8) + .80*Math.sin(a*5 - fasi*2.6)
                                  + .70*Math.sin(a*8 + fasi*3.4) + .40*Math.sin(a*13 - fasi*4.3))/2.35);

  // Ljóshjúpur — þröngur og hófstilltur. (Fyrri útgáfa var 2,6× breiðari og
  // mun sterkari; hún lagðist yfir allt spjaldið og varð að mjólkurmóðu í stað
  // þess að lesast sem glóð.)
  const hR = kR*(1.9+E*.7);
  const hjupur = kx.createRadialGradient(cx,cy,kR*.55,cx,cy,hR);
  hjupur.addColorStop(0, heitt(.16+.26*E)); hjupur.addColorStop(.40, lit(.06+.11*E));
  hjupur.addColorStop(1, lit(0));
  kx.beginPath(); kx.arc(cx,cy,hR,0,Math.PI*2); kx.fillStyle = hjupur; kx.fill();

  // Yfirborðið ÝFIST: sléttur hringur í þögn, ólgandi í hávaða. Bassinn ræður
  // ólgunni — lögunin fylgir raunverulegu hljóði en ekki klukku.
  kx.beginPath();
  for(let i=0;i<=120;i++){
    const a = i/120*Math.PI*2, rr = brun(a);
    i ? kx.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr)
      : kx.moveTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);
  }
  kx.closePath();
  const gr = kx.createRadialGradient(cx,cy,0,cx,cy,kR*1.06);
  gr.addColorStop(0, heitt(.34+.26*E)); gr.addColorStop(.45, heitt(.15+.20*E));
  gr.addColorStop(.85, heitt(.09+.16*E)); gr.addColorStop(1, heitt(.04+.10*E));
  kx.fillStyle = gr; kx.fill();
  // Brúnin er skýr og björt — það er hún sem les sem innilokað hvarf.
  kx.strokeStyle = heitt(.40+.50*E); kx.lineWidth = (1+1.6*E)*dpr; kx.stroke();

  // Hvítglóandi hjartað — harði punkturinn sem allt annað hverfist um. Hvíti
  // liturinn er BUNDINN við hann; bolurinn í kring heldur kerfislitnum.
  const hjR = kR*(.30+.16*E);
  const hjarta = kx.createRadialGradient(cx,cy,0,cx,cy,hjR);
  hjarta.addColorStop(0, `rgba(255,255,255,${(.55+.40*E).toFixed(2)})`);
  hjarta.addColorStop(.45, `rgba(${Math.round(r+(255-r)*.7)},${Math.round(g+(255-g)*.7)},${Math.round(b+(255-b)*.7)},${(.22+.34*E).toFixed(2)})`);
  hjarta.addColorStop(1, 'rgba(255,255,255,0)');
  kx.beginPath(); kx.arc(cx,cy,hjR,0,Math.PI*2); kx.fillStyle = hjarta; kx.fill();

  // Neistar út úr brúninni — fjöldi og lengd fylgja orkunni. Þeir DOFNA út í
  // oddinn (línustrikull); jafnbjartar, jafnlangar línur lásust sem teiknuð
  // sólargeisla-stjarna, ekki sem útstreymi.
  const nNeistar = Math.round(4 + E*16);
  for(let i=0;i<nNeistar;i++){
    const a = (i*2.39996 + fasi*.3) % (Math.PI*2);        // gullna hornið = jöfn dreifing
    const breidd = .35 + .65*Math.abs(Math.sin(i*1.7 + fasi*2.2));
    const r1 = brun(a)*1.01, r2 = r1 + kR*(.12 + .85*E)*breidd;
    const x1 = cx+Math.cos(a)*r1, y1 = cy+Math.sin(a)*r1;
    const x2 = cx+Math.cos(a)*r2, y2 = cy+Math.sin(a)*r2;
    const g2 = kx.createLinearGradient(x1,y1,x2,y2);
    g2.addColorStop(0, heitt(.18+.50*E)); g2.addColorStop(1, lit(0));
    kx.beginPath(); kx.moveTo(x1,y1); kx.lineTo(x2,y2);
    kx.strokeStyle = g2; kx.lineWidth = (.7+.9*E)*dpr; kx.stroke();
  }

  // ── Agnirnar: HÆGT reik á eigin sporbrautum. Grunnhraðinn er ~1/6 af því
  //    sem hann var; orkan flýtir þeim aðeins lítillega (þær eru ekki mælirinn
  //    — kjarninn er það). Diskantinn lætur þær tindra.
  snuningur += dt * (.085 + .16*E);
  for(const p of AGNIR){
    const a = p.horn + snuningur*p.hradi;
    const rad = R*(p.rad + .045*Math.sin(fasi*.7 + p.f) + E*.26);
    const x = cx+Math.cos(a)*rad, y = cy+Math.sin(a)*rad;
    const tindr = .5 + .5*Math.sin(fasi*1.1 + p.f);
    kx.beginPath(); kx.arc(x, y, p.st*(1+.5*diskant)*dpr, 0, Math.PI*2);
    kx.fillStyle = heitt(.16 + .34*tindr + .30*E); kx.fill();
  }

  kx.globalCompositeOperation = 'source-over';

  // Hnappurinn situr ofan á miðjunni og myndi annars vera eini dauði bletturinn
  // á borðinu. Hann fær því sömu orku: glóðin í kringum hann og innri birtan
  // fylgja `E`. Skrifað beint á style (ekki klasa) svo þetta sé samfellt.
  // GILDRA: inline-stíll slær út `#hnappur.on` regluna í CSS, svo rauði liturinn
  // í hlustun VERÐUR að vera valinn hér líka — annars yrði hnappurinn blár um
  // leið og byrjað er að hlusta.
  if(hnapp){
    const [hr,hg,hb] = hnapp.classList.contains('on') ? [255,90,110] : heilsulitur;
    hnapp.style.boxShadow =
      `0 0 ${Math.round(26+70*E)}px rgba(${hr},${hg},${hb},${(.26+.45*E).toFixed(2)}),` +
      `inset 0 0 ${Math.round(24+46*E)}px rgba(${hr},${hg},${hb},${(.14+.40*E).toFixed(2)})`;
  }
  requestAnimationFrame(teiknaKjarna);
}

/* ── hljóðnemi: alvöru bylgja, ekki hreyfimynd ── */
const bc = $('#bylgja'), bx = bc.getContext('2d');
let greinir = null, gognBuffer = null, tidniBuffer = null;
function teiknaBylgju(){
  const w = bc.width, h = bc.height;
  bx.clearRect(0,0,w,h);
  bx.strokeStyle = 'rgba(79,216,255,.75)'; bx.lineWidth = Math.min(2, devicePixelRatio||1);
  bx.beginPath();
  if(greinir && gognBuffer){
    greinir.getByteTimeDomainData(gognBuffer);
    let summa = 0;
    for(let i=0;i<gognBuffer.length;i++){
      const v = (gognBuffer[i]-128)/128, y = h/2 + v*h*.45;
      summa += Math.abs(v);
      const x = i/gognBuffer.length*w;
      i ? bx.lineTo(x,y) : bx.moveTo(x,y);
    }
    markOrka = Math.min(1, (summa/gognBuffer.length)*7);
    // Tíðnirófið: neðsti áttundi = bassi (ýfir kjarnann), efsti þriðjungur =
    // diskant (kveikir í ögnunum). Mýkt með lágsíu svo þetta titri ekki.
    if(tidniBuffer){
      greinir.getByteFrequencyData(tidniBuffer);
      const N = tidniBuffer.length;
      let lag = 0, har = 0;
      const lagN = Math.max(1, N>>3), harFra = Math.floor(N*.66);
      for(let i=0;i<lagN;i++) lag += tidniBuffer[i];
      for(let i=harFra;i<N;i++) har += tidniBuffer[i];
      bassi   += (Math.min(1, lag/lagN/190) - bassi) * .18;
      diskant += (Math.min(1, har/(N-harFra)/150) - diskant) * .18;
    }
  }else{
    bx.moveTo(0,h/2); bx.lineTo(w,h/2); markOrka = 0;
    bassi += (0-bassi)*.05; diskant += (0-diskant)*.05;
  }
  bx.stroke();
  requestAnimationFrame(teiknaBylgju);
}

/* ── ratsjá: vélarnar. Fjarlægð frá miðju = hve langt síðan lífsmark. ── */
let VELAR = [];
function teiknaRatsja(){
  const c = $('#ratsja-canvas'), x = c.getContext('2d');
  const w = c.width, h = c.height, cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 6;
  const dpr = Math.min(2, devicePixelRatio||1);
  x.clearRect(0,0,w,h);
  for(let i=1;i<=3;i++){
    x.beginPath(); x.arc(cx,cy,R*i/3,0,Math.PI*2);
    x.strokeStyle='rgba(79,216,255,.16)'; x.lineWidth=1*dpr; x.stroke();
  }
  x.beginPath(); x.moveTo(cx-R,cy); x.lineTo(cx+R,cy); x.moveTo(cx,cy-R); x.lineTo(cx,cy+R);
  x.strokeStyle='rgba(79,216,255,.12)'; x.stroke();

  const sveipur = (Date.now()/2600)%1 * Math.PI*2;
  const gr = x.createConicGradient ? x.createConicGradient(sveipur,cx,cy) : null;
  if(gr){ gr.addColorStop(0,'rgba(79,216,255,.30)'); gr.addColorStop(.12,'rgba(79,216,255,0)');
    gr.addColorStop(1,'rgba(79,216,255,0)');
    x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.fillStyle=gr; x.fill(); }

  if(!VELAR.length){
    x.fillStyle='rgba(63,115,145,.9)'; x.font=`${11*dpr}px ui-monospace,monospace`;
    x.textAlign='center'; x.fillText('ENGIN VÉL Á SKJÁNUM', cx, cy+4*dpr);
  }
  VELAR.forEach((v,i) => {
    const a = (i/Math.max(1,VELAR.length))*Math.PI*2 - Math.PI/2;
    const naer = v.aldur_min==null ? 1 : Math.min(1, v.aldur_min/1440);   // sólarhringur = ysta baugur
    const rr = R*(.22 + naer*.72);
    const px = cx+Math.cos(a)*rr, py = cy+Math.sin(a)*rr;
    const lit = v.status==='graent' ? '67,245,160' : v.status==='gult' ? '255,199,70' : '255,90,110';
    x.beginPath(); x.arc(px,py,4*dpr,0,Math.PI*2); x.fillStyle=`rgba(${lit},.95)`; x.fill();
    x.beginPath(); x.arc(px,py,9*dpr,0,Math.PI*2); x.strokeStyle=`rgba(${lit},.35)`; x.stroke();
    x.fillStyle=`rgba(${lit},.85)`; x.font=`${9.5*dpr}px ui-monospace,monospace`; x.textAlign='center';
    x.fillText(String(v.vel||'').slice(0,14).toUpperCase(), px, py-13*dpr);
  });
  requestAnimationFrame(teiknaRatsja);
}

/* ── tal ────────────────────────────────────────────────── */
let sr = null, straumur = null, sidastaSvar = '';
async function byrjaTal(){
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:true});
    straumur = s;
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    greinir = ac.createAnalyser(); greinir.fftSize = 1024;
    gognBuffer = new Uint8Array(greinir.fftSize);
    tidniBuffer = new Uint8Array(greinir.frequencyBinCount);
    ac.createMediaStreamSource(s).connect(greinir);
  }catch(e){ $('#heyri').innerHTML = '<span class="villa">Kemst ekki í hljóðnemann</span>'; return false; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ $('#heyri').textContent = 'Tækið styður ekki talgreiningu'; return true; }
  sr = new SR(); sr.lang = MAL==='en'?'en-US':'is-IS'; sr.continuous = true; sr.interimResults = true;
  let loka = '';
  sr.onresult = e => {
    let bid = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i];
      if(r.isFinal) loka += r[0].transcript.trim()+' '; else bid += r[0].transcript;
    }
    $('#talid').textContent = (loka+bid).trim();
  };
  sr.onend = () => { if($('#hnappur').classList.contains('on')){ try{sr.start();}catch(_){}} };
  try{ sr.start(); }catch(_){}
  return true;
}
function haettaTal(){
  if(sr){ try{ sr.onend=null; sr.stop(); }catch(_){} sr=null; }
  if(straumur){ straumur.getTracks().forEach(t=>t.stop()); straumur=null; }
  greinir = null; gognBuffer = null; tidniBuffer = null; markOrka = 0;
}
function tala(t, mal){
  sidastaSvar = t;
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const k = mal==='en'?'en':'is';
    u.lang = k==='en'?'en-US':'is-IS';
    const v = (speechSynthesis.getVoices()||[]).find(x => (x.lang||'').toLowerCase().startsWith(k));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(_){}
}

$('#hnappur').addEventListener('click', async () => {
  const b = $('#hnappur');
  if(b.classList.contains('on')){
    haettaTal(); b.classList.remove('on'); $('#hlbl').textContent='Tala';
    const q = $('#talid').textContent.trim();
    if(!q){ $('#heyri').textContent='Ekkert heyrðist'; return; }
    $('#heyri').textContent='Hugsa…';
    try{
      const r = await fetch('/api/raddminni',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'spyrja',spurning:q,mal:MAL})});
      const j = await r.json();
      if(j.error) throw new Error(j.error);
      $('#svar').textContent = j.svar; $('#svar').hidden = false;
      $('#heyri').textContent = 'Svarað';
      tala(j.svar, j.mal||MAL);
      baetaStraum(MAL==='en'?'query answered':'spurningu svarað','ok');
    }catch(e){
      $('#svar').innerHTML = '<span class="villa">'+esc(e.message)+'</span>'; $('#svar').hidden=false;
      $('#heyri').textContent='Villa';
    }
  }else{
    $('#talid').textContent=''; $('#svar').hidden=true;
    if(await byrjaTal()){ b.classList.add('on'); $('#hlbl').textContent='Stopp'; $('#heyri').textContent='Hlusta…'; }
  }
});

/* ── straumur (fjarskipti) — RAUNVERULEGIR atburðir ── */
const STRAUMUR = [];
function baetaStraum(txt, flokkur){
  const d = new Date();
  STRAUMUR.unshift({ t: pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()), txt, flokkur });
  if(STRAUMUR.length>60) STRAUMUR.pop();
  $('#straumur').innerHTML = STRAUMUR.map(x =>
    '<div><span class="kl">'+x.t+'</span> <span class="'+(x.flokkur||'')+'">'+esc(x.txt)+'</span></div>').join('');
}

/* ── gögnin ─────────────────────────────────────────────── */
function stika(nafn, gildi, hlutfall, klasi){
  return '<div class="maelir"><div class="lina"><span>'+esc(nafn)+'</span><b>'+esc(gildi)+'</b></div>'+
    '<div class="rein '+(klasi||'')+'"><i style="width:'+Math.max(2,Math.min(100,hlutfall))+'%"></i></div></div>';
}

async function sakja(){
  try{
    const [h, g, v, ve] = await Promise.all([
      fetch('/api/kerfisheilsa',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      fetch('/api/data-sources-status',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      fetch('/api/vel-heartbeat',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      fetch('/api/veidin',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    ]);

    // ── vitals
    if(h && h.counts){
      const c = h.counts, alls = (c.graent||0)+(c.gult||0)+(c.raudt||0);
      const teng = (h.services||[]).filter(s => !/ferskleiki/i.test(s.hopur));
      const raud = teng.filter(s=>s.status==='raudt').length;
      const gul  = teng.filter(s=>s.status==='gult').length;
      $('#vitals').innerHTML =
        stika('Tengingar í lagi', (c.graent||0)+'/'+alls, alls?100*(c.graent||0)/alls:0, raud?'var':'ok') +
        stika('Þarfnast athugunar', String(gul), alls?100*gul/alls:0, gul?'var':'ok') +
        stika('Ótengt', String(raud), alls?100*raud/alls:0, raud?'hae':'ok');
      $('#k-uppf').textContent = new Date().toLocaleTimeString('is-IS',{hour:'2-digit',minute:'2-digit'});
      const p = [];
      p.push('<span class="p '+(raud?'hae':'on')+'">'+(raud?raud+' ótengt':'tengingar í lagi')+'</span>');
      if(gul) p.push('<span class="p vara">'+gul+' að athuga</span>');
      $('#pillur').innerHTML = p.join('');
    }

    // ── vélar
    VELAR = (v && v.velar) || [];
    $('#v-fjoldi').textContent = VELAR.length ? VELAR.filter(x=>x.status==='graent').length+'/'+VELAR.length+' í sambandi' : 'engin skráð';
    $('#velalisti').innerHTML = VELAR.length ? VELAR.map(x =>
      '<div style="font-size:10.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px">'+
      '<span>'+esc(x.vel)+'</span><span style="color:var(--'+(x.status==='graent'?'ok':x.status==='gult'?'var':'hae')+')">'+
      (x.aldur_min==null?'—':x.aldur_min<60?x.aldur_min+' mín':Math.round(x.aldur_min/60)+' klst')+'</span></div>').join('')
      : '<div style="font-size:10.5px;color:var(--ink3)">Settu upp lífsmarkið á vélunum til að sjá þær hér.</div>';

    // ── gagnaleiðslur
    if(g && g.sources){
      $('#gogn').innerHTML = g.sources.map(s => {
        const k = s.status==='fresh'?'ok':s.status==='aging'?'var':'hae';
        const pct = s.age_days==null?0:Math.max(4,100-Math.min(100,(s.age_days/14)*100));
        return stika((s.label||s.key), s.age_days==null?'—':(s.age_days+'d'), pct, k);
      }).join('');
    }

    // ── meginmarkmið: skýrsluþekja
    if(ve && ve.nuna){
      const n = ve.nuna, d = ve.delta||{};
      const pct = n.stadir_i_thjonustu ? 100*n.stadir_med_2026_skyrslu/n.stadir_i_thjonustu : 0;
      $('#m-tala').textContent = n.stadir_med_2026_skyrslu + ' / ' + n.stadir_i_thjonustu;
      $('#m-texti').textContent = 'staðir í þjónustu með skýrslu 2026 · ' + n.engin_skyrsla_25_26 + ' hafa enga skýrslu 25/26';
      $('#m-rein').style.width = pct.toFixed(1)+'%';
      $('#m-pct').textContent = pct.toFixed(1)+'%';
      $('#m-dags').textContent = n.dags;
      const dd = d.stadir_med_2026_skyrslu||0;
      $('#m-vinstri').textContent = (dd>0?'+':'')+dd+' frá grunnlínu';
      $('#m-haegri').textContent = n.rukkud_an_skyrslu+' rukkuð án skýrslu';
    }

    baetaStraum('kerfisstaða uppfærð','');
    // kjarnaliturinn fylgir raunverulegri stöðu
    const raudt = (h&&h.counts&&h.counts.raudt)||0, gult=(h&&h.counts&&h.counts.gult)||0;
    heilsulitur = raudt ? [255,90,110] : gult ? [255,199,70] : [79,216,255];
  }catch(e){
    baetaStraum('villa við lestur: '+e.message,'hae');
  }
}

staerd(); teiknaKjarna(); teiknaBylgju(); teiknaRatsja();
settMal(MAL);
baetaStraum('stjórnstöð ræst','ok');
sakja();
setInterval(sakja, 60000);
</script>
