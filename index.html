  const $meta = document.getElementById('vb-meta');
  const $refresh = document.getElementById('vb-refresh');
  const $back = document.getElementById('vb-month-back');
  const $fwd = document.getElementById('vb-month-fwd');
  const $host = document.getElementById('vb-grid-host');
  let data = null;

  // persisted state for vinnubok grid (month window, hidden worksites)
  state.ui = state.ui || {};
  if(typeof state.ui.vb_months_back !== 'number') state.ui.vb_months_back = 8;
  if(typeof state.ui.vb_months_fwd !== 'number') state.ui.vb_months_fwd = 0;
  if(!Array.isArray(state.ui.vb_hidden)) state.ui.vb_hidden = [];
  if(!Array.isArray(state.ui.vb_collapsed_years)) state.ui.vb_collapsed_years = [];
  if(!['cards','table','minimal'].includes(state.ui.vb_layout)) state.ui.vb_layout = 'table';
  if(!['','green','yellow','red'].includes(state.ui.vb_review_filter)) state.ui.vb_review_filter = '';

  const VB_URLS = ['/api/worksites?year=combined', '/api/invoice-drafts', '/api/efnislisti-docs'];

  function processResponses(ws, dr, ef){
    data = {
      worksites: ws.worksites || [],
      drafts: {},
      efnislisti: {},   // work documents (doc_type='efnislisti')
      invoices: {},     // invoice / reikningur documents (doc_type='invoice')
      scan: {},   // `${worksite}|${month}` → { amount, snippet, file, status } from folder scan
      rates: window.__rgPricingGuide || {},
    };
    for(const d of (dr.rows || [])){
      data.drafts[`${d.worksite_name}|${d.work_month}`] = d;
    }
    // rows ordered added_at desc → first per cell+type is the most recent
    for(const e of (ef.rows || [])){
      const k = `${e.worksite_name}|${e.work_month}`;
      const slot = e.doc_type === 'invoice' ? data.invoices : data.efnislisti;
      if(!slot[k]) slot[k] = { id: e.drive_file_id, title: e.title };
    }
  }

  const VB_LS_KEY = 'brunaholfVbCache_v1';
  const VB_LS_TTL = 30 * 60 * 1000; // 30 min disk cache (longer than in-memory)

  // Read cache synchronously (no await) — gives instant render if previous data
  // exists in memory OR localStorage. localStorage survives page reloads.
  function renderSkeleton(){
    const months = buildMonths();
    const cells = months.map(() => '<td class="vb-cell" style="opacity:.5"><div style="height:90px;background:linear-gradient(90deg,#f1f5f9 0%,#e2e8f0 50%,#f1f5f9 100%);background-size:200% 100%;animation:vb-shimmer 1.4s linear infinite"></div></td>').join('');
    const rows = Array.from({length:6}, () => `<tr><td class="vb-row-name" style="opacity:.5"><div style="height:14px;width:120px;background:#cbd5e1;border-radius:3px"></div></td>${cells}</tr>`).join('');
    $host.innerHTML = `
      <style>@keyframes vb-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
      <div class="vb-scroll-wrap" data-vb-layout="${state.ui.vb_layout || 'table'}" style="overflow-x:auto;max-height:calc(100vh - 220px);overflow-y:auto">
        <table class="vb-grid">
          <thead><tr><th class="vb-row-name">Verkstaður</th>${months.map(ym => `<th class="vb-th-month"><div class="vb-th-name">${monthLabel(ym)}</div></th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
  function readCacheSync(){
    const cache = window.__dataCache || {};
    let hits = VB_URLS.map(u => cache[u]);
    if(hits.every(h => h && h.ok)){
      try { return hits.map(h => JSON.parse(h.body)); } catch {}
    }
    // Fallback: try localStorage (persists across page reloads)
    try {
      const raw = localStorage.getItem(VB_LS_KEY);
      if(!raw) return null;
      const blob = JSON.parse(raw);
      if(Date.now() - blob.ts > VB_LS_TTL) return null;
      return [blob.ws, blob.dr || {rows:[]}, blob.ef || {rows:[]}];
    } catch { return null; }
  }
  function writeCacheLS(ws, dr, ef){
    try {
      localStorage.setItem(VB_LS_KEY, JSON.stringify({ ws, dr, ef, ts: Date.now() }));
    } catch {}
  }

  async function load(opts){
    const force = opts && opts.force;
    let renderedFromCache = false;

    // 1. Instant render from cache if available (no spinner, no wait).
    if(!force){
      const cached = readCacheSync();
      if(cached){
        processResponses(cached[0], cached[1] || {rows:[]}, cached[2] || {rows:[]});
        render();
        renderedFromCache = true;
        $meta.textContent = `${data.worksites.length} verkstaðir · samstillir…`;
      } else {
        // No cache at all → show skeleton table so user sees structure immediately
        renderSkeleton();
        $meta.textContent = 'Sækir…';
      }
    } else {
      $meta.textContent = 'Sækir…';
    }
    $refresh.disabled = true;
    try{
      const [wsR, drR, efR] = await Promise.all([
        cachedFetch(VB_URLS[0], {force: true}),
        cachedFetch(VB_URLS[1], {force: true}).catch(() => null),
        cachedFetch(VB_URLS[2], {force: true}).catch(() => null),
      ]);
      const ws = wsR ? await wsR.json() : { worksites: [] };
      const dr = drR && drR.ok ? await drR.json() : { rows: [] };
      const ef = efR && efR.ok ? await efR.json() : { rows: [] };
      // Snapshot focus so user typing in an input doesn't lose place during re-render.
      const focused = document.activeElement;
      const focusKey = focused && focused.dataset && focused.dataset.vbSaveAmt;
      const selStart = focused && focused.selectionStart;
      processResponses(ws, dr, ef);
      writeCacheLS(ws, dr, ef);
      render();
      if(focusKey){
        const el = document.querySelector(`[data-vb-save-amt="${CSS.escape(focusKey)}"]`);
        if(el){ el.focus(); if(selStart != null) try { el.setSelectionRange(selStart, selStart); } catch {} }
      }
      $meta.textContent = `${data.worksites.length} verkstaðir · uppfært ${new Date().toLocaleTimeString('is-IS')}`;
    }catch(e){
      if(!renderedFromCache) $meta.textContent = 'Villa: '+(e.message||e);
      else $meta.textContent = `${data.worksites.length} verkstaðir · samstilling mistókst`;
    }finally{
      $refresh.disabled = false;
    }
  }

  function buildMonths(){
    const today = new Date();
    const out = [];
    const back = state.ui.vb_months_back || 8;
    const fwd  = state.ui.vb_months_fwd  || 0;
    for(let i = back - 1; i >= -fwd; i--){
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    }
    return out;
  }
  function monthLabel(ym){
    const [y,m] = ym.split('-');
    const names = ['Jan','Feb','Mar','Apr','Maí','Jún','Júl','Ágú','Sep','Okt','Nóv','Des'];
    return `${names[parseInt(m,10)-1]} ${y.slice(2)}`;
  }
  function rateFor(project){
    const pg = (data.rates || {})[project];
    return {
      dv: Number(pg?.dagvinna_rate) || 9951,
      ev: Number(pg?.eftirvinna_rate) || 14927,
    };
  }
  function fmtIsk(n){ return n ? Math.round(n).toLocaleString('is-IS') : ''; }
  function isGata(name){
    return /landsspítal|landsspital|nlsh|heklu|dalvegur 30/i.test(name);
  }

  function render(){
    if(!data){ $host.innerHTML = ''; return; }
    const months = buildMonths();
    const hidden = new Set(state.ui.vb_hidden || []);
    const reviewFilter = state.ui.vb_review_filter || '';
    const reviewMap = state.ui.vb_review || {};
    const sites = (data.worksites || []).filter(w => {
      if(/almennt|veikindi|sick|work at home|kaffi|fundir/i.test(w.project)) return false;
      if(hidden.has(w.project)) return false;
      // When a dot filter is on, show only worksites with a matching dot in the visible months.
      if(reviewFilter) return months.some(ym => reviewMap[`${w.project}|${ym}`] === reviewFilter);
      const hasHours = months.some(ym => (w.monthly||{})[ym] > 0);
      const hasInvoiceDraft = months.some(ym => data.drafts[`${w.project}|${ym}`]);
      return hasHours || hasInvoiceDraft || (w.invoice_unpaid||0) > 0;
    });
    // Sort by latest month with activity (Tímavera klst OR a draft) — most recent first.
    const latestActivity = (w) => {
      let latest = '';
      for(const ym of Object.keys(w.monthly || {})){
        if((w.monthly[ym] || 0) > 0 && ym > latest) latest = ym;
      }
      for(const k of Object.keys(data.drafts)){
        if(!k.startsWith(w.project + '|')) continue;
        const m = k.split('|')[1];
        if(m > latest) latest = m;
      }
      return latest;  // '' if no activity
    };
    sites.sort((a,b) => {
      const la = latestActivity(a), lb = latestActivity(b);
      if(la !== lb) return lb.localeCompare(la);  // descending YYYY-MM
      return (b.hours||0) - (a.hours||0);
    });

    const hiddenCount = (state.ui.vb_hidden || []).length;
    const hiddenBar = '';
    // Render the "N faldir" pill in the toolbar instead of above the table
    const $hi = document.getElementById('vb-hidden-inline');
    if($hi){
      if(hiddenCount){
        $hi.hidden = false;
        $hi.innerHTML = `👁 ${hiddenCount} faldir <button type="button" id="vb-unhide-all">↻ Sýna alla</button>`;
      } else {
        $hi.hidden = true;
        $hi.innerHTML = '';
      }
    }

    // Determine which year-collapse buttons to show and which months to fold
    const collapsedYears = new Set(state.ui.vb_collapsed_years || []);
    const yearsInWindow = [...new Set(months.map(ym => ym.slice(0,4)))];
    // months becomes a mixed array: either "YYYY-MM" string or {collapsed_year: "2025"}
    const monthCells = [];
    let lastCollapsedYear = null;
    for(const ym of months){
      const year = ym.slice(0,4);
      if(collapsedYears.has(year)){
        if(lastCollapsedYear !== year){
          monthCells.push({ collapsed_year: year });
          lastCollapsedYear = year;
        }
      } else {
        monthCells.push(ym);
        lastCollapsedYear = null;
      }
    }

    // Per-month totals (sum of invoice amounts across all visible sites)
    const monthTotal = (ym) => {
      let sum = 0;
      for(const w of sites){
        const d = data.drafts[`${w.project}|${ym}`];
        if(d) sum += Number(d.total_m_vsk || 0);
      }
      return sum;
    };
    const grandTotal = monthCells.reduce((acc, mc) => acc + (typeof mc === 'string' ? monthTotal(mc) : 0), 0);

    const html = `
      ${hiddenBar}
      <div class="vb-scroll-wrap" data-vb-layout="${state.ui.vb_layout || 'cards'}" style="overflow-x:auto;max-height:calc(100vh - 220px);overflow-y:auto">
        <table class="vb-grid">
          <thead>
            <tr>
              <th class="vb-row-name" style="text-align:left">Verkstaður</th>
              ${monthCells.map(mc =>
                typeof mc === 'string'
                  ? `<th class="vb-th-month"><div class="vb-th-name">${monthLabel(mc)}</div>${monthTotal(mc) > 0 ? `<div class="vb-th-sum">${monthTotal(mc).toLocaleString('is-IS')}</div>` : ''}</th>`
                  : `<th class="vb-year-collapsed" data-vb-expand-year="${mc.collapsed_year}" title="Smelltu til að sýna ${mc.collapsed_year} aftur">▶ ${mc.collapsed_year}</th>`
              ).join('')}
            </tr>
          </thead>
          <tbody>
            ${sites.map(w => renderRow(w, monthCells)).join('')}
          </tbody>
          <tfoot>
            <tr class="vb-totals-row">
              <td class="vb-row-name">
                Samtals m. vsk
                <span class="vb-total-sub" style="display:block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:none;color:rgba(255,255,255,.85);margin-top:3px;font-family:'SF Mono','JetBrains Mono',monospace">${grandTotal > 0 ? grandTotal.toLocaleString('is-IS') + ' kr' : '—'}</span>
              </td>
              ${monthCells.map(mc =>
                typeof mc === 'string'
                  ? `<td class="vb-total-cell">${monthTotal(mc) > 0 ? monthTotal(mc).toLocaleString('is-IS') : '—'}<span class="vb-total-sub">m. vsk</span></td>`
                  : `<td class="vb-year-collapsed" data-vb-expand-year="${mc.collapsed_year}">…</td>`
              ).join('')}
            </tr>
          </tfoot>
        </table>
      </div>
    `;
    $host.innerHTML = html;

    // wire cell events
    $host.querySelectorAll('[data-vb-save-amt]').forEach(input => {
      // Snapshot the value on focus so we can detect if the user actually changed it.
      // Without this, just tab-clicking through cells would save null and wipe data.
      input.addEventListener('focus', () => { input.dataset.vbInitial = input.value; });
      input.addEventListener('blur', () => {
        const initial = input.dataset.vbInitial;
        if (initial !== undefined && input.value === initial) return;  // no real change
        saveAmount(input);
      });
      input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); input.blur(); } });
    });
    $host.querySelectorAll('[data-vb-attach]').forEach(btn => {
      btn.onclick = () => openDriveSearch(btn.dataset.vbAttach, 'efnislisti');
    });
    $host.querySelectorAll('[data-vb-attach-inv]').forEach(btn => {
      btn.onclick = () => openDriveSearch(btn.dataset.vbAttachInv, 'invoice');
    });
    // Review-status cycle: empty → yellow → red → empty
    $host.querySelectorAll('[data-vb-review]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.vbReview;
        state.ui.vb_review = state.ui.vb_review || {};
        const cur = state.ui.vb_review[key];
        // Cycle: none → green → yellow → red → none
        const next = cur === 'green' ? 'yellow' : cur === 'yellow' ? 'red' : cur === 'red' ? undefined : 'green';
        if(next) state.ui.vb_review[key] = next;
        else delete state.ui.vb_review[key];
        save();
        btn.className = 'vb-review-btn' + (next ? ' state-'+next : '');
        btn.title = next === 'green'  ? 'Staðfest / tilbúið'
                  : next === 'yellow' ? 'Ágiskun — skoða betur'
                  : next === 'red'    ? 'Þarfnast nánari skoðunar / sönnunar'
                  : 'Smelltu til að merkja: grænt = staðfest, gult = ágiskun, rautt = skoða betur';
      };
    });
    $host.querySelectorAll('[data-vb-hide]').forEach(btn => {
      btn.onclick = () => {
        const project = btn.dataset.vbHide;
        if(!state.ui.vb_hidden.includes(project)){
          state.ui.vb_hidden.push(project);
          save(); render();
        }
      };
    });
    const $unhide = document.getElementById('vb-unhide-all');
    if($unhide){
      $unhide.onclick = () => { state.ui.vb_hidden = []; save(); render(); };
    }
    // Link a Drive folder to the worksite (when none is set yet)
    $host.querySelectorAll('[data-vb-folder]').forEach(btn => {
      btn.onclick = async () => {
        const project = btn.dataset.vbFolder;
        const url = (prompt(`Límdu inn Drive-slóð á möppu fyrir „${project}":`) || '').trim();
        if(!url) return;
        const w = (data.worksites || []).find(x => x.project === project);
        try {
          const r = await fetch('/api/worksites', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ project_name: project, year: new Date().getFullYear(), drive_folder_url: url, updated_by: 'vinnubok' }),
          });
          if(!r.ok) throw new Error('HTTP '+r.status);
          if(w){ w.status = w.status || {}; w.status.drive_folder_url = url; }
          render();
        } catch(e){ alert('Tenging mistókst: '+(e.message||e)); }
      };
    });
    // Link the payer company's Payday ledger overview to the worksite
    $host.querySelectorAll('[data-vb-payday]').forEach(btn => {
      btn.onclick = async () => {
        const project = btn.dataset.vbPayday;
        const w = (data.worksites || []).find(x => x.project === project);
        const cur = (w && w.status && w.status.payday_url) || '';
        const url = (prompt(`Payday-slóð á greiðanda fyrir „${project}" (yfirlit / ledgerAccountStatement):`, cur) || '').trim();
        if(url === cur) return;  // unchanged / cancelled
        try {
          const r = await fetch('/api/worksites', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ project_name: project, year: new Date().getFullYear(), payday_url: url || null, updated_by: 'vinnubok' }),
          });
          if(!r.ok) throw new Error('HTTP '+r.status);
          if(w){ w.status = w.status || {}; w.status.payday_url = url || null; }
          render();
        } catch(e){ alert('Tenging mistókst: '+(e.message||e)); }
      };
    });
    // Scan the worksite's Drive folder → link Efnislistar to months + suggest amounts
    $host.querySelectorAll('[data-vb-scan]').forEach(btn => {
      btn.onclick = () => runScan(btn.dataset.vbScan, btn);
    });
    // Accept a scanned amount suggestion (writes it into the cell + persists)
    $host.querySelectorAll('[data-vb-accept]').forEach(btn => {
      btn.onclick = async () => {
        const key = btn.dataset.vbAccept;
        const sug = (data.scan || {})[key];
        if(!sug || !sug.amount) return;
        const input = $host.querySelector(`[data-vb-save-amt="${CSS.escape(key)}"]`);
        if(input){
          input.value = Number(sug.amount).toLocaleString('is-IS');
          await saveAmount(input);
        }
        delete data.scan[key];
        render();
      };
    });
    // Dismiss a suggestion without applying it
    $host.querySelectorAll('[data-vb-dismiss]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.vbDismiss;
        if(data.scan) delete data.scan[key];
        render();
      };
    });
    // Click a collapsed year column → expand it
    $host.querySelectorAll('[data-vb-expand-year]').forEach(el => {
      el.onclick = () => {
        const year = el.dataset.vbExpandYear;
        state.ui.vb_collapsed_years = (state.ui.vb_collapsed_years || []).filter(y => y !== year);
        save(); render();
      };
    });
  }

  function renderRow(w, monthCells){
    const cust = (w.mapped_customers || [])[0] || '';
    const rates = rateFor(w.project);
    const driveUrl = w.status?.drive_folder_url || '';
    const paydayUrl = w.status?.payday_url || '';
    const paydayLink = paydayUrl
      ? `<a class="vb-folder-link" href="${escapeAttr(paydayUrl)}" target="_blank" rel="noopener" title="Opna greiðanda í Payday${cust ? ' ('+escapeAttr(cust)+')' : ''}">💳</a><button type="button" class="vb-folder-link vb-payday-edit vb-folder-add" data-vb-payday="${escapeAttr(w.project)}" title="Breyta Payday-slóð greiðanda">✎</button>`
      : `<button type="button" class="vb-folder-link vb-folder-add" data-vb-payday="${escapeAttr(w.project)}" title="Tengja Payday-slóð greiðanda">💳</button>`;
    return `
      <tr>
        <td class="vb-row-name">
          <button type="button" class="vb-hide-btn" data-vb-hide="${escapeAttr(w.project)}" title="Fela verkstaðinn">×</button>
          <span class="vb-ws-name">${escapeHtml(w.project)}${driveUrl
            ? `<a class="vb-folder-link" href="${escapeAttr(driveUrl)}" target="_blank" rel="noopener" title="Opna Drive möppu verkstaðarins">📁</a><button type="button" class="vb-folder-link vb-scan-btn" data-vb-scan="${escapeAttr(w.project)}" title="Skanna Drive möppu eftir Efnislistum — tengir skjöl við rétta mánuði og les upphæð (m. vsk)">🔍</button>`
            : `<button type="button" class="vb-folder-link vb-folder-add" data-vb-folder="${escapeAttr(w.project)}" title="Tengja Drive möppu við verkstaðinn">🔗</button>`}${paydayLink}</span>
          <small>${escapeHtml(cust)}${rates.dv !== 9951 ? ' · '+rates.dv+' kr/klst' : ''}</small>
        </td>
        ${monthCells.map(mc =>
          typeof mc === 'string'
            ? renderCell(w, mc, rates)
            : `<td class="vb-year-collapsed" data-vb-expand-year="${mc.collapsed_year}" title="Smelltu til að sýna ${mc.collapsed_year}">…</td>`
        ).join('')}
      </tr>
    `;
  }

  function renderCell(w, ym, rates){
    const hours = (w.monthly || {})[ym] || 0;
    const estKr = !isGata(w.project) ? Math.round(hours * rates.dv * 1.24) : 0;
    const draftKey = `${w.project}|${ym}`;
    const draft = data.drafts[draftKey];
    const draftKr = draft ? Number(draft.total_m_vsk || 0) : 0;
    const ef = data.efnislisti[draftKey];
    const inv = data.invoices[draftKey];
    const sug = (data.scan || {})[draftKey];
    const sugAmount = sug && sug.amount ? Number(sug.amount) : 0;
    const showSug = sugAmount > 0 && sugAmount !== draftKr;
    const hasInvoice = draftKr > 0;
    const mismatch = hasInvoice && hours > 0 && Math.abs(draftKr - estKr) > Math.max(estKr * 0.1, 50000);
    const cls = ['vb-cell'];
    if(hours > 0) cls.push('vb-cell-has-hours');
    if(hasInvoice) cls.push('vb-cell-has-invoice');
    if(mismatch) cls.push('vb-cell-mismatch');

    const hoursStr = hours > 0 ? hours.toFixed(1).replace('.0','') + 't' : '—';
    const estStr = estKr > 0 ? fmtIskCompact(estKr) : '—';
    state.ui.vb_review = state.ui.vb_review || {};
    const reviewState = state.ui.vb_review[draftKey];  // undefined | 'green' | 'yellow' | 'red'
    const reviewLabel = reviewState === 'green'  ? 'Staðfest / tilbúið'
                      : reviewState === 'yellow' ? 'Ágiskun — skoða betur'
                      : reviewState === 'red'    ? 'Þarfnast nánari skoðunar / sönnunar'
                      : 'Smelltu til að merkja: grænt = staðfest, gult = ágiskun, rautt = skoða betur';

    return `
      <td class="${cls.join(' ')}" data-vb-cell="${escapeAttr(draftKey)}">
        <div class="vb-cell-corners">
          <div class="vb-corner">
            <span class="vb-corner-val ${hours > 0 ? '' : 'dim'}">${hoursStr}</span>
            <span class="vb-corner-sep">·</span>
            <span class="vb-corner-val dim">${estStr}</span>
          </div>
          <div class="vb-corner vb-corner-r">
            <button type="button" class="vb-review-btn ${reviewState ? 'state-'+reviewState : ''}" data-vb-review="${escapeAttr(draftKey)}" title="${reviewLabel}"></button>
            ${hasInvoice
              ? `<span style="background:#10b981;color:#fff;font-size:9px;padding:1px 5px;border-radius:99px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">✓</span>`
              : (hours > 0 ? `<span style="background:#fef3c7;color:#92400e;font-size:9px;padding:1px 5px;border-radius:99px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">eftir</span>` : '')
            }
          </div>
        </div>
        <div class="vb-cell-main">
          <input type="text" class="vb-amount-input" data-vb-save-amt="${escapeAttr(draftKey)}"
                 value="${draftKr ? draftKr.toLocaleString('is-IS') : ''}" placeholder="—" inputmode="numeric">
          <div class="vb-amount-currency">kr m. vsk</div>
          <div class="vb-save-status" data-vb-status="${escapeAttr(draftKey)}"></div>
        </div>
        ${sug && sug.status === 'loading'
          ? `<div class="vb-suggest vb-suggest-loading">⏳ les skjal…</div>`
          : (showSug
            ? `<div class="vb-suggest" title="${escapeAttr(sug.snippet || 'Lesið úr Efnislista')}">
                 <span class="vb-suggest-amt">📄 ${sugAmount.toLocaleString('is-IS')}</span>
                 <button type="button" class="vb-suggest-yes" data-vb-accept="${escapeAttr(draftKey)}" title="Nota þessa upphæð (m. vsk)">nota ✓</button>
                 <button type="button" class="vb-suggest-no" data-vb-dismiss="${escapeAttr(draftKey)}" title="Hunsa tillögu">✕</button>
               </div>`
            : '')}
        <div class="vb-cell-bottom">
          ${ef
            ? `<div style="display:flex;align-items:center;gap:6px;font-size:11px">
                 <a href="https://drive.google.com/file/d/${ef.id}/view" target="_blank" rel="noopener" title="${escapeAttr(ef.title || '')}" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3b82f6;text-decoration:none;font-weight:500">📎 ${escapeHtml((ef.title || 'Efnislisti').replace(/\.(xlsx|pdf|docx)$/i, ''))}</a>
                 <button type="button" class="vb-attach-btn" data-vb-attach="${escapeAttr(draftKey)}" title="Skipta um skjal" style="padding:3px 7px;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:5px;cursor:pointer;color:#64748b">↻</button>
               </div>`
            : `<button type="button" class="vb-attach-btn" data-vb-attach="${escapeAttr(draftKey)}" style="width:100%;padding:7px 10px;font-size:11px;border:1.5px dashed #cbd5e1;background:transparent;border-radius:6px;cursor:pointer;color:#64748b;font-weight:500;transition:all .15s">+ Tengja skjal</button>`
          }
          ${inv
            ? `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-top:5px">
                 <a href="https://drive.google.com/file/d/${inv.id}/view" target="_blank" rel="noopener" title="Reikningur: ${escapeAttr(inv.title || '')}" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#059669;text-decoration:none;font-weight:600">🧾 ${escapeHtml((inv.title || 'Reikningur').replace(/\.(xlsx|pdf|docx)$/i, ''))}</a>
                 <button type="button" class="vb-attach-btn" data-vb-attach-inv="${escapeAttr(draftKey)}" title="Skipta um reikning" style="padding:3px 7px;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:5px;cursor:pointer;color:#64748b">↻</button>
               </div>`
            : `<button type="button" class="vb-attach-btn" data-vb-attach-inv="${escapeAttr(draftKey)}" style="width:100%;margin-top:5px;padding:6px 10px;font-size:11px;border:1.5px dashed #a7f3d0;background:transparent;border-radius:6px;cursor:pointer;color:#059669;font-weight:600;transition:all .15s">+ Tengja reikning</button>`
          }
        </div>
      </td>
    `;
  }

  function fmtIskCompact(n){
    if(!n) return '—';
    if(n >= 1000000) return (n/1000000).toFixed(n >= 10000000 ? 1 : 2).replace('.0','') + 'M';
    if(n >= 1000) return Math.round(n/1000) + 'k';
    return n.toString();
  }

  async function saveAmount(input){
    const key = input.dataset.vbSaveAmt;
    const [worksite, month] = key.split('|');
    // ISK has no decimals — keep digits only. Robust against "." / spaces / "kr" /
    // stray chars so we never send NaN (JSON-encodes NaN to null, which wiped the
    // amount). "4.295.185 kr" -> 4295185 ; "" -> null.
    const digits = (input.value || "").replace(/[^0-9]/g, "");
    const newAmount = digits === "" ? null : parseInt(digits, 10);
    input.value = newAmount != null ? newAmount.toLocaleString("is-IS") : "";
    const $st = document.querySelector(`[data-vb-status="${CSS.escape(key)}"]`);
    if($st){ $st.textContent = 'Vistar…'; $st.className = 'vb-save-status'; }
    try {
      const existing = data.drafts[key];
      // source is NOT NULL in invoice_drafts — must supply it for INSERT case.
      // Use existing source if updating, otherwise auto-detect from worksite type.
      const source = existing?.source || (isGata(worksite) ? 'ajour' : 'timavera');
      const r = await fetch('/api/invoice-drafts', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          worksite_name: worksite,
          work_month: month,
          total_m_vsk: newAmount,
          source: source,
          status: existing?.status || 'draft',
          notes: `Handvirkt skráð í Vinnubók (${new Date().toLocaleString('is-IS')})`,
          updated_by: 'vinnubok',
        }),
      });
      if(!r.ok){
        const errText = await r.text().catch(() => '');
        throw new Error('HTTP '+r.status+(errText ? ': '+errText.slice(0,120) : ''));
      }
      const saved = await r.json();
      data.drafts[key] = saved;
      // Immediate visual confirmation without a disruptive full re-render:
      // reflect the saved/has-invoice state on the cell (turns the amount green
      // in table layout) so it's clear the value stuck.
      const cell = input.closest('.vb-cell');
      if(cell) cell.classList.toggle('vb-cell-has-invoice', Number(saved.total_m_vsk || 0) > 0);
      if($st){ $st.textContent = '✓ vistað'; $st.className = 'vb-save-status vb-save-ok'; }
    } catch(e){
      if($st){ $st.textContent = '✗ '+(e.message||e); $st.className = 'vb-save-status vb-save-err'; }
    }
  }

  // Extract a Drive folder/file id from a pasted Drive URL.
  function driveFolderId(url){
    const s = String(url || '');
    let m = s.match(/\/folders\/([A-Za-z0-9_-]+)/);
    if(m) return m[1];
    m = s.match(/[?&]id=([A-Za-z0-9_-]+)/);
    if(m) return m[1];
    m = s.match(/\/d\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }

  // Scan a worksite's Drive folder: link the per-month Efnislisti (PDF preferred)
  // to the right month cell, then read each file's m. vsk total as a SUGGESTION
  // the user confirms with one click. Never overwrites amounts silently.
  async function runScan(project, btn){
    const w = (data.worksites || []).find(x => x.project === project);
    const folderId = driveFolderId(w?.status?.drive_folder_url || '');
    if(!folderId){ alert('Engin gild Drive-möppuslóð fyrir þennan verkstað.'); return; }
    if(btn) btn.classList.add('is-scanning');
    try {
      const r = await fetch(`/api/efnislisti-scan?folderId=${encodeURIComponent(folderId)}&worksite=${encodeURIComponent(project)}`);
      const res = await r.json();
      if(!r.ok) throw new Error(res.error || ('HTTP '+r.status));
      const months = (res.months || []).filter(m => m.pick);
      if(!months.length){
        if(btn) btn.classList.remove('is-scanning');
        alert(`Engin Efnislisti-skjöl fundust fyrir „${project}" (skoðaði ${res.folders_visited||0} möppur).`);
        return;
      }
      data.scan = data.scan || {};
      const toRead = [];
      for(const m of months){
        const pick = m.pick;
        const key = `${project}|${m.month}`;
        data.efnislisti[key] = { id: pick.id, title: pick.name };
        data.scan[key] = { status:'loading', file:{ id:pick.id, name:pick.name, mime:pick.mime } };
        toRead.push({ key, id: pick.id });
        // Persist the file↔month link (fire-and-forget)
        fetch('/api/efnislisti-docs', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ worksite_name: project, work_month: m.month, drive_file_id: pick.id, title: pick.name }),
        }).catch(()=>{});
      }
      render();  // show 📎 links + ⏳ placeholders right away
      // Read amounts with limited concurrency, refreshing as each lands.
      let idx = 0;
      async function worker(){
        while(idx < toRead.length){
          const job = toRead[idx++];
          let amount = null, snippet = '';
          try {
            const ar = await fetch(`/api/efnislisti-amount?id=${encodeURIComponent(job.id)}`);
            const ad = await ar.json();
            amount = ad.amount || null; snippet = ad.snippet || '';
          } catch(e){ /* leave amount null */ }
          const cur = data.scan[job.key] || {};
          data.scan[job.key] = { ...cur, status:'done', amount, snippet };
          render();
        }
      }
      await Promise.all([worker(), worker(), worker()]);
    } catch(e){
      if(isReauthError(null, e.message)){
        if(confirm('Google tenging er útrunnin (Drive aðgangur).\n\nTengja aftur núna?')) startGoogleReauth();
      } else {
        alert('Skönnun mistókst: '+(e.message||e));
      }
    } finally {
      const live = $host.querySelector(`[data-vb-scan="${CSS.escape(project)}"]`);
      if(live) live.classList.remove('is-scanning');
    }
  }

  // Extract a Drive folder id from a folder URL (…/folders/ID or ?id=ID).
  function driveFolderIdFromUrl(url){
    if(!url) return null;
    const m = String(url).match(/\/folders\/([A-Za-z0-9_-]+)/) || String(url).match(/[?&]id=([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  }
  const niceMime = (m) => String(m||'')
    .replace('application/vnd.google-apps.','Google ')
    .replace('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','xlsx')
    .replace('application/vnd.openxmlformats-officedocument.wordprocessingml.document','docx')
    .replace('application/','').slice(0,28);

  // General document picker: attach ANY Drive file to a (worksite, month) cell.
  // Two modes — browse the worksite's Drive folder, or free-text search Drive.
  function openDriveSearch(cellKey, docType){
    docType = docType === 'invoice' ? 'invoice' : 'efnislisti';
    const isInv = docType === 'invoice';
    const [worksite, month] = cellKey.split('|');
    const w = (data.worksites || []).find(x => x.project === worksite);
    const rootFolderId = driveFolderIdFromUrl(w && w.status && w.status.drive_folder_url);
    const wrap = document.createElement('div');
    wrap.className = 'vb-modal-bg';
    wrap.innerHTML = `
      <div class="vb-modal" role="dialog">
        <div class="vb-modal-h">
          <span>${isInv ? 'Tengja reikning' : 'Tengja skjal'} — <b>${escapeHtml(worksite)}</b> · ${month}</span>
          <button type="button" class="vb-modal-x" data-vb-close>×</button>
        </div>
        <div class="vb-modal-body">
          <div class="vb-pick-tabs" role="group">
            ${rootFolderId ? `<button type="button" class="vb-pick-tab is-active" data-mode="browse">📁 Mappa verkstaðarins</button>` : ''}
            <button type="button" class="vb-pick-tab ${rootFolderId?'':'is-active'}" data-mode="search">🔍 Leita í Drive</button>
          </div>
          <div class="vb-search-row" id="vb-search-row" ${rootFolderId?'hidden':''}>
            <input type="text" id="vb-q" value="${escapeAttr(worksite)}" placeholder="Leita að skjali á nafni…">
            <button type="button" class="tv-btn" id="vb-go">Leita</button>
          </div>
          <div class="vb-crumbs" id="vb-crumbs" ${rootFolderId?'':'hidden'}></div>
          <div id="vb-results">${rootFolderId ? 'Hleð möppu…' : 'Sláðu inn leitarorð og smelltu „Leita".'}</div>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);
    const close = () => wrap.remove();
    wrap.addEventListener('click', e => { if(e.target === wrap) close(); });
    wrap.querySelector('[data-vb-close]').onclick = close;
    const $q = wrap.querySelector('#vb-q');
    const $go = wrap.querySelector('#vb-go');
    const $r = wrap.querySelector('#vb-results');
    const $crumbs = wrap.querySelector('#vb-crumbs');
    const $searchRow = wrap.querySelector('#vb-search-row');

    // Breadcrumb stack for folder browsing: [{id, name}]
    const stack = rootFolderId ? [{ id: rootFolderId, name: '📁 Verkstaðarmappa' }] : [];

    async function attachPick(id, name){
      try {
        const r = await fetch('/api/efnislisti-docs', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ worksite_name: worksite, work_month: month, drive_file_id: id, title: name, doc_type: docType }),
        });
        if(!r.ok) throw new Error('HTTP '+r.status);
        (isInv ? data.invoices : data.efnislisti)[cellKey] = { id, title: name };
        render();
        close();
      } catch(e){ alert('Tenging mistókst: '+(e.message||e)); }
    }

    function showReauth(){
      $r.innerHTML = `<div style="padding:10px;background:#fff7ed;border:1px solid #fdba74;border-radius:6px;color:#9a3412">
        ⚠ Google tenging er útrunnin — Drive aðgangur virkar ekki.
        <button type="button" class="tv-btn" id="vb-reauth" style="margin-top:8px">🔑 Tengja Google aftur</button></div>`;
      const rb = document.getElementById('vb-reauth'); if(rb) rb.onclick = startGoogleReauth;
    }

    // Render a list of Drive items: folders navigate, files attach.
    function renderItems(items, { allowFolders }){
      if(!items.length){ $r.innerHTML = '<i>Tómt — engin skjöl hér.</i>'; return; }
      const folders = allowFolders ? items.filter(f => f.is_folder) : [];
      const files = items.filter(f => !f.is_folder);
      $r.innerHTML =
        folders.map(f => `
          <div class="vb-file-li" data-nav='${escapeAttr(JSON.stringify({id:f.id, name:f.name}))}'>
            <div><div><b>📁 ${escapeHtml(f.name)}</b></div><small>mappa</small></div>
            <div><span class="vb-attach-btn">opna →</span></div>
          </div>`).join('') +
        files.map(f => `
          <div class="vb-file-li" data-pick='${escapeAttr(JSON.stringify({id:f.id, name:f.name}))}'>
            <div>
              <div><b>${escapeHtml(f.name)}</b></div>
              <small>${escapeHtml(niceMime(f.mime))} · ${f.modified ? new Date(f.modified).toLocaleDateString('is-IS') : ''}</small>
            </div>
            <div>
              ${f.web_link ? `<a href="${escapeAttr(f.web_link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px;margin-right:6px">👁 sjá</a>` : ''}
              <span class="vb-attach-btn">tengja →</span>
            </div>
          </div>`).join('');
      $r.querySelectorAll('[data-pick]').forEach(el => {
        el.onclick = () => { const p = JSON.parse(el.dataset.pick); attachPick(p.id, p.name); };
      });
      $r.querySelectorAll('[data-nav]').forEach(el => {
        el.onclick = () => { const p = JSON.parse(el.dataset.nav); stack.push(p); browse(); };
      });
    }

    function renderCrumbs(){
      $crumbs.innerHTML = stack.map((s, i) =>
        `<span class="vb-crumb" data-crumb="${i}">${escapeHtml(s.name)}</span>${i < stack.length-1 ? '<span class="vb-crumb-sep">›</span>' : ''}`
      ).join('');
      $crumbs.querySelectorAll('[data-crumb]').forEach(el => {
        el.onclick = () => { stack.length = Number(el.dataset.crumb)+1; browse(); };
      });
    }

    async function browse(){
      renderCrumbs();
      const cur = stack[stack.length-1];
      $r.innerHTML = 'Hleð möppu…';
      try {
        const resp = await fetch('/api/drive-folders?parent='+encodeURIComponent(cur.id)+'&limit=100');
        const j = await resp.json();
        if(!resp.ok) throw new Error(j.error || ('HTTP '+resp.status));
        // folders first, then files, both newest-first (API already sorts by modified)
        const items = (j.files || []).sort((a,b) => (b.is_folder?1:0)-(a.is_folder?1:0));
        renderItems(items, { allowFolders: true });
      } catch(e){
        if(isReauthError(null, e.message)) showReauth();
        else $r.innerHTML = '<i style="color:#c40000">Villa: '+(e.message||e)+'</i>';
      }
    }

    async function runSearch(){
      const q = $q.value.trim();
      if(!q) return;
      $r.innerHTML = 'Leitar…';
      try {
        const resp = await fetch('/api/drive-files-search?q='+encodeURIComponent(q));
        const j = await resp.json();
        if(!resp.ok) throw new Error(j.error || ('HTTP '+resp.status));
        renderItems((j.files || []).map(f => ({ ...f, is_folder:false })), { allowFolders: false });
      } catch(e){
        if(isReauthError(null, e.message)) showReauth();
        else $r.innerHTML = '<i style="color:#c40000">Villa: '+(e.message||e)+'</i>';
      }
    }

    // Mode switching
    wrap.querySelectorAll('[data-mode]').forEach(tab => {
      tab.onclick = () => {
        wrap.querySelectorAll('[data-mode]').forEach(t => t.classList.toggle('is-active', t === tab));
        const browseMode = tab.dataset.mode === 'browse';
        $searchRow.hidden = browseMode;
        $crumbs.hidden = !browseMode;
        if(browseMode) browse(); else { $r.innerHTML = 'Sláðu inn leitarorð og smelltu „Leita".'; $q.focus(); }
      };
    });
    $go.onclick = runSearch;
    $q.addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });

    // Start in the most useful mode: browse the folder if we have one, else search.
    if(rootFolderId) browse(); else runSearch();
  }

  // ===== Scratchpad: editable grid + calculator =====
  state.ui.vb_pad = state.ui.vb_pad || { rows: 6, cols: 4, cells: {} };
  state.ui.vb_calc_history = state.ui.vb_calc_history || [];

  function safeEvalFormula(expr){
    let s = String(expr || '').trim();
    if(s.startsWith('=')) s = s.slice(1);
    s = s.replace(/[.\s ]/g, '').replace(/,/g, '.');  // strip thousand-dots, accept comma decimals
    if(!/^[\d+\-*/().]+$/.test(s)) return null;
    try { const v = Function('return '+s)(); return typeof v === 'number' && isFinite(v) ? v : null; }
    catch { return null; }
  }
  function fmtCalc(n){
    if(n == null || !isFinite(n)) return '—';
    return Math.round(n) === n ? n.toLocaleString('is-IS') : n.toLocaleString('is-IS', { maximumFractionDigits: 4 });
  }

  function renderPad(){
    const p = state.ui.vb_pad;
    const $g = document.getElementById('vb-pad-grid');
    if(!$g) return;
    let html = '<table class="vb-pad-table"><tbody>';
    for(let r = 0; r < p.rows; r++){
      html += '<tr>';
      for(let c = 0; c < p.cols; c++){
        const key = `${r}:${c}`;
        const raw = p.cells[key] || '';
        const isFormula = raw.startsWith('=');
        const display = isFormula
          ? (() => { const v = safeEvalFormula(raw); return v == null ? raw : fmtCalc(v); })()
          : raw;
        const cls = isFormula ? (safeEvalFormula(raw) == null ? 'vb-pad-cell is-error' : 'vb-pad-cell is-formula') : 'vb-pad-cell';
        html += `<td><span class="${cls}" contenteditable data-pad="${key}" data-raw="${escapeAttr(raw)}" title="${escapeAttr(raw)}">${escapeHtml(display)}</span></td>`;
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    $g.innerHTML = html;
    $g.querySelectorAll('[data-pad]').forEach(cell => {
      cell.addEventListener('focus', () => { cell.textContent = cell.dataset.raw || ''; });
      cell.addEventListener('blur', () => {
        const text = cell.textContent.trim();
        state.ui.vb_pad.cells[cell.dataset.pad] = text;
        save();
        renderPad();
      });
      cell.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); cell.blur(); }
      });
    });
  }
  renderPad();

  document.getElementById('vb-pad-add-row').onclick = () => { state.ui.vb_pad.rows = Math.min(state.ui.vb_pad.rows + 1, 30); save(); renderPad(); };
  document.getElementById('vb-pad-add-col').onclick = () => { state.ui.vb_pad.cols = Math.min(state.ui.vb_pad.cols + 1, 10); save(); renderPad(); };
  document.getElementById('vb-pad-clear').onclick = () => {
    if(!confirm('Hreinsa alla minnispunkta?')) return;
    state.ui.vb_pad = { rows: 6, cols: 4, cells: {} };
    save(); renderPad();
  };

  function renderCalcHistory(){
    const $u = document.getElementById('vb-calc-history');
    if(!$u) return;
    $u.innerHTML = (state.ui.vb_calc_history || []).slice(0, 8).map(h => `
      <li data-recall="${escapeAttr(h.expr)}">
        <span class="expr">${escapeHtml(h.expr)}</span>
        <span class="res">${escapeHtml(h.result)}</span>
      </li>
    `).join('');
    $u.querySelectorAll('[data-recall]').forEach(li => {
      li.onclick = () => {
        const $i = document.getElementById('vb-calc-input');
        $i.value = li.dataset.recall;
        $i.focus();
      };
    });
  }
  renderCalcHistory();

  const $calcIn = document.getElementById('vb-calc-input');
  const $calcRes = document.getElementById('vb-calc-result');
  function compute(){
    const expr = $calcIn.value.trim();
    if(!expr){ $calcRes.textContent = ''; $calcRes.className = 'vb-calc-result'; return; }
    const v = safeEvalFormula(expr);
    if(v == null){ $calcRes.textContent = '✗ ógild formúla'; $calcRes.className = 'vb-calc-result is-error'; return; }
    const r = fmtCalc(v);
    $calcRes.textContent = '= ' + r;
    $calcRes.className = 'vb-calc-result';
    state.ui.vb_calc_history = [{ expr, result: r }, ...(state.ui.vb_calc_history || []).filter(h => h.expr !== expr)].slice(0, 8);
    save();
    renderCalcHistory();
  }
  $calcIn.addEventListener('input', () => {
    // Live preview while typing (without saving to history)
    const expr = $calcIn.value.trim();
    if(!expr){ $calcRes.textContent = ''; return; }
    const v = safeEvalFormula(expr);
    if(v == null){ $calcRes.textContent = ''; return; }
    $calcRes.textContent = '= ' + fmtCalc(v);
    $calcRes.className = 'vb-calc-result';
  });
  $calcIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); compute(); } });

  // ===== Visual style controls (live tunables) =====
  const VB_STYLE_DEFAULTS = {
    inputFont:  { v: 14.5, min: 10,  max: 22, step: .5, label: 'Letur — Reikningsbox' },
    inputH:     { v: 32,   min: 22,  max: 60, step: 1,  label: 'Hæð — Reikningsbox' },
    cornerFont: { v: 12,   min: 9,   max: 18, step: .5, label: 'Letur — Klst/Áætl.' },
    cellMin:    { v: 155,  min: 110, max: 260,step: 5,  label: 'Breidd — Gluggi' },
    cellPadY:   { v: 5,    min: 0,   max: 16, step: 1,  label: 'Padding — Lóðrétt' },
    cellPadX:   { v: 12,   min: 4,   max: 22, step: 1,  label: 'Padding — Lárétt' },
    rowNameW:   { v: 175,  min: 120, max: 280,step: 5,  label: 'Breidd — Verkstaður' },
    nameFont:   { v: 16,   min: 12,  max: 26, step: .5, label: 'Letur — Verkstaður' },
    bSpacing:   { v: 6,    min: 0,   max: 14, step: 1,  label: 'Bil milli glugga' },
    rowGap:     { v: 3,    min: 0,   max: 12, step: 1,  label: 'Þykkt blárrar línu' },
  };
  state.ui.vb_styles = state.ui.vb_styles || {};

  function applyVbStyles(){
    let s = '';
    const v = (k) => state.ui.vb_styles[k] != null ? state.ui.vb_styles[k] : VB_STYLE_DEFAULTS[k].v;
    s += `.vb-scroll-wrap .vb-amount-input{font-size:${v('inputFont')}px !important;height:${v('inputH')}px !important;}`;
    s += `.vb-scroll-wrap .vb-corner-val{font-size:${v('cornerFont')}px !important;}`;
    s += `.vb-scroll-wrap .vb-cell{min-width:${v('cellMin')}px !important;max-width:${Math.round(v('cellMin')*1.32)}px !important;}`;
    s += `.vb-scroll-wrap .vb-cell-main{padding:${v('cellPadY')}px ${v('cellPadX')}px !important;}`;
    s += `.vb-scroll-wrap .vb-cell-corners{padding:${v('cellPadY')+2}px ${v('cellPadX')}px ${Math.max(0,v('cellPadY')-1)}px !important;}`;
    s += `.vb-scroll-wrap .vb-cell-bottom{padding:${v('cellPadY')+1}px ${v('cellPadX')}px ${v('cellPadY')+2}px !important;}`;
    s += `.vb-scroll-wrap .vb-row-name{min-width:${v('rowNameW')}px !important;max-width:${Math.round(v('rowNameW')*1.3)}px !important;}`;
    s += `.vb-scroll-wrap .vb-ws-name{font-size:${v('nameFont')}px !important;}`;
    s += `.vb-scroll-wrap .vb-grid{border-spacing:${v('bSpacing')}px !important;}`;
    s += `.vb-scroll-wrap .vb-grid tbody tr + tr > td{border-top-width:${v('rowGap')}px !important;}`;
    let tag = document.getElementById('vb-style-tag');
    if(!tag){ tag = document.createElement('style'); tag.id = 'vb-style-tag'; document.head.appendChild(tag); }
    tag.textContent = s;
  }

  function renderStyleControls(){
    const $rows = document.getElementById('vb-style-rows');
    if(!$rows) return;
    $rows.innerHTML = Object.entries(VB_STYLE_DEFAULTS).map(([k, def]) => {
      const val = state.ui.vb_styles[k] != null ? state.ui.vb_styles[k] : def.v;
      return `
        <div class="vb-style-row">
          <div>
            <label>${def.label}</label>
            <input type="range" min="${def.min}" max="${def.max}" step="${def.step}" value="${val}" data-vbstyle="${k}">
          </div>
          <span class="val" id="vbstyle-val-${k}">${val}</span>
        </div>
      `;
    }).join('');
    $rows.querySelectorAll('input[data-vbstyle]').forEach(inp => {
      inp.addEventListener('input', () => {
        const k = inp.dataset.vbstyle;
        const val = Number(inp.value);
        state.ui.vb_styles[k] = val;
        document.getElementById('vbstyle-val-'+k).textContent = val;
        applyVbStyles();
        // Debounce save
        clearTimeout(window.__vbStyleSaveT);
        window.__vbStyleSaveT = setTimeout(save, 300);
      });
    });
  }
  renderStyleControls();
  applyVbStyles();
  document.getElementById('vb-style-reset').onclick = () => {
    if(!confirm('Resetta öll útlitskontról?')) return;
    state.ui.vb_styles = {};
    save();
    renderStyleControls();
    applyVbStyles();
  };

  $refresh.onclick = () => load({force: true});
  $back.onclick = () => { state.ui.vb_months_back = Math.min((state.ui.vb_months_back||8) + 2, 24); save(); render(); };
  $fwd.onclick = () => { state.ui.vb_months_fwd = Math.min((state.ui.vb_months_fwd||0) + 1, 6); save(); render(); };
  document.getElementById('vb-collapse-2025').onclick = () => {
    state.ui.vb_collapsed_years = state.ui.vb_collapsed_years || [];
    const i = state.ui.vb_collapsed_years.indexOf('2025');
    if(i >= 0) state.ui.vb_collapsed_years.splice(i, 1);
    else state.ui.vb_collapsed_years.push('2025');
    const btn = document.getElementById('vb-collapse-2025');
    btn.textContent = state.ui.vb_collapsed_years.includes('2025') ? '📅 Sýna 2025' : '📅 Fela 2025';
    save(); render();
  };
  // set initial button label
  const $col = document.getElementById('vb-collapse-2025');
  if($col && (state.ui.vb_collapsed_years || []).includes('2025')) $col.textContent = '📅 Sýna 2025';
  // Layout switcher: mark active + wire clicks
  function syncLayoutBtns(){
    document.querySelectorAll('[data-vb-layout]').forEach(b => {
      if(b.tagName === 'BUTTON') b.classList.toggle('active', b.dataset.vbLayout === state.ui.vb_layout);
    });
  }
  syncLayoutBtns();
  document.querySelectorAll('button[data-vb-layout]').forEach(b => {
    b.onclick = () => {
      state.ui.vb_layout = b.dataset.vbLayout;
      save();
      syncLayoutBtns();
      render();
    };
  });
  // Review-dot filter chips: mark active + wire clicks
  function syncFilterBtns(){
    document.querySelectorAll('[data-vb-filter]').forEach(b =>
      b.classList.toggle('active', (b.dataset.vbFilter||'') === (state.ui.vb_review_filter||'')));
  }
  syncFilterBtns();
  document.querySelectorAll('[data-vb-filter]').forEach(b => {
    b.onclick = () => { state.ui.vb_review_filter = b.dataset.vbFilter || ''; save(); syncFilterBtns(); render(); };
  });
  load();
}

/* ====================== VERÐSKRÁ (rate / pricing-guide editor) ====================== */
async function renderVerdskra(t){
  $view.innerHTML = `
    <div class="rg-wrap">
      <div class="rg-header">

          <h1 class="rg-h1">Verðskrá <span class="rg-sub" id="vs-meta">Sækir…</span></h1>

  async function saveWorksite(i){
    const row = document.querySelector(`tr[data-vs-row="${i}"]`);
    if(!row) return;
    const $st = row.querySelector('[data-vs-status]');
    $st.textContent = 'Vistar…'; $st.className = 'vs-save-status';
    const payload = {};
    row.querySelectorAll('[data-f]').forEach(el => {
      const f = el.dataset.f;
      if(el.type === 'checkbox') payload[f] = el.checked;
      else if(el.type === 'number') payload[f] = el.value === '' ? null : Number(el.value);
      else payload[f] = el.value || null;
    });
    if(!payload.worksite_name){
      $st.textContent = '✗ Vantar verkstað'; $st.className = 'vs-save-status vs-save-err';
      return;
    }
    try {
      const r = await fetch('/api/pricing-guide', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload),
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      const saved = await r.json();
      pgRows[i] = saved;
      $st.textContent = '✓ Vistað'; $st.className = 'vs-save-status vs-save-ok';

      $st.textContent = '✗ '+(e.message||e); $st.className = 'vs-save-status vs-save-err';

  $view.innerHTML = `

      </div>

      <div id="ef-table-host"></div>
    </div>
  `;

  try {
    const r = await fetch('/api/redder-invoices');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const { rows, summary } = await r.json();
    const fmt = n => Math.round(n||0).toLocaleString('is-IS');

    // Normalised month/worksite per invoice (reused for filtering + grouping).
    const invMonth = inv => inv.dagsetning ? String(inv.dagsetning).slice(0,7) : '(óþekkt)';
    const invWs = inv => inv.worksite_match || '(ótengt)';

    // Populate filter dropdowns from the data (months newest-first, worksites alpha).
    const months = [...new Set(rows.map(invMonth))].sort().reverse();
    const sites  = [...new Set(rows.map(invWs))].sort((a,b)=>a.localeCompare(b,'is'));
    const $fMonth = document.getElementById('ef-f-month');
    const $fWs = document.getElementById('ef-f-ws');
    $fMonth.insertAdjacentHTML('beforeend', months.map(m=>`<option value="${escapeAttr(m)}">${escapeHtml(monthLabelStatic(m))}</option>`).join(''));
    $fWs.insertAdjacentHTML('beforeend', sites.map(s=>`<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join(''));

    const renderTable = () => {
    const fMonth = $fMonth.value, fWs = $fWs.value;
    const filtered = rows.filter(inv => (!fMonth || invMonth(inv)===fMonth) && (!fWs || invWs(inv)===fWs));

    // KPIs reflect the current filter selection.
    const total = filtered.reduce((a,inv)=>a+Number(inv.m_vsk||0),0);
    const filterOn = !!(fMonth || fWs);
    document.getElementById('ef-meta').textContent = filterOn ? `${filtered.length} af ${rows.length} reikningum` : `${rows.length} reikningar`;
    document.getElementById('ef-k-count').textContent = filtered.length;

    document.getElementById('ef-k-sites').textContent = new Set(filtered.map(r => r.worksite_match).filter(Boolean)).size;

    // Group filtered invoices by worksite × month
    const groups = {};
    for (const inv of filtered) {
      const month = invMonth(inv);
      const ws = invWs(inv);
      const k = `${ws}|${month}`;
      if (!groups[k]) groups[k] = { worksite: ws, month, invoices: [], total_m_vsk: 0 };
      groups[k].invoices.push(inv);
      groups[k].total_m_vsk += Number(inv.m_vsk || 0);
    }
    const groupRows = Object.values(groups).sort((a,b) => b.month.localeCompare(a.month) || b.total_m_vsk - a.total_m_vsk);

    const html = `
      <div class="rg-forecast" style="background:linear-gradient(135deg,#F0F6FC 0%,#E2EDF7 100%);border-color:#B6CFE8">
        <div class="rg-forecast-head">

            `).join('')}
        </div>
      </div>

      <div class="wc-card" style="margin-top:20px">
        <h3>📥 Hvernig á að bæta við Redder reikningi</h3>
        <ol style="font-size:13px;color:var(--text);padding-left:18px;line-height:1.7">

    document.getElementById('ef-table-host').innerHTML = html;

    $fMonth.addEventListener('change', renderTable);
    $fWs.addEventListener('change', renderTable);

    document.getElementById('ef-meta').textContent = 'Villa: '+(e.message||e);
  }

/* ====================== WORKCENTER (per-worksite hub modal) ====================== */
// Opens when you click a worksite name in the Reikningagerð grid.
// Shows + edits: pricing_guide rules, customer_info notes, hours by month,
// invoice history, recent emails.
async function rgOpenWorkcenter(project, allSites, months){
  const w = allSites.find(s => s.project === project);
  if(!w){ alert('Engin gögn fyrir verkstað: '+project); return; }
  const customer = (w.mapped_customers||[])[0] || '';
  const drive = w.status?.drive_folder_url || '';
  const fmt = n => n ? Math.round(n).toLocaleString('is-IS') : '';

  // Open shell modal with a loading state, then fetch pricing + customer info in parallel
  openModal(`
    <div class="wc-wrap">
      <div class="wc-head">
        <div>
          <div class="wc-title">${escapeHtml(project)}</div>
          <div class="wc-sub">${escapeHtml(customer || '—')}${drive ? ` · <a href="${escapeHtml(drive)}" target="_blank" rel="noopener">📁 Drive mappa</a>` : ''}</div>
        </div>
        <button type="button" class="rg-calc-close" id="wc-close">✕</button>
      </div>
      <div class="wc-body" id="wc-body">Sækir…</div>
    </div>
  `);
  document.getElementById('wc-close').onclick = closeModal;
  const $body = document.getElementById('wc-body');

  let pricing = {}, custInfo = {};
  try {
    const [pr, cr] = await Promise.all([
      fetch(`/api/pricing-guide?worksite=${encodeURIComponent(project)}`).then(r => r.ok ? r.json() : ({})),
      customer ? fetch(`/api/customer-info?name=${encodeURIComponent(customer)}`).then(r => r.ok ? r.json() : ({})) : Promise.resolve({}),
    ]);
    pricing = pr || {};
    custInfo = cr || {};
  } catch(e){ /* ignore — show empty editable form */ }

  // Hours per month from worksites data
  const hoursRows = months.map(ym => ({ ym, h: (w.monthly||{})[ym] || 0 })).filter(r => r.h > 0);
  const invoices = (w.invoices||[]).slice().sort((a,b) => (b.gjalddagi||'').localeCompare(a.gjalddagi||''));

  $body.innerHTML = `
    <div class="wc-grid">
      <section class="wc-card">
        <h3>💰 Reikningsreglur (pricing_guide)</h3>
        <div class="wc-row">
          <label>Source<select id="wc-src">
            <option value="timavera" ${(pricing.source||'timavera')==='timavera'?'selected':''}>timavera</option>
            <option value="ajour" ${pricing.source==='ajour'?'selected':''}>ajour</option>
            <option value="fixed" ${pricing.source==='fixed'?'selected':''}>fixed</option>
          </select></label>
        </div>
        <div class="wc-row">
          <label>Dagvinna kr/klst<input type="number" id="wc-dv" value="${pricing.dagvinna_rate ?? 9951}" step="50"></label>
          <label>Eftirvinna kr/klst<input type="number" id="wc-ev" value="${pricing.eftirvinna_rate ?? 14927}" step="50"></label>
        </div>
        <div class="wc-row">
          <label>Akstur km kr<input type="number" id="wc-km" value="${pricing.akstur_km_rate ?? 186}" step="10"></label>
          <label>Akstur ferð kr<input type="number" id="wc-fr" value="${pricing.akstur_ferd_rate ?? 4000}" step="100"></label>
        </div>
        <div class="wc-row">
          <label>Smáhlutagjald / dv klst<input type="number" id="wc-sma" value="${pricing.smahlutagjald_per_h ?? 137}" step="10"></label>
          <label>VSK %<input type="number" id="wc-vsk" value="${pricing.vsk_pct ?? 24}" step="1"></label>
        </div>
        <div class="wc-row">
          <label>Fixed amount (override)<input type="number" id="wc-fix" value="${pricing.fixed_amount ?? ''}" step="1000" placeholder="—"></label>
          <label>Retention %<input type="number" id="wc-ret" value="${pricing.retention_pct ?? 0}" step="1"></label>
        </div>
        <div class="wc-row">
          <label>Greiðslufrestur (dagar)<input type="number" id="wc-pt" value="${pricing.payment_terms_days ?? ''}" step="1" placeholder="—"></label>
          <label><input type="checkbox" id="wc-stadf" ${pricing.stadfesting_default?'checked':''}> Staðfesting brunaþéttinga sjálfvirkt</label>
        </div>
        <div class="wc-row wc-row-full">
          <label>Athugasemd<textarea id="wc-notes" rows="2" placeholder="—">${escapeHtml(pricing.notes || '')}</textarea></label>
        </div>
        <button type="button" class="rg-tool" id="wc-save-pricing">💾 Vista verðreglur</button>
        <span id="wc-save-pricing-status" class="wc-save-status"></span>
      </section>

      <section class="wc-card">
        <h3>👤 Viðskiptavinaupplýsingar (customer_info)</h3>
        ${customer ? `
          <div class="wc-row">
            <label>Greiðslumáti<select id="wc-pm">
              <option value="payday"      ${custInfo.payment_method==='payday'?'selected':''}>Payday</option>
              <option value="bank-direct" ${custInfo.payment_method==='bank-direct'?'selected':''}>Bank-direct</option>
              <option value="mix"         ${custInfo.payment_method==='mix'?'selected':''}>Mix</option>
              <option value="unknown"     ${(!custInfo.payment_method||custInfo.payment_method==='unknown')?'selected':''}>Óvíst</option>
            </select></label>
            <label>Retention %<input type="number" id="wc-ci-ret" value="${custInfo.retention_pct ?? 0}" step="1"></label>
          </div>
          <div class="wc-row">
            <label>Tölvupóstur<input type="email" id="wc-email" value="${escapeAttr(custInfo.contact_email || '')}" placeholder="—"></label>
            <label>Sími<input type="text" id="wc-phone" value="${escapeAttr(custInfo.contact_phone || '')}" placeholder="—"></label>
          </div>
          <div class="wc-row">
            <label>Greiðsluskilmálar<input type="text" id="wc-pt2" value="${escapeAttr(custInfo.payment_terms || '')}" placeholder="t.d. 30 days net"></label>
          </div>
          <div class="wc-row wc-row-full">
            <label>Almenn nóta<textarea id="wc-gnote" rows="2" placeholder="—">${escapeHtml(custInfo.general_notes || '')}</textarea></label>
          </div>
          <button type="button" class="rg-tool" id="wc-save-customer">💾 Vista viðskiptavin</button>
          <span id="wc-save-customer-status" class="wc-save-status"></span>
        ` : `<div class="wc-empty">Enginn viðskiptavinur tengdur — bættu við í customer_worksite_map.</div>`}
      </section>

      <section class="wc-card">
        <h3>⏱ Tímavera klst per mánuð</h3>
        <table class="wc-mini-table">
          ${hoursRows.length ? hoursRows.map(r => `<tr><td>${monthLabelStatic(r.ym)}</td><td class="num">${r.h.toFixed(1)} klst</td></tr>`).join('') : '<tr><td colspan="2" class="wc-empty">Engar klst á tímabilinu.</td></tr>'}
        </table>
      </section>

      <section class="wc-card">
        <h3>💳 Reikningar (${invoices.length})</h3>
        <table class="wc-mini-table">
          ${invoices.length ? `
            <thead><tr>
              <th>Gjalddagi</th><th>#</th>
              <th class="num">án vsk</th>
              <th class="num">m. vsk</th>
              <th>Staða</th>
              <th>Payday</th>
            </tr></thead>
            <tbody>
              ${invoices.slice(0, 15).map(i => {
                const amt = Number(i.amount) || 0;
                const guess_an  = Math.round(amt / 1.24);
                const guess_mvsk = Math.round(amt * 1.24);
                const looksMvsk = (amt % 1000) !== 0 && amt > 100000;
                const anVsk  = looksMvsk ? guess_an : amt;
                const mVsk   = looksMvsk ? amt      : guess_mvsk;
                const pdId   = i.payday_invoice_id;
                const pdLink = pdId
                  ? `<a href="https://app.payday.is/is/invoice/${pdId}/" target="_blank" rel="noopener" class="wc-pd-link" title="Opna í Payday">🔗 ${pdId}</a>`
                  : `<button type="button" class="wc-pd-link wc-pd-link-empty" data-pd-link="${i.id}" title="Tengja við Payday URL">+ tengja</button>`;
                return `
                  <tr>
                    <td>${i.gjalddagi || '—'}</td>
                    <td>#${escapeHtml(String(i.tilvisun||'').replace(/\.0$/,''))}</td>
                    <td class="num an-vsk">${fmt(anVsk)}</td>
                    <td class="num">${fmt(mVsk)}</td>
                    <td>${escapeHtml(i.status || '')}</td>
                    <td>${pdLink}</td>
                  </tr>`;
              }).join('')}
            </tbody>
          ` : '<tr><td colspan="6" class="wc-empty">Engir reikningar tengdir.</td></tr>'}
        </table>
        <div style="font-size:10.5px;color:var(--muted-2);margin-top:8px;font-style:italic">án vsk / m. vsk samkvæmt 24% reglu. Smelltu "+ tengja" til að líma inn Payday URL — næst opnast reikningurinn beint úr töflunni.</div>
      </section>

      <section class="wc-card wc-card-full">
        <h3>🗒 Næstu skref / Athugasemdir</h3>
        <textarea id="wc-todo-notes" rows="4" class="wc-todo-textarea" placeholder="Hvað þarf að gera næst? T.d. 'Senda Mars reikning, fá staðfestingu á aksturskostnaði, kalla á Ívar v/staðfestingar...'">${escapeHtml(w.status?.notes || '')}</textarea>
        <button type="button" class="rg-tool" id="wc-save-todo">💾 Vista athugasemd</button>
        <span id="wc-save-todo-status" class="wc-save-status"></span>
      </section>
    </div>
  `;

  // Save handlers
  const savePricing = async () => {
    const $s = document.getElementById('wc-save-pricing-status');
    $s.textContent = '… vistar';
    const body = {
      worksite_name: project,
      customer_name: customer || null,
      source: document.getElementById('wc-src').value,
      dagvinna_rate: Number(document.getElementById('wc-dv').value) || null,
      eftirvinna_rate: Number(document.getElementById('wc-ev').value) || null,
      akstur_km_rate: Number(document.getElementById('wc-km').value) || null,
      akstur_ferd_rate: Number(document.getElementById('wc-fr').value) || null,
      smahlutagjald_per_h: document.getElementById('wc-sma').value === '' ? null : Number(document.getElementById('wc-sma').value), // keep an explicit 0 (= ekkert smáhlutagjald)
      vsk_pct: Number(document.getElementById('wc-vsk').value) || null,
      fixed_amount: document.getElementById('wc-fix').value ? Number(document.getElementById('wc-fix').value) : null,
      retention_pct: Number(document.getElementById('wc-ret').value) || 0,
      payment_terms_days: document.getElementById('wc-pt').value ? Number(document.getElementById('wc-pt').value) : null,
      stadfesting_default: document.getElementById('wc-stadf').checked,
      notes: document.getElementById('wc-notes').value || null,
      updated_by: 'workcenter',
    };
    try {
      const r = await fetch('/api/pricing-guide', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      $s.textContent = r.ok ? '✓ Vistað' : '✗ Villa: '+r.status;
      $s.className = 'wc-save-status ' + (r.ok ? 'wc-save-ok' : 'wc-save-err');
    } catch(e){ $s.textContent = '✗ '+(e.message||e); $s.className='wc-save-status wc-save-err'; }
  };
  const saveCustomer = async () => {
    const $s = document.getElementById('wc-save-customer-status');
    $s.textContent = '… vistar';
    const body = {
      customer_name: customer,
      payment_method: document.getElementById('wc-pm').value,
      retention_pct: Number(document.getElementById('wc-ci-ret').value) || 0,
      contact_email: document.getElementById('wc-email').value || null,
      contact_phone: document.getElementById('wc-phone').value || null,
      payment_terms: document.getElementById('wc-pt2').value || null,
      general_notes: document.getElementById('wc-gnote').value || null,
    };
    try {
      const r = await fetch('/api/customer-info', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      $s.textContent = r.ok ? '✓ Vistað' : '✗ Villa: '+r.status;
      $s.className = 'wc-save-status ' + (r.ok ? 'wc-save-ok' : 'wc-save-err');
    } catch(e){ $s.textContent = '✗ '+(e.message||e); $s.className='wc-save-status wc-save-err'; }
  };
  const saveTodo = async () => {
    const $s = document.getElementById('wc-save-todo-status');
    $s.textContent = '… vistar';
    const body = {
      project_name: project,
      year: new Date().getFullYear(),
      notes: document.getElementById('wc-todo-notes').value || null,
      updated_by: 'workcenter',
    };
    try {
      const r = await fetch('/api/worksites', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      $s.textContent = r.ok ? '✓ Vistað' : '✗ Villa: '+r.status;
      $s.className = 'wc-save-status ' + (r.ok ? 'wc-save-ok' : 'wc-save-err');
    } catch(e){ $s.textContent = '✗ '+(e.message||e); $s.className='wc-save-status wc-save-err'; }
  };
  const $sp = document.getElementById('wc-save-pricing');
  if($sp) $sp.onclick = savePricing;
  const $sc = document.getElementById('wc-save-customer');
  if($sc) $sc.onclick = saveCustomer;
  const $st = document.getElementById('wc-save-todo');
  if($st) $st.onclick = saveTodo;

  // "+ tengja" Payday link button — prompts for URL and saves payday_invoice_id
  document.querySelectorAll('[data-pd-link]').forEach(b => {
    b.onclick = async () => {
      const invoiceId = b.dataset.pdLink;
      const url = prompt('Líma inn Payday URL fyrir þennan reikning\n(t.d. https://app.payday.is/is/invoice/4559218/):');
      if(!url) return;
      const m = url.match(/\/invoice\/(\d+)/);
      if(!m){ alert('Gat ekki fundið Payday reikningsnúmer í URL.\nFormat: https://app.payday.is/is/invoice/NNNNNN/'); return; }
      const paydayId = Number(m[1]);
      try{
        const r = await fetch('/api/invoice-edit', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: Number(invoiceId), payday_invoice_id: paydayId }),
        });
        if(!r.ok) throw new Error('HTTP '+r.status);
        // Replace button with link
        const a = document.createElement('a');
        a.href = `https://app.payday.is/is/invoice/${paydayId}/`;
        a.target = '_blank'; a.rel = 'noopener';
        a.className = 'wc-pd-link';
        a.textContent = `🔗 ${paydayId}`;
        b.parentNode.replaceChild(a, b);
      }catch(e){
        alert('Villa við að vista: '+(e.message||e));
      }
    };
  });
}

  const $refresh = document.getElementById('cmp-refresh');

  async function load(force){
    document.getElementById('cmp-meta').textContent = 'Sækir…';
    $refresh.disabled = true; $refresh.classList.add('loading');
    const cb = force ? ('?_=' + Date.now()) : '';
    try {
      const r = await fetch('/api/competitors' + cb);
      if (!r.ok) {
        const e = await r.json().catch(()=>({error:'Villa'}));
        document.getElementById('cmp-meta').innerHTML = `<span style="color:var(--red)">Villa: ${escapeHtml(e.error||('HTTP '+r.status))}</span>`;
        return;
      }
      const data = await r.json();
      renderAll(data);
    } catch(err) {
      document.getElementById('cmp-meta').innerHTML = `<span style="color:var(--red)">Villa: ${escapeHtml(err.message||String(err))}</span>`;
    } finally {
      $refresh.disabled = false; $refresh.classList.remove('loading');
    }
  }

  function renderAll(d){
    const last = d.last_scrape ? tvFormatTimestamp(d.last_scrape) : '—';
    document.getElementById('cmp-meta').innerHTML = `Síðast uppfært: ${escapeHtml(last)} · ${d.summary.total_competitor_rows} vöruverð · ${d.summary.total_service_rows} þjónustuverð · ${d.summary.total_vendors} verslunaraðilar · ${d.summary.total_suppliers} birgjar · ${d.summary.total_alarm_services} brunakerfis-aðilar`;

    document.getElementById('cmp-kpi-cmp').textContent     = d.summary.comparable;
    document.getElementById('cmp-kpi-cheap').textContent   = d.summary.we_cheapest;
    document.getElementById('cmp-kpi-cheap-of').textContent = d.summary.comparable;
    document.getElementById('cmp-kpi-mid').textContent     = d.summary.we_midrange;
    document.getElementById('cmp-kpi-dear').textContent    = d.summary.we_dearest;
    document.getElementById('cmp-kpi-dear-of').textContent  = d.summary.comparable;

    renderOpportunities(d.opportunities || []);
    renderVendors(d.vendors);
    renderGroups(d.product_groups || d.groups);
    renderServices(d.service_groups || []);
    renderSuppliers(d.suppliers || []);
    renderAlarmServices(d.alarm_services || []);
    renderRaw(d.raw);

  function renderOpportunities(ops){
    const $el = document.getElementById('cmp-ops');
    if (!ops.length) { $el.innerHTML = '<div class="empty" style="margin:0">Engin greind tækifæri enn.</div>'; return; }
    const ICONS = { opportunity: '↗', risk: '⚠', gap: '○' };
    const order = { opportunity: 0, gap: 1, risk: 2 };
    ops.sort((a, b) => (order[a.kind]||9) - (order[b.kind]||9));
    $el.innerHTML = ops.map(op => `
      <div class="cmp-op cmp-op-${op.kind}">
        <div class="cmp-op-head">
          <span class="cmp-op-icon">${ICONS[op.kind] || '•'}</span>
          <div class="cmp-op-title">${escapeHtml(op.title)}</div>
        </div>
        <div class="cmp-op-detail">${escapeHtml(op.detail)}</div>
        <div class="cmp-op-action"><strong>Aðgerð:</strong> ${escapeHtml(op.action)}</div>
      </div>`).join('');
  }

  function renderServices(groups){
    const $el = document.getElementById('cmp-services');
    if (!groups.length) { $el.innerHTML = '<div class="empty">Engin þjónustuverð skráð.</div>'; return; }
    $el.innerHTML = groups.map(sg => {
      const all = sg.rows;
      const minP = Math.min(...all.map(r => r.price));
      const maxP = Math.max(...all.map(r => r.price));
      const span = Math.max(1, maxP - minP);
      return `
        <div class="tv-card cmp-group">
          <div class="cmp-group-head">
            <div class="cmp-group-title">${escapeHtml(sg.kind_label)}${sg.type_label && sg.type_label !== sg.kind_label ? ' — ' + escapeHtml(sg.type_label) : ''}</div>
            <div class="cmp-group-range">${formatKr(minP)} – ${formatKr(maxP)}</div>
          </div>
          ${all.map(r => {
            const ours = r.vendor === 'Slökkvitæki ehf';
            const widthPct = ((r.price - minP) / span * 100).toFixed(0);
            return `<div class="cmp-row ${ours ? 'cmp-row-ours' : ''}">
              <div class="cmp-vendor-cell">
                ${ours ? '<span class="cmp-badge-ours">Við</span>' : `<span class="cmp-vendor-tag">${escapeHtml(r.vendor)}</span>`}
                <span class="cmp-prod-name">${escapeHtml(r.size_label || '—')}${r.notes ? ' · ' + escapeHtml(r.notes) : ''}</span>
              </div>
              <div class="cmp-bar-cell"><div class="cmp-bar ${ours ? 'cmp-bar-ours' : ''}" style="width:${widthPct}%"></div></div>
              <div class="cmp-price-cell">${formatKr(r.price)}</div>
            </div>`;
          }).join('')}
        </div>`;
    }).join('');
  }

  function renderVendors(vendors){

  function renderGroups(groups){
    const $el = document.getElementById('cmp-groups');
    if (!groups.length) { $el.innerHTML = '<div class="empty">Engin samanburðargögn enn.</div>'; return; }
    $el.innerHTML = groups.map(g => {
      const ourPrice = g.our ? g.our.price : null;
      const allPrices = [...(g.our ? [ourPrice] : []), ...g.competitors.map(c => c.price)];
      const minP = Math.min(...allPrices);
      const maxP = Math.max(...allPrices);
      const span = Math.max(1, maxP - minP);

      const ourClass = g.our
        ? (g.our.price === minP ? 'cmp-cheapest' : g.our.price === maxP ? 'cmp-dearest' : 'cmp-mid')
        : '';

      const ourRow = g.our ? `
        <div class="cmp-row cmp-row-ours ${ourClass}">
          <div class="cmp-vendor-cell">
            <span class="cmp-badge-ours">Við</span>
            <span class="cmp-prod-name">${escapeHtml(g.our.name)}</span>
          </div>
          <div class="cmp-bar-cell"><div class="cmp-bar cmp-bar-ours" style="width:${((g.our.price - minP) / span * 100).toFixed(0)}%"></div></div>
          <div class="cmp-price-cell">${formatKr(g.our.price)}</div>
        </div>` : `
        <div class="cmp-row cmp-row-empty">
          <div class="cmp-vendor-cell"><em>Slökkvitæki ehf — engin samsvarandi vara skráð</em></div>
          <div></div><div></div>
        </div>`;

      const cmpRows = g.competitors.map(c => {
        const widthPct = ((c.price - minP) / span * 100).toFixed(0);
        const diffStr = c.diff_kr != null
          ? (c.diff_kr === 0 ? '±0' : c.diff_kr > 0 ? `+${formatKr(c.diff_kr)}` : `−${formatKr(-c.diff_kr)}`)
          : '';
        const diffPctStr = c.diff_pct != null
          ? (c.diff_pct === 0 ? '' : c.diff_pct > 0 ? ` (+${c.diff_pct.toFixed(1)}%)` : ` (${c.diff_pct.toFixed(1)}%)`)
          : '';
        const diffClass = c.diff_kr == null ? '' : (c.diff_kr > 0 ? 'cmp-diff-good' : c.diff_kr < 0 ? 'cmp-diff-bad' : '');
        return `
          <div class="cmp-row">
            <div class="cmp-vendor-cell">
              <span class="cmp-vendor-tag">${escapeHtml(c.vendor)}</span>
              ${c.url ? `<a class="cmp-prod-link" href="${escapeAttr(c.url)}" target="_blank" rel="noopener" title="Opna á vef">${escapeHtml(c.name)} ↗</a>` : `<span class="cmp-prod-name">${escapeHtml(c.name)}</span>`}
            </div>
            <div class="cmp-bar-cell"><div class="cmp-bar" style="width:${widthPct}%"></div></div>
            <div class="cmp-price-cell">${formatKr(c.price)} <span class="cmp-diff ${diffClass}">${diffStr}${diffPctStr}</span></div>
          </div>`;
      }).join('');

      return `
        <div class="tv-card cmp-group">
          <div class="cmp-group-head">
            <div class="cmp-group-title">${escapeHtml(g.type_label)} · ${escapeHtml(g.size_label)}</div>
            <div class="cmp-group-range">${formatKr(minP)} – ${formatKr(maxP)}</div>
          </div>
          ${ourRow}
          ${cmpRows || '<div class="cmp-row cmp-row-empty"><div class="cmp-vendor-cell"><em>Engin samkeppnisverð skráð.</em></div><div></div><div></div></div>'}
        </div>`;
    }).join('');
  }

  function renderRaw(rows){
    const html = `
      <thead>
        <tr>
          <th>Samkeppnisaðili</th>
          <th>Vara</th>
          <th>Tegund</th>
          <th>Stærð</th>
          <th class="tv-num">Verð m/vsk</th>
          <th>Slóð</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          const sz = r.size_kg ? `${r.size_kg} kg` : r.size_l ? `${r.size_l} l` : '—';
          const link = r.product_url ? `<a href="${escapeAttr(r.product_url)}" target="_blank" rel="noopener">opna ↗</a>` : '';
          return `<tr>
            <td>${escapeHtml(r.vendor)}</td>
            <td class="tv-trunc" title="${escapeAttr(r.product_name)}">${escapeHtml(r.product_name)}</td>
            <td>${escapeHtml(r.product_type||'')}</td>
            <td>${escapeHtml(sz)}</td>
            <td class="tv-num">${formatKr(r.price_incl_vat)}</td>
            <td>${link}</td>
          </tr>`;
        }).join('')}
      </tbody>`;
    document.getElementById('cmp-raw-table').innerHTML = html;
  }

  function formatKr(n){
    if (n == null) return '—';
    return Math.round(Number(n)).toLocaleString('is-IS') + ' kr';
  }

  $refresh.addEventListener('click', () => load(true));
  load(false);
}

async function fetchCsv(t){
  const holder = document.getElementById('csvHolder');
  if(!holder) return;
  holder.innerHTML = `<div class="empty">Hleður…</div>`;
  try{
    const r = await fetch(t.sheetCsv,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text = await r.text();
    const rows = parseCSV(text);
    if(rows.length===0){ holder.innerHTML = `<div class="empty">Tóm skrá.</div>`; return; }
    const head = rows[0];
    const body = rows.slice(1);
    const tbl = `<table class="tbl"><thead><tr>${head.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
      <tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${linkify(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    holder.innerHTML = tbl;
  }catch(err){
    holder.innerHTML = `<div class="empty">Tókst ekki að sækja gögn:<br>${escapeHtml(String(err.message||err))}<br><br>
      Staðfestu að sheet sé birt á neti (Publish to web → CSV).</div>`;
  }
}
function linkify(s){
  if(!s) return '';
  const m = String(s).match(/^https?:\/\/\S+$/i);
  if(m) return `<a target="_blank" rel="noopener" href="${escapeAttr(s)}">↗ Opna</a>`;
  return escapeHtml(s);
}
function parseCSV(text){
  const out=[]; let row=[]; let cur=''; let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"' && text[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); out.push(row); row=[]; cur=''; }
      else if(c==='\r'){ }
      else cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); out.push(row); }
  return out.filter(r=>r.length>1 || (r.length===1 && r[0].length));
}
