<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Viðskiptavinavefir — Stjórn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&family=Space+Mono&display=swap">
<style>
  :root{
    --bg:#0f1216; --surface:#1b2128; --raised:#232a32; --line:#2f3742; --line2:#262d35;
    --ink:#e9edf2; --dim:#9aa4b0; --faint:#6a7480;
    --dark:#141414; --accent:#c8642a; --accent2:#e08a4d;
    --good:#4fd08a; --danger:#e2555f; --idle:#5a6672;
    --mono:"Space Mono",monospace; --ui:"Jost",system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c0e11,#0f1216 200px,#12161b);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;padding-bottom:60px}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  a{color:var(--accent);text-decoration:none}
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b0d10,#0f1319);position:sticky;top:0;z-index:5}
  .hbar{display:flex;align-items:center;gap:14px;padding:16px 0}
  .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2115,#171b21);border:1px solid var(--accent);font-size:17px}
  h1{font-family:var(--serif);font-weight:600;font-size:23px;margin:0}
  .sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-top:1px}
  .spacer{flex:1}
  .btn{font-family:var(--ui);font-size:12.5px;font-weight:500;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{border-color:#3d4753;background:#20262e}
  .btn--accent{background:linear-gradient(145deg,#cf6a2c,#a04c1c);border-color:#6e330f;color:#fff;font-weight:600}
  .btn--sm{padding:6px 10px;font-size:11.5px}
  .btn--danger{color:#ffb3b8;border-color:#5a1c20;background:#241014}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 16px}
  .chip{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:12px 15px;position:relative;overflow:hidden}
  .chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .chip.good::before{background:var(--good)} .chip.alert::before{background:var(--danger)}
  .chip .k{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
  .chip .v{font-family:var(--serif);font-size:28px;font-weight:600;margin-top:2px}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
  .sect{display:flex;align-items:baseline;gap:12px;margin:22px 2px 10px}
  .sect h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
  .sect .hint{font-size:12px;color:var(--faint);font-style:italic}
  .panel{background:var(--surface);border:1px solid var(--line2);border-radius:13px;overflow:hidden}
  .picker{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
  .picker input{flex:1;background:#0e1216;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-family:var(--ui);font-size:13.5px}
  .picker input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:56px;left:16px;right:16px;background:var(--raised);border:1px solid var(--line);border-radius:8px;z-index:8;max-height:280px;overflow:auto}
  .results div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
  .results div:hover{background:#2b333d}
  .results .rk{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tbody tr.rowline:hover{background:#191f26}
  .co{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.15}
  .kt{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%}
  .on{background:rgba(79,208,138,.12);color:#7fe0aa;border:1px solid rgba(79,208,138,.28)} .on .dot{background:var(--good);box-shadow:0 0 6px rgba(79,208,138,.7)}
  .setup{background:rgba(216,138,77,.12);color:#e0a074;border:1px solid rgba(216,138,77,.3)} .setup .dot{background:var(--accent)}
  .off{background:rgba(120,132,146,.10);color:#9aa4b0;border:1px solid rgba(120,132,146,.22)} .off .dot{background:var(--idle)}
  .acc{font-family:var(--mono);font-size:12px;color:var(--dim)} .acc.none{color:var(--faint)}
  .actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .editor{background:linear-gradient(180deg,#181d24,#141a20);border-top:1px solid var(--line)}
  .editor-in{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .editor h3{font-family:var(--ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .inp{width:100%;background:#0e1216;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:var(--ui);font-size:13.5px}
  .inp.mono{font-family:var(--mono);font-size:12.5px}
  .inrow{display:flex;gap:8px}.inrow .inp{flex:1}
  .urlbox{display:flex;align-items:center;gap:8px;background:#0e1216;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
  .urlbox code{font-family:var(--mono);font-size:11.5px;color:var(--accent2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.45}
  .divider{height:1px;background:var(--line2);margin:2px 0 12px}
  .msg{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line2)}
  .msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:#20262e;border:1px solid var(--line);font-size:14px}
  .msg.unread .av{border-color:var(--accent);background:#241d12}
  .msg .body{flex:1;min-width:0}
  .msg .top{display:flex;align-items:baseline;gap:8px}.msg .from{font-weight:600;font-size:13px}.msg .t{font-size:11px;color:var(--faint);margin-left:auto}
  .msg .txt{font-size:12.5px;color:var(--dim);margin-top:2px;white-space:pre-wrap}
  .msg .reply{margin-top:8px;display:flex;gap:6px}
  .msg .reply input{flex:1;background:#0e1216;border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--ink);font:inherit;font-size:12.5px}
  .empty{padding:26px 16px;text-align:center;color:var(--faint);font-style:italic}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#20262e;border:1px solid var(--accent);color:var(--accent2);padding:10px 18px;border-radius:9px;font-size:12.5px;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.editor-in{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <div class="ic">🔑</div>
  <div><h1>Viðskiptavinavefir</h1><div class="sub">Slökkvitæki ehf · sjálfsafgreiðsluvefir rekstrarfélaga</div></div>
</div></header>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div>
      <div class="sect"><h2>Rekstrarfélög</h2><span class="hint">veldu fyrirtæki til að stofna aðgang</span></div>
      <div class="panel">
        <div class="picker">
          <input id="coSearch" placeholder="🔎 Leita að fyrirtæki til að virkja vef…" autocomplete="off">
          <div class="results hidden" id="coResults"></div>
        </div>
        <table><thead><tr><th>Rekstrarfélag</th><th>Staða</th><th class="hide-sm">Aðgangur</th><th class="r">Aðgerðir</th></tr></thead>
          <tbody id="accBody"><tr><td colspan="4" class="empty">Hleð…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="sect"><h2>Skilaboð</h2><span class="hint">fyrirspurnir frá vefjum</span></div>
      <div class="panel" id="msgPanel"><div class="empty">Hleð…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/gatt-admin/admin.js"></script>
</body>
</html>
