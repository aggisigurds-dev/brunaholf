# Brunahólf — Stjórnstöð · Netlify build config

[build]
  publish = "."
  functions = "netlify/functions"

# --- Innri skrár EKKI birtar opinberlega -------------------------------------
# `publish = "."` birtir rót verkefnisins, svo ALLT sem er í repo-inu var sótt-
# anlegt á brunaholf.netlify.app — m.a. CLAUDE.md (107 KB af innri lýsingu:
# Supabase-verkefnis-id, Drive-möppu-id, kennitölur, töfluskema) og sql/*.sql.
# Slökkvitæki sleppur við þetta því build-dist.js sleppir *.md; hér er ekkert
# build-þrep, svo lokað er með redirect-reglum. Þær verða að standa FREMST —
# Netlify tekur fyrstu reglu sem passar.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.mcp.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/local-mcp/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Ship pdf-parse / xlsx as real node_modules (not esbuild-bundled) so the
# Efnislisti amount parser loads reliably in the function runtime.
[functions]
  external_node_modules = ["pdf-parse", "xlsx", "mailparser", "pdf-lib"]

# Friendly URL for the Mæting bridge:
#   /api/maeting  →  /.netlify/functions/timavera-maeting

[[redirects]]
  from = "/api/maeting"
  to = "/.netlify/functions/timavera-maeting"
  status = 200

[[redirects]]
  from = "/api/payday-pull-bg"
  to = "/.netlify/functions/payday-pull-background"
  status = 200

[[redirects]]
  from = "/bakendi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/reikningar"
  to = "/.netlify/functions/worksites"
  status = 200
  force = false

[[redirects]]
  from = "/reikningur"
  to = "/reikningur/"
  status = 301
  force = true

[[redirects]]
  from = "/reikningur/"
  to = "/reikningur/index.html"
  status = 200
  force = true


# Landsbanki-hreyfingar úr Drive → bank_transactions (twin of payday/timavera
# ingest-drive). Rides the /api/* catch-all below too, en skýr redirect fyrir vissu.
[[redirects]]
  from = "/api/landsbanki-ingest-drive"
  to = "/.netlify/functions/landsbanki-ingest-drive"
  status = 200

# Skjala-multitool (Fasi 1 — les-eingöngu forskoðun). Ríður líka /api/* catch-all,
# en skýr redirect fyrir vissu.
[[redirects]]
  from = "/api/drive-multitool"
  to = "/.netlify/functions/drive-multitool"
  status = 200

# Öll önnur /api/* → samnefnd function (leysti 90 eins 1:1 blokkir af)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions."timavera-maeting"]
  schedule = "*/10 * * * *"

# Tímavera beintenging (API) — nú AÐAL-heimild vinnufærslna (2026-07-15). Sækir
# beint úr Tímavera Customer API á 2 tíma fresti; dedupe á entry_key svo endur-pull
# er skaðlaus. Leysir af desktop-xlsx-brúna (luna-bridge/timavera-bridge.js RETIRED)
# + Drive-xlsx innsog. Lykill í app_kv['timavera_api_key'] (Agnar setti 2026-07-15).
[functions."timavera-pull"]
  schedule = "15 */2 * * *"

# Payday reikningar → invoices (Brunahólf AR). Tvisvar á dag (07/15). Upsert á
# (tilvisun, source='payday') með dedupe — sama lykill og xlsx-leiðin, engin tvítök.
# Staðfest 2026-07-15: probe OK, dry mappar 345 raðir rétt (kt/hofudstoll/upphaed_total/
# gjalddagi/status, kredit meðhöndlað). Heldur Skuldunautum/Krófum ferskum án handvirkni.
[functions."payday-pull"]
  schedule = "0 7,15 * * *"

# Nightly (03:00 UTC) append-only backup of the Supabase document PDFs
# (úttektarskýrslur + reikningar + Efnislisti/Tímaskýrsla) into a Google Drive
# backup folder — a durable second copy so the docs never live in one unbacked
# store. Background function (15-min budget) → handles the full backfill.
[functions."storage-backup-background"]
  schedule = "0 3 * * *"
