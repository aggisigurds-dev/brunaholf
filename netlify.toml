# Brunahólf — Stjórnstöð · Netlify build config

[build]
  publish = "."
  functions = "netlify/functions"

# Ship pdf-parse / xlsx as real node_modules (not esbuild-bundled) so the
# Efnislisti amount parser loads reliably in the function runtime.
[functions]
  external_node_modules = ["pdf-parse", "xlsx", "mailparser"]

# Friendly URL for the Mæting bridge:
#   /api/maeting  →  /.netlify/functions/timavera-maeting
[[redirects]]
  from = "/api/maeting"
  to = "/.netlify/functions/timavera-maeting"
  status = 200

# Friendly URL for the private Inbox digest:
#   /api/inbox    →  /.netlify/functions/inbox
[[redirects]]
  from = "/api/inbox"
  to = "/.netlify/functions/inbox"
  status = 200

# Friendly URL for the Tímavera report:
#   /api/timavera →  /.netlify/functions/timavera
[[redirects]]
  from = "/api/timavera"
  to = "/.netlify/functions/timavera"
  status = 200

# Friendly URL for the competitor-price comparison:
#   /api/competitors → /.netlify/functions/competitors
[[redirects]]
  from = "/api/competitors"
  to = "/.netlify/functions/competitors"
  status = 200

# Friendly URL for worksite billing audit:
#   /api/worksites → /.netlify/functions/worksites
[[redirects]]
  from = "/api/worksites"
  to = "/.netlify/functions/worksites"
  status = 200

# Google OAuth — start, callback, and helpers
[[redirects]]
  from = "/api/google-auth"
  to = "/.netlify/functions/google-auth"
  status = 200

[[redirects]]
  from = "/api/drive-folders"
  to = "/.netlify/functions/drive-folders"
  status = 200

[[redirects]]
  from = "/api/gmail-search"
  to = "/.netlify/functions/gmail-search"
  status = 200

[[redirects]]
  from = "/api/customer-map"
  to = "/.netlify/functions/customer-map"
  status = 200

[[redirects]]
  from = "/api/sheet-create"
  to = "/.netlify/functions/sheet-create"
  status = 200

[[redirects]]
  from = "/api/customer-info"
  to = "/.netlify/functions/customer-info"
  status = 200

[[redirects]]
  from = "/api/drive-download"
  to = "/.netlify/functions/drive-download"
  status = 200

[[redirects]]
  from = "/api/email-tasks"
  to = "/.netlify/functions/email-tasks"
  status = 200

# Friendly URL for cross-device state sync (tab list / buttons / UI):
#   /api/app-state → /.netlify/functions/app-state
[[redirects]]
  from = "/api/app-state"
  to = "/.netlify/functions/app-state"
  status = 200

# Vefrýni visual-review tool (pages/pins CRUD + screenshot upload)
#   /api/vefryni → /.netlify/functions/vefryni
[[redirects]]
  from = "/api/vefryni"
  to = "/.netlify/functions/vefryni"
  status = 200

# Per-worksite billing rules (rate / akstur / smáhlutagjald / VSK / etc.)
[[redirects]]
  from = "/api/pricing-guide"
  to = "/.netlify/functions/pricing-guide"
  status = 200

# Payday API pull (OAuth2 client_credentials → invoices table)
#   /api/payday-pull[?probe=1|?dry=1|?since=&until=&pageSize=]
[[redirects]]
  from = "/api/payday-pull"
  to = "/.netlify/functions/payday-pull"
  status = 200

# Background version — same code but 15-min timeout, returns 202 instantly.
# Used when triggering from short-timeout clients (Supabase http extension).
[[redirects]]
  from = "/api/payday-pull-bg"
  to = "/.netlify/functions/payday-pull-background"
  status = 200

# Browser-bridge: Chrome extension POSTs scraped email metadata here
#   POST /api/email-ingest-browser  (X-Brunaholf-Token header)
[[redirects]]
  from = "/api/email-ingest-browser"
  to = "/.netlify/functions/email-ingest-browser"
  status = 200

# Local-MCP Drive upload session initiator — creates a Google resumable
# upload URL for the MCP on the heimaskrifstofa tölva to PUT bytes into.
#   POST /api/drive-upload-session   (X-Brunaholf-Token header)
[[redirects]]
  from = "/api/drive-upload-session"
  to = "/.netlify/functions/drive-upload-session"
  status = 200

# Bulk PDF extractor from a Google Takeout .mbox sitting in Drive
#   GET /api/mbox-extract-pdfs?fileId=<id>&targetFolder=<id>[&since=YYYY-MM-DD][&dry=1]
#   GET /api/mbox-extract-pdfs?status=<jobId>
[[redirects]]
  from = "/api/mbox-extract-pdfs"
  to = "/.netlify/functions/mbox-extract-pdfs"
  status = 200

# Bulk PDF classifier — sorts a Drive folder of PDFs into 3 sub-folders
#   GET /api/pdf-classify?sample=N&source=<id>           (analyse-first peek)
#   GET /api/pdf-classify?source=<id>&uttekt=<id>&reikningar=<id>&annad=<id>[&dry=1]
#   GET /api/pdf-classify?status=<jobId>
[[redirects]]
  from = "/api/pdf-classify"
  to = "/.netlify/functions/pdf-classify"
  status = 200

# Document coverage matrix — per customer × year × type counts of
# customer_documents, for the /doc-matrix.html checklist UI.
[[redirects]]
  from = "/api/doc-matrix"
  to = "/.netlify/functions/doc-matrix"
  status = 200

# Prebuilt next-invoice drafts (forecast)
[[redirects]]
  from = "/api/invoice-drafts"
  to = "/.netlify/functions/invoice-drafts"
  status = 200

# Efnislisti document links (Drive file ID per worksite/month)
[[redirects]]
  from = "/api/efnislisti-docs"
  to = "/.netlify/functions/efnislisti-docs"
  status = 200

# Redder material-cost invoices (recharged to worksites)
[[redirects]]
  from = "/api/redder-invoices"
  to = "/.netlify/functions/redder-invoices"
  status = 200

# Per-invoice editor (payday_invoice_id, status, worksite_match, notes)
[[redirects]]
  from = "/api/invoice-edit"
  to = "/.netlify/functions/invoice-edit"
  status = 200

# Per-worksite unbilled-hours audit (Tímavera vs invoice án vsk minus materials)
[[redirects]]
  from = "/api/unbilled-hours"
  to = "/.netlify/functions/unbilled-hours"
  status = 200

# Per-month Gata verkefni uppgjör (Dalvegur 30 / Heklureitur)
#   /api/gata-uppgjor?worksite=Dalvegur+30&month=2026-05[&bands_m_vsk=NNN]
[[redirects]]
  from = "/api/gata-uppgjor"
  to = "/.netlify/functions/gata-uppgjor"
  status = 200

# NLSH (Landsspítalinn) contract uppgjör — per-verkliður estimate from Ajour
#   /api/nlsh-uppgjor?month=2026-05
[[redirects]]
  from = "/api/nlsh-uppgjor"
  to = "/.netlify/functions/nlsh-uppgjor"
  status = 200

# NLSH dashboard — full page data (revenue/holes/hours per month/week/staff)
#   /api/nlsh-dashboard
[[redirects]]
  from = "/api/nlsh-dashboard"
  to = "/.netlify/functions/nlsh-dashboard"
  status = 200

# NLSH shared notes/messages (manager ↔ staff) — GET list, POST append
[[redirects]]
  from = "/api/nlsh-notes"
  to = "/.netlify/functions/nlsh-notes"
  status = 200

# One-click data refresh from Drive: newest Ajour CSV → background ingest (+?status=1 poll)
[[redirects]]
  from = "/api/nlsh-update"
  to = "/.netlify/functions/nlsh-update"
  status = 200

# Tímavera xlsx from Drive → timavera_entries (twin of luna-bridge/timavera-bridge.js)
[[redirects]]
  from = "/api/timavera-ingest-drive"
  to = "/.netlify/functions/timavera-ingest-drive"
  status = 200

# Payday invoices xlsx from Drive → invoices (source=payday, dedup tilvisun)
[[redirects]]
  from = "/api/payday-ingest-drive"
  to = "/.netlify/functions/payday-ingest-drive"
  status = 200

# NLSH month-end cumulative snapshots (snapshot-delta billing) — GET / POST
[[redirects]]
  from = "/api/nlsh-monthly"
  to = "/.netlify/functions/nlsh-monthly"
  status = 200

# Tímabók — staff time book per worksite/month, to send with the invoice
#   /api/timabok?worksite=Fjarðagata&month=2026-02
[[redirects]]
  from = "/api/timabok"
  to = "/.netlify/functions/timabok"
  status = 200

# Generic Verðskrá hole-size rates (Dalvegur 30 / Heklureitur)
[[redirects]]
  from = "/api/hole-rates"
  to = "/.netlify/functions/hole-rates"
  status = 200

# Drive search for Efnislisti files
[[redirects]]
  from = "/api/drive-files-search"
  to = "/.netlify/functions/drive-files-search"
  status = 200

# Paginated Drive folder/query listing (feeds the Bakendi doc indexer)
[[redirects]]
  from = "/api/drive-list"
  to = "/.netlify/functions/drive-list"
  status = 200

# Bakendi: server-side Drive→customer_documents indexer
[[redirects]]
  from = "/api/doc-index"
  to = "/.netlify/functions/doc-index"
  status = 200

# Bakendi Skýrslu-stöð: report→site matching board (pure Supabase)
[[redirects]]
  from = "/api/match-station"
  to = "/.netlify/functions/match-station"
  status = 200

# Clean deep-link to the Bakendi tab (e.g. linked from the slökkvitæki
# úttektar-page): serve the app, the in-app router reads the path and opens it.
[[redirects]]
  from = "/bakendi"
  to = "/index.html"
  status = 200

# Build a sortable "whole database" Google Sheet from úttektarskýrslu filenames
[[redirects]]
  from = "/api/allt-sheet"
  to = "/.netlify/functions/allt-sheet"
  status = 200

# Bakendi Reikningalesari: read sent-invoice PDFs (fyrirtæki/kt/reikningsnr/dags/upphæð)
[[redirects]]
  from = "/api/reikningar-read"
  to = "/.netlify/functions/reikningar-read"
  status = 200

# Bakendi Reikningalesari: write the parsed invoices into a summary Google Sheet in the folder
[[redirects]]
  from = "/api/reikningar-sheet"
  to = "/.netlify/functions/reikningar-sheet"
  status = 200

# Bakendi Endurnefna reikninga: deep-scan invoice PDFs (content) and rename to standard
[[redirects]]
  from = "/api/reikningar-rename"
  to = "/.netlify/functions/reikningar-rename"
  status = 200

# Bakendi Endurnefna úttektarskýrslur: deep-scan report PDFs (content) and rename
# to "Fyrirtæki - Heimilisfang - Kennitala - Mánuður - Ár" + find duplicates
[[redirects]]
  from = "/api/uttekt-rename"
  to = "/.netlify/functions/uttekt-rename"
  status = 200

# Bakendi Samningalesari: read Þjónustusamningur PDFs (fyrirtæki/heimilisfang/kt/dags)
[[redirects]]
  from = "/api/samningar-read"
  to = "/.netlify/functions/samningar-read"
  status = 200

# Bakendi Samningalesari: write the parsed samningar into a summary Google Sheet in the folder
[[redirects]]
  from = "/api/samningar-sheet"
  to = "/.netlify/functions/samningar-sheet"
  status = 200

# Bakendi: netfang backfill from sent bokhald@eldklar.is .eml
[[redirects]]
  from = "/api/eml-netfong"
  to = "/.netlify/functions/eml-netfong"
  status = 200

# Skjalaheiti renamer: resolve a kennitala to a customer
[[redirects]]
  from = "/api/kt-lookup"
  to = "/.netlify/functions/kt-lookup"
  status = 200

# Skjalaheiti renamer: memory of processed reports (dedup + history)
[[redirects]]
  from = "/api/skjalaheiti-log"
  to = "/.netlify/functions/skjalaheiti-log"
  status = 200

# Skjalaheiti renamer: create a missing customer in customers_base
[[redirects]]
  from = "/api/kt-create"
  to = "/.netlify/functions/kt-create"
  status = 200

# Skjalaheiti renamer: reverse lookup — find a customer's kennitala by name (reports with no kt)
[[redirects]]
  from = "/api/name-lookup"
  to = "/.netlify/functions/name-lookup"
  status = 200

# Leiðsögn: service-routing schedule (companies + address + month/year + priority)
[[redirects]]
  from = "/api/leidsogn"
  to = "/.netlify/functions/leidsogn"
  status = 200

# Recursively scan a worksite's Drive folder for Efnislisti files per month
[[redirects]]
  from = "/api/efnislisti-scan"
  to = "/.netlify/functions/efnislisti-scan"
  status = 200

# Extract the "samtals m. vsk" total out of one Efnislisti file (pdf/xlsx)
[[redirects]]
  from = "/api/efnislisti-amount"
  to = "/.netlify/functions/efnislisti-amount"
  status = 200

# Data sources freshness report — when each source was last imported
[[redirects]]
  from = "/api/data-sources-status"
  to = "/.netlify/functions/data-sources-status"
  status = 200

# Skuldunautar (AR snapshot) — open invoices per debtor + bank cross-ref
[[redirects]]
  from = "/api/debtors"
  to = "/.netlify/functions/debtors"
  status = 200

# Sjálfvirkni — automation registry + run-status log (GET list / POST register|run|toggle)
[[redirects]]
  from = "/api/automations"
  to = "/.netlify/functions/automations"
  status = 200

# Hreyfingaryfirlit — per-customer account statement (invoices vs payments + bank)
[[redirects]]
  from = "/api/hreyfingar"
  to = "/.netlify/functions/hreyfingar"
  status = 200

# DK Plus (accounting) read-only API proxy (Slökkvitæki ehf)
#   /api/dkplus?path=Company|Customers|Sales/Invoices|Products|...
[[redirects]]
  from = "/api/dkplus"
  to = "/.netlify/functions/dkplus"
  status = 200

# DK Plus phase 2 — sales-invoice write path (POST; calculate-preview by default)
#   POST /api/dkplus-invoice  { mode:"calculate"|"create", invoice:{…} }
[[redirects]]
  from = "/api/dkplus-invoice"
  to = "/.netlify/functions/dkplus-invoice"
  status = 200

# DK Plus product (Vörur) importer — create the catalog in dk from vorur.dk_vorunr
#   POST /api/dkplus-product { mode:"dry-run"|"create", confirm, only/offset/limit }
[[redirects]]
  from = "/api/dkplus-product"
  to = "/.netlify/functions/dkplus-product"
  status = 200

# DK Plus customer (viðskiptavinir) sync + delivery-flag update
#   POST /api/dkplus-customer { mode:"dry-run"|"create"|"update-sendto", confirm, … }
[[redirects]]
  from = "/api/dkplus-customer"
  to = "/.netlify/functions/dkplus-customer"
  status = 200

# Slökkvitæki Sala price list (vorur) — for the reikningur generator
[[redirects]]
  from = "/api/vorur"
  to = "/.netlify/functions/vorur"
  status = 200

# Shared company branding (logo) from app_settings — for the reikningur generator
[[redirects]]
  from = "/api/branding"
  to = "/.netlify/functions/branding"
  status = 200

# Recent Slökkvitæki POS sales (solur) — load an existing sale into the reikningur
[[redirects]]
  from = "/api/solur"
  to = "/.netlify/functions/solur"
  status = 200

# Mark sales as sent to dk (writeback for the Reikningar í bið batch flow)
[[redirects]]
  from = "/api/solur-mark"
  to = "/.netlify/functions/solur-mark"
  status = 200

# Friendly URL for the Reikningagerð grid — uses /api/worksites under the hood,
# kept here so the route is documented.
[[redirects]]
  from = "/api/reikningar"
  to = "/.netlify/functions/worksites"
  status = 200

# Friendly URL for the standalone Reikningagerð (Efnislisti) form:
#   /reikningur → /reikningur/index.html (force=false so folder index serves naturally)
[[redirects]]
  from = "/reikningur"
  to = "/reikningur/"
  status = 301
  force = true

[[redirects]]
  from = "/reikningur/"
  to = "/reikningur/index.html"
  status = 200
  force = true

# Scheduled invocation: re-runs the function every 10 minutes so the
# (eventual) Timavera scrape result is "warm" when the page asks.
# Cron syntax: minute hour day month weekday — every 10 min, all day.
[functions."timavera-maeting"]
  schedule = "*/10 * * * *"
