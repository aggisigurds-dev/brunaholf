# Þáttunarpróf á inline <script> blokkum.
#
# Netlify byggir EKKERT fyrir þetta repo — index.html er borin fram eins og hún
# er. Deploy-preview verður því „grænn" um leið og afritun tekst; að skráin KEYRI
# ekki er ekki mælt. 2026-08-08 fór ein vantandi `}` í loftið og allur hubbinn
# varð tómur. Þetta er eina prófið sem hefði stöðvað það.
name: Inline JS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Þátta allar inline <script> blokkir
        run: node tools/check-inline-js.cjs
      # 15.11.2026: gmail-send má aldrei opnast aftur — póstsending án innskráningar eða tóka = rautt.
      - name: Hlið gmail-send (póstsending krefst innskráningar)
        run: node tools/test-gmail-send-hlid.cjs
      # Lota 13 (17.11.2026): öll prófin, líka vörðurinn (test/vord.test.js hleður öll 155 vöfðu föllin, svo pakkarnir
      # pdf-parse, xlsx, pdf-lib, mailparser … verða að vera til). Engin package-lock.json í repóinu → npm install, ekki ci.
      - name: Pakkar (fyrir npm test)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Öll próf (npm test)
        run: npm test
